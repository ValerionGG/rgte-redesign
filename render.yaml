# Déploiement Render (Blueprint) : site + formulaires + back-office, base SQLite sur disque persistant.
services:
  - type: web
    name: rgte
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: rgte-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NOTIFY_WEBHOOK_URL
        sync: false
