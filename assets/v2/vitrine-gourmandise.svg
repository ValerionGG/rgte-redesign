    <ellipse cx="212" cy="130" rx="13" ry="4.5" fill="#D9A866"></ellipse><ellipse cx="212" cy="126.5" rx="10" ry="3" fill="#F1D36A"></ellipse>
    <rect x="236" y="117" width="36" height="17" rx="8" fill="#B7CB93"></rect><rect x="236" y="117" width="36" height="5" rx="2.5" fill="#D9E6C1"></rect>
