    <rect x="344" y="119" width="52" height="15" rx="2" fill="#4A3127"></rect><rect x="344" y="119" width="52" height="3" fill="#7A5240"></rect><g fill="#C9A15A"><circle cx="354" cy="126" r="1.4"></circle><circle cx="366" cy="126" r="1.4"></circle><circle cx="378" cy="126" r="1.4"></circle><circle cx="390" cy="126" r="1.4"></circle></g>
  </g>
