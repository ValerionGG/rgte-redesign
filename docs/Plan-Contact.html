<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700;900&amp;family=Red+Hat+Mono:wght@400;500&amp;family=Red+Hat+Text:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#F4F3EF}
.pl *{box-sizing:border-box}
.pl a{color:inherit}
.pl-wrap{max-width:1320px;margin:0 auto;padding:0 40px}
.mono{font-family:'Red Hat Mono',ui-monospace,monospace}
.disp{font-family:'Red Hat Display',sans-serif}
.pl :focus-visible{outline:2px solid var(--red);outline-offset:3px}
.nav-a{position:relative;text-decoration:none;font-weight:500;font-size:15px;padding:12px 0;display:inline-flex;align-items:center;min-height:44px}
.nav-a::after{content:"";position:absolute;left:0;right:100%;bottom:6px;height:1px;background:var(--red);transition:right .45s cubic-bezier(.6,.1,.2,1)}
.nav-a:hover::after,.nav-a.on::after{right:0}
.btn-red{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;background:var(--red);color:#fff !important;text-decoration:none;font-family:'Red Hat Display',sans-serif;font-weight:700;font-size:15px;border:0;cursor:pointer;transition:transform .3s,box-shadow .3s}
.btn-red:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px var(--red)}
.btn-line{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border:1px solid currentColor;text-decoration:none;font-family:'Red Hat Display',sans-serif;font-weight:700;font-size:15px;background:transparent;cursor:pointer;transition:background .3s,color .3s}
.btn-line:hover{background:#E8EEF4;color:#0E2A47 !important}
.btn-line.dk:hover{background:#0E2A47;color:#F4F3EF !important}
.burger{display:none;width:48px;height:48px;align-items:center;justify-content:center;background:transparent;border:1px solid rgba(143,179,207,.5);color:#E8EEF4;cursor:pointer}
.toplink{text-decoration:none;min-height:34px;display:inline-flex;align-items:center}
.toplink:hover{color:#E8EEF4}
.rise{opacity:0;transform:translateY(22px);animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.mask{clip-path:inset(0 0 100% 0);animation:mask 1.1s cubic-bezier(.7,0,.2,1) forwards}
@keyframes mask{to{clip-path:inset(0 0 0 0)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2s cubic-bezier(.6,.1,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s cubic-bezier(.2,.7,.2,1) infinite}
.svgt{font-family:'Red Hat Mono',monospace;font-size:11px;letter-spacing:.08em}
.chip{transition:background .25s,color .25s,border-color .25s}
.chip:hover{border-color:#0E2A47 !important}
.stp{transition:color .3s}
.swap{animation:swap .55s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.fld{width:100%;min-height:48px;border:1px solid rgba(14,42,71,.35);background:#fff;padding:12px 14px;font:inherit;font-size:15px;color:#0E2A47;border-radius:0;transition:border-color .25s,box-shadow .25s}
.fld:focus{outline:none;border-color:#0E2A47;box-shadow:0 0 0 3px rgba(143,179,207,.45)}
.lab{display:block;font-family:'Red Hat Mono',monospace;font-size:11px;letter-spacing:.12em;margin-bottom:6px;color:#3A4F66}
.morph rect,.morph path,.morph text{transition:all .6s cubic-bezier(.6,.1,.2,1)}
.faq{transition:background .3s}
.faq:hover{background:rgba(14,42,71,.04)}
.faq .pm{transition:transform .4s}
.lnk{text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}
.lnk:hover{color:var(--red)}
.foot a{text-decoration:none;display:inline-flex;min-height:32px;align-items:center}
.foot a:hover{color:#fff;text-decoration:underline}
.mnav a{display:flex;min-height:52px;align-items:center;border-bottom:1px solid rgba(143,179,207,.2);text-decoration:none;font-size:18px}
@media (max-width:980px){.desk-nav{display:none !important}.burger{display:inline-flex}.hide-m{display:none !important}}
@media (max-width:720px){.pl-wrap{padding:0 16px}.btn-red.hdr{padding:0 14px;font-size:14px}}
</style>
</helmet>
<div class="pl" style="{{ rootStyle }}">

<header style="background:#0E2A47;color:#E8EEF4;position:relative;z-index:5">
  <div style="border-bottom:1px solid rgba(143,179,207,.2)">
    <div class="pl-wrap mono" style="display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:11px;letter-spacing:.1em;color:#8FB3CF">
      <span class="hide-m">BUREAU D’ÉTUDES &amp; SHOW-ROOM — PUGET-SUR-ARGENS (83)</span>
      <a class="toplink" href="index.html">← TOUTES LES PROPOSITIONS</a>
    </div>
  </div>
  <div class="pl-wrap" style="display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:84px">
    <a href="Plan-Accueil.html" aria-label="RGTE, accueil" style="display:flex;align-items:center;gap:14px;text-decoration:none">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" fill="none" stroke="#8FB3CF" stroke-width="1"></rect><path d="M17 4V30M4 17H30" stroke="#8FB3CF" stroke-width="1"></path><circle cx="17" cy="17" r="7" fill="none" stroke="var(--red)" stroke-width="2"></circle></svg>
      <span style="display:flex;flex-direction:column;line-height:1">
        <span class="disp" style="font-weight:900;font-size:27px;letter-spacing:.08em">RGTE</span>
        <span class="mono" style="font-size:10px;letter-spacing:.16em;color:#8FB3CF;margin-top:5px">R.G. TECHNOLOGIES</span>
      </span>
    </a>
    <nav class="desk-nav" aria-label="Navigation principale" style="display:flex;gap:34px">
      <a class="nav-a" href="Plan-Lignes.html">Lignes</a>
      <a class="nav-a" href="Plan-Secteurs.html">Secteurs</a>
      <a class="nav-a" href="Plan-Realisations.html">Réalisations</a>
      <a class="nav-a on" href="Plan-Contact.html" aria-current="page">Showroom &amp; contact</a>
    </nav>
    <div style="display:flex;align-items:center;gap:16px">
      <a href="tel:0800951313" class="hide-m" style="text-decoration:none;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2">
        <span class="mono" style="font-size:15px;font-weight:500;letter-spacing:.04em">0 800 95 13 13</span>
        <span class="mono" style="font-size:10px;color:#8FB3CF;letter-spacing:.12em">APPEL GRATUIT</span>
      </a>
      <a href="#devis" class="btn-red hdr">Plan 3D offert</a>
      <button type="button" class="burger" aria-label="{{ burgerLabel }}" onClick="{{ toggleMenu }}"><svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path d="M0 1H20M0 7H20M0 13H20" stroke="currentColor" stroke-width="1.5"></path></svg></button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav pl-wrap" aria-label="Navigation mobile" style="padding-bottom:20px">
      <a href="Plan-Lignes.html">Lignes</a>
      <a href="Plan-Secteurs.html">Secteurs</a>
      <a href="Plan-Realisations.html">Réalisations</a>
      <a href="Plan-Contact.html">Showroom &amp; contact</a>
      <a href="tel:0800951313" class="mono">0 800 95 13 13 — appel gratuit</a>
    </nav>
  </sc-if>
</header>

<!-- HERO : carte -->
<section style="{{ heroStyle }}">
  <div class="pl-wrap" style="padding-top:64px;padding-bottom:72px">
    <p class="mono rise" style="margin:0 0 20px;font-size:12px;letter-spacing:.18em;color:#8FB3CF"><span style="color:var(--red)">■</span> FEUILLE F — SHOW-ROOM &amp; CONTACT</p>
    <div style="display:flex;flex-wrap:wrap;gap:24px 56px;align-items:flex-end;justify-content:space-between">
      <h1 class="disp mask" style="margin:0;flex:1 1 640px;font-weight:900;font-size:clamp(40px,6vw,88px);line-height:.98;letter-spacing:-.02em;overflow-wrap:anywhere">Venez voir les vitrines en vrai.</h1>
      <p class="rise" style="margin:0;flex:1 1 320px;max-width:420px;font-size:17px;line-height:1.6;color:#C9D7E4;animation-delay:.3s">Bureau d’études et show-room au même endroit, dans le Var. Apportez vos cotes : on commence le plan sur place.</p>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:24px;margin-top:48px;align-items:stretch">
      <div style="flex:2 1 560px;border:1px solid rgba(143,179,207,.35);background:#0B2440;padding:12px">
        <svg viewBox="0 0 700 400" width="100%" style="display:block;height:auto" role="img" aria-label="Carte schématique de Puget-sur-Argens : le show-room RGTE, Espace Vernèdes 3, entre l’A8 et l’Argens">
          <defs><pattern id="plnHatchC" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="rgba(143,179,207,.35)" stroke-width="1"></line></pattern></defs>
          <path d="M250 150C300 120 400 130 450 160C490 190 470 250 420 262C350 280 280 262 250 232C228 210 228 168 250 150Z" fill="url(#plnHatchC)" stroke="rgba(143,179,207,.5)" stroke-dasharray="4 4"></path>
          <path class="draw" pathLength="1" d="M0 110C150 90 260 140 380 120S600 80 700 100" stroke="#E8EEF4" stroke-width="7" fill="none"></path>
          <path d="M0 110C150 90 260 140 380 120S600 80 700 100" stroke="#0B2440" stroke-width="1.5" stroke-dasharray="10 10" fill="none"></path>
          <path class="draw" pathLength="1" style="animation-delay:.4s" d="M0 250C160 240 300 270 420 258S620 226 700 236" stroke="#8FB3CF" stroke-width="3" fill="none"></path>
          <path class="draw" pathLength="1" style="animation-delay:.8s" d="M0 340C120 360 220 300 340 330S560 380 700 350" stroke="#8FB3CF" stroke-width="1.5" fill="none"></path>
          <path d="M430 196L470 120M430 196L436 258" stroke="rgba(232,238,244,.6)" stroke-width="1.5" fill="none"></path>
          <rect x="24" y="72" width="34" height="20" fill="#E8EEF4"></rect>
          <text x="41" y="86" text-anchor="middle" class="svgt" fill="#0E2A47" style="font-weight:500">A8</text>
          <text x="24" y="132" class="svgt" fill="#8FB3CF">← LE MUY</text>
          <text x="676" y="80" text-anchor="end" class="svgt" fill="#8FB3CF">FRÉJUS →</text>
          <text x="40" y="372" class="svgt" fill="#8FB3CF">L’ARGENS</text>
          <text x="300" y="232" class="svgt" fill="#C9D7E4">PUGET-SUR-ARGENS</text>
          <circle class="pulse" cx="430" cy="196" r="10" fill="none" stroke="var(--red)" stroke-width="2"></circle>
          <circle cx="430" cy="196" r="7" fill="var(--red)"></circle>
          <path d="M437 192L500 170H660" stroke="var(--red)" stroke-width="1" fill="none"></path>
          <text x="506" y="162" class="svgt" fill="#FFFFFF" style="font-weight:500;font-size:12px">RGTE — SHOW-ROOM</text>
          <text x="506" y="188" class="svgt" fill="#E8EEF4">ESPACE VERNÈDES 3</text>
          <text x="506" y="204" class="svgt" fill="#8FB3CF">423, CH. DES VERNÈDES</text>
          <g transform="translate(650 300)"><circle r="18" fill="none" stroke="#8FB3CF"></circle><path d="M0 -14L5 4L0 0L-5 4Z" fill="#E8EEF4"></path><text y="-22" text-anchor="middle" class="svgt" fill="#8FB3CF">N</text></g>
          <text x="10" y="392" class="svgt" fill="#8FB3CF">CARTE SCHÉMATIQUE — NON À L’ÉCHELLE</text>
        </svg>
      </div>
      <aside style="flex:1 1 320px;border:1px solid rgba(143,179,207,.35);display:flex;flex-direction:column">
        <div style="padding:22px;border-bottom:1px solid rgba(143,179,207,.35)">
          <p class="mono" style="margin:0 0 8px;font-size:10px;letter-spacing:.14em;color:#8FB3CF">ADRESSE</p>
          <p style="margin:0;font-size:17px;line-height:1.55">423, Chemin des Vernèdes<br>Espace Vernèdes 3<br>83480 Puget-sur-Argens</p>
        </div>
        <div style="padding:22px;border-bottom:1px solid rgba(143,179,207,.35)">
          <p class="mono" style="margin:0 0 8px;font-size:10px;letter-spacing:.14em;color:#8FB3CF">NUMÉRO VERT</p>
          <a href="tel:0800951313" class="mono" style="font-size:28px;font-weight:500;text-decoration:none;display:inline-flex;min-height:44px;align-items:center">0 800 95 13 13</a>
          <p style="margin:2px 0 0;font-size:14px;color:#C9D7E4">Appel gratuit</p>
        </div>
        <div style="padding:22px;border-bottom:1px solid rgba(143,179,207,.35)">
          <p class="mono" style="margin:0 0 8px;font-size:10px;letter-spacing:.14em;color:#8FB3CF">HORAIRES DU SHOW-ROOM</p>
          <p class="mono" style="margin:0;font-size:16px">[HORAIRES]</p>
        </div>
        <div style="padding:22px;margin-top:auto">
          <a href="#devis" class="btn-red" style="width:100%">Préparer ma demande</a>

</section>

<!-- FORMULAIRE EN ÉTAPES -->
<section id="devis" style="background:#F4F3EF;color:#0E2A47">
  <div class="pl-wrap" style="padding-top:88px;padding-bottom:96px">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px">
      <div>
        <p class="mono" style="margin:0 0 14px;font-size:12px;letter-spacing:.18em;color:var(--red)">DEMANDE DE DEVIS &amp; PLAN 3D</p>
        <h2 class="disp" style="margin:0;font-weight:900;font-size:clamp(32px,4vw,56px);line-height:1;letter-spacing:-.02em">Trois feuilles à remplir.</h2>
      </div>
      <p class="mono" style="margin:0;font-size:12px;letter-spacing:.08em;color:#3A4F66">Prototype — rien n’est envoyé.</p>
    </div>
    <div role="list" style="display:grid;grid-template-columns:repeat(3,1fr);margin-top:36px;border-top:1.5px solid #0E2A47">
      <sc-for list="{{ steps }}" as="t" hint-placeholder-count="3">
        <div role="listitem" class="stp" style="{{ t.style }}"><span class="mono" style="display:block;font-size:11px;letter-spacing:.14em">{{ t.n }}</span><span class="disp" style="display:block;font-size:19px;font-weight:700;margin-top:2px">{{ t.label }}</span></div>
      </sc-for>
    </div>

    <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
      <form onSubmit="{{ submit }}" novalidate="novalidate" style="margin-top:40px">
        <sc-if value="{{ st1 }}" hint-placeholder-val="{{ true }}">
          <div class="swap" style="display:flex;flex-wrap:wrap;gap:40px">
            <div style="flex:2 1 520px">
              <p class="lab">VOTRE SECTEUR D’ACTIVITÉ *</p>
              <div role="group" aria-label="Secteur d’activité" style="display:flex;flex-wrap:wrap;gap:8px">
                <sc-for list="{{ secteurs }}" as="x" hint-placeholder-count="13">
                  <button type="button" class="chip" style="{{ x.style }}" aria-pressed="{{ x.sel }}" onClick="{{ x.pick }}">{{ x.nom }}</button>
                </sc-for>
              </div>
              <sc-if value="{{ errSect }}" hint-placeholder-val="{{ false }}"><p class="mono" style="margin:12px 0 0;font-size:12px;color:#B3221A">Choisissez un secteur pour continuer.</p></sc-if>
            </div>
            <div style="flex:1 1 300px">
              <p class="lab">LIGNE ENVISAGÉE</p>
              <div role="group" aria-label="Ligne envisagée" style="display:flex;flex-wrap:wrap;gap:8px">
                <sc-for list="{{ lignesOpt }}" as="l" hint-placeholder-count="6">
                  <button type="button" class="chip mono" style="{{ l.style }}" aria-pressed="{{ l.sel }}" onClick="{{ l.pick }}">{{ l.nom }}</button>
                </sc-for>
              </div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ st2 }}" hint-placeholder-val="{{ false }}">
          <div class="swap" style="display:flex;flex-wrap:wrap;gap:40px">
            <div style="flex:1 1 360px;display:flex;flex-direction:column;gap:18px">
              <p style="margin:0;font-size:16px;line-height:1.6;color:#3A4F66">Les cotes intérieures de la zone de vente, si vous les avez. Le bureau d’études les relèvera de toute façon avant le plan.</p>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                <div><label class="lab" for="pc-l">LARGEUR (CM)</label><input id="pc-l" class="fld mono" type="number" min="0" inputmode="numeric" value="{{ f.larg }}" onInput="{{ setLarg }}"></div>
                <div><label class="lab" for="pc-p">PROFONDEUR (CM)</label><input id="pc-p" class="fld mono" type="number" min="0" inputmode="numeric" value="{{ f.prof }}" onInput="{{ setProf }}"></div>
              </div>
              <div><label class="lab" for="pc-ln">LINÉAIRE DE VITRINE SOUHAITÉ (CM)</label><input id="pc-ln" class="fld mono" type="number" min="0" inputmode="numeric" value="{{ f.lin }}" onInput="{{ setLin }}"></div>
              <label style="display:flex;gap:12px;align-items:center;min-height:48px;cursor:pointer;font-size:15px"><input type="checkbox" checked="{{ f.plan3d }}" onChange="{{ togglePlan }}" style="width:22px;height:22px;accent-color:#0E2A47">Je souhaite recevoir mon plan 3D d’agencement offert</label>
            </div>
            <div style="flex:1.2 1 420px;background:#0E2A47;padding:18px">
              <div class="mono" style="display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;color:#8FB3CF;margin-bottom:8px"><span>VOTRE LOCAL — APERÇU</span><span>{{ preview.scaleLbl }}</span></div>
              <svg class="morph" viewBox="0 0 440 280" width="100%" style="display:block;height:auto" role="img" aria-label="{{ preview.aria }}">
                <path d="M0 0" stroke="none"></path>
                <rect x="{{ preview.x }}" y="{{ preview.y }}" width="{{ preview.w }}" height="{{ preview.h }}" fill="rgba(232,238,244,.06)" stroke="#E8EEF4" stroke-width="2" style="{{ preview.rectStyle }}"></rect>
                <rect x="{{ preview.x }}" y="{{ preview.ly }}" width="{{ preview.lw }}" height="16" fill="rgba(212,42,32,.25)" stroke="var(--red)" stroke-width="1.2" style="{{ preview.linStyle }}"></rect>
                <path d="{{ preview.dimW }}" stroke="#E8EEF4" stroke-width=".9" fill="none"></path>
                <path d="{{ preview.dimH }}" stroke="#E8EEF4" stroke-width=".9" fill="none"></path>
                <text x="220" y="{{ preview.tWy }}" text-anchor="middle" class="svgt" fill="var(--red)" style="font-size:13px">{{ preview.wLbl }}</text>
                <text transform="{{ preview.tH }}" text-anchor="middle" class="svgt" fill="var(--red)" style="font-size:13px">{{ preview.hLbl }}</text>
                <text x="220" y="146" text-anchor="middle" class="svgt" fill="#8FB3CF">{{ preview.center }}</text>
              </svg>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ st3 }}" hint-placeholder-val="{{ false }}">
          <div class="swap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px 20px">
            <div><label class="lab" for="pc-nom">NOM *</label><input id="pc-nom" class="fld" type="text" autocomplete="name" value="{{ f.nom }}" onInput="{{ setNom }}" style="{{ eS.nom }}"><sc-if value="{{ err.nom }}" hint-placeholder-val="{{ false }}"><span class="mono" style="display:block;margin-top:6px;font-size:12px;color:#B3221A">Champ requis</span></sc-if></div>
            <div><label class="lab" for="pc-tel">TÉLÉPHONE *</label><input id="pc-tel" class="fld" type="tel" autocomplete="tel" value="{{ f.tel }}" onInput="{{ setTel }}" style="{{ eS.tel }}"><sc-if value="{{ err.tel }}" hint-placeholder-val="{{ false }}"><span class="mono" style="display:block;margin-top:6px;font-size:12px;color:#B3221A">Champ requis</span></sc-if></div>
            <div><label class="lab" for="pc-email">EMAIL *</label><input id="pc-email" class="fld" type="email" autocomplete="email" value="{{ f.email }}" onInput="{{ setEmail }}" style="{{ eS.email }}"><sc-if value="{{ err.email }}" hint-placeholder-val="{{ false }}"><span class="mono" style="display:block;margin-top:6px;font-size:12px;color:#B3221A">Email valide requis</span></sc-if></div>
            <div><label class="lab" for="pc-cp">CODE POSTAL</label><input id="pc-cp" class="fld" type="text" inputmode="numeric" autocomplete="postal-code" value="{{ f.cp }}" onInput="{{ setCp }}"></div>
            <div><label class="lab" for="pc-ville">VILLE</label><input id="pc-ville" class="fld" type="text" autocomplete="address-level2" value="{{ f.ville }}" onInput="{{ setVille }}"></div>
            <div style="grid-column:1/-1"><label class="lab" for="pc-msg">MESSAGE *</label><textarea id="pc-msg" class="fld" rows="5" value="{{ f.msg }}" onInput="{{ setMsg }}" style="{{ eS.msg }}"></textarea><sc-if value="{{ err.msg }}" hint-placeholder-val="{{ false }}"><span class="mono" style="display:block;margin-top:6px;font-size:12px;color:#B3221A">Champ requis</span></sc-if></div>
          </div>
        </sc-if>

        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-top:36px;padding-top:20px;border-top:1px solid rgba(14,42,71,.2)">
          <span class="mono" style="font-size:12px;letter-spacing:.08em;color:#3A4F66">{{ recap }}</span>
          <div style="display:flex;gap:12px">
            <sc-if value="{{ canBack }}" hint-placeholder-val="{{ false }}"><button type="button" class="btn-line dk" onClick="{{ back }}">Précédent</button></sc-if>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3100},"accent":{"editor":"color","default":"#D42A20","options":["#D42A20","#1A1A1A","#B08D57"]},"grille":{"editor":"boolean","default":true}}'>
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { menu:false, step:1, sect:'', ligne:'nsp', tried1:false, tried3:false, sent:false, faq:0,
    f:{ larg:'', prof:'', lin:'', plan3d:true, nom:'', tel:'', email:'', cp:'', ville:'', msg:'' } }; }
  renderVals() {
    const p = this.props || {};
    const R = p.accent || '#D42A20';
    const grid = p.grille !== false;
    const s = this.state, f = s.f;
    const gridBg = grid ? 'background-image:linear-gradient(rgba(143,179,207,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(143,179,207,.09) 1px,transparent 1px);background-size:40px 40px;' : '';
    const upd = o => this.setState({ f: Object.assign({}, this.state.f, o) });
    const setF = k => ev => { const v = ev && ev.target ? ev.target.value : ''; upd({ [k]: v }); };
    const chip = on => 'min-height:48px;padding:0 16px;font-family:inherit;font-size:15px;cursor:pointer;border:1px solid ' + (on ? '#0E2A47' : 'rgba(14,42,71,.25)') + ';' + (on ? 'background:#0E2A47;color:#F4F3EF;' : 'background:transparent;color:#0E2A47;');
    const SECT = ['Boulangerie','Pâtisserie','Chocolats','Sandwichs','Traiteur','Poissonnerie','Bar à salades','Bar à couscous','Fromagerie','Bar','Bar à topping','Coffee shop / Café','Pizza al taglio'];
    const secteurs = SECT.map(n => { const on = s.sect === n; return { nom:n, sel: on ? 'true' : 'false', style: chip(on), pick: () => this.setState({ sect:n, tried1:false }) }; });
    const LG = [ ['nsp','Je ne sais pas'], ['Basique','Basique'], ['Stone','Stone'], ['Legno','Legno'], ['Encastrable','Encastrable'], ['Industry','Industry'] ];
    const lignesOpt = LG.map(o => { const on = s.ligne === o[0]; return { nom:o[1], sel: on ? 'true' : 'false', style: chip(on) + 'font-size:13px;', pick: () => this.setState({ ligne:o[0] }) }; });
    const STEPS = ['Métier', 'Local', 'Coordonnées'];
    const steps = STEPS.map((l, i) => { const n = i + 1, on = s.step === n, done = s.step > n || s.sent; return { n: (done ? '✓ ' : '') + '0' + n, label:l,
      style: 'padding:16px 4px 0;border-top:3px solid ' + (on ? R : (done ? '#0E2A47' : 'transparent')) + ';margin-top:-2px;color:' + (on || done ? '#0E2A47' : '#7A8A9C') + ';' }; });
    // aperçu du local
    const W = parseFloat(f.larg) || 0, D = parseFloat(f.prof) || 0, Ln = parseFloat(f.lin) || 0;
    const has = W > 0 && D > 0;
    const maxW = 340, maxH = 180;
    const sc = has ? Math.min(maxW / W, maxH / D) : 1;
    const w = has ? W * sc : 300, h = has ? D * sc : 160;
    const x = 220 - w / 2, y = 130 - h / 2;
    const lw = has ? Math.min(Ln > 0 ? Ln * sc : w * 0.6, w) : w * 0.6;
    const preview = {
      x, y, w, h, ly: y + h - 30, lw,
      rectStyle: has ? '' : 'stroke-dasharray:8 6;stroke:#8FB3CF',
      linStyle: has && Ln > 0 ? '' : 'opacity:.45;stroke-dasharray:4 3',
      dimW: 'M' + x + ' ' + (y + h + 18) + 'H' + (x + w) + 'M' + x + ' ' + (y + h + 8) + 'V' + (y + h + 26) + 'M' + (x + w) + ' ' + (y + h + 8) + 'V' + (y + h + 26) + 'M' + (x - 4) + ' ' + (y + h + 22) + 'L' + (x + 4) + ' ' + (y + h + 14) + 'M' + (x + w - 4) + ' ' + (y + h + 22) + 'L' + (x + w + 4) + ' ' + (y + h + 14),
      dimH: 'M' + (x - 18) + ' ' + y + 'V' + (y + h) + 'M' + (x - 26) + ' ' + y + 'H' + (x - 8) + 'M' + (x - 26) + ' ' + (y + h) + 'H' + (x - 8) + 'M' + (x - 22) + ' ' + (y + 4) + 'L' + (x - 14) + ' ' + (y - 4) + 'M' + (x - 22) + ' ' + (y + h + 4) + 'L' + (x - 14) + ' ' + (y + h - 4),
      tWy: y + h + 40, tH: 'translate(' + (x - 30) + ' ' + (y + h / 2) + ') rotate(-90)',
      wLbl: has ? Math.round(W * 10) + ' MM' : 'LARGEUR', hLbl: has ? Math.round(D * 10) + ' MM' : 'PROF.',
      center: has ? (Ln > 0 ? 'VITRINE : ' + Math.round(Ln * 10) + ' MM' : 'ZONE DE VENTE') : 'SAISISSEZ VOS COTES',
      scaleLbl: has ? 'À L’ÉCHELLE' : 'EN ATTENTE DE COTES',
      aria: has ? 'Aperçu du local : ' + W + ' cm sur ' + D + ' cm' : 'Aperçu du local en attente de cotes'
    };
    const emailOk = /.+@.+\..+/.test(f.email);
    const err = { nom: s.tried3 && !f.nom.trim(), tel: s.tried3 && !f.tel.trim(), email: s.tried3 && !emailOk, msg: s.tried3 && !f.msg.trim() };
    const eSt = on => on ? 'border-color:#B3221A;box-shadow:0 0 0 3px rgba(179,34,26,.15)' : '';
    const FAQ = [
      { q:'Le plan 3D est-il payant ?', a:'Non. L’élaboration de votre plan 3D d’agencement est offerte : vous voyez votre boutique avant la fabrication.' },
      { q:'Les vitrines s’adaptent-elles à mon local ?', a:'Oui, elles sont adaptées à votre local et à vos dimensions. La Gourmandise, par exemple, existe en 101, 117, 146, 169, 191 et 222 cm, ou sur mesure.' },
      { q:'Quelles plages de température ?', a:'+2 °C/+8 °C pour la pâtisserie, +14 °C/+18 °C pour les chocolats, −2 °C/0 °C pour la poissonnerie, +30 °C/+90 °C pour le bain-marie.' },
      { q:'Quelles matières sont proposées ?', a:'Pierre acrylique type Corian, granit, bois mélaminé avec moulures, et panneau frontal en verre portant votre sérigraphie.' },
      { q:'Combien coûte une vitrine ?', a:'La Gourmandise 101 cm (ligne Stone) est à 5 800,00 € HT. Les autres modèles et longueurs sont sur devis.' },
      { q:'Où voir les vitrines ?', a:'Au show-room de Puget-sur-Argens : 423, Chemin des Vernèdes, Espace Vernèdes 3. Horaires : [HORAIRES]. Numéro vert 0 800 95 13 13.' }
    ];
    const faqs = FAQ.map((q, i) => { const on = s.faq === i; return { n: String(i + 1).padStart(2, '0'), q:q.q, a:q.a, isOpen: on, open: on ? 'true' : 'false',
      pick: () => this.setState({ faq: this.state.faq === i ? -1 : i }), iconStyle: 'flex:none;transition:transform .4s;transform:rotate(' + (on ? 45 : 0) + 'deg)' }; });
    const recap = (s.sect || 'Secteur à choisir') + ' · ' + (s.ligne === 'nsp' ? 'ligne à définir' : 'ligne ' + s.ligne) + (has ? ' · ' + W + ' × ' + D + ' cm' : '');
    return {
      rootStyle: '--red:' + R + ';font-family:\'Red Hat Text\',sans-serif;background:#F4F3EF;color:#0E2A47;',
      menuOpen: s.menu, burgerLabel: s.menu ? 'Fermer le menu' : 'Ouvrir le menu', toggleMenu: () => this.setState({ menu: !this.state.menu }),
      heroStyle: 'background-color:#0E2A47;color:#E8EEF4;' + gridBg,
      steps, st1: s.step === 1, st2: s.step === 2, st3: s.step === 3,
      secteurs, lignesOpt, errSect: s.tried1 && !s.sect,
      f, preview, err, eS: { nom: eSt(err.nom), tel: eSt(err.tel), email: eSt(err.email), msg: eSt(err.msg) },
      setLarg: setF('larg'), setProf: setF('prof'), setLin: setF('lin'), setNom: setF('nom'), setTel: setF('tel'), setEmail: setF('email'), setCp: setF('cp'), setVille: setF('ville'), setMsg: setF('msg'),
      togglePlan: () => upd({ plan3d: !this.state.f.plan3d }),
      canBack: s.step > 1, notLast: s.step < 3, isLast: s.step === 3,
      back: () => this.setState({ step: Math.max(1, this.state.step - 1) }),
      nextStep: () => { const st = this.state; if (st.step === 1 && !st.sect) { this.setState({ tried1:true }); return; } this.setState({ step: Math.min(3, st.step + 1) }); },
      submit: ev => { if (ev && ev.preventDefault) ev.preventDefault(); if (this.state.step < 3) { if (this.state.step === 1 && !this.state.sect) { this.setState({ tried1:true }); return; } this.setState({ step: this.state.step + 1 }); return; } const g = this.state.f; const ok = g.nom.trim() && g.tel.trim() && /.+@.+\..+/.test(g.email) && g.msg.trim(); this.setState(ok ? { sent:true, tried3:false } : { tried3:true }); },
      sent: s.sent, notSent: !s.sent, recap,
      sum: { sect: s.sect || '—', ligne: s.ligne === 'nsp' ? 'à définir' : s.ligne, local: has ? W + ' × ' + D + ' cm' : 'cotes à relever', plan: f.plan3d ? 'oui, offert' : 'non' },
      restart: () => this.setState({ step:1, sect:'', ligne:'nsp', sent:false, tried1:false, tried3:false, f:{ larg:'', prof:'', lin:'', plan3d:true, nom:'', tel:'', email:'', cp:'', ville:'', msg:'' } }),
      faqs
    };
  }
}
</script>
