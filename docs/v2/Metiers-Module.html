<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0;background:#FFFFFF}
sc-for,sc-if{display:contents}
.mt{--acc:#D42A20;font-family:'Figtree',system-ui,sans-serif;color:#1C1C1E;background:#FFFFFF;-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;font-variant-numeric:tabular-nums}
.mt *,.mt *::before,.mt *::after{box-sizing:border-box}
.mt img{display:block;max-width:100%}
.mt h1,.mt h2,.mt h3,.mt h4,.mt p{margin:0}
.wrap{max-width:1320px;margin:0 auto;padding:0 32px}
.topbar{background:#1C1C1E;color:#C9C9CC;font-size:13px}
.topbar-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:40px}
.topbar a{color:#FFFFFF;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.topbar a:hover{text-decoration:underline;text-underline-offset:3px}
.hdr{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid #E6E5E1}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:76px}
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#1C1C1E;min-height:44px}
.logo-w{font-weight:900;font-size:29px;letter-spacing:-.04em;line-height:1;display:inline-flex;align-items:flex-end}
.logo-w i{display:block;width:8px;height:8px;background:var(--acc);margin:0 0 4px 3px}
.logo-s{display:block;border-left:1px solid #CFCECA;padding-left:11px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#5C5C61;line-height:1.25}
.nav{display:flex;align-items:center;gap:4px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-size:15px;font-weight:600;color:#3A3A3E;text-decoration:none;border-radius:10px;position:relative;transition:color .2s}
.nav a::after{content:'';position:absolute;left:14px;right:14px;bottom:8px;height:2px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.nav a:hover{color:#1C1C1E}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.nav a.on{color:#1C1C1E}
.hdr-r{display:flex;align-items:center;gap:14px}
.tel{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#1C1C1E;min-height:44px}
.tel-i{width:40px;height:40px;border-radius:50%;border:1px solid #DAD9D5;display:grid;place-items:center;flex:none;transition:border-color .2s,background .2s}
.tel:hover .tel-i{border-color:var(--acc);background:#FBEDEC}
.tel b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.tel small{display:block;font-size:12px;color:#5C5C61;line-height:1.2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border-radius:12px;border:0;font:700 15px/1.15 'Figtree',system-ui,sans-serif;text-decoration:none;cursor:pointer;text-align:center;transition:transform .2s ease,box-shadow .25s ease,background .2s ease,color .2s}
.btn svg{flex:none;transition:transform .25s ease}
.btn:hover svg{transform:translateX(3px)}
.btn-acc{background:var(--acc);color:#FFFFFF}
.btn-acc:hover{transform:translateY(-1px);box-shadow:0 14px 28px -14px var(--acc)}
.btn-ink{background:#1C1C1E;color:#FFFFFF}
.btn-ink:hover{transform:translateY(-1px);box-shadow:0 14px 28px -16px #1C1C1E}
.btn-line{background:#FFFFFF;color:#1C1C1E;box-shadow:inset 0 0 0 1px #CFCECA}
.btn-line:hover{box-shadow:inset 0 0 0 2px #1C1C1E}
.btn-sm{min-height:44px;padding:0 18px;font-size:14px}
.btn-block{width:100%}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1px solid #DAD9D5;background:#FFFFFF;align-items:center;justify-content:center;cursor:pointer;color:#1C1C1E}
.mnav{display:none}
.mnav a{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;border-radius:12px;background:#ECEBE8;text-decoration:none;color:#1C1C1E;font-weight:700}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5C5C61}
.eyebrow i{width:18px;height:2px;background:var(--acc);display:block}
.h2{font-size:clamp(30px,3.4vw,46px);line-height:1.04;letter-spacing:-.035em;font-weight:800;overflow-wrap:anywhere}
.lead{font-size:clamp(16px,1.3vw,18px);color:#5C5C61;line-height:1.55}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;padding:5px 10px;border-radius:8px;background:#ECEBE8;color:#3A3A3E;white-space:nowrap}
.mt :focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .45s ease both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:14px 0 10px;font-size:14px;color:#5C5C61}
.crumbs a{color:#5C5C61;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.crumbs a:hover{color:#1C1C1E}
.pg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:28px;align-items:start}
.stw{position:sticky;top:96px;display:flex;flex-direction:column;gap:10px}
.stage{position:relative;background:#ECEBE8;border-radius:28px;min-height:540px;overflow:hidden;display:flex;flex-direction:column}
.stage-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 18px 0;flex-wrap:wrap;position:relative;z-index:2}
.vt{display:flex;background:#FFFFFF;border-radius:12px;padding:3px;gap:2px}
.vt button{min-height:40px;padding:0 14px;border:0;border-radius:9px;font:700 13.5px/1 'Figtree',sans-serif;cursor:pointer;transition:background .2s,color .2s}
.stv{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:20px 40px 26px;position:relative}
.stv::before{content:'';position:absolute;left:8%;right:8%;top:4%;bottom:22%;background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}
.gw{position:relative;transition:width .65s cubic-bezier(.2,.7,.2,1);max-width:100%}
.gw img{width:100%;height:auto;position:relative}
.cote{position:relative;height:22px;margin-top:8px;border-left:1.5px solid #1C1C1E;border-right:1.5px solid #1C1C1E;transition:width .65s cubic-bezier(.2,.7,.2,1);max-width:100%}
.cote::before{content:'';position:absolute;left:0;right:0;top:10px;border-top:1.5px solid #1C1C1E}
.cote span{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#ECEBE8;padding:0 10px;font-size:15px;font-weight:800;line-height:22px;white-space:nowrap}
.hz{position:absolute;z-index:3}
.hz button{width:30px;height:30px;border-radius:50%;border:0;background:#D42A20;color:#FFFFFF;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(212,42,32,.18);transition:transform .2s}
.hz button:hover{transform:scale(1.12)}
.hz .tip{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);background:#1C1C1E;color:#FFFFFF;font-size:12.5px;font-weight:600;padding:8px 10px;border-radius:8px;white-space:nowrap;animation:fade .25s ease both}
.plan{width:100%;max-width:640px;position:relative}
.plan svg{display:block;width:100%;height:auto}
.photo{position:relative;flex:1;min-height:480px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 9s ease-out both}
.phcap{position:absolute;left:16px;bottom:16px;background:rgba(255,255,255,.94);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.strip div{background:#F6F5F3;border-radius:16px;padding:12px 14px}
.strip span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5C5C61}
.strip b{display:block;font-size:14px;margin-top:3px;line-height:1.3}

.panel{display:flex;flex-direction:column;gap:22px;padding:4px 0}
.ptitle{font-size:clamp(40px,4vw,60px);font-weight:900;letter-spacing:-.045em;line-height:.96;margin-top:10px}
.step-h{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:15px;margin-bottom:10px}
.step-h .l{display:flex;align-items:center;gap:10px}
.step-n{font-size:12px;width:26px;height:26px;border-radius:50%;background:#1C1C1E;color:#FFFFFF;display:grid;place-items:center;flex:none}
.step-h .v{font-size:13px;color:#5C5C61;font-weight:600}
.ideal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.icard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 16px;border:0;border-radius:18px;cursor:pointer;text-align:left;font-family:'Figtree',sans-serif;color:#1C1C1E;transition:background .25s,box-shadow .25s,transform .2s}
.icard:hover{transform:translateY(-2px)}
.icard .k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.icard b{font-size:22px;font-weight:900;letter-spacing:-.03em}
.icard span{font-size:13px}
.lens{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lbtn{min-height:54px;border:0;border-radius:14px;font:800 16px/1 'Figtree',sans-serif;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s,transform .15s}
.lbtn:hover{box-shadow:inset 0 0 0 2px #1C1C1E}
.lbtn:active{transform:scale(.96)}
.lbtn small{display:block;font:600 11px/1.2 'Figtree',sans-serif;margin-top:4px;opacity:.85}
.custom{display:flex;align-items:center;gap:10px;margin-top:8px;padding:4px 14px 4px 16px;border-radius:14px;background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #1C1C1E}
.custom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:800 17px/1 'Figtree',sans-serif;min-height:46px;color:#1C1C1E}
.fins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fbtn{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 12px;border:0;border-radius:16px;cursor:pointer;text-align:left;font:700 14px/1.25 'Figtree',sans-serif;color:#1C1C1E;transition:background .2s,box-shadow .2s}
.fbtn .sw{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px rgba(28,28,30,.15)}
.fbtn small{display:block;font-size:12px;font-weight:500;color:#5C5C61;margin-top:2px}
.recap{background:#1C1C1E;color:#FFFFFF;border-radius:24px;padding:22px}
.pricebox{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pricebox .p{font-size:40px;font-weight:900;letter-spacing:-.045em;line-height:1}
.pricebox small{display:block;font-size:13px;color:#BDBDC1;margin-top:6px;max-width:320px;line-height:1.45}
.rrow{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid #333337;font-size:14px}
.rrow span{color:#BDBDC1}
.rrow b{font-weight:700;text-align:right}
.code{font-size:12px;font-weight:700;letter-spacing:.06em;padding:9px 12px;border-radius:10px;background:#2A2A2E;margin-top:12px;overflow-wrap:anywhere;color:#E9E9EC}

.tabs{display:flex;gap:4px;background:#ECEBE8;border-radius:16px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{min-height:48px;padding:0 20px;border:0;border-radius:12px;font:700 15px/1 'Figtree',sans-serif;cursor:pointer;white-space:nowrap;transition:background .25s,color .25s}
.tabbody{margin-top:26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;animation:fade .4s ease both}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:8px}
.kv div{background:#F6F5F3;border-radius:16px;padding:14px 16px}
.kv span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5C5C61}
.kv b{display:block;font-size:15px;margin-top:4px;line-height:1.35}
.dtab{display:grid;gap:6px;margin-top:26px}
.drow{display:grid;grid-template-columns:130px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center;min-height:56px;padding:0 18px;border:0;border-radius:14px;cursor:pointer;text-align:left;font:500 14.5px/1.3 'Figtree',sans-serif;color:#1C1C1E;transition:background .2s,box-shadow .2s}
.drow:hover{box-shadow:inset 0 0 0 2px #1C1C1E}
.drow b{font-weight:800}
.dhead{display:grid;grid-template-columns:130px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:16px;padding:0 18px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#5C5C61}

.formw{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;align-items:start}
.form{background:#ECEBE8;border-radius:28px;padding:28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:700}
.fld input,.fld select,.fld textarea{font:500 15px/1.4 'Figtree',sans-serif;color:#1C1C1E;background:#FFFFFF;border:0;border-radius:12px;min-height:50px;padding:12px 14px;outline:0;transition:box-shadow .2s;width:100%}
.fld textarea{min-height:100px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{box-shadow:inset 0 0 0 2px #1C1C1E}
.fld input[readonly]{background:#F6F5F3;color:#3A3A3E}
.err{font-size:12.5px;color:#B3241B;font-weight:600}
.done{background:#1C1C1E;color:#FFFFFF;border-radius:28px;padding:36px;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;margin-top:28px}
.rcard{display:flex;flex-direction:column;text-decoration:none;color:#1C1C1E;background:#FFFFFF;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px #E6E5E1;transition:transform .3s,box-shadow .3s}
.rcard:hover{transform:translateY(-4px);box-shadow:0 0 0 1.5px #1C1C1E,0 22px 36px -28px rgba(28,28,30,.5)}
.rvis{background:#ECEBE8;padding:20px 16px 0}
.rvis img{width:100%;height:auto;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.rcard:hover .rvis img{transform:scale(1.05)}
.rbd{padding:14px 16px 16px}
.rbd b{display:block;font-size:17px;font-weight:800}
.rbd span{display:block;font-size:13px;color:#5C5C61;margin-top:4px}
.rbd em{display:block;font-style:normal;font-size:12px;font-weight:800;color:#B3241B;margin-top:8px}

.ftr{background:#ECEBE8;padding:64px 0 24px;margin-top:80px}
.ftr-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:36px}
.ftr-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5C5C61;margin-bottom:12px}
.ftr p{font-size:15px}
.ftr-links a{display:flex;align-items:center;min-height:36px;text-decoration:none;color:#1C1C1E;font-size:15px;font-weight:500}
.ftr-links a:hover{color:var(--acc)}
.ftr-tel{font-size:26px;font-weight:900;text-decoration:none;letter-spacing:-.02em;display:inline-block;color:#1C1C1E}
.ftr-bot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-top:56px;padding-top:12px;border-top:1px solid #D6D5D1;font-size:13px;color:#5C5C61}
.ftr-bot a{color:#5C5C61;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.ftr-bot a:hover{color:#1C1C1E}
.legal{display:flex;flex-wrap:wrap;gap:0 20px}

@media(max-width:1180px){.nav,.tel{display:none}.burger{display:inline-flex}.mnav{display:grid;gap:6px;padding:4px 16px 16px}}
@media(max-width:1080px){.pg{grid-template-columns:minmax(0,1fr)}.stw{position:static}}
@media(max-width:960px){.tabbody,.formw{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){.wrap{padding:0 16px}.topbar-note{display:none}.hdr-cta{display:none}.stage{min-height:0}.stv{padding:16px 16px 20px}.photo{min-height:320px}.hz{display:none}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.lens{grid-template-columns:repeat(4,minmax(0,1fr))}.lbtn{font-size:14px;min-height:52px}.lbtn small{font-size:10px}.form{grid-template-columns:minmax(0,1fr);padding:18px}.drow,.dhead{grid-template-columns:76px minmax(0,1fr) minmax(0,1fr);gap:10px;padding:0 12px}.drow .hide,.dhead .hide{display:none}.pricebox .p{font-size:34px}.vt button{padding:0 10px}.ftr{margin-top:64px}.done{padding:24px}}
@media (prefers-reduced-motion:reduce){.mt *{animation:none !important;transition:none !important}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3400},"accent":{"editor":"color","default":"#D42A20","options":["#D42A20","#1C1C1E","#B3241B"]},"usageInitial":{"editor":"enum","default":"patisserie","options":["patisserie","chocolat"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    const u = props && props.usageInitial === 'chocolat' ? 'choc' : 'pat';
    this.state = { menuOpen:false, len:101, custom:'', temp:u, fin:'blanc', view:'face', tab:'desc', hz:-1,
      f:{ nom:'', tel:'', mail:'', sec:'', cp:'', ville:'', msg:'' }, err:{}, sent:false };
  }
  setF(k, e){ const f = Object.assign({}, this.state.f); f[k] = e.target.value; const err = Object.assign({}, this.state.err); err[k] = false; this.setState({ f, err }); }
  submit(e){
    if (e && e.preventDefault) e.preventDefault();
    const f = this.state.f;
    const err = { nom: !f.nom.trim(), tel: !f.tel.trim(), mail: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.mail.trim()), msg: !f.msg.trim() };
    if (err.nom || err.tel || err.mail || err.msg) { this.setState({ err }); return; }
    this.setState({ sent:true, err:{} });
  }
  renderVals(){
    const s = this.state;
    const acc = (this.props && this.props.accent) || '#D42A20';
    const LENS = [101,117,146,169,191,222];
    const isCustom = s.len === 'sm';
    const cv = parseInt(s.custom, 10);
    const eff = isCustom ? (cv > 0 ? cv : 0) : s.len;
    const lenTxt = isCustom ? (cv > 0 ? 'Sur mesure · ' + cv + ' cm' : 'Sur mesure') : s.len + ' cm';
    const lenShort = isCustom ? (cv > 0 ? cv + ' cm' : '? cm') : s.len + ' cm';
    const draw = eff > 0 ? eff : 180;
    const pct = Math.max(56, Math.min(100, Math.round(62 + (draw - 101) / (222 - 101) * 38)));
    const choc = s.temp === 'choc';
    const blanc = s.fin === 'blanc';
    const isCatalog = s.len === 101 && blanc;
    const sel = 'background:#1C1C1E;color:#FFFFFF;box-shadow:none';
    const uns = 'background:#F6F5F3;color:#1C1C1E;box-shadow:inset 0 0 0 1px #E6E5E1';
    const lens = LENS.map(l => ({ label: String(l), sub: l === 101 ? '5 800 € HT' : 'sur devis', on: s.len === l ? 'true' : 'false', style: s.len === l ? sel : uns, pick: () => this.setState({ len:l }) }))
      .concat([{ label:'Sur', sub:'mesure', on: isCustom ? 'true' : 'false', style: isCustom ? sel : uns, pick: () => this.setState({ len:'sm' }) }]);
    const temps = [
      { id:'pat', metier:'Pâtisserie', range:'+2 / +8 °C', use:'Pâtisseries, macarons' },
      { id:'choc', metier:'Chocolat', range:'+14 / +18 °C', use:'Chocolats' }
    ].map(t => { const on = s.temp === t.id; return { metier:t.metier, range:t.range, use:t.use, on: on ? 'true' : 'false', style: on ? 'background:#FFFFFF;box-shadow:inset 0 0 0 2px #D42A20' : uns, kStyle: on ? 'color:#B3241B' : 'color:#5C5C61', pick: () => this.setState({ temp:t.id }) }; });
    const fins = [
      { id:'blanc', name:'Pierre acrylique blanche', sub:'Par défaut', sw:'background:#F6F4F0' },
      { id:'col', name:'Autre coloris', sub:'[COLORIS] · sur devis', sw:'background:repeating-linear-gradient(45deg,#DAD9D5 0 6px,#C9C8C4 6px 12px)' }
    ].map(x => ({ name:x.name, sub:x.sub, sw:x.sw, on: s.fin === x.id ? 'true' : 'false', style: s.fin === x.id ? 'background:#FFFFFF;box-shadow:inset 0 0 0 2px #1C1C1E' : uns, pick: () => this.setState({ fin:x.id }) }));
    const VIEWS = [['face','Face'],['plan','Vue de dessus'],['photo','Ambiance']];
    const views = VIEWS.map(v => ({ label:v[1], on: s.view === v[0] ? 'true' : 'false', style: s.view === v[0] ? 'background:#1C1C1E;color:#FFFFFF' : 'background:transparent;color:#3A3A3E', pick: () => this.setState({ view:v[0], hz:-1 }) }));
    const HZ = [
      ['Vitrages coulissants des 2 côtés','left:51%;top:20%'],
      ['Piliers et plan en pierre acrylique blanche','left:9%;top:44%'],
      ['Groupe logé · froid ventilé','left:72%;top:85%'],

    const hotspots = HZ.map((h, i) => ({ label:h[0], pos: h[1] + ';transform:translate(-50%,-50%)', on: s.hz === i ? 'true' : 'false', open: s.hz === i, pick: () => this.setState({ hz: s.hz === i ? -1 : i }) }));
    // vue de dessus
    const pw = Math.round(Math.min(560, Math.max(200, draw * 2.4)));
    const px = Math.round((640 - pw) / 2);
    const ax1 = px + 40, ax2 = px + pw - 40, mid = 320;
    const plan = { w: pw, x: px, xr: px + pw - 16, ix: px + 22, iw: pw - 44,
      arrT: 'M' + (mid - 60) + ' 80 H' + (mid + 60) + ' M' + (mid + 50) + ' 74 L' + (mid + 60) + ' 80 L' + (mid + 50) + ' 86 M' + (mid - 50) + ' 74 L' + (mid - 60) + ' 80 L' + (mid - 50) + ' 86',
      arrB: 'M' + (mid - 60) + ' 236 H' + (mid + 60) + ' M' + (mid + 50) + ' 230 L' + (mid + 60) + ' 236 L' + (mid + 50) + ' 242 M' + (mid - 50) + ' 230 L' + (mid - 60) + ' 236 L' + (mid - 50) + ' 242',
      cote: 'M' + px + ' 292 V312 M' + (px + pw) + ' 292 V312 M' + px + ' 303 H' + (px + pw) };
    const tabsDef = [['desc','Description'],['carac','Caractéristiques'],['dim','Dimensions']];
    const tabs = tabsDef.map(([id, name]) => ({ name, on: s.tab === id ? 'true' : 'false', style: s.tab === id ? 'background:#FFFFFF;color:#1C1C1E;box-shadow:0 1px 3px rgba(28,28,30,.15)' : 'background:transparent;color:#3A3A3E', pick: () => this.setState({ tab:id }) }));
    const rowOn = 'background:#1C1C1E;color:#FFFFFF', rowOff = 'background:#F6F5F3';
    const dimRows = LENS.map(l => ({ len: l + ' cm', dim: l === 101 ? '101 × 80 × 80 + 25 h' : '[DIMENSIONS]', expo: l === 101 ? 'Verre 81 × 60 cm' : 'Profondeur 60 cm', price: l === 101 ? '5 800,00 € HT' : 'Sur devis [PRIX]', on: s.len === l ? 'true' : 'false', style: s.len === l ? rowOn : rowOff, pick: () => this.setState({ len:l }) }))
      .concat([{ len:'Sur mesure', dim:'Selon votre local', expo:'Profondeur 60 cm', price:'Sur devis', on: isCustom ? 'true' : 'false', style: isCustom ? rowOn : rowOff, pick: () => this.setState({ len:'sm' }) }]);
    const tempTxt = choc ? '+14 / +18 °C' : '+2 / +8 °C';
    const finTxt = blanc ? 'Pierre acrylique blanche' : 'Autre coloris [COLORIS]';
    let priceTxt = 'Sur devis', priceSub;
    if (isCatalog) { priceTxt = '5 800,00 € HT'; priceSub = 'Modèle 101 cm en pierre acrylique blanche.'; }
    else if (s.len === 101) priceSub = 'Le tarif de 5 800,00 € HT s\'entend en pierre acrylique blanche ; autre coloris sur devis.';
    else if (isCustom) priceSub = 'Longueur sur mesure : chiffrage par le bureau d\'études.';
    else priceSub = 'Longueur ' + s.len + ' cm : [PRIX] — communiqué sur devis.';
    const code = 'GOURMANDISE · STONE · ' + (isCustom ? 'SM-' + (cv > 0 ? cv : '___') : 'L' + s.len) + ' · ' + (choc ? '+14/+18' : '+2/+8') + ' · ' + (blanc ? 'BLANC' : '[COLORIS]');
    const f = s.f, e = s.err || {};
    const bad = 'box-shadow:inset 0 0 0 2px #B3241B';
    const V = '../assets/v2/vitrine-';
    const REL = [['Réfrigérée Centrale','gourmandise','Vitrages des 2 côtés · prof. 60 cm','+2/+8 ou +14/+18 °C'],['Réfrigérée Plane','plane','Hauteur du plan · prof. 53 ou 60 cm','+2/+8 ou +14/+18 °C'],['Réfrigérée Vision','plane','8 cm sous le plan de travail','+2/+8 ou +14/+18 °C'],['Réfrigérée Panorama','panorama','2 ou 3 étagères réfrigérées','+2/+8 ou +14/+18 °C'],['Comptoir caisse','caisse','Tout commerce · avec ou sans tablette PMR','']];
    const secVal = f.sec || (choc ? 'Chocolats' : 'Pâtisserie');
    return {
      rootStyle: '--acc:' + acc,
      menuOpen: s.menuOpen, toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      views, isFace: s.view === 'face', isPlan: s.view === 'plan', isPhoto: s.view === 'photo',
      useTag: choc ? 'Chocolat · +14/+18 °C' : 'Pâtisserie · +2/+8 °C',
      gwStyle: 'width:' + pct + '%', hotspots, plan, lenShort,
      planAria: 'Vue de dessus du module Gourmandise, longueur ' + lenShort + ', profondeur d\'exposition 60 cm, vitrages coulissants des deux côtés',
      lenTxt, isCustom, custom: s.custom,
      setCustom: (ev) => this.setState({ custom: ev.target.value.replace(/[^0-9]/g, '').slice(0, 3) }),
      lens, temps, fins, tempTxt, finTxt, finShort: blanc ? 'Blanche' : '[COLORIS]',
      useTxt: choc ? 'Chocolat' : 'Pâtisserie', pourTxt: choc ? 'ma chocolaterie' : 'ma pâtisserie',
      priceTxt, priceSub, isCatalog,
      dimTxt: s.len === 101 ? '101 × 80 × 80 + 25 h' : '[DIMENSIONS]',
      code, tabs, tabDesc: s.tab === 'desc', tabCarac: s.tab === 'carac', tabDim: s.tab === 'dim', dimRows,
      modelTxt: 'Gourmandise ' + lenTxt + ' · ' + tempTxt + ' · ' + (blanc ? 'Pierre acrylique blanche' : '[COLORIS]'),
      f, secVal,
      inNom: (ev) => this.setF('nom', ev), inTel: (ev) => this.setF('tel', ev), inMail: (ev) => this.setF('mail', ev),
      inSec: (ev) => this.setF('sec', ev), inCp: (ev) => this.setF('cp', ev), inVille: (ev) => this.setF('ville', ev), inMsg: (ev) => this.setF('msg', ev),
      eNom: !!e.nom, eTel: !!e.tel, eMail: !!e.mail, eMsg: !!e.msg,
      eNomS: e.nom ? bad : '', eTelS: e.tel ? bad : '', eMailS: e.mail ? bad : '', eMsgS: e.msg ? bad : '',
      submit: (ev) => this.submit(ev), sent: s.sent, notSent: !s.sent, reset: () => this.setState({ sent:false }),
      related: REL.map(r => ({ name:r[0], svg: V + r[1] + '.svg', spec:r[2], temp:r[3], alt: r[0] + ', Ligne Stone' }))
    };
  }
