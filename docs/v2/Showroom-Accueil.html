<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RGTE · Showroom — Accueil</title>
<script src="../vendor/preact.min.js"></script>
<script src="../dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#fff}
sc-for,sc-if{display:contents}
.sr{--red:#D42A20;--red-d:#B5221A;--ink:#1C1C1E;--studio:#ECEBE8;--studio2:#E3E1DD;--mute:#5A5A5E;--line:#DAD8D3;font-family:'Jost',system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.5;font-size:17px;-webkit-font-smoothing:antialiased;overflow-x:clip;font-variant-numeric:tabular-nums}
.sr *,.sr *::before,.sr *::after{box-sizing:border-box}
.sr img{display:block;max-width:100%}
.sr h1,.sr h2,.sr h3,.sr h4,.sr p{margin:0}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px}
.top{background:var(--ink);color:#CFCEC9;font-size:13px}
.top-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:36px}
.top a{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.top a:hover{text-decoration:underline;text-underline-offset:3px}
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:24px;min-height:76px}
.logo{display:inline-flex;flex-direction:column;justify-content:center;text-decoration:none;color:var(--ink);line-height:1;min-height:44px}
.logo b{font-weight:700;font-size:30px;letter-spacing:.08em;color:var(--red)}
.logo span{font-size:11.5px;letter-spacing:.16em;margin-top:5px;font-weight:500}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:var(--ink);text-decoration:none;font-weight:500;font-size:16px}
.nav a::after{content:'';position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.tel{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-height:44px;padding-left:20px;border-left:1px solid var(--line)}
.tel svg{color:var(--red);flex:none}
.tel b{display:block;font-size:17px;font-weight:600;letter-spacing:.02em;line-height:1.1}
.tel small{display:block;font-size:12px;color:var(--mute);line-height:1.2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:3px;border:0;font:500 16px/1 'Jost',sans-serif;text-decoration:none;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s,transform .2s;white-space:nowrap}
.btn svg{flex:none;transition:transform .25s ease}
.btn:hover svg{transform:translateX(3px)}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-d)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{background:#000}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn-line:hover{background:var(--ink);color:#fff}
.btn-sm{min-height:44px;padding:0 18px;font-size:15px}
.burger{display:none;width:44px;height:44px;border-radius:3px;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);margin-left:auto}
.mnav{display:none}
.mnav a{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500;font-size:17px}
.kick{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--red)}
.kick::before{content:'';width:22px;height:2px;background:var(--red);display:block}
.h2{font-size:clamp(32px,3.6vw,52px);line-height:1.06;letter-spacing:-.01em;font-weight:600;overflow-wrap:anywhere}
.lead{font-size:clamp(17px,1.35vw,19px);color:var(--mute);line-height:1.55;max-width:60ch}
.sec{padding:72px 0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:24px 48px;flex-wrap:wrap;margin-bottom:36px}
.sec-h > div{max-width:720px}
.lnk{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--ink);font-weight:500;text-decoration:none;border-bottom:1.5px solid var(--ink)}
.lnk:hover{color:var(--red);border-color:var(--red)}
.sr :focus-visible{outline:2px solid var(--red);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.fade{animation:fade .45s ease both}
.sr [id]{scroll-margin-top:84px}

/* ---- Hero ---- */
.hero{position:relative;background:radial-gradient(ellipse 70% 80% at 68% 38%,#F7F6F4 0%,#ECEBE8 62%);overflow:hidden}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:150px;background:#E4E2DE;z-index:0}
.hero-g{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.3fr);gap:24px;align-items:center;padding-top:44px}
.hero-t{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;padding-bottom:40px}
.h1{font-size:clamp(40px,4.5vw,66px);line-height:1.02;font-weight:600;letter-spacing:-.015em;margin-top:20px;overflow-wrap:anywhere}
.hero-l{margin-top:22px;font-size:19px;color:#45454A;max-width:34em;line-height:1.55}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.calltel{display:inline-flex;align-items:center;gap:12px;min-height:50px;padding:0 20px 0 14px;border-radius:3px;background:#fff;text-decoration:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s}
.calltel:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.calltel b{font-size:18px;font-weight:600;letter-spacing:.02em;display:block;line-height:1.1}
.calltel small{font-size:12px;color:var(--mute);display:block;line-height:1.2}
.calltel svg{color:var(--red)}
.hero-m{margin-top:28px;font-size:14px;color:var(--mute);max-width:32em}
.stage{position:relative;padding:40px 0 0}
.stage-v{position:relative;aspect-ratio:480/320;width:100%;animation:slideIn 1.1s .15s cubic-bezier(.2,.7,.2,1) both}
.stage-v img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;transition:opacity .6s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.price-chip{position:absolute;top:28px;right:0;z-index:3;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;background:#fff;border-radius:40px;text-decoration:none;color:var(--ink);box-shadow:0 12px 30px -18px rgba(28,28,30,.45);transition:transform .25s}
.price-chip:hover{transform:translateY(-2px)}
.price-chip small{display:block;font-size:12px;color:var(--mute);line-height:1.2}
.price-chip b{display:block;font-size:20px;font-weight:600;line-height:1.15}
.price-chip i{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.capw{position:relative;min-height:62px;margin-top:6px}
.cap{position:absolute;left:0;right:0;top:0;transition:opacity .5s ease,transform .6s ease}
.cap b{font-size:20px;font-weight:600}
.cap span{display:block;font-size:15px;color:#45454A}
.rail{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:22px 0 30px}
.rbtn{position:relative;display:flex;align-items:center;gap:12px;min-height:76px;padding:10px 14px 10px 10px;border:0;border-radius:4px;cursor:pointer;text-align:left;font-family:'Jost',sans-serif;color:var(--ink);transition:background .25s,box-shadow .25s}
.rbtn::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.rbtn.on::before{transform:scaleX(1)}
.rbtn:hover{background:#fff}
.rbtn img{width:64px;height:43px;object-fit:contain;flex:none}
.rbtn b{display:block;font-size:16px;font-weight:600;line-height:1.2}
.rbtn small{display:block;font-size:13px;color:var(--mute)}

/* ---- Podiums ---- */
.pods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pod{position:relative;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--studio);border-radius:6px;overflow:hidden;transition:background .3s}
.pod:hover{background:#E6E5E1}
.pod-v::after{content:'';display:block;height:14px;margin:-6px -24px 0;background:#E1DFDB;box-shadow:inset 0 1px 0 #F7F6F4}
.pod-v{position:relative;padding:44px 24px 0;background:radial-gradient(ellipse 60% 70% at 50% 40%,#F6F5F3,transparent 70%)}
.pod-v img{width:100%;max-width:260px;margin:0 auto;aspect-ratio:480/320;object-fit:contain;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.pod:hover .pod-v img{transform:translateY(-8px) scale(1.02)}
.pod-n{padding:14px 22px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.pod-n h3{font-size:22px;font-weight:600;line-height:1.15}
.pod-n p{font-size:15px;color:#45454A;line-height:1.45}
.pod-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pod-tags span{font-size:13px;padding:4px 10px;border-radius:20px;background:#fff;color:var(--ink)}
.pod-go{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:500}
.pod-go i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;transition:background .25s,color .25s}
.pod:hover .pod-go i{background:var(--red);color:#fff}
.pod-cnt{position:absolute;top:16px;left:18px;font-size:13px;font-weight:500;color:var(--mute)}

/* ---- Vedette ---- */
.ved{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:56px;align-items:center}
.ved-s{position:relative;background:var(--studio);border-radius:6px;padding:64px 28px 36px;min-height:400px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.ved-img{width:100%;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.ved-img img{width:100%;aspect-ratio:480/320;object-fit:contain}
.cote{position:relative;height:22px;margin:4px 8.3% 0;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink)}
.cote::before{content:'';position:absolute;left:0;right:0;top:10px;border-top:1.5px solid var(--ink)}
.cote span{position:absolute;left:50%;top:0;transform:translateX(-50%);background:var(--studio);padding:0 10px;font-size:15px;font-weight:600;line-height:22px;white-space:nowrap}
.ved-tag{position:absolute;top:22px;left:24px;font-size:14px;color:var(--mute)}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;margin-top:26px;border-top:1px solid var(--line)}
.specs div{padding:12px 0;border-bottom:1px solid var(--line)}
.specs span{display:block;font-size:13px;color:var(--mute)}
.specs b{display:block;font-size:16px;font-weight:500;line-height:1.35}
.lens{display:flex;flex-wrap:wrap;gap:6px;margin-top:24px}
.len{min-width:64px;min-height:44px;padding:0 12px;border:0;border-radius:3px;font:500 15px/1 'Jost',sans-serif;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.len:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ved-p{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:22px}
.ved-p b{font-size:36px;font-weight:600;line-height:1;animation:fade .35s ease both}
.ved-p span{font-size:14px;color:var(--mute)}

/* ---- Secteurs ---- */
.sect{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:56px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:32px}
.chip{min-height:44px;padding:0 18px;border:0;border-radius:24px;font:500 15px/1 'Jost',sans-serif;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.chip:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.spanel{background:var(--studio);border-radius:6px;padding:32px;animation:fade .4s ease both}
.spanel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.spanel-h h3{font-size:32px;font-weight:600;line-height:1.1}
.temp{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:20px;background:#fff;font-size:15px;font-weight:500}
.temp svg{color:var(--red)}
.smods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(118px,100%),1fr));gap:8px;margin-top:22px}
.smod{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:#fff;border-radius:4px;padding:10px 12px 12px;transition:transform .25s,box-shadow .25s}
.smod:hover{transform:translateY(-3px);box-shadow:0 14px 24px -18px rgba(28,28,30,.5)}
.smod img{width:100%;aspect-ratio:480/320;object-fit:contain}
.smod b{font-size:15px;font-weight:600;line-height:1.25;margin-top:4px}
.smod small{font-size:13px;color:var(--mute)}
.snote{font-size:13px;color:var(--mute);margin-top:14px}

/* ---- Réalisations ---- */
.real{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:40px;align-items:stretch}
.rlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ritem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;min-height:76px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;font-family:'Jost',sans-serif;color:var(--ink);transition:background .25s,padding .3s}
.ritem:hover{background:#F6F5F3;padding-left:22px}
.ritem b{font-size:18px;font-weight:600;line-height:1.2}
.ritem small{grid-column:1;font-size:14px;color:var(--mute)}
.ritem em{grid-row:1 / span 2;grid-column:2;font-style:normal;font-size:13px;font-weight:500;padding:4px 10px;border-radius:20px}
.rview{position:relative;border-radius:6px;overflow:hidden;background:var(--studio);display:flex;flex-direction:column}
.rphoto{position:relative;flex:1;min-height:270px}
.rphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s ease,transform 1.2s ease}
.rphoto small{position:absolute;right:12px;top:12px;font-size:12px;background:rgba(255,255,255,.9);padding:4px 10px;border-radius:20px;color:var(--ink)}
.rinfo{background:var(--studio);padding:22px 24px 24px}
.rinfo-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.rinfo-h b{font-size:22px;font-weight:600}
.rinfo-h span{font-size:15px;color:var(--mute)}
.rmods{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.rmod{flex:1 1 120px;max-width:170px;background:#fff;border-radius:4px;padding:8px 10px 10px;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.rmod img{width:100%;aspect-ratio:480/320;object-fit:contain}
.rmod span{display:block;font-size:13px;font-weight:500;line-height:1.25}

/* ---- Méthode ---- */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.step{position:relative;display:flex;flex-direction:column;gap:8px;padding:24px 28px 8px 0;border:0;background:transparent;text-align:left;cursor:pointer;font-family:'Jost',sans-serif;color:var(--ink)}
.step::before{content:'';position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .45s ease}
.step.on::before,.step:hover::before{transform:scaleX(1)}
.step .n{font-size:15px;font-weight:600;color:var(--red)}
.step b{font-size:24px;font-weight:600;line-height:1.15}
.step p{font-size:15px;color:#45454A;line-height:1.5;max-width:28ch}
.step .free{align-self:flex-start;font-size:13px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--red);color:#fff}

/* ---- Matières ---- */
.mat{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1fr);gap:40px;align-items:center}
.mat-s{position:relative;background:var(--studio);border-radius:6px;aspect-ratio:16/10;overflow:hidden}
.mat-s img{position:absolute;left:8%;top:10%;width:84%;height:80%;object-fit:contain;transition:opacity .5s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.mat-s small{position:absolute;left:20px;bottom:16px;font-size:14px;color:var(--mute)}
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:30px}
.mbtn{display:flex;flex-direction:column;gap:12px;padding:12px 12px 16px;border:0;border-radius:4px;cursor:pointer;text-align:left;font-family:'Jost',sans-serif;color:var(--ink);background:#fff;transition:box-shadow .25s}
.mbtn:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sw{height:64px;border-radius:3px;position:relative;overflow:hidden}
.sw-pierre{background:url(../assets/marble-white.webp) center/cover}
.sw-granit{background:#3B3B3D;background-image:radial-gradient(circle,#6a6a6c 1px,transparent 1.5px),radial-gradient(circle,#1f1f20 1px,transparent 1.6px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
.sw-bois{background:#B8875A;box-shadow:inset 0 0 0 10px #B8875A,inset 0 0 0 12px #9C6F46,inset 0 0 0 16px #C69466,inset 0 0 0 17px #9C6F46}
.sw-verre{background:#CFE3EA;display:grid;place-items:center;color:rgba(28,28,30,.45);font-size:12px;letter-spacing:.2em}
.mbtn b{font-size:17px;font-weight:600;line-height:1.2}
.mbtn small{font-size:13px;color:var(--mute);line-height:1.35}

/* ---- Contact ---- */
.ctc{background:var(--studio)}
.ctc-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:56px;align-items:start}
.map{position:relative;margin-top:30px;border-radius:6px;overflow:hidden;background:#F5F4F1;height:210px}
.map svg{display:block;width:100%;height:100%}
.addr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:24px}
.addr span{display:block;font-size:13px;color:var(--mute)}
.addr p{font-size:16px;line-height:1.45}
.addr a{color:var(--ink);font-weight:600;text-decoration:none;font-size:19px}
.form{background:#fff;border-radius:6px;padding:32px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1/-1}
.fld label{font-size:14px;font-weight:500}
.fld input,.fld select,.fld textarea{font:400 16px/1.4 'Jost',sans-serif;color:var(--ink);background:#F6F5F3;border:0;border-radius:3px;min-height:50px;padding:12px 14px;outline:0;box-shadow:inset 0 0 0 1px #E0DED9;transition:box-shadow .2s,background .2s;width:100%}
.fld textarea{min-height:92px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.err{font-size:13px;color:#B3241B}
.check{grid-column:1/-1;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-radius:3px;cursor:pointer;font-size:15px;transition:background .2s,box-shadow .2s;border:0;font-family:'Jost',sans-serif;text-align:left;color:var(--ink)}
.check i{width:22px;height:22px;border-radius:3px;display:grid;place-items:center;flex:none;transition:background .2s}
.done{background:#fff;border-radius:6px;padding:40px;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}

/* ---- Footer ---- */
.ftr{background:var(--ink);color:#CFCEC9;padding:56px 0 20px}
.ftr .logo{color:#fff}
.ftr-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px}
.ftr-h{font-size:14px;color:#9C9B97;margin-bottom:12px}
.ftr p{font-size:15px;line-height:1.6}
.ftr-l a{display:flex;align-items:center;min-height:36px;color:#fff;text-decoration:none;font-size:15px}
.ftr-l a:hover{color:#F07A72}
.ftr-tel{font-size:28px;font-weight:600;color:#fff;text-decoration:none;letter-spacing:.02em}

            <span style="font-size:13px;color:#5A5A5E">* Obligatoire. Prototype : rien n’est envoyé.</span>
            <button type="submit" class="btn btn-red">Envoyer ma demande<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
          </div>
        </form>
      </sc-if>
      <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
        <div class="done" role="status">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#D42A20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M7 12.5l3 3 7-7"></path></svg>
          <h3 style="font-size:28px;font-weight:600;margin-top:16px">Demande envoyée, {{ f.nom }}.</h3>
          <p style="margin-top:8px;color:#45454A">{{ doneTxt }}</p>
          <p style="margin-top:8px;font-size:14px;color:#5A5A5E">Prototype : rien n’est envoyé.</p>
          <button type="button" class="btn btn-line" style="margin-top:22px" onClick="{{ reset }}">Modifier ma demande</button>
        </div>
      </sc-if>
    </div>
  </div>
</section>
</main>

  <div class="wrap">

        <a class="logo" href="Showroom-Accueil.html" aria-label="RGTE, accueil"><b>RGTE</b><span>R.G. Technologies</span></a>

      </div>
      <div><p class="ftr-h">Bureau d’études &amp; show-room</p><p>423, Chemin des Vernèdes<br>Espace Vernèdes 3<br>83480 Puget-sur-Argens</p></div>
      <div><p class="ftr-h">Appel gratuit</p><a class="ftr-tel" href="tel:0800951313">0 800 95 13 13</a><p style="margin-top:6px">Horaires : [HORAIRES]</p></div>
      <div class="ftr-l"><p class="ftr-h">Explorer</p><a href="Showroom-Lignes.html">Lignes d’agencement</a><a href="#secteurs">Secteurs</a><a href="#realisations">Réalisations</a><a href="#contact">Showroom &amp; contact</a></div>

</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":6250},"accent":{"editor":"color","default":"#D42A20","options":["#D42A20","#1C1C1E","#9E1F17"]},"ligneHero":{"editor":"enum","default":"stone","options":["stone","basique","legno","encastrable","industry"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    const lh = props && props.ligneHero ? props.ligneHero : 'stone';
    this.state = {
      menu:false, line: lh, gl:101, sect:1, real:0, step:1, mat:'pierre',
      f:{ secteur:'', nom:'', tel:'', mail:'', cp:'', msg:'' }, plan:true, err:{}, sent:false
    };
  }
  setF(k, e){ const f = Object.assign({}, this.state.f); f[k] = e.target.value; const err = Object.assign({}, this.state.err); err[k] = false; this.setState({ f, err }); }
  submit(e){
    if (e && e.preventDefault) e.preventDefault();
    const f = this.state.f;
    const err = { nom: !f.nom.trim(), tel: !f.tel.trim(), mail: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.mail.trim()), msg: !f.msg.trim() };
    if (err.nom || err.tel || err.mail || err.msg) { this.setState({ err }); return; }
    this.setState({ sent:true, err:{} });
  }
  renderVals(){
    const s = this.state;
    const acc = (this.props && this.props.accent) || '#D42A20';
    const V = (n) => '../assets/v2/vitrine-' + n + '.svg';
    const MOD = 'Showroom-Module.html', LIG = 'Showroom-Lignes.html';
    const LINES = [
      { id:'stone', name:'Ligne Stone', svg:'gourmandise', n:11, mat:'Structure en pierre acrylique type Corian, façade en verre avec sérigraphie à votre image.', tags:['Plane','Gourmandise','Panorama','Poissonnerie'], alt:'Vitrine Gourmandise de la Ligne Stone' },
      { id:'basique', name:'Ligne Basique', svg:'cube', n:12, mat:'Coloris et matériaux au choix, façade bois mélaminé ou verre en option, plan et plinthe en granit.', tags:['Cube','Pastry Show','Amandine'], alt:'Vitrine Cube de la Ligne Basique, façade bois à moulures' },
      { id:'legno', name:'Ligne Legno', svg:'legno', n:9, mat:'Panneau frontal en bois mélaminé, modules réfrigérés, neutres et chauffants.', tags:['Plane','Réfrigérée statique','Chauffante sèche'], alt:'Vitrine plane de la Ligne Legno, façade bois mélaminé' },
      { id:'encastrable', name:'Ligne Encastrable', svg:'encastrable', n:2, mat:'Module brut prêt à être habillé, en version comptoir ou meuble entier sur pied.', tags:['Cuve froid ventilé','Cuve froid statique'], alt:'Cuve encastrable brute, prête à habiller' },
      { id:'industry', name:'Ligne Industry', svg:'industry', n:11, mat:'Vitrines standardisées en longueurs et indépendantes, de la boucherie au supermarché.', tags:['Aramis','Hanoi','Loire','Hawaii'], alt:'Vitrine de la Ligne Industry, vitre bombée' }
    ];
    const heroImgs = LINES.map(l => ({ src:V(l.svg), alt: l.id === s.line ? l.alt : '', style: l.id === s.line ? 'opacity:1;transform:none' : 'opacity:0;transform:translateX(36px) scale(.97)' }));
    const heroCaps = LINES.map(l => ({ name:l.name, mat:l.mat, style: l.id === s.line ? 'opacity:1;transform:none' : 'opacity:0;transform:translateY(8px);pointer-events:none' }));
    const rail = LINES.map(l => {
      const on = l.id === s.line;
      return { name:l.name, count:l.n + ' modules', src:V(l.svg), on: on ? 'true' : 'false', cls: on ? 'rbtn on' : 'rbtn', style: on ? 'background:#fff;box-shadow:0 14px 28px -20px rgba(28,28,30,.45)' : 'background:transparent;box-shadow:inset 0 0 0 1px #D3D1CC', pick: () => this.setState({ line:l.id }) };
    });
    const podCls = ['pod','pod','pod','pod','pod'];
    const pods = LINES.map((l, i) => ({ cls: podCls[i], name:l.name, mat:l.mat, tags:l.tags, src:V(l.svg), alt:l.alt, count: l.n + (l.n > 1 ? ' modules' : ' module') }));

    // Vedette
    const GL = [101,117,146,169,191,222];
    const gl = s.gl;
    const pct = gl === 'sm' ? 100 : Math.max(46, Math.round(gl / 222 * 100));
    const vedLens = GL.map(l => ({ label: l + ' cm', on: gl === l ? 'true' : 'false', style: gl === l ? 'background:#1C1C1E;color:#fff' : 'background:#F1F0ED;color:#1C1C1E', pick: () => this.setState({ gl:l }) }))
      .concat([{ label:'Sur mesure', on: gl === 'sm' ? 'true' : 'false', style: gl === 'sm' ? 'background:#1C1C1E;color:#fff' : 'background:#F1F0ED;color:#1C1C1E', pick: () => this.setState({ gl:'sm' }) }]);

    // Secteurs
    const M = (name, svg, ligne) => ({ name, src:V(svg), ligne, href:MOD });
    const R = 'Modules utilisés dans nos réalisations pour ce métier.';
    const W = 'Sélection indicative, à valider avec le bureau d’études.';
    const SECT = [
      { n:'Boulangerie', t:'[TEMP. À VALIDER]', a:'ma boulangerie', mods:[M('Amandine','cube','Ligne Basique'),M('Comptoir caisse','caisse','Ligne Basique'),M('Réfrigérée statique','legno','Ligne Legno'),M('Vitrine neutre','caisse','Ligne Legno')], note:R },
      { n:'Pâtisserie', t:'+2 °C / +8 °C', a:'ma pâtisserie', mods:[M('Gourmandise','gourmandise','Ligne Stone'),M('Plane','plane','Ligne Stone'),M('Panorama','panorama','Ligne Stone'),M('Pastry Show','cube','Ligne Basique')], note:'Modules conseillés. Également : Vision, Centrale, Cube, Amandine.' },
      { n:'Chocolats', t:'+14 °C / +18 °C', a:'ma chocolaterie', mods:[M('Plane','plane','Ligne Stone'),M('Centrale','gourmandise','Ligne Stone'),M('Gourmandise','gourmandise','Ligne Stone'),M('Comptoir caisse','caisse','Ligne Stone')], note:R },
      { n:'Sandwichs', t:'[TEMP. À VALIDER]', a:'ma sandwicherie', mods:[M('Panoramique','panorama','Ligne Basique'),M('Basse','cube','Ligne Basique'),M('Murale self-service','panorama','Ligne Basique')], note:R },
      { n:'Traiteur', t:'[TEMP. À VALIDER]', a:'mon activité traiteur', mods:[M('Plane','plane','Ligne Stone'),M('Saladette','saladette','Ligne Stone'),M('Panorama','panorama','Ligne Stone'),M('Comptoir bar','caisse','Ligne Stone')], note:R },
      { n:'Poissonnerie', t:'−2 °C / 0 °C', a:'ma poissonnerie', mods:[M('Poissonnerie','poissonnerie','Ligne Stone'),M('Hanoi','poissonnerie','Ligne Industry'),M('Surface plane','plane','Ligne Stone'),M('Comptoir caisse','caisse','Ligne Stone')], note:'Froid statique avec serpentin de cuve et vidange. Sélection à valider avec le bureau d’études.' },
      { n:'Bar à salades', t:'+2 °C / +8 °C', a:'mon bar à salades', mods:[M('Saladette','saladette','Ligne Stone'),M('Panorama','panorama','Ligne Stone'),M('Comptoir caisse','caisse','Ligne Stone')], note:'Saladette en bacs gastronormes (bacs non fournis). ' + R },
      { n:'Bar à couscous', t:'+30 °C / +90 °C', a:'mon bar à couscous', mods:[M('Chaud bain-marie','bainmarie','Ligne Stone'),M('Comptoir caisse','caisse','Ligne Stone')], note:'Bain-marie avec trous arrondis sur mesure, réalisé en Isère. Caisse : à valider.' },
      { n:'Fromagerie', t:'[TEMP. À VALIDER]', a:'ma fromagerie', mods:[M('Plane','plane','Ligne Stone'),M('Panorama','panorama','Ligne Stone'),M('Comptoir caisse','caisse','Ligne Stone')], note:W },
      { n:'Bar', t:'[TEMP. À VALIDER]', a:'mon bar', mods:[M('Comptoir bar','caisse','Ligne Stone'),M('Comptoir caisse','caisse','Ligne Stone'),M('Panorama','panorama','Ligne Stone')], note:'Comptoir bar neutre ou réfrigéré. ' + W },
      { n:'Bar à topping', t:'[TEMP. À VALIDER]', a:'mon bar à topping', mods:[M('Saladette sur mesure','saladette','Ligne Stone'),M('Surface plane','plane','Ligne Stone')], note:'Saladette à trous arrondis et surface plane, réalisées pour une chaîne de bars à yogourt glacé.' },
      { n:'Coffee shop / Café', t:'[TEMP. À VALIDER]', a:'mon coffee shop', mods:[M('Comptoir bar','caisse','Ligne Stone'),M('Comptoir caisse','caisse','Ligne Stone'),M('Cube','cube','Ligne Basique')], note:W },
      { n:'Pizza al taglio', t:'+2 °C / +8 °C', a:'ma pizzeria', mods:[M('Saladette','saladette','Ligne Stone'),M('Plane','plane','Ligne Stone'),M('Comptoir caisse','caisse','Ligne Stone')], note:'Configuration d’une pizzeria sur composition à Paris. Température : celle de la saladette.' }
    ];
    const sectChips = SECT.map((x, i) => ({ n:x.n, on: s.sect === i ? 'true' : 'false', style: s.sect === i ? 'background:#1C1C1E;color:#fff' : 'background:#fff;color:#1C1C1E', pick: () => this.setState({ sect:i }) }));
    const sx = SECT[s.sect];
    const sect = { n:sx.n, t:sx.t, mods:sx.mods, note:sx.note, cta:'Plan 3D offert pour ' + sx.a, go: () => { const f = Object.assign({}, this.state.f); f.secteur = sx.n; this.setState({ f }); } };

    // Réalisations
    const REAL = [
      { type:'Pâtisserie', lieu:'Paris 4e', ligne:'Ligne Stone', img:'vitrine-glass-pastry', mods:[M('Vitrine réfrigérée Plane','plane',''),M('Comptoir caisse','caisse','')] },
      { type:'Bar à salades', lieu:'Département 13', ligne:'Ligne Stone', img:'saladette-bacs', mods:[M('Saladette','saladette',''),M('Comptoir caisse','caisse',''),M('Panorama','panorama','')] },
      { type:'Chocolatier', lieu:'Gap et Grenoble', ligne:'Ligne Stone', img:'chocolate-display', mods:[M('Plane','plane',''),M('Comptoir caisse','caisse','')] },
      { type:'Boulangerie pâtisserie', lieu:'La Réunion', ligne:'Ligne Basique', img:'vitrine-viennoiserie', mods:[M('Amandine','cube',''),M('Comptoir caisse','caisse','')] },
      { type:'Boulangerie', lieu:'Département 33', ligne:'Ligne Legno', img:'vitrine-wood', mods:[M('Réfrigérée statique','legno',''),M('Vitrine neutre','caisse',''),M('Module arrière','caisse','')] },
      { type:'Traiteur poissonnier', lieu:'Département 92', ligne:'Ligne Stone', img:'fish-ice', mods:[M('Panorama','panorama',''),M('Surface plane','plane',''),M('Comptoir caisse','caisse','')] }
    ];
    const reals = REAL.map((r, i) => ({ type:r.type, lieu:r.lieu, ligne:r.ligne, on: s.real === i ? 'true' : 'false', style: s.real === i ? 'background:#F1F0ED;box-shadow:inset 3px 0 0 #D42A20' : '', tagStyle: s.real === i ? 'background:#D42A20;color:#fff' : 'background:#F1F0ED;color:#1C1C1E', pick: () => this.setState({ real:i }) }));
    const realImgs = REAL.map((r, i) => ({ src:'../assets/' + r.img + '.webp', alt: s.real === i ? 'Illustration : ' + r.type.toLowerCase() : '', style: s.real === i ? 'opacity:1;transform:scale(1)' : 'opacity:0;transform:scale(1.06)' }));
    const rs = REAL[s.real];
    const realSel = { type:rs.type, lieu:rs.lieu, ligne:rs.ligne + ', modules installés', mods: rs.mods.map((m, j) => Object.assign({}, m, { key: s.real + '-' + j })) };

    // Méthode
    const STEPS = [
      { t:'Étude', d:'Le bureau d’études analyse votre local, vos dimensions et les produits à exposer.' },
      { t:'Plan 3D', d:'Nous élaborons le plan 3D de votre agencement : modules, matières, coloris.', free:true },
      { t:'Fabrication', d:'Vos vitrines sont fabriquées à vos dimensions, dans les matières retenues.' },
      { t:'Installation', d:'Mise en place dans votre commerce. Modalités et délais : [À PRÉCISER].' }
    ];
    const steps = STEPS.map((x, i) => ({ n:'Étape ' + (i + 1), t:x.t, d:x.d, free: !!x.free, on: s.step === i ? 'true' : 'false', cls: s.step === i ? 'step on' : 'step', pick: () => this.setState({ step:i }) }));

    // Matières
    const MATS = [
      { id:'pierre', name:'Pierre acrylique type Corian', use:'Structure de la Ligne Stone', sw:'sw sw-pierre', svg:'gourmandise', where:'Ligne Stone : piliers et plan de travail en pierre acrylique' },
      { id:'granit', name:'Granit', use:'Plan de travail et plinthe, Ligne Basique', sw:'sw sw-granit', svg:'cube', where:'Ligne Basique : plan de travail et plinthe en granit' },
      { id:'bois', name:'Bois mélaminé à moulures', use:'Façade des lignes Legno et Basique', sw:'sw sw-bois', svg:'legno', where:'Ligne Legno : panneau frontal en bois mélaminé' },
      { id:'verre', name:'Verre sérigraphié', use:'Façade Ligne Stone, option Basique', sw:'sw sw-verre', svg:'plane', where:'Ligne Stone : façade en verre avec sérigraphie du client' }
    ];
    const mats = MATS.map(m => ({ name:m.name, use:m.use, sw:m.sw, swTxt: m.id === 'verre' ? 'VOTRE LOGO' : '', on: s.mat === m.id ? 'true' : 'false', style: s.mat === m.id ? 'box-shadow:inset 0 0 0 2px #D42A20' : '', pick: () => this.setState({ mat:m.id }) }));
    const matImgs = MATS.map(m => ({ src:V(m.svg), alt: s.mat === m.id ? m.where : '', style: s.mat === m.id ? 'opacity:1;transform:none' : 'opacity:0;transform:translateY(14px)' }));
    const matSel = MATS.filter(m => m.id === s.mat)[0];

    const f = s.f, e = s.err || {};
    const bad = 'box-shadow:inset 0 0 0 2px #B3241B';
    return {
      rootStyle: '--red:' + acc,
      menuOpen: s.menu, menuAria: s.menu ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !s.menu }), closeMenu: () => this.setState({ menu:false }),
      heroImgs, heroCaps, rail, pods,
      vedImgStyle: 'width:' + pct + '%',
      vedLenTxt: gl === 'sm' ? 'Sur mesure' : gl + ' cm',
      vedLens,
      vedPrice: gl === 101 ? '5 800,00 € HT' : 'Sur devis',
      vedPriceSub: gl === 101 ? 'Modèle 101 cm, pierre acrylique blanche' : (gl === 'sm' ? 'Longueur sur mesure, chiffrée par le bureau d’études' : 'Longueur ' + gl + ' cm : [PRIX] communiqué sur devis'),
      sectChips, sect,
      reals, realImgs, realSel,
      steps, mats, matImgs, matSel,
      f, notSent: !s.sent, sent: s.sent,
      inSec: (ev) => this.setF('secteur', ev), inCp: (ev) => this.setF('cp', ev), inNom: (ev) => this.setF('nom', ev), inTel: (ev) => this.setF('tel', ev), inMail: (ev) => this.setF('mail', ev), inMsg: (ev) => this.setF('msg', ev),
      eNom: !!e.nom, eTel: !!e.tel, eMail: !!e.mail, eMsg: !!e.msg,
      eNomS: e.nom ? bad : '', eTelS: e.tel ? bad : '', eMailS: e.mail ? bad : '', eMsgS: e.msg ? bad : '',
      planAria: s.plan ? 'true' : 'false',
      planStyle: s.plan ? 'background:#FBEAE8;box-shadow:inset 0 0 0 1.5px #D42A20' : 'background:#F6F5F3;box-shadow:inset 0 0 0 1px #E0DED9',
      planBox: s.plan ? 'background:#D42A20' : 'background:#fff;box-shadow:inset 0 0 0 1.5px #9C9B97',
      togglePlan: () => this.setState({ plan: !s.plan }),
      submit: (ev) => this.submit(ev),
      doneTxt: (s.plan ? 'Le bureau d’études prépare votre plan 3D d’agencement' : 'Le bureau d’études revient vers vous') + (f.secteur ? ' pour votre activité : ' + f.secteur.toLowerCase() + '.' : '.'),
      reset: () => this.setState({ sent:false })
    };
  }
}
</script>
