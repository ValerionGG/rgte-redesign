<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RGTE · Métiers — Accueil</title>
<script src="../vendor/preact.min.js"></script>
<script src="../dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0;background:#FFFFFF}
sc-for,sc-if{display:contents}
.mt{--acc:#D42A20;--ink:#1C1C1E;--mute:#5C5C61;--studio:#ECEBE8;--studio2:#E4E3DF;--line:#DAD9D5;font-family:'Figtree',system-ui,sans-serif;color:#1C1C1E;background:#FFFFFF;-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;font-variant-numeric:tabular-nums}
.mt *,.mt *::before,.mt *::after{box-sizing:border-box}
.mt img{display:block;max-width:100%}
.mt h1,.mt h2,.mt h3,.mt h4,.mt p{margin:0}
.wrap{max-width:1320px;margin:0 auto;padding:0 32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* top + header */
.topbar{background:#1C1C1E;color:#C9C9CC;font-size:13px}
.topbar-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:40px}
.topbar a{color:#FFFFFF;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.topbar a:hover{text-decoration:underline;text-underline-offset:3px}
.hdr{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid #E6E5E1}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:76px}
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#1C1C1E;min-height:44px}
.logo-w{font-weight:900;font-size:29px;letter-spacing:-.04em;line-height:1;display:inline-flex;align-items:flex-end}
.logo-w i{display:block;width:8px;height:8px;background:var(--acc);margin:0 0 4px 3px}
.logo-s{display:block;border-left:1px solid #CFCECA;padding-left:11px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#5C5C61;line-height:1.25}
.nav{display:flex;align-items:center;gap:4px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-size:15px;font-weight:600;color:#3A3A3E;text-decoration:none;border-radius:10px;position:relative;transition:color .2s,background .2s}
.nav a::after{content:'';position:absolute;left:14px;right:14px;bottom:8px;height:2px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.nav a:hover{color:#1C1C1E}
.nav a:hover::after{transform:scaleX(1)}
.hdr-r{display:flex;align-items:center;gap:14px}
.tel{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#1C1C1E;min-height:44px}
.tel-i{width:40px;height:40px;border-radius:50%;border:1px solid #DAD9D5;display:grid;place-items:center;flex:none;transition:border-color .2s,background .2s}
.tel:hover .tel-i{border-color:var(--acc);background:#FBEDEC}
.tel b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.tel small{display:block;font-size:12px;color:#5C5C61;line-height:1.2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border-radius:12px;border:0;font:700 15px/1.15 'Figtree',system-ui,sans-serif;text-decoration:none;cursor:pointer;text-align:center;transition:transform .2s ease,box-shadow .25s ease,background .2s ease,color .2s}
.btn svg{flex:none;transition:transform .25s ease}
.btn:hover svg{transform:translateX(3px)}
.btn-acc{background:var(--acc);color:#FFFFFF}
.btn-acc:hover{transform:translateY(-1px);box-shadow:0 14px 28px -14px var(--acc)}
.btn-ink{background:#1C1C1E;color:#FFFFFF}
.btn-ink:hover{transform:translateY(-1px);box-shadow:0 14px 28px -16px #1C1C1E}
.btn-line{background:#FFFFFF;color:#1C1C1E;box-shadow:inset 0 0 0 1px #CFCECA}
.btn-line:hover{box-shadow:inset 0 0 0 2px #1C1C1E}
.btn-sm{min-height:44px;padding:0 18px;font-size:14px}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1px solid #DAD9D5;background:#FFFFFF;align-items:center;justify-content:center;cursor:pointer;color:#1C1C1E}
.mnav{display:none}
.mnav a{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;border-radius:12px;background:#ECEBE8;text-decoration:none;color:#1C1C1E;font-weight:700}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5C5C61}
.eyebrow i{width:18px;height:2px;background:var(--acc);display:block}
.h2{font-size:clamp(30px,3.5vw,48px);line-height:1.04;letter-spacing:-.035em;font-weight:800;overflow-wrap:anywhere}
.lead{font-size:clamp(16px,1.3vw,18px);color:#5C5C61;line-height:1.55}
.sec{padding:72px 0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 40px;flex-wrap:wrap;margin-bottom:28px}
.sec-h>div:first-child{flex:1 1 520px;min-width:0}
.sec-h .lead{flex:0 1 440px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;padding:5px 10px;border-radius:8px;background:#ECEBE8;color:#3A3A3E;white-space:nowrap}
.tag-val{background:#FFF1D6;color:#6B4A00}
.temp{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;padding:8px 12px;border-radius:10px;background:#1C1C1E;color:#FFFFFF;white-space:nowrap}
.temp svg{color:#FF8F86}
.mt :focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .45s ease both}
@keyframes swapA{from{opacity:0;transform:translateX(26px) scale(.98)}to{opacity:1;transform:none}}
@keyframes swapB{from{opacity:0;transform:translateX(26px) scale(.98)}to{opacity:1;transform:none}}
@keyframes txtA{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes txtB{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* hero */
.hero{padding:40px 0 56px}
.hero-g{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:56px;align-items:start}
.h1{font-size:clamp(38px,3.9vw,58px);line-height:.98;letter-spacing:-.045em;font-weight:900;overflow-wrap:anywhere;margin-top:20px}
.h1 em{font-style:normal;color:var(--acc)}
.youare{margin-top:36px;padding-top:28px;border-top:1px solid #E6E5E1}
.youare-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.youare-h b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.youare-h span{font-size:13px;color:#5C5C61}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #CFCECA;background:#FFFFFF;color:#1C1C1E;font:600 15px/1 'Figtree',sans-serif;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:hover{border-color:#1C1C1E}
.chip:active{transform:scale(.96)}
.hero-facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:28px;font-size:14px;color:#5C5C61}
.hero-facts span{display:inline-flex;align-items:center;gap:8px}
.hero-facts svg{color:var(--acc)}
.stage{background:#ECEBE8;border-radius:28px;overflow:hidden;position:relative}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 24px 0;flex-wrap:wrap}
.stage-top p{font-size:14px;color:#5C5C61}
.stage-top p b{color:#1C1C1E;font-weight:800}
.stage-v{position:relative;padding:0 40px;display:flex;justify-content:center;align-items:flex-end}
.stage-v::before{content:'';position:absolute;left:10%;right:10%;top:6%;bottom:16%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));pointer-events:none}
.stage-v img{position:relative;width:100%;max-width:520px;height:auto}
.stage-cap{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:6px 24px 18px;flex-wrap:wrap}
.stage-cap h3{font-size:clamp(24px,2.2vw,30px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.stage-cap p{font-size:14px;color:#5C5C61;margin-top:6px}
.lnk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:700;font-size:15px;color:#1C1C1E;text-decoration:none;border-bottom:2px solid var(--acc)}
.lnk svg{transition:transform .25s}
.lnk:hover svg{transform:translateX(4px)}
.thumbs-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 24px 10px;font-size:13px;font-weight:700;color:#3A3A3E;flex-wrap:wrap}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:0 24px 16px;scroll-padding:0 24px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.thumb{flex:0 0 124px;scroll-snap-align:start;border:0;border-radius:14px;padding:8px 8px 10px;cursor:pointer;text-align:left;font-family:'Figtree',sans-serif;color:#1C1C1E;transition:background .2s,box-shadow .2s,transform .2s}
.thumb:hover{transform:translateY(-2px)}
.thumb img{width:100%;height:auto}
.thumb b{display:block;font-size:13px;font-weight:700;line-height:1.2;margin-top:4px}
.thumb span{display:block;font-size:11.5px;color:#5C5C61;margin-top:2px}
.stage-cta{background:#FFFFFF;margin:0 8px 8px;border-radius:22px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stage-cta .btn-acc{flex:1 1 280px}

/* faits */
.facts{background:#1C1C1E;color:#FFFFFF}
.facts-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.fact{padding:26px 24px;border-left:1px solid #38383C}
.fact:first-child{border-left:0;padding-left:0}
.fact b{display:block;font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1}
.fact span{display:block;font-size:14px;color:#BDBDC1;margin-top:8px}

/* lignes */
.ltabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ltab{border:0;border-radius:20px;padding:14px 14px 16px;cursor:pointer;text-align:left;font-family:'Figtree',sans-serif;color:#1C1C1E;display:flex;flex-direction:column;gap:6px;transition:background .25s,box-shadow .25s,transform .25s}
.ltab:hover{transform:translateY(-3px)}
.ltab img{width:100%;height:auto;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.ltab:hover img{transform:scale(1.04)}
.ltab b{font-size:18px;font-weight:800;letter-spacing:-.02em}
.ltab span{font-size:13px;color:#5C5C61}
.ldet{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;background:#ECEBE8;border-radius:28px;padding:28px;align-items:center}
.ldet-v{background:#FFFFFF;border-radius:22px;padding:28px 36px 18px;position:relative}
.ldet-v img{width:100%;max-width:440px;height:auto;margin:0 auto}
.ldet h3{font-size:clamp(28px,2.8vw,40px);font-weight:900;letter-spacing:-.04em;line-height:1}
.specs{display:grid;gap:0;margin-top:20px;border-top:1px solid #D6D5D1}
.spec{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid #D6D5D1;font-size:15px}
.spec span{color:#5C5C61}
.spec b{font-weight:700}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.mchips a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;background:#FFFFFF;color:#1C1C1E;font-size:13px;font-weight:600;text-decoration:none;transition:background .2s,color .2s}
.mchips a:hover{background:#1C1C1E;color:#FFFFFF}

/* vedette */
.ved{background:#ECEBE8}
.ved-g{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:center}
.ved-st{background:#FFFFFF;border-radius:28px;padding:64px 40px 24px;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;overflow:hidden}
.ved-st .badge{position:absolute;top:20px;left:20px;display:flex;gap:8px;flex-wrap:wrap}
.ved-img{transition:width .6s cubic-bezier(.2,.7,.2,1);max-width:100%}
.ved-img img{width:100%;height:auto}
.cote{position:relative;height:20px;margin-top:10px;border-left:1.5px solid #1C1C1E;border-right:1.5px solid #1C1C1E;transition:width .6s cubic-bezier(.2,.7,.2,1);max-width:100%}
.cote::before{content:'';position:absolute;left:0;right:0;top:9px;border-top:1.5px solid #1C1C1E}
.cote span{position:absolute;left:50%;top:-1px;transform:translateX(-50%);background:#FFFFFF;padding:0 10px;font-size:14px;font-weight:800;line-height:20px;white-space:nowrap}
.lens{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.lbtn{min-height:48px;min-width:64px;padding:0 12px;border:0;border-radius:12px;font:700 15px/1 'Figtree',sans-serif;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.lbtn:hover{box-shadow:inset 0 0 0 2px #1C1C1E}
.ideal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:22px}
.ideal div{background:#FFFFFF;border-radius:16px;padding:14px 16px}
.ideal span{display:block;font-size:13px;color:#5C5C61}
.ideal b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.ticks{display:grid;gap:8px;margin-top:22px;padding:0;list-style:none}
.ticks li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.ticks svg{flex:none;margin-top:3px;color:var(--acc)}
.price{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:26px;padding-top:22px;border-top:1px solid #D6D5D1}
.price b{display:block;font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1}
.price small{display:block;font-size:13px;color:#5C5C61;margin-top:6px;max-width:300px}

/* secteurs */
.sgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.sect{display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:150px;padding:14px;border-radius:18px;text-decoration:none;color:#1C1C1E;transition:background .25s,box-shadow .25s,transform .25s}
.sect:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 2px #1C1C1E}
.sect img{width:100%;height:auto;margin-top:auto}
.sect b{font-size:16px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.sect small{display:block;font-size:12.5px;font-weight:600}
.sect-cta{background:var(--acc);color:#FFFFFF}
.sect-cta:hover{box-shadow:none}

/* réalisations */
.rf{display:flex;gap:4px;background:#ECEBE8;border-radius:14px;padding:4px;flex-wrap:wrap}
.rf button{min-height:44px;padding:0 16px;border:0;border-radius:10px;font:700 14px/1 'Figtree',sans-serif;cursor:pointer;transition:background .2s,color .2s}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:16px}
.rcard{display:flex;flex-direction:column;background:#FFFFFF;border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px #E6E5E1;transition:box-shadow .3s,transform .3s;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.rcard:hover{transform:translateY(-4px);box-shadow:0 0 0 1px #1C1C1E,0 26px 40px -30px rgba(28,28,30,.45)}
.rvis{position:relative;height:190px;overflow:hidden;background:#ECEBE8}
.rvis .ph{width:100%;height:190px;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.rcard:hover .rvis .ph{transform:scale(1.05)}
.rvis .ins{position:absolute;right:12px;bottom:12px;width:132px;background:#FFFFFF;border-radius:12px;padding:6px 8px 2px;box-shadow:0 10px 24px -14px rgba(0,0,0,.5)}
.rvis .ins img{width:100%;height:auto}
.rvis .solo{display:flex;align-items:flex-end;justify-content:center;height:190px;padding:18px 60px 6px}
.rvis .solo img{width:100%;max-width:300px;height:auto}
.rvis .cap{position:absolute;left:12px;top:12px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.92);color:#3A3A3E}
.rbd{padding:16px 20px 18px;display:flex;flex-direction:column;gap:6px}
.rbd-t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rbd h3{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.rbd .n{font-size:13px;font-weight:800;color:var(--acc)}
.rbd p{font-size:14px;color:#5C5C61}
.rbd .mods{font-size:14px;color:#1C1C1E;font-weight:600}
.empty{grid-column:1/-1;background:#ECEBE8;border-radius:22px;padding:36px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}

/* méthode */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:relative}
.step{border:0;border-radius:20px;padding:20px;text-align:left;cursor:pointer;font-family:'Figtree',sans-serif;color:#1C1C1E;min-height:150px;display:flex;flex-direction:column;gap:10px;transition:background .3s,color .3s,transform .25s}
.step:hover{transform:translateY(-3px)}
.step .num{font-size:14px;font-weight:800;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.step b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.step span{font-size:15px;line-height:1.5}
.prog{height:4px;background:#E6E5E1;border-radius:4px;margin-top:18px;overflow:hidden}
.prog i{display:block;height:4px;background:var(--acc);border-radius:4px;transition:width .6s cubic-bezier(.2,.7,.2,1)}

/* matières */
.mats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mat{border-radius:22px;overflow:hidden;background:#FFFFFF;box-shadow:0 0 0 1px #E6E5E1;transition:transform .3s,box-shadow .3s}
.mat:hover{transform:translateY(-4px);box-shadow:0 0 0 1px #1C1C1E}
.sw{height:120px;position:relative;transition:height .4s cubic-bezier(.2,.7,.2,1)}
.mat:hover .sw{height:132px}
.sw-pierre{background:#F6F4F0;box-shadow:inset 0 -1px 0 #E2DFD9}
.sw-pierre::after{content:'';position:absolute;inset:0;background:url(../assets/marble-white.webp) center/cover;opacity:.55;mix-blend-mode:multiply}
.sw-granit{background-color:#3B3B3D;background-image:radial-gradient(#6A6A6E 1px,transparent 1.4px),radial-gradient(#252527 1px,transparent 1.4px);background-size:9px 9px,13px 13px;background-position:0 0,4px 6px}
.sw-bois{background-color:#B8875A;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 14px)}
.sw-bois::after{content:'';position:absolute;left:18px;right:18px;top:22px;bottom:22px;border:2px solid rgba(80,50,20,.28);box-shadow:inset 0 0 0 6px rgba(255,255,255,.08),inset 0 0 0 8px rgba(80,50,20,.18)}
.sw-verre{background:#CFE3EA}
.sw-verre::before{content:'';position:absolute;left:-20%;top:0;width:30%;height:100%;background:rgba(255,255,255,.45);transform:skewX(-20deg);transition:left .8s cubic-bezier(.2,.7,.2,1)}
.mat:hover .sw-verre::before{left:90%}
.sw-verre span{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:11px;letter-spacing:.32em;color:#557684;font-weight:600}
.mat-b{padding:16px 18px 18px}
.mat-b b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em}
.mat-b p{font-size:14px;color:#5C5C61;margin-top:6px}
.mat-b .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

/* contact */
.ct{background:#1C1C1E;color:#FFFFFF}
.ct-g{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:start}
.ct .eyebrow{color:#BDBDC1}
.ct .lead{color:#BDBDC1}
.ct-tel{display:inline-block;font-size:clamp(34px,3.6vw,50px);font-weight:900;letter-spacing:-.04em;color:#FFFFFF;text-decoration:none;line-height:1;margin-top:28px}
.ct-tel:hover{color:#FF8F86}
.ct-info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:28px;font-size:15px}
.ct-info span{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9C9CA1;margin-bottom:6px}
.map{margin-top:28px;border-radius:22px;background:#26262A;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
@keyframes pulse{0%{r:8;opacity:.6}100%{r:26;opacity:0}}
.pulse{animation:pulse 2.2s ease-out infinite}
.form{background:#FFFFFF;color:#1C1C1E;border-radius:28px;padding:30px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form h3{grid-column:1/-1;font-size:26px;font-weight:800;letter-spacing:-.03em}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:700}
.fld input,.fld select,.fld textarea{font:500 15px/1.4 'Figtree',sans-serif;color:#1C1C1E;background:#F4F3F1;border:0;border-radius:12px;min-height:50px;padding:12px 14px;outline:0;transition:box-shadow .2s,background .2s;width:100%}
.fld textarea{min-height:88px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{box-shadow:inset 0 0 0 2px #1C1C1E;background:#FFFFFF}
.err{font-size:12.5px;color:#B3241B;font-weight:600}
.done{background:#FFFFFF;color:#1C1C1E;border-radius:28px;padding:40px;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}

/* footer */
.ftr{background:#ECEBE8;padding:72px 0 24px}
.ftr-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:36px}
.ftr-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5C5C61;margin-bottom:12px}
.ftr p{font-size:15px}
.ftr-links a{display:flex;align-items:center;min-height:36px;text-decoration:none;color:#1C1C1E;font-size:15px;font-weight:500}
.ftr-links a:hover{color:var(--acc)}
.ftr-tel{font-size:26px;font-weight:900;text-decoration:none;letter-spacing:-.02em;display:inline-block;color:#1C1C1E}
.ftr-bot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-top:56px;padding-top:12px;border-top:1px solid #D6D5D1;font-size:13px;color:#5C5C61}
.ftr-bot a{color:#5C5C61;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.ftr-bot a:hover{color:#1C1C1E}
.legal{display:flex;flex-wrap:wrap;gap:0 20px}

@media(max-width:1180px){.nav,.tel{display:none}.burger{display:inline-flex}.mnav{display:grid;gap:6px;padding:4px 16px 16px}.sgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:1080px){.hero-g,.ved-g,.ct-g,.ldet{grid-template-columns:minmax(0,1fr)}.ltabs{grid-template-columns:repeat(5,minmax(180px,1fr));overflow-x:auto;padding-bottom:6px}.steps,.mats{grid-template-columns:repeat(2,minmax(0,1fr))}.facts-g{grid-template-columns:repeat(2,minmax(0,1fr))}.fact:nth-child(3){border-left:0;padding-left:0}}
@media(max-width:720px){.wrap{padding:0 16px}.sec{padding:72px 0}.hero{padding:32px 0 56px}.topbar-note{display:none}.hdr-cta{display:none}.stage-v{padding:8px 16px 0;min-height:0}.stage-top,.stage-cap,.thumbs-h{padding-left:16px;padding-right:16px}.thumbs{padding:0 16px 16px}.ldet{padding:16px;gap:20px}.ldet-v{padding:16px}.spec{grid-template-columns:110px minmax(0,1fr)}.ved-st{padding:60px 16px 20px;min-height:0}.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.steps{grid-template-columns:minmax(0,1fr)}.mats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sw{height:90px}.mat-b{padding:12px}.mat-b b{font-size:15px}.mat-b p{font-size:13px}.step{min-height:0}.form{grid-template-columns:minmax(0,1fr);padding:20px}.ct-info{grid-template-columns:minmax(0,1fr)}.fact{padding:18px 12px}.fact b{font-size:24px}.rvis .solo{padding:18px 30px 6px}.done{padding:26px}}
@media (prefers-reduced-motion:reduce){.mt *{animation:none !important;transition:none !important}}
</style>
</helmet>

<main>
<!-- HERO : Vous êtes… -->
<section class="hero" id="vous-etes">
  <div class="wrap hero-g">
    <div>

      <p class="lead rise d2" style="margin-top:20px;max-width:520px">Votre métier, vos vitrines. Dites-nous ce que vous vendez : nous vous montrons les modules adaptés, puis notre bureau d'études élabore votre plan 3D d'agencement, adapté à votre local et à vos dimensions.</p>

        <div class="youare-h"><b>Vous êtes…</b><span>13 métiers de bouche</span></div>
        <div class="chips" role="group" aria-label="Choisissez votre métier">
          <sc-for list="{{ metiers }}" as="m" hint-placeholder-count="13">
            <button type="button" class="chip" style="{{ m.chipStyle }}" aria-pressed="{{ m.on }}" onClick="{{ m.pick }}">{{ m.label }}</button>
          </sc-for>
        </div>
      </div>
      <div class="hero-facts rise d4">
        <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Plan 3D d'agencement offert</span>
        <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Fabrication sur mesure</span>
        <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Show-room à Puget-sur-Argens</span>
      </div>
    </div>

    <div class="stage rise d2" aria-live="polite">
      <div class="stage-top">
        <p>Vitrine conseillée · <b>{{ cur.label }}</b></p>
        <span class="temp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"></path></svg>{{ stageTemp }}</span>
      </div>
      <div class="stage-v">
        <img src="{{ hm.svg }}" alt="{{ hm.alt }}" style="{{ swapAnim }}" width="480" height="320">
      </div>
      <div class="stage-cap" style="{{ txtAnim }}">

          <h3>{{ hm.name }}</h3>
          <p>{{ hm.ligneLabel }} · {{ hm.spec }}</p>
        </div>
        <a class="lnk" href="Metiers-Module.html">Voir la fiche<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      </div>
      <div class="thumbs-h"><span>{{ recCount }} modules conseillés pour {{ cur.lower }}</span><sc-if value="{{ cur.toValidate }}" hint-placeholder-val="{{ false }}"><span class="tag tag-val">Sélection à valider</span></sc-if><sc-if value="{{ cur.validated }}" hint-placeholder-val="{{ true }}"><span class="tag">Sélection RGTE</span></sc-if></div>

        <a class="btn btn-line" href="tel:0800951313"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D42A20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>0 800 95 13 13</a>

<!-- LIGNES -->

      </div>
    </div>
  </div>
</section>

<!-- SECTEURS -->

        <span class="eyebrow"><i></i>Secteurs d'activité</span>

    </div>
  </div>

<!-- RÉALISATIONS -->
<section class="sec" id="realisations" style="background:#F6F5F3">
  <div class="wrap">
    <div class="sec-h">
      <div>
        <span class="eyebrow"><i></i>Réalisations</span>
        <h2 class="h2" style="margin-top:14px">Ils ont équipé leur boutique.</h2>
      </div>
      <div class="rf" role="group" aria-label="Filtrer les réalisations">
        <button type="button" style="{{ rfVed }}" onClick="{{ setVed }}" aria-pressed="{{ rfVedOn }}">En vedette</button>
        <button type="button" style="{{ rfMet }}" onClick="{{ setMet }}" aria-pressed="{{ rfMetOn }}">{{ cur.label }} ({{ cur.nReal }})</button>

    </div>
  </div>
</section>

<!-- MÉTHODE -->
<section class="sec" id="methode">
  <div class="wrap">
    <div class="sec-h">
      <div>
        <span class="eyebrow"><i></i>Notre méthode</span>
        <h2 class="h2" style="margin-top:14px">De votre local à votre vitrine.</h2>
      </div>
      <a class="btn btn-acc" href="#contact">Démarrer par le plan 3D offert</a>
    </div>
    <div class="steps" role="group" aria-label="Étapes du projet">
      <sc-for list="{{ steps }}" as="st" hint-placeholder-count="4">
        <button type="button" class="step" style="{{ st.style }}" aria-pressed="{{ st.on }}" onClick="{{ st.pick }}"><span class="num" style="{{ st.numStyle }}">{{ st.n }}</span><b>{{ st.t }}</b><span>{{ st.d }}</span></button>
      </sc-for>
    </div>
    <div class="prog" aria-hidden="true"><i style="{{ progW }}"></i></div>
  </div>
</section>

<!-- MATIÈRES -->
<section class="sec" id="matieres" style="padding-top:24px">
  <div class="wrap">
    <div class="sec-h">
      <div>
        <span class="eyebrow"><i></i>Matières</span>
        <h2 class="h2" style="margin-top:14px">Les matières tendance, au choix.</h2>
      </div>
      <p class="lead">Coloris et matériaux selon votre souhait : vos produits méritent d'être mis en valeur.</p>
    </div>
    <div class="mats">
      <div class="mat"><div class="sw sw-pierre"></div><div class="mat-b"><b>Pierre acrylique type Corian</b><p>Structure de la Ligne Stone ; piliers et plan du module Gourmandise.</p><div class="tags"><span class="tag">Stone</span></div></div></div>

    const hmIdx = Math.min(s.hm, recIds.length - 1);
    const hm = M[recIds[hmIdx]];
    const recs = recIds.map((id, i) => { const m = M[id]; const on = i === hmIdx; return { name:m.name, svg:m.svg, ligneShort:'Ligne ' + m.ligneShort + (m.temp ? ' · ' + m.temp : ''), on: on ? 'true' : 'false', style: on ? 'background:#FFFFFF;box-shadow:inset 0 0 0 2px #1C1C1E' : 'background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 1px #D6D5D1', pick: () => this.setState({ hm:i, k:s.k + 1 }) }; });
    const odd = s.k % 2 === 1;
    const swapAnim = 'animation:' + (odd ? 'swapA' : 'swapB') + ' .6s cubic-bezier(.2,.7,.2,1) both';
    const txtAnim = 'animation:' + (odd ? 'txtA' : 'txtB') + ' .5s .08s cubic-bezier(.2,.7,.2,1) both';
    const stageTemp = cm.temp ? cm.temp : (hm.temp ? hm.temp : 'Plage selon module');
    // lignes
    const lignes = D.lignes.map(l => { const on = l.id === s.ligne; return { name:l.name, svg:l.svg, short:l.short, count:l.mods.length, on: on ? 'true' : 'false', style: on ? 'background:#ECEBE8;box-shadow:inset 0 0 0 2px #1C1C1E' : 'background:#F6F5F3', pick: () => this.setState({ ligne:l.id, lk:s.lk + 1 }) }; });
    const lg0 = D.lignes.find(l => l.id === s.ligne);
    const lg = Object.assign({}, lg0, { count: lg0.mods.length });
    const ligneAnim = 'animation:' + (s.lk % 2 ? 'txtA' : 'txtB') + ' .5s cubic-bezier(.2,.7,.2,1) both';
    // vedette
    const LENS = [101,117,146,169,191,222];
    const vedLens = LENS.map(l => ({ label: l + ' cm', on: s.gl === l ? 'true' : 'false', style: s.gl === l ? 'background:#1C1C1E;color:#FFFFFF' : 'background:#FFFFFF;color:#1C1C1E', pick: () => this.setState({ gl:l }) }));
    const pct = Math.round(58 + (s.gl - 101) / (222 - 101) * 42);
    // réalisations
    let list;
    if (s.rf === 'vedette') list = [1,2,3,7,13,4];
    else if (s.rf === 'metier') list = cm.reals;
    else list = D.reals.map(r => r.id);
    const reals = list.map((id, i) => { const r = D.reals.find(x => x.id === id); const mm = M[r.main]; return Object.assign({}, r, { num: (r.id < 10 ? '0' : '') + r.id, hasImg: !!r.img, noImg: !r.img, svg: mm.svg, svgAlt: mm.alt, delay: 'animation-delay:' + (i * 0.05).toFixed(2) + 's' }); });
    const segOn = 'background:#1C1C1E;color:#FFFFFF', segOff = 'background:transparent;color:#3A3A3E';
    // méthode
    const STEPS = [
      ['Étude','Le bureau d\'études analyse votre local, vos dimensions et les produits que vous exposez.'],
      ['Plan 3D','Nous élaborons votre plan 3D d\'agencement : modules, matières, coloris. Il est offert.'],
      ['Fabrication','Vos vitrines sont fabriquées sur mesure, adaptées à votre local. Délai : [DÉLAI].'],
      ['Installation','Votre agencement est mis en place dans votre commerce. Modalités : [À PRÉCISER].']
    ];
    const steps = STEPS.map((x, i) => { const on = i === s.step; const past = i < s.step; return { n: '0' + (i + 1), t:x[0], d:x[1], on: on ? 'true' : 'false', style: on ? 'background:#1C1C1E;color:#FFFFFF' : 'background:#F6F5F3;color:#1C1C1E', numStyle: on ? 'background:#D42A20;color:#FFFFFF' : (past ? 'background:#1C1C1E;color:#FFFFFF' : 'background:#FFFFFF;color:#1C1C1E;box-shadow:inset 0 0 0 1px #CFCECA'), pick: () => this.setState({ step:i }) }; });
    const f = s.f, e = s.err || {};
    const bad = 'box-shadow:inset 0 0 0 2px #B3241B';
    return {
      rootStyle: '--acc:' + acc,
      menuOpen: s.menuOpen, toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }), closeMenu: () => this.setState({ menuOpen:false }),
      metiers, metier: s.metier,
      cur: { label:cm.label, lower:cm.lower, pour:cm.pour, validated: !!cm.validated, toValidate: !cm.validated, nReal: cm.reals.length },
      hm, recs, recCount: recIds.length, swapAnim, txtAnim, stageTemp,
      lignes, lg, ligneAnim,
      vedLens, vedW: 'width:' + pct + '%', vedCote: 'width:' + pct + '%', vedLen: s.gl + ' cm',
      vedPrice: s.gl === 101 ? '5 800 € HT' : 'Sur devis',
      vedSub: s.gl === 101 ? 'Modèle 101 cm, pierre acrylique blanche.' : 'Longueur ' + s.gl + ' cm : [PRIX] — chiffrage par le bureau d\'études.',
      reals, realEmpty: reals.length === 0,
      rfVed: s.rf === 'vedette' ? segOn : segOff, rfMet: s.rf === 'metier' ? segOn : segOff, rfAll: s.rf === 'toutes' ? segOn : segOff,
      rfVedOn: s.rf === 'vedette' ? 'true' : 'false', rfMetOn: s.rf === 'metier' ? 'true' : 'false', rfAllOn: s.rf === 'toutes' ? 'true' : 'false',
      setVed: () => this.setState({ rf:'vedette' }), setMet: () => this.setState({ rf:'metier' }), setAll: () => this.setState({ rf:'toutes' }),
      steps, progW: 'width:' + ((s.step + 1) * 25) + '%',
      f, inMetier: (ev) => this.setState({ metier: ev.target.value, hm:0, k:s.k + 1 }),
      inNom: (ev) => this.setF('nom', ev), inTel: (ev) => this.setF('tel', ev), inMail: (ev) => this.setF('mail', ev), inCp: (ev) => this.setF('cp', ev), inDim: (ev) => this.setF('dim', ev), inMsg: (ev) => this.setF('msg', ev),
      msgPh: 'Ex. : ' + cm.label.toLowerCase() + ', local de [N] m², modules souhaités…',
      eNom: !!e.nom, eTel: !!e.tel, eMail: !!e.mail,
      eNomS: e.nom ? bad : '', eTelS: e.tel ? bad : '', eMailS: e.mail ? bad : '',
      submit: (ev) => this.submit(ev), sent: s.sent, notSent: !s.sent, reset: () => this.setState({ sent:false }),
      recNames: recIds.slice(0, 3).map(id => M[id].name).join(', ')
    };
  }
}
</script>
