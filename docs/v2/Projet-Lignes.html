<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RGTE · Projet 3D — Lignes d'agencement</title>
<script src="../vendor/preact.min.js"></script>
<script src="../dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#FFFFFF}
sc-for,sc-if{display:contents}
.pj{--acc:#D42A20;--ink:#1C1C1E;--mute:#5C5C61;--line:#DAD9D5;--studio:#ECEBE8;--soft:#F6F5F3;font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:#FFFFFF;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-feature-settings:"tnum" 1}
.pj *,.pj *::before,.pj *::after{box-sizing:border-box}
.pj img{display:block;max-width:100%}
.pj h1,.pj h2,.pj h3,.pj h4,.pj p{margin:0}
.pj button{font-family:inherit}
.pj :focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.wrap{max-width:1320px;margin:0 auto;padding:0 32px}
section[id]{scroll-margin-top:84px}

.topbar{background:var(--ink);color:#C9C9CC;font-size:13px}
.topbar-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:36px}
.topbar a{color:#FFFFFF;text-decoration:none;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.topbar a:hover{text-decoration:underline;text-underline-offset:3px}
.hdr{position:sticky;top:0;z-index:80;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:72px}
.logo{display:inline-flex;flex-direction:column;text-decoration:none;color:var(--ink);min-height:44px;justify-content:center}
.logo-w{font-weight:800;font-size:27px;letter-spacing:-.01em;line-height:1}
.logo-c{display:block;height:7px;margin:4px 0 3px;border-left:1.5px solid var(--acc);border-right:1.5px solid var(--acc);position:relative}
.logo-c::before{content:'';position:absolute;left:0;right:0;top:3px;border-top:1.5px solid var(--acc)}
.logo-s{font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--mute);line-height:1}
.nav{display:flex;gap:4px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;position:relative}
.nav a::after{content:'';position:absolute;left:12px;right:12px;bottom:8px;height:1.5px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.hdr-r{display:flex;align-items:center;gap:10px}
.tel{display:inline-flex;flex-direction:column;justify-content:center;text-decoration:none;color:var(--ink);min-height:44px;padding:0 6px;line-height:1.15}
.tel b{font-size:16px;font-weight:800;letter-spacing:.01em}
.tel small{font-size:11.5px;color:var(--mute);font-weight:600}
.planbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#FFFFFF;color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;transition:border-color .2s}
.planbtn:hover{border-color:var(--ink)}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:12px;color:#FFFFFF;font-size:12.5px;font-weight:800;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:8px;border:0;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;transition:background .2s,box-shadow .2s,transform .15s,color .2s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-acc{background:var(--acc);color:#FFFFFF}
.btn-acc:hover{background:#B9231A}
.btn-ink{background:var(--ink);color:#FFFFFF}
.btn-ink:hover{background:#3A3A3E}
.btn-line{background:#FFFFFF;color:var(--ink);box-shadow:inset 0 0 0 1px #BDBCB8}
.btn-line:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn-sm{min-height:44px;padding:0 16px;font-size:14px}
.burger{display:none;width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:#FFFFFF;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.mnav{display:none}
.drop{border-top:1px solid var(--line);background:#FFFFFF;animation:fd .3s ease both}
.drop-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start;padding:20px 0 24px}
.drop-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:8px}
.drow{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 6px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.drow img{width:64px;height:43px;object-fit:contain;flex:none;background:var(--studio);border-radius:4px}
.drow b{display:block;font-size:14px;line-height:1.25}
.drow span{display:block;font-size:12.5px;color:var(--mute)}
.xbtn{margin-left:auto;flex:none;width:44px;height:44px;border:0;border-radius:6px;background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.xbtn:hover{background:var(--studio);color:var(--ink)}
@keyframes fd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.kick{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--acc)}
.kick::before{content:'';width:22px;height:9px;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;background:linear-gradient(currentColor,currentColor) center/100% 1.5px no-repeat}
.h1{font-size:clamp(38px,4.6vw,64px);line-height:1;letter-spacing:-.035em;font-weight:800;overflow-wrap:anywhere}
.h2{font-size:clamp(28px,3vw,42px);line-height:1.08;letter-spacing:-.03em;font-weight:800;overflow-wrap:anywhere}
.lead{font-size:clamp(16px,1.3vw,18px);color:var(--mute);line-height:1.55;max-width:60ch}
.note{font-size:12.5px;color:var(--mute)}

/* head */
.phead{padding:40px 0 0}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px;color:var(--mute);margin-bottom:18px}
.crumbs a{color:var(--mute);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.crumbs a:hover{color:var(--ink)}
.ph-g{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end}
.search{display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;border-radius:8px;border:1px solid var(--line);background:var(--soft);transition:border-color .2s,background .2s}
.search:focus-within{border-color:var(--ink);background:#FFFFFF}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:600 16px/1 'Manrope',sans-serif;min-height:54px;color:var(--ink)}
.ltabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-top:36px}
.ltab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:10px 22px 12px 0;margin-right:22px;border:0;background:transparent;cursor:pointer;text-align:left;white-space:nowrap;position:relative;color:var(--ink)}
.ltab b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.ltab span{font-size:12.5px;color:var(--mute);font-weight:600}
.ltab i{position:absolute;left:0;right:22px;bottom:-1px;height:3px;transition:background .25s}

/* line band */
.band{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center;margin-top:28px;animation:fd .4s ease both}
.band-st{position:relative;background-color:var(--studio);background-image:linear-gradient(rgba(28,28,30,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(28,28,30,.05) 1px,transparent 1px);background-size:24px 24px;border-radius:6px;height:300px;display:flex;align-items:flex-end;justify-content:center;padding:0 24px 12px}
.band-st img{width:100%;max-width:440px}
.marks::before,.marks::after{content:'';position:absolute;width:14px;height:14px;pointer-events:none}
.marks::before{left:10px;top:10px;border-left:1px solid var(--ink);border-top:1px solid var(--ink)}
.marks::after{right:10px;bottom:10px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.kv{display:grid;gap:0;margin-top:18px}
.kv div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.kv span{color:var(--mute);font-size:13.5px}

/* grid */
.ghead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:40px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:16px}
.card{display:flex;flex-direction:column;border-radius:6px;background:#FFFFFF;box-shadow:0 0 0 1px var(--line);overflow:hidden;transition:box-shadow .25s,transform .25s;animation:fd .4s ease both}
.card:hover{box-shadow:0 0 0 1.5px var(--ink);transform:translateY(-2px)}
.card-st{position:relative;display:block;color:var(--ink);height:170px;background:var(--studio);padding:14px 16px 6px}
.card-st img{width:100%;height:100%;object-fit:contain;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .card-st img{transform:scale(1.04)}
.card-st em{position:absolute;left:10px;top:10px;font-style:normal;display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:#FFFFFF;font-size:11.5px;font-weight:700}
.card-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-b h3{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.card-b h3 a{color:inherit;text-decoration:none}
.card-b h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.temp{font-size:13.5px;font-weight:800;color:var(--acc)}
.spec{font-size:13.5px;color:var(--mute);line-height:1.4}
.card-a{display:flex;gap:6px;margin-top:auto;padding-top:12px}
.addbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.fiche{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;border-radius:6px;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;box-shadow:inset 0 0 0 1px var(--line)}
.fiche:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.empty{padding:48px 24px;border-radius:6px;background:var(--soft);text-align:center;display:grid;gap:12px;justify-items:center}

/* comparator */
.cmpw{overflow-x:auto;margin-top:24px;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.cmp{display:grid;grid-template-columns:170px repeat(5,minmax(150px,1fr));min-width:940px}
.cmp > div{padding:13px 14px;border-top:1px solid var(--line);font-size:14px;line-height:1.4;transition:background .25s}
.cmp .rh{color:var(--mute);font-size:13px;font-weight:700;background:var(--soft)}
.cmp .ch{border-top:0;padding:10px}
.chb{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;border:0;background:transparent;cursor:pointer;padding:4px;border-radius:4px;text-align:left;color:inherit}
.chb img{width:100%;max-width:150px;height:auto}
.chb b{font-size:16px;font-weight:800}
.mark{color:var(--mute);font-weight:600}

/* mon plan */
.mp{background:var(--soft);border-top:1px solid var(--line);padding:72px 0}
.mp-g{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:start}
.stage{position:relative;background-color:var(--studio);background-image:linear-gradient(rgba(28,28,30,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(28,28,30,.055) 1px,transparent 1px);background-size:24px 24px;border-radius:6px;height:330px;overflow:hidden}
.face{position:absolute;left:24px;right:24px;bottom:24px;display:flex;flex-direction:column;align-items:center}
.face-row{display:flex;align-items:flex-end;width:100%;max-width:700px}
.mw{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;animation:mw .55s cubic-bezier(.2,.7,.2,1) both}
.mw img{width:100%;height:auto}
@keyframes mw{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tag{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 6px;border-radius:4px;background:var(--ink);color:#FFFFFF;font-size:12px;font-weight:800;margin-bottom:6px;position:relative}
.tag::after{content:'';position:absolute;left:50%;top:100%;height:10px;border-left:1px solid var(--ink)}
.cote{position:relative;height:16px;margin-top:8px;border-left:1.5px solid var(--acc);border-right:1.5px solid var(--acc)}
.cote::before{content:'';position:absolute;left:0;right:0;top:7px;border-top:1.5px solid var(--acc)}
.cote span{position:absolute;left:50%;top:-2px;transform:translateX(-50%);padding:0 8px;background:var(--studio);color:var(--acc);font-size:13px;font-weight:800;white-space:nowrap;line-height:20px}
.cote-w{width:100%;max-width:700px}
.st-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mute);font-size:15px}
.st-empty div{display:grid;gap:10px;justify-items:center;max-width:340px}
.dashed{width:240px;height:70px;border:1.5px dashed #A9A8A4;border-radius:4px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:8px;margin-top:12px}
.lgi{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 10px;border-radius:6px;background:#FFFFFF;box-shadow:0 0 0 1px var(--line);font-size:13.5px;line-height:1.25;min-height:56px}
.lgi .tag{margin:0;flex:none}
.lgi .tag::after{display:none}
.lgi small{display:block;color:var(--mute);font-size:12.5px}
.form{background:#FFFFFF;border-radius:8px;box-shadow:0 0 0 1px var(--line);padding:26px;display:grid;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13.5px;font-weight:700}
.fld input{font:500 15px/1.4 'Manrope',sans-serif;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:6px;min-height:48px;padding:11px 13px;outline:0;width:100%;transition:border-color .2s,box-shadow .2s}
.fld input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(28,28,30,.08);background:#FFFFFF}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.err{font-size:12.5px;color:#B3261C;font-weight:600}
.ok{animation:fd .45s ease both}
.okic{width:48px;height:48px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#FFFFFF}

.pbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px;border-radius:10px;background:var(--ink);color:#FFFFFF;box-shadow:0 20px 40px -20px rgba(0,0,0,.5);animation:up .4s cubic-bezier(.2,.7,.2,1) both;max-width:calc(100% - 32px)}
.pbar b{font-size:15px;white-space:nowrap}
.pbar .thumbs{display:flex;gap:4px}
.pbar .thumbs img{width:46px;height:31px;object-fit:contain;background:#3A3A3E;border-radius:3px}
@keyframes up{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}

.ftr{background:#FFFFFF;border-top:1px solid var(--line);padding:64px 0 24px}
.ftr-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:36px}
.ftr-h{font-size:13px;font-weight:800;margin-bottom:12px}
.ftr p{font-size:14.5px;color:var(--mute)}
.ftr-l a{display:flex;align-items:center;min-height:36px;color:var(--ink);text-decoration:none;font-size:14.5px}
.ftr-l a:hover{color:var(--acc)}
.ftr-tel{font-size:24px;font-weight:800;color:var(--ink);text-decoration:none}
.ftr-bot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 20px;margin-top:48px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.ftr-bot a{color:var(--mute);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.ftr-bot a:hover{color:var(--ink)}
.legal{display:flex;flex-wrap:wrap;gap:0 18px}

@media(max-width:1240px){.tel{display:none}}
@media(max-width:1060px){.nav{display:none}.burger{display:inline-flex}.mnav{display:grid;gap:6px;padding:4px 0 16px}.mnav a{display:flex;align-items:center;min-height:48px;padding:0 14px;border-radius:6px;background:var(--soft);text-decoration:none;color:var(--ink);font-weight:700}
.ph-g,.band,.mp-g{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){.wrap{padding:0 16px}.hdr-cta,.topbar-note,.planbtn .pl-t{display:none}.band-st{height:220px}.kv div{grid-template-columns:110px minmax(0,1fr)}.stage{height:260px}.face{left:12px;right:12px}.f2{grid-template-columns:minmax(0,1fr)}.form{padding:18px}.pbar .thumbs{display:none}.drop-in{grid-template-columns:minmax(0,1fr)}.card-st{height:130px}}
@media (prefers-reduced-motion:reduce){.pj *{animation:none !important;transition:none !important}html{scroll-behavior:auto}}
</style>
</helmet>
<div class="pj" style="{{ rootStyle }}">

<div class="topbar">
  <div class="wrap topbar-in">
    <span class="topbar-note">Bureau d'études et show-room à Puget-sur-Argens (Var)</span>
    <a href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Toutes les propositions</a>
  </div>
</div>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="Projet-Accueil.html" aria-label="RGTE, R.G. Technologies — accueil"><span class="logo-w">RGTE</span><span class="logo-c" aria-hidden="true"></span><span class="logo-s">R.G. Technologies</span></a>
    <nav class="nav" aria-label="Navigation principale">
      <a class="on" href="Projet-Lignes.html" aria-current="page">Lignes d'agencement</a>
      <a href="Projet-Accueil.html#secteurs">Secteurs</a>
      <a href="Projet-Accueil.html#realisations">Réalisations</a>
      <a href="Projet-Accueil.html#contact">Showroom &amp; contact</a>
    </nav>
    <div class="hdr-r">
      <a class="tel" href="tel:0800951313"><b>0 800 95 13 13</b><small>Appel gratuit</small></a>
      <button type="button" class="planbtn" onClick="{{ togglePlan }}" aria-expanded="{{ planOpenS }}" aria-label="Mon plan : voir les modules ajoutés"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="10"></rect><path d="M9 7v10M15 7v10"></path></svg><span class="pl-t">Mon plan</span><span class="badge" key="{{ badgeKey }}" style="{{ badgeStyle }}">{{ count }}</span></button>
      <a class="btn btn-acc btn-sm hdr-cta" href="Projet-Accueil.html#plan3d">Plan 3D offert</a>
      <button type="button" class="burger" aria-label="Ouvrir ou fermer le menu" onClick="{{ toggleMenu }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav class="wrap mnav" aria-label="Navigation mobile">
      <a href="Projet-Lignes.html">Lignes d'agencement</a>
      <a href="Projet-Accueil.html#secteurs">Secteurs</a>
      <a href="Projet-Accueil.html#realisations">Réalisations</a>
      <a href="Projet-Accueil.html#contact">Showroom &amp; contact</a>
      <a href="tel:0800951313">0 800 95 13 13 · appel gratuit</a>
      <a href="Projet-Accueil.html#plan3d" style="background:var(--acc);color:#FFFFFF">Plan 3D offert</a>
    </nav>
  </sc-if>
  <sc-if value="{{ planOpen }}" hint-placeholder-val="{{ false }}">
    <div class="drop">
      <div class="wrap drop-in">
        <div>
          <p style="font-size:15px;font-weight:800;margin-bottom:10px">Les modules de votre plan ({{ count }})</p>
          <sc-if value="{{ hasPlan }}" hint-placeholder-val="{{ true }}">
            <div class="drop-list">
              <sc-for list="{{ compo.items }}" as="m" hint-placeholder-count="3">

    const acc = (this.props && this.props.accent) || '#D42A20';
    const qn = norm(s.q.trim());
    const tabs = [{ id:'toutes', name:'Toutes' }].concat(LIGNES).map(l => ({ name:l.name, count: l.id === 'toutes' ? MODS.length : MODS.filter(r => r[2] === l.id).length, on: s.ligne === l.id ? 'true' : 'false', bar:'background:' + (s.ligne === l.id ? 'var(--acc)' : 'transparent'), pick: () => this.setState({ ligne:l.id }) }));
    const lineObj = LIGNES.find(l => l.id === s.ligne);
    const list = MODS.filter(r => (qn || s.ligne === 'toutes' || r[2] === s.ligne) && (!qn || norm(r[1] + ' ' + (r[5] || '') + ' ' + r[2]).indexOf(qn) > -1)).map(r => MOD[r[0]]);
    const inPlan = id => s.plan.indexOf(id) > -1;
    const cards = list.map(m => {
      const ip = inPlan(m.id);
      return Object.assign({}, m, { inPlan: ip, notIn: !ip, inS: ip ? 'true' : 'false',
        tempTxt: m.temp, tempStyle: m.temp ? '' : 'display:none',
        ficheLabel: 'Fiche ' + m.name,
        addStyle: ip ? 'background:var(--acc);color:#FFFFFF' : 'background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)',
        toggle: () => this.toggle(m.id) });
    });
    const allIn = list.length > 0 && list.every(m => inPlan(m.id));
    const compo = this.compose(s.plan);
    const cmpRowsDef = [['Principe','principe'],['Matériaux','mat'],['Panneau frontal','front'],['Plan de travail','top'],['Modules','n'],['Prix','prix']];
    const colBg = id => s.ligne === id ? 'background:#FCEDEC' : '';
    const cmpCols = LIGNES.map(l => ({ name:l.name, src:'../assets/v2/vitrine-' + l.hero + '.svg', on: s.ligne === l.id ? 'true' : 'false', bg: colBg(l.id), pick: () => this.setState({ ligne:l.id, q:'' }) }));
    const cmpRows = cmpRowsDef.map(d => ({ label:d[0], cells: LIGNES.map(l => {
      let t = d[1] === 'n' ? MODS.filter(r => r[2] === l.id).length + ' modules' : d[1] === 'prix' ? (l.id === 'stone' ? 'Gourmandise 101 cm : 5 800 € HT ; autres sur devis' : 'Sur devis') : l[d[1]];
      return { t, bg: colBg(l.id), tStyle: t.indexOf('[') === 0 ? 'color:var(--mute)' : '' };
    }) }));
    const e = s.err || {}, bad = 'border-color:#B3261C;box-shadow:0 0 0 3px rgba(179,38,28,.12)';
    const count = s.plan.length;
    return {
      rootStyle: '--acc:' + acc,
      menuOpen: s.menu, toggleMenu: () => this.setState({ menu: !s.menu, planOpen:false }),
      planOpen: s.planOpen, planOpenS: s.planOpen ? 'true' : 'false', togglePlan: () => this.setState({ planOpen: !s.planOpen, menu:false }), closePlan: () => this.setState({ planOpen:false }),
      count, badgeKey:'b' + s.bump, badgeStyle: count ? 'background:var(--acc)' : 'background:#8E8D89',
      hasPlan: count > 0, noPlan: count === 0, compo, names: compo.items.map(m => m.name).join(', '),
      q: s.q, hasQ: !!s.q, setQ: (ev) => this.setState({ q: ev.target.value }), clearQ: () => this.setState({ q:'' }),
      tabs, hasLine: !!lineObj && !qn,
      line: lineObj ? Object.assign({}, lineObj, { src:'../assets/v2/vitrine-' + lineObj.hero + '.svg', alt:'Vitrine de la Ligne ' + lineObj.name }) : { id:'', name:'', desc:'', mat:'', front:'', top:'', src:'', alt:'' },
      resultTxt: list.length + (list.length > 1 ? ' modules' : ' module') + (lineObj && !qn ? ' · Ligne ' + lineObj.name : ' · toutes lignes') + (qn ? ' · « ' + s.q.trim() + ' »' : ''),
      addAll: () => { const p = s.plan.slice(); if (allIn) { this.setState({ plan: p.filter(id => !list.some(m => m.id === id)), bump:s.bump + 1 }); } else { list.forEach(m => { if (p.indexOf(m.id) < 0) p.push(m.id); }); this.setState({ plan:p, bump:s.bump + 1 }); } },
      addAllTxt: allIn ? 'Retirer ces modules du plan' : 'Tout ajouter à mon plan',
      cards, hasResults: list.length > 0, noResults: list.length === 0,
      cmpCols, cmpRows,
      formIntro: count ? count + ' module' + (count > 1 ? 's' : '') + ' sélectionné' + (count > 1 ? 's' : '') + '. Le bureau d\'études vous rappelle pour élaborer le plan 3D.' : 'Ajoutez d\'abord des modules à votre plan.',
      f: s.f, inNom: (ev) => this.setF('nom', ev), inTel: (ev) => this.setF('tel', ev), inMail: (ev) => this.setF('mail', ev), inLen: (ev) => { const f = Object.assign({}, s.f, { len: ev.target.value.replace(/[^0-9]/g, '').slice(0, 4) }); this.setState({ f }); },
      eNom: !!e.nom, eTel: !!e.tel, eMail: !!e.mail, ePlan: !!e.plan, eNomS: e.nom ? bad : '', eTelS: e.tel ? bad : '', eMailS: e.mail ? bad : '',
      submit: (ev) => this.submit(ev), sent: s.sent, notSent: !s.sent, reset: () => this.setState({ sent:false }),
      showBar: count > 0 && !s.sent, barThumbs: compo.items.slice(0, 4)
    };
  }
}
</script>
</body>
</html>
