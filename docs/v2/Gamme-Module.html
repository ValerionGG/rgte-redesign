<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#fff}
sc-for,sc-if{display:contents}
.g{--acc:#D42A20;--ink:#1C1C1E;--mut:#55555A;--ln:#D6D5D1;--ln2:#E7E6E2;--st:#ECEBE8;--st2:#F5F5F3;font-family:'Barlow',system-ui,sans-serif;font-size:16px;color:var(--ink);background:#fff;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
.g *,.g *::before,.g *::after{box-sizing:border-box}
.g img{display:block;max-width:100%}
.g h1,.g h2,.g h3,.g h4,.g p,.g dl,.g dd,.g dt,.g ul{margin:0}
.g ul{padding:0;list-style:none}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding:0 32px}
.g :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mk{display:inline-block;padding:0 4px;background:#FFF1EF;color:#A3221A;font-weight:600;font-size:.92em;border-radius:2px}
.top{background:var(--ink);color:#C9C9CC;font-size:13px}
.top-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:36px}
.top a{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.top a:hover{text-decoration:underline;text-underline-offset:3px}
.hdr{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.96);border-bottom:1px solid var(--ln)}
.hdr-in{display:flex;align-items:center;gap:28px;min-height:72px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-height:44px;flex:none}
.logo-b{width:8px;height:34px;background:var(--acc);display:block}
.logo-w{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;letter-spacing:.01em;line-height:.9;display:block}
.logo-s{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);line-height:1.15}
.nav{display:flex;gap:4px;margin-left:12px}
.nav a{white-space:nowrap;display:inline-flex;align-items:center;min-height:72px;padding:0 12px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);text-decoration:none;box-shadow:inset 0 -3px 0 transparent;transition:box-shadow .2s}
.nav a:hover{box-shadow:inset 0 -3px 0 var(--acc)}
.nav a.on{box-shadow:inset 0 -3px 0 var(--ink)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:18px}
.tel{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-height:44px}
.tel b{white-space:nowrap;display:block;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;line-height:1;letter-spacing:.02em}
.tel small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);line-height:1.3}
.tel-i{width:36px;height:36px;border:1px solid var(--ln);display:grid;place-items:center;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border:0;border-radius:2px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s;white-space:nowrap}
.btn svg{flex:none;transition:transform .2s}
.btn:hover svg{transform:translateX(3px)}
.btn-acc{background:var(--acc);color:#fff}
.btn-acc:hover{background:#B5231A}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{background:#000}
.btn-out{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn-out:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.btn-sm{min-height:44px;padding:0 16px;font-size:16px}
.btn-block{width:100%}
.burger{display:none;width:44px;height:44px;border:1px solid var(--ln);background:#fff;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);border-radius:2px}
.mnav{display:none}
.mnav a{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 16px;border-top:1px solid var(--ln2);text-decoration:none;color:var(--ink);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.lab{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.sh{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 18px;border-top:2px solid var(--ink);padding-top:14px;margin-bottom:22px}
.sh-n{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;color:var(--acc);letter-spacing:.06em}
.sh-t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(28px,3vw,40px);line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .35s ease both}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--mut);padding:10px 0 8px}
.crumbs a{color:var(--mut);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.crumbs a:hover{color:var(--ink)}

/* produit */
.pp{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;align-items:start}
.gal{position:sticky;top:90px;display:flex;flex-direction:column;gap:8px}
.stage{position:relative;background:var(--st);height:470px;overflow:hidden}
.crop{position:absolute;width:18px;height:18px;border-color:var(--ink);border-style:solid;border-width:0}
.crop.tl{left:14px;top:14px;border-left-width:1px;border-top-width:1px}
.crop.tr{right:14px;top:14px;border-right-width:1px;border-top-width:1px}
.crop.bl{left:14px;bottom:14px;border-left-width:1px;border-bottom-width:1px}
.crop.br{right:14px;bottom:14px;border-right-width:1px;border-bottom-width:1px}
.stag{position:absolute;left:28px;top:24px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);line-height:1.6;z-index:2}
.face{position:absolute;left:0;right:0;top:60px;bottom:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px}
.fimg{transition:width .6s cubic-bezier(.2,.7,.2,1)}
.fimg img{width:100%;height:auto}
.cote{position:relative;height:16px;margin-top:6px;border-left:1px solid var(--ink);border-right:1px solid var(--ink);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.cote::before{content:'';position:absolute;left:0;right:0;top:8px;border-top:1px solid var(--ink)}
.cote span{position:absolute;left:50%;top:-1px;transform:translateX(-50%);background:var(--st);padding:0 10px;font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tech{position:absolute;inset:56px 24px 24px;background:#fff;background-image:linear-gradient(#EEEDEA 1px,transparent 1px),linear-gradient(90deg,#EEEDEA 1px,transparent 1px);background-size:20px 20px}
.tech svg{width:100%;height:100%;display:block}
.tech rect,.tech path,.tech line{transition:all .6s cubic-bezier(.2,.7,.2,1)}
.photo{position:absolute;inset:0}
.photo img{width:100%;height:100%;object-fit:cover;animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.phcap{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.94);padding:4px 10px;font-size:12px;color:var(--mut)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumbs button{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px;border:0;border-top:2px solid transparent;background:var(--st2);cursor:pointer;font:600 14px/1.2 'Barlow',sans-serif;color:var(--ink);text-align:left;transition:background .2s,border-color .2s}
.thumbs button:hover{background:var(--st)}
.thumbs svg{flex:none}
.hl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--ln)}
.hl div{padding:10px 12px;border-left:1px solid var(--ln2);font-size:14px;line-height:1.3}
.hl div:first-child{border-left:0}
.hl span{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.hl b{font-weight:600}

.panel{display:flex;flex-direction:column;gap:20px}
.ptitle{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(48px,5vw,76px);line-height:.9;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ln)}
.meta div{padding:8px 16px 8px 0;margin-right:16px;font-size:14px}
.meta span{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.meta b{font-weight:600}
.opt-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.opt-h b{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.opt-h span{font-size:14px;color:var(--mut)}
.lens{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.lens button{min-height:54px;border:1px solid var(--ln);background:#fff;font:700 18px/1 'Barlow Condensed',sans-serif;cursor:pointer;color:var(--ink);border-radius:2px;transition:background .2s,color .2s,border-color .2s;padding:0 2px}
.lens button small{display:block;font:500 11px/1.2 'Barlow',sans-serif;margin-top:3px;opacity:.85}
.lens button:hover{border-color:var(--ink)}
.custom{display:flex;align-items:center;gap:10px;margin-top:6px;padding:0 12px;border:1px solid var(--ink)}
.custom input{flex:1;min-width:0;border:0;outline:0;font:600 17px 'Barlow',sans-serif;min-height:46px;color:var(--ink);background:transparent}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:10px 14px;border:1px solid var(--ln);background:#fff;cursor:pointer;text-align:left;font-family:'Barlow',sans-serif;color:var(--ink);border-radius:2px;transition:border-color .2s,box-shadow .2s,background .2s}
.tc:hover{border-color:var(--ink)}
.tc b{font-family:'Barlow Condensed',sans-serif;font-size:22px;line-height:1.05}
.tc span{font-size:13px;color:var(--mut)}
.tc .sw{width:28px;height:28px;border:1px solid var(--ln);display:block;margin-bottom:4px}
.recap{border:1px solid var(--ink)}
.recap-p{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--ln)}
.recap-p b{font-family:'Barlow Condensed',sans-serif;font-size:44px;line-height:1;font-weight:700;animation:fade .35s ease both}
.recap-p small{display:block;font-size:13px;color:var(--mut);max-width:300px;margin-top:4px}
.code{font-size:13px;font-weight:600;letter-spacing:.06em;background:var(--st2);padding:10px 18px;border-bottom:1px solid var(--ln);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.recap-a{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:14px 18px 16px}
.recap-a .full{grid-column:1/-1}

/* tabs */
.tabs{display:flex;border-bottom:1px solid var(--ink);overflow-x:auto}
.tabs button{min-height:52px;padding:0 20px;border:0;border-bottom:3px solid transparent;background:none;font:700 18px/1 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--mut);white-space:nowrap;transition:color .2s,border-color .2s}
.tabs button:hover{color:var(--ink)}
.tbody{padding-top:24px;animation:fade .35s ease both}
.spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px}
.srow{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--ln);font-size:15px}
.srow span{color:var(--mut)}
.srow b{font-weight:600}
.dt{border-top:1px solid var(--ink)}
.drow{display:grid;grid-template-columns:120px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) 40px;gap:12px;align-items:center;width:100%;min-height:52px;padding:0 12px;border:0;border-bottom:1px solid var(--ln);background:#fff;cursor:pointer;text-align:left;font:500 15px 'Barlow',sans-serif;color:var(--ink);transition:background .2s}
.drow:hover{background:var(--st2)}
.drow b{font-family:'Barlow Condensed',sans-serif;font-size:20px}
.dhead{display:grid;grid-template-columns:120px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) 40px;gap:12px;padding:0 12px 8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:10px}
.doc{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--ln)}
.doc i{width:44px;height:52px;border:1px solid var(--ink);display:grid;place-items:center;font-style:normal;font:700 12px 'Barlow Condensed',sans-serif;flex:none;position:relative}
.doc b{display:block;font-size:15px}
.doc span{font-size:13px;color:var(--mut)}
.desc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;font-size:16px;color:var(--mut)}
.desc h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;color:var(--ink)}

/* form */
.fw{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:0;border:1px solid var(--ink)}
.fw-l{background:var(--ink);color:#fff;padding:32px;display:flex;flex-direction:column;gap:16px}
.fw-l h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px;line-height:.95;text-transform:uppercase}
.fw-l p{color:#C9C9CC}
.fw-l .code{background:#2C2C2F;border:0;color:#fff}
.fw-l a.t{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:700;color:#fff;text-decoration:none;line-height:1}
.fw-r{padding:28px 32px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{font:500 16px/1.4 'Barlow',sans-serif;color:var(--ink);background:#fff;border:1px solid #9A9A9F;border-radius:2px;min-height:48px;padding:10px 12px;outline:0;transition:border-color .2s,box-shadow .2s;width:100%}
.fld textarea{min-height:100px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fld input[readonly]{background:var(--st2);color:var(--mut)}
.err{font-size:13px;color:#B3241B}
.done{padding:32px;border-top:4px solid var(--acc);animation:rise .5s ease both}

/* associés */
.rel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.rcard{display:flex;flex-direction:column;border:1px solid var(--ln);text-decoration:none;color:var(--ink);transition:border-color .2s,transform .25s,box-shadow .25s}
.rcard:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 16px 26px -22px rgba(28,28,30,.6)}
.rcard img{height:120px;width:100%;object-fit:contain;background:var(--st);padding:20px 12px 6px}
.rcard div{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.rcard b{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;line-height:1.05;text-transform:uppercase}
.rcard span{font-size:13px;color:var(--mut)}
.rcard em{font-style:normal;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;margin-top:4px}

.ftr{background:var(--st);padding:56px 0 18px;border-top:1px solid var(--ln)}
.ftr-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:32px}
.ftr-h{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.ftr p{font-size:15px}
.ftr-l a{display:flex;align-items:center;min-height:36px;color:var(--ink);text-decoration:none;font-size:15px}
.ftr-l a:hover{color:var(--acc)}
.ftr-tel{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;color:var(--ink);text-decoration:none}
.ftr-b{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;margin-top:40px;padding-top:12px;border-top:1px solid var(--ln);font-size:13px;color:var(--mut)}
.ftr-b a{color:var(--mut);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.ftr-b a:hover{color:var(--ink)}
.legal{display:flex;flex-wrap:wrap;gap:0 18px}
@media(max-width:1180px){.nav,.tel{display:none}.burger{display:inline-flex}.mnav{display:block;border-top:1px solid var(--ln)}.rel{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:980px){.pp,.fw,.desc{grid-template-columns:minmax(0,1fr)}.gal{position:static}.spec{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){.wrap{padding:0 16px}.hdr-cta{display:none}.hdr-in{gap:12px}.top-note{display:none}.stage{height:320px}.face{padding:0 16px;top:64px}.stag{left:32px;top:20px;font-size:11px}.tech{inset:64px 10px 10px}.hl{grid-template-columns:repeat(2,minmax(0,1fr))}.hl div:nth-child(3){border-left:0}.hl div:nth-child(n+3){border-top:1px solid var(--ln2)}.lens{grid-template-columns:repeat(4,minmax(0,1fr))}.thumbs button{font-size:12px;gap:6px;padding:6px}.thumbs svg{display:none}.srow{grid-template-columns:minmax(0,1fr);gap:2px}.drow,.dhead{grid-template-columns:76px minmax(0,1fr) minmax(0,1fr);}.drow .hide,.dhead .hide{display:none}.form{grid-template-columns:minmax(0,1fr)}.fw-l,.fw-r{padding:20px}.rel{grid-template-columns:repeat(2,minmax(0,1fr))}.recap-a{grid-template-columns:minmax(0,1fr)}.recap-p b{font-size:36px}.tabs button{padding:0 12px;font-size:16px}}
@media (prefers-reduced-motion:reduce){.g *{animation:none !important;transition:none !important}}
</style>
</helmet>

  }
  setF(k, e){ const f = Object.assign({}, this.state.f); f[k] = e.target.value; const err = Object.assign({}, this.state.err); err[k] = false; this.setState({ f, err }); }
  submit(e){
    if (e && e.preventDefault) e.preventDefault();
    const f = this.state.f;
    const err = { nom: !f.nom.trim(), tel: !f.tel.trim(), mail: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.mail.trim()), msg: !f.msg.trim() };
    if (err.nom || err.tel || err.mail || err.msg) { this.setState({ err }); return; }
    this.setState({ sent:true, err:{} });
  }
  renderVals(){
    const s = this.state;
    const acc = (this.props && this.props.accent) || '#D42A20';
    const isCustom = s.len === 'sm';
    const cv = parseInt(s.custom, 10);
    const eff = isCustom ? (cv > 0 ? cv : 0) : s.len;
    const lenTxt = isCustom ? (cv > 0 ? 'Sur mesure · ' + cv + ' cm' : 'Sur mesure') : s.len + ' cm';
    const is101 = s.len === 101;
    const blanc = s.fin === 'blanc';
    const catalog = is101 && blanc;
    const choc = s.temp === 'c';
    const sel = 'background:#1C1C1E;color:#fff;border-color:#1C1C1E';
    const selCard = 'border-color:#1C1C1E;box-shadow:inset 0 0 0 1px #1C1C1E;background:#F5F5F3';
    const dl = Math.max(80, Math.min(260, eff || 222));
    const wPct = Math.round(50 + (Math.min(dl, 222) - 101) / 121 * 44);
    const lens = LENS.map(l => ({ n:String(l), sub: l === 101 ? '5 800 €' : 'devis', on: s.len === l ? 'true' : 'false', style: s.len === l ? sel : '', pick: () => this.setState({ len:l }) }))
      .concat([{ n:'Mesure', sub:'devis', on: isCustom ? 'true' : 'false', style: (isCustom ? sel + ';' : '') + 'font-size:15px', pick: () => this.setState({ len:'sm' }) }]);
    const temps = [['p','+2 / +8 °C','Pâtisseries, macarons'],['c','+14 / +18 °C','Chocolats']].map(t => ({ r:t[1], u:t[2], on: s.temp === t[0] ? 'true' : 'false', style: s.temp === t[0] ? selCard : '', pick: () => this.setState({ temp:t[0] }) }));
    const fins = [['blanc','Pierre acrylique blanche','Par défaut','background:#F6F4F0'],['col','Autre coloris','[COLORIS] · sur devis','background:repeating-linear-gradient(45deg,#DDDCD8 0 5px,#C9C8C4 5px 10px)']]
      .map(x => ({ n:x[1], sub:x[2], sw:x[3], on: s.fin === x[0] ? 'true' : 'false', style: s.fin === x[0] ? selCard : '', pick: () => this.setState({ fin:x[0] }) }));
    const tempTxt = choc ? '+14 / +18 °C' : '+2 / +8 °C';
    let priceTxt = 'Sur devis', priceSub;
    if (catalog) priceSub = 'Modèle 101 cm, pierre acrylique blanche.';
    else if (is101) priceSub = 'Le prix de 5 800,00 € HT s\'entend en pierre acrylique blanche ; autre coloris sur devis.';
    else if (isCustom) priceSub = 'Longueur sur mesure : chiffrage du bureau d\'études.';
    else priceSub = 'Longueur ' + s.len + ' cm : [PRIX] communiqué sur devis.';
    if (catalog) priceTxt = '5 800,00 € HT';
    const code = 'GOURMANDISE · ST-06 · ' + (isCustom ? 'SM-' + (cv > 0 ? cv : '___') : 'L' + s.len) + ' · ' + (choc ? '+14/+18' : '+2/+8') + ' · ' + (blanc ? 'PIERRE BLANCHE' : '[COLORIS]');
    // dessin coté
    const fw = Math.round(170 + (Math.min(dl, 222) - 101) / 121 * 230);
    const sx = 40 + fw + 70;
    const t = { fw, postR: 40 + fw - 24, capW: fw - 28, glassW: fw - 48, mid: 40 + fw / 2, footW: fw - 32, fx2: 40 + fw,
      sx, sxf: sx + 10, sx2: sx + 130, smid: sx + 65, sideGlass: 'M' + (sx + 14) + ' 138 L' + (sx + 14) + ' 76 L' + (sx + 116) + ' 76 L' + (sx + 116) + ' 138 Z',
      hx: sx + 150, hx1: sx + 142, hx2: sx + 158, htx: sx + 160,
      lTxt: isCustom ? (cv > 0 ? cv + ' cm' : 'L sur mesure') : s.len + ' cm', pTxt: is101 ? '80' : 'P [DIM.]', hTxt: is101 ? '80 + 25 h' : 'H [DIM.]',
      expo: is101 ? 'Exposition en verre 81 × 60 cm' : 'Profondeur d\'exposition 60 cm' };
    const VIEWS = [['face','Vue de face','M3 7h18v10H3zM7 7V4h10v3'],['cote','Dessin coté','M4 20h16M4 16v8M20 16v8M6 4h12v8H6z'],['photo','Ambiance','M4 5h16v14H4zM4 15l5-5 5 5 3-3 3 3']];
    const views = VIEWS.map(v => ({ n:v[1], ico:v[2], on: s.view === v[0] ? 'true' : 'false', style: s.view === v[0] ? 'border-top-color:' + acc + ';background:#ECEBE8' : '', pick: () => this.setState({ view:v[0] }) }));
    const TABS = [['spec','Caractéristiques'],['dim','Dimensions'],['desc','Description'],['docs','Documents']];
    const tabs = TABS.map(x => ({ n:x[1], on: s.tab === x[0] ? 'true' : 'false', style: s.tab === x[0] ? 'color:#1C1C1E;border-bottom-color:' + acc : '', pick: () => this.setState({ tab:x[0] }) }));
    const dimRows = LENS.map(l => ({ len:l + ' cm', dim: l === 101 ? '101 × 80 × 80 + 25 h' : '[DIMENSIONS]', expo: l === 101 ? 'Verre 81 × 60 cm' : 'Profondeur 60 cm', price: l === 101 ? '5 800,00 € HT' : 'Sur devis', mark: s.len === l ? '●' : '', on: s.len === l ? 'true' : 'false', style: s.len === l ? 'background:#FFF5F4' : '', pick: () => this.setState({ len:l }) }))
      .concat([{ len:'Sur mesure', dim:'Selon votre local', expo:'Profondeur 60 cm', price:'Sur devis', mark: isCustom ? '●' : '', on: isCustom ? 'true' : 'false', style: isCustom ? 'background:#FFF5F4' : '', pick: () => this.setState({ len:'sm' }) }]);
    const e = s.err || {};
    const bad = 'border-color:#B3241B;box-shadow:inset 0 0 0 1px #B3241B';
    const REL = [['Réfrigérée Centrale','gourmandise','ST-05','Vitrages des 2 côtés · prof. 60 cm'],['Réfrigérée Plane','plane','ST-01','Hauteur du plan · prof. 53 ou 60 cm'],['Réfrigérée Vision','plane','ST-02','8 cm sous le plan de travail'],['Réfrigérée Panorama','panorama','ST-10','2 ou 3 étagères réfrigérées'],['Comptoir caisse','caisse','ST-07','Avec ou sans tablette PMR']];
    return {
      rootStyle: '--acc:' + acc,
      menuOpen: s.menu, toggleMenu: () => this.setState({ menu: !s.menu }),
      stageTag: 'Gourmandise · ' + lenTxt + ' · ' + (choc ? 'chocolats ' : 'pâtisserie ') + tempTxt,
      vFace: s.view === 'face', vCote: s.view === 'cote', vPhoto: s.view === 'photo', views,
      wStyle: 'width:' + wPct + '%', lenTxt, t, techAria: 'Dessin coté de la Gourmandise, longueur ' + lenTxt,
      lens, isCustom, custom: s.custom, setCustom: (ev) => this.setState({ custom: ev.target.value.replace(/[^0-9]/g, '').slice(0, 4) }),
      temps, tempTxt, fins, finShort: blanc ? 'Pierre acrylique blanche' : '[COLORIS]',
      priceTxt, priceSub, pStyle: catalog ? 'color:' + acc : '', code,
      tabs, tSpec: s.tab === 'spec', tDim: s.tab === 'dim', tDesc: s.tab === 'desc', tDocs: s.tab === 'docs', dimRows,
      modelTxt: 'Gourmandise ' + lenTxt + ' · ' + tempTxt + ' · ' + (blanc ? 'pierre acrylique blanche' : '[COLORIS]'),
      f: s.f,
      inNom: (ev) => this.setF('nom', ev), inTel: (ev) => this.setF('tel', ev), inMail: (ev) => this.setF('mail', ev), inSec: (ev) => this.setF('sec', ev),
      inCp: (ev) => this.setF('cp', ev), inVille: (ev) => this.setF('ville', ev), inMsg: (ev) => this.setF('msg', ev),
      eNom: !!e.nom, eTel: !!e.tel, eMail: !!e.mail, eMsg: !!e.msg,
      eNomS: e.nom ? bad : '', eTelS: e.tel ? bad : '', eMailS: e.mail ? bad : '', eMsgS: e.msg ? bad : '',
      submit: (ev) => this.submit(ev), sent: s.sent, notSent: !s.sent, reset: () => this.setState({ sent:false }),
      related: REL.map(r => ({ n:r[0], img:'../assets/v2/vitrine-' + r[1] + '.svg', alt:'Rendu ' + r[0], ix:r[2], s:r[3] }))
    };
  }
}
</script>
