<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RGTE · Showroom — Lignes d'agencement</title>
<script src="../vendor/preact.min.js"></script>
<script src="../dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#fff}
sc-for,sc-if{display:contents}
.sr{--red:#D42A20;--red-d:#B5221A;--ink:#1C1C1E;--studio:#ECEBE8;--studio2:#E3E1DD;--mute:#5A5A5E;--line:#DAD8D3;font-family:'Jost',system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.5;font-size:17px;-webkit-font-smoothing:antialiased;overflow-x:clip;font-variant-numeric:tabular-nums}
.sr *,.sr *::before,.sr *::after{box-sizing:border-box}
.sr img{display:block;max-width:100%}
.sr h1,.sr h2,.sr h3,.sr h4,.sr p{margin:0}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px}
.top{background:var(--ink);color:#CFCEC9;font-size:13px}
.top-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:36px}
.top a{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.top a:hover{text-decoration:underline;text-underline-offset:3px}
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:24px;min-height:76px}
.logo{display:inline-flex;flex-direction:column;justify-content:center;text-decoration:none;color:var(--ink);line-height:1;min-height:44px}
.logo b{font-weight:700;font-size:30px;letter-spacing:.08em;color:var(--red)}
.logo span{font-size:11.5px;letter-spacing:.16em;margin-top:5px;font-weight:500}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:var(--ink);text-decoration:none;font-weight:500;font-size:16px}
.nav a::after{content:'';position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.tel{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-height:44px;padding-left:20px;border-left:1px solid var(--line)}
.tel svg{color:var(--red);flex:none}
.tel b{display:block;font-size:17px;font-weight:600;letter-spacing:.02em;line-height:1.1}
.tel small{display:block;font-size:12px;color:var(--mute);line-height:1.2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:3px;border:0;font:500 16px/1 'Jost',sans-serif;text-decoration:none;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s,transform .2s;white-space:nowrap}
.btn svg{flex:none;transition:transform .25s ease}
.btn:hover svg{transform:translateX(3px)}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-d)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{background:#000}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn-line:hover{background:var(--ink);color:#fff}
.btn-sm{min-height:44px;padding:0 18px;font-size:15px}
.burger{display:none;width:44px;height:44px;border-radius:3px;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);margin-left:auto}
.mnav{display:none}
.mnav a{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500;font-size:17px}
.kick{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--red)}
.kick::before{content:'';width:22px;height:2px;background:var(--red);display:block}
.h2{font-size:clamp(30px,3.2vw,46px);line-height:1.06;letter-spacing:-.01em;font-weight:600;overflow-wrap:anywhere}
.lead{font-size:clamp(17px,1.35vw,19px);color:var(--mute);line-height:1.55;max-width:60ch}
.sec{padding:72px 0}
.sr :focus-visible{outline:2px solid var(--red);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .45s ease both}
.sr [id]{scroll-margin-top:160px}

/* ---- Intro ---- */
.intro{background:var(--studio);padding:28px 0 0}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.crumbs a{color:var(--mute);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.crumbs a:hover{color:var(--ink)}
.intro-g{display:flex;justify-content:space-between;align-items:flex-end;gap:24px 48px;flex-wrap:wrap;padding:8px 0 32px}
.h1{font-size:clamp(40px,4.6vw,64px);line-height:1.02;font-weight:600;letter-spacing:-.015em;overflow-wrap:anywhere}
.tabs{position:sticky;top:77px;z-index:40;background:rgba(236,235,232,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs-in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.tab{position:relative;display:flex;align-items:center;gap:10px;min-height:68px;padding:8px 10px;border:0;background:transparent;cursor:pointer;text-align:left;font-family:'Jost',sans-serif;color:var(--ink);transition:background .25s}
.tab::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.tab.on::after{transform:scaleX(1)}
.tab:hover{background:rgba(255,255,255,.6)}
.tab.on{background:#fff}
.tab img{width:54px;height:36px;object-fit:contain;flex:none}
.tab b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.tab small{display:block;font-size:13px;color:var(--mute)}
.tab-all{width:54px;height:36px;flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px}
.tab-all i{background:#C9C7C2;border-radius:1px}

/* ---- Room ---- */
.room{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:56px;align-items:center;padding-top:56px}
.rstage{position:relative;background:radial-gradient(ellipse 70% 70% at 50% 38%,#F7F6F4,#ECEBE8 70%);border-radius:6px;aspect-ratio:16/10;overflow:hidden}
.rstage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:22%;background:#E3E1DD}
.rstage img{position:absolute;left:9%;top:8%;width:82%;height:84%;object-fit:contain;z-index:1;transition:opacity .55s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rstage small{position:absolute;left:18px;bottom:14px;z-index:2;font-size:13px;color:var(--mute)}
.rinfo{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.rinfo h2{font-size:clamp(34px,3.6vw,52px);font-weight:600;line-height:1.04;margin-top:14px}
.rdl{margin-top:24px;border-top:1px solid var(--line)}
.rdl div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.rdl span{color:var(--mute);font-size:14px;padding-top:2px}
.rcta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}

/* ---- Modules ---- */
.tool{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 32px;flex-wrap:wrap;margin:64px 0 24px}
.tool h3{font-size:28px;font-weight:600;line-height:1.1}
.tool p{font-size:15px;color:var(--mute);margin-top:4px}
.search{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:3px;background:#F6F5F3;box-shadow:inset 0 0 0 1px #E0DED9;width:min(360px,100%);transition:box-shadow .2s,background .2s}
.search:focus-within{background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:400 16px/1.2 'Jost',sans-serif;color:var(--ink);min-height:46px}
.search svg{color:var(--mute);flex:none}
.clear{border:0;background:transparent;cursor:pointer;min-width:44px;min-height:44px;color:var(--mute);font:500 14px 'Jost',sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:12px}
.mcard{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px #E6E4E0;transition:box-shadow .3s,transform .3s;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.mcard:hover{box-shadow:0 0 0 1px var(--ink),0 24px 40px -30px rgba(28,28,30,.55);transform:translateY(-3px)}
.mcard-v{position:relative;background:var(--studio);padding:34px 22px 0}
.mcard-v::after{content:'';display:block;height:12px;margin:-4px -22px 0;background:#E1DFDB}
.mcard-v img{width:100%;aspect-ratio:480/320;object-fit:contain;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.mcard:hover .mcard-v img{transform:translateY(-6px) scale(1.03)}
.mcard-l{position:absolute;top:12px;left:14px;font-size:13px;color:var(--mute)}
.mcard-star{position:absolute;top:10px;right:10px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--red);color:#fff}
.mcard-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard-b b{font-size:19px;font-weight:600;line-height:1.2}
.mcard-b p{font-size:14px;color:#45454A;line-height:1.45}
.mtemp{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:3px 10px;border-radius:20px;background:#F1F0ED}
.mtemp svg{color:var(--red)}
.mfoot{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #EFEDEA;font-size:15px}
.mfoot span{font-weight:600}
.mfoot em{font-style:normal;display:inline-flex;align-items:center;gap:6px;color:var(--mute);transition:color .2s}
.mcard:hover .mfoot em{color:var(--red)}
.empty{grid-column:1/-1;background:#F6F5F3;border-radius:6px;padding:36px;text-align:center}
.empty b{font-size:20px;font-weight:600}
.empty p{color:var(--mute);margin-top:6px}

/* ---- Comparateur ---- */
.cmpw{overflow-x:auto;margin-top:32px;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.cmp{display:grid;grid-template-columns:170px repeat(5,minmax(160px,1fr));min-width:980px}
.cmp .rh{position:sticky;left:0;z-index:1}
.cmp > div{padding:14px 16px;border-bottom:1px solid #EFEDEA;font-size:15px;line-height:1.4;transition:background .3s}
.cmp .rh{color:var(--mute);font-size:14px;background:#FAFAF9}
.chead{border:0;background:transparent;cursor:pointer;text-align:left;font-family:'Jost',sans-serif;color:var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:44px;border-bottom:1px solid #EFEDEA;transition:background .3s}
.chead img{width:100%;max-width:130px;aspect-ratio:480/320;object-fit:contain}
.chead b{font-size:17px;font-weight:600}
.chead:hover{background:#F6F5F3}
.mark{color:var(--mute)}

/* ---- CTA ---- */
.band{background:var(--ink);color:#fff;border-radius:6px;padding:48px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:center}
.band p{color:#CFCEC9;margin-top:10px;max-width:52ch}
.band .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.band .btn-line{color:#fff;box-shadow:inset 0 0 0 1.5px #fff}
.band .btn-line:hover{background:#fff;color:var(--ink)}

/* ---- Footer ---- */
.ftr{background:var(--ink);color:#CFCEC9;padding:56px 0 20px;margin-top:72px}
.ftr .logo{color:#fff}
.ftr-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px}
.ftr-h{font-size:14px;color:#9C9B97;margin-bottom:12px}
.ftr p{font-size:15px;line-height:1.6}
.ftr-l a{display:flex;align-items:center;min-height:36px;color:#fff;text-decoration:none;font-size:15px}
.ftr-l a:hover{color:#F07A72}
.ftr-tel{font-size:28px;font-weight:600;color:#fff;text-decoration:none;letter-spacing:.02em}
.ftr-b{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 20px;margin-top:40px;padding-top:12px;border-top:1px solid #3A3A3D;font-size:13px}
.ftr-b a{color:#CFCEC9;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.ftr-b a:hover{color:#fff}
.legal{display:flex;flex-wrap:wrap;gap:0 20px}

@media(max-width:1180px){.nav,.tel{display:none}.burger{display:inline-flex}.mnav{display:block;padding:0 0 12px}.tabs-in{display:flex;overflow-x:auto}.tab{flex:0 0 200px}}
@media(max-width:1080px){.room,.band{grid-template-columns:minmax(0,1fr)}.band .acts{justify-content:flex-start}}
@media(max-width:720px){.wrap{padding:0 16px}.top-note{display:none}.hdr-cta{display:none}.hdr-in{min-height:64px}.tabs{top:65px}.tabs-in{margin:0 -16px;padding:0 16px}.tab{flex:0 0 172px;min-height:60px}
.room{padding-top:32px;gap:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.mcard-v{padding:30px 10px 0}.mcard-v::after{margin:-4px -10px 0}.mcard-b{padding:12px 12px 14px}.mcard-b b{font-size:16px}.mcard-b p{font-size:13px}.mfoot{flex-direction:column;align-items:flex-start;gap:2px;font-size:14px}.mtemp{font-size:12px;padding:3px 8px}.cmp{grid-template-columns:118px repeat(5,minmax(150px,1fr));min-width:868px}.rdl div{grid-template-columns:minmax(0,1fr);gap:2px}.tool{margin-top:48px}.band{padding:28px 20px}.ftr{margin-top:56px}}
@media (prefers-reduced-motion:reduce){.sr *{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="sr" style="{{ rootStyle }}">

<div class="top">
  <div class="wrap top-in">
    <span class="top-note">Fabricant de vitrines réfrigérées sur mesure, bureau d’études et show-room dans le Var</span>
    <a href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Toutes les propositions</a>
  </div>
</div>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="Showroom-Accueil.html" aria-label="RGTE, R.G. Technologies, accueil"><b>RGTE</b><span>R.G. Technologies</span></a>
    <nav class="nav" aria-label="Navigation principale">
      <a class="on" href="Showroom-Lignes.html" aria-current="page">Lignes d’agencement</a>
      <a href="Showroom-Accueil.html#secteurs">Secteurs</a>
      <a href="Showroom-Accueil.html#realisations">Réalisations</a>
      <a href="Showroom-Accueil.html#contact">Showroom &amp; contact</a>
    </nav>
    <a class="tel" href="tel:0800951313"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg><span><b>0 800 95 13 13</b><small>Appel gratuit</small></span></a>
    <a class="btn btn-red btn-sm hdr-cta" href="Showroom-Accueil.html#contact">Plan 3D offert</a>
    <button type="button" class="burger" aria-label="Ouvrir ou fermer le menu" aria-expanded="{{ menuAria }}" onClick="{{ toggleMenu }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav wrap fade" aria-label="Navigation mobile">
      <a href="Showroom-Lignes.html" onClick="{{ closeMenu }}">Lignes d’agencement</a>
      <a href="Showroom-Accueil.html#secteurs">Secteurs</a>
      <a href="Showroom-Accueil.html#realisations">Réalisations</a>
      <a href="Showroom-Accueil.html#contact">Showroom &amp; contact</a>
      <a href="tel:0800951313">0 800 95 13 13 <small style="color:#5A5A5E">appel gratuit</small></a>
      <a href="Showroom-Accueil.html#contact" style="color:#D42A20">Demander mon plan 3D offert</a>
    </nav>
  </sc-if>
</header>

<main>
<section class="intro">
  <div class="wrap">
    <nav class="crumbs" aria-label="Fil d’Ariane"><a href="Showroom-Accueil.html">Accueil</a><span aria-hidden="true">/</span><span style="color:#1C1C1E">Lignes d’agencement</span></nav>
    <div class="intro-g">
      <div>
        <h1 class="h1">Lignes d’agencement</h1>
        <p class="lead" style="margin-top:12px">Cinq lignes, 45 modules. Entrez dans chaque salle d’exposition, comparez les matières et ouvrez la fiche d’un module.</p>
      </div>
      <a class="btn btn-red" href="Showroom-Accueil.html#contact">Plan 3D offert<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    </div>
  </div>
</section>

<div class="tabs">
  <div class="wrap tabs-in" role="tablist" aria-label="Lignes d’agencement">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
      <button type="button" role="tab" class="{{ t.cls }}" aria-selected="{{ t.on }}" onClick="{{ t.pick }}"><img src="{{ t.src }}" alt=""><span><b>{{ t.name }}</b><small>{{ t.count }}</small></span></button>
    </sc-for>
    <button type="button" role="tab" class="{{ allCls }}" aria-selected="{{ allAria }}" onClick="{{ pickAll }}"><span class="tab-all" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><span><b>Tous les modules</b><small>45 modules</small></span></button>
  </div>
</div>

<section class="wrap">
  <sc-if value="{{ isLine }}" hint-placeholder-val="{{ true }}">
    <div class="room">
      <div class="rstage">
        <sc-for list="{{ stageImgs }}" as="im" hint-placeholder-count="5">
          <img src="{{ im.src }}" alt="{{ im.alt }}" style="{{ im.style }}">
        </sc-for>
        <small>Rendu indicatif</small>
      </div>
      <div class="rinfo" aria-live="polite">
        <span class="kick">{{ cur.kicker }}</span>
        <h2>{{ cur.name }}</h2>
        <p class="lead" style="margin-top:12px">{{ cur.desc }}</p>
        <div class="rdl">
          <div><span>Structure</span><b style="font-weight:500">{{ cur.structure }}</b></div>
          <div><span>Panneau frontal</span><b style="font-weight:500">{{ cur.front }}</b></div>
          <div><span>Plan de travail</span><b style="font-weight:500">{{ cur.plan }}</b></div>
          <div><span>Composition</span><b style="font-weight:500">{{ cur.compo }}</b></div>
        </div>
        <div class="rcta">
          <a class="btn btn-red" href="Showroom-Accueil.html#contact">Mon plan 3D avec la {{ cur.name }}</a>
          <a class="btn btn-line" href="#modules">Voir les modules</a>
        </div>
      </div>
    </div>
  </sc-if>

  <div class="tool" id="modules">
    <div>
      <h3>{{ gridTitle }}</h3>
      <p>{{ gridSub }}</p>
    </div>
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input type="search" placeholder="Rechercher : saladette, caisse, ventilé…" value="{{ q }}" onInput="{{ setQ }}" aria-label="Rechercher un module"><sc-if value="{{ hasQ }}" hint-placeholder-val="{{ false }}"><button type="button" class="clear" onClick="{{ clearQ }}" aria-label="Effacer la recherche">Effacer</button></sc-if></label>
  </div>

  <div class="grid">
    <sc-for list="{{ mods }}" as="m" hint-placeholder-count="8">
      <a class="mcard" href="Showroom-Module.html" style="{{ m.delay }}">
        <div class="mcard-v">
          <span class="mcard-l">{{ m.ligne }}</span>
          <sc-if value="{{ m.star }}" hint-placeholder-val="{{ false }}"><span class="mcard-star">Fiche détaillée</span></sc-if>
          <img src="{{ m.src }}" alt="{{ m.alt }}">
        </div>
        <div class="mcard-b">
          <b>{{ m.name }}</b>
