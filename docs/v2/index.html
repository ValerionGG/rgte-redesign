<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RGTE — Tour 2 : 5 propositions</title>
<script src="../vendor/preact.min.js"></script>
<script src="../dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&amp;family=Archivo:wght@400;600;800&amp;family=Figtree:wght@400;600;800&amp;family=Barlow+Condensed:wght@600;700&amp;family=Manrope:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.1,1) both}
.slide{animation:slide .7s cubic-bezier(.2,.7,.1,1) both}
.dir{transition:background .3s ease}
.dir:hover{background:#F3F2EF}
.dir:focus-visible,.card:focus-visible,.pg:focus-visible,.cta:focus-visible,.back:focus-visible{outline:2px solid #D42A20;outline-offset:3px}
.card .stage img{transition:transform .8s cubic-bezier(.2,.7,.1,1)}
.card:hover .stage img{transform:translateY(-6px) scale(1.03)}
.card .arr{transition:transform .4s}
.card:hover .arr{transform:translate(4px,-4px)}
.pg{transition:background .25s,color .25s}
.pg:hover{background:#1C1C1E;color:#FFFFFF}
.cta{transition:background .25s}
.cta:hover{background:#B8231A}
@media (max-width:900px){.split{flex-direction:column}.big{font-size:44px !important}.lst{flex:1 1 auto !important}}
</style>
</helmet>
<div style="font-family:'Jost',system-ui,sans-serif;color:#1C1C1E;background:#FFFFFF;min-height:2000px">
  <div style="background:#1C1C1E;color:#D9D7D2;font-size:12px;letter-spacing:.06em">
    <div style="max-width:1320px;margin:0 auto;padding:10px 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <span>Proposition de refonte de rgte.eu — tour 2 · concept non officiel</span>
      <a class="back" href="../index.html" style="color:#FFFFFF;text-decoration:none">← Voir le tour 1 (10 directions)</a>
    </div>
  </div>
  <div style="max-width:1320px;margin:0 auto;padding:40px 40px 96px;display:flex;flex-direction:column;gap:56px">
    <header style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
      <span style="display:flex;align-items:baseline;gap:12px"><span style="font-weight:700;font-size:26px;letter-spacing:.04em;color:#D42A20">RGTE</span><span style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#5A5A5E">R.G. Technologies</span></span>
      <span style="font-size:13px;color:#5A5A5E">Vitrines réfrigérées sur mesure · Octobre 2026</span>
    </header>

    <section style="display:flex;flex-direction:column;gap:22px;max-width:980px">
      <span class="rise" style="font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#D42A20;font-weight:600">Tour 2 · recentré sur le produit</span>
      <h1 class="big rise" style="margin:0;font-weight:600;font-size:76px;line-height:1;letter-spacing:-.02em;animation-delay:.1s">Cinq propositions où la vitrine RGTE est l'héroïne.</h1>
      <p class="rise" style="margin:0;font-size:18px;line-height:1.6;color:#45454A;max-width:820px;animation-delay:.2s">Le premier tour mettait en scène l'univers des clients (pâtisserie, chocolat, halles…). Ce tour revient à l'essentiel : RGTE est un fabricant de vitrines réfrigérées sur mesure. Chaque direction garde l'identité de la marque (rouge, grotesque, fond gris studio), place les produits au-dessus de la ligne de flottaison et fait de la page d'accueil une landing qui mène au plan 3D offert, au numéro vert et au show-room.</p>
      <div class="rise" style="display:flex;flex-wrap:wrap;gap:10px;animation-delay:.3s">
        <span style="padding:8px 14px;border:1px solid #DAD8D3;border-radius:999px;font-size:14px">Produit en héros, rendu dessiné</span>
        <span style="padding:8px 14px;border:1px solid #DAD8D3;border-radius:999px;font-size:14px">Plan 3D offert + 0 800 95 13 13</span>
        <span style="padding:8px 14px;border:1px solid #DAD8D3;border-radius:999px;font-size:14px">45 modules avec visuel</span>
        <span style="padding:8px 14px;border:1px solid #DAD8D3;border-radius:999px;font-size:14px">Fiche Gourmandise configurable</span>
      </div>
    </section>

    <section class="split" style="display:flex;gap:40px;align-items:stretch">
      <nav class="lst" aria-label="Directions" style="flex:0 0 380px;display:flex;flex-direction:column;border-top:1px solid #DAD8D3">
        <sc-for list="{{ dirs }}" as="d" hint-placeholder-count="5">
          <button type="button" class="dir" onClick="{{ d.pick }}" style="{{ d.rowStyle }}">
            <span style="{{ d.numStyle }}">{{ d.num }}</span>
            <span style="display:flex;flex-direction:column;gap:3px;text-align:left">
              <span style="{{ d.nameStyle }}">{{ d.name }}</span>
              <span style="font-size:14px;line-height:1.4;color:#5A5A5E">{{ d.tag }}</span>
            </span>
          </button>
        </sc-for>
      </nav>

      <article style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;border:1px solid #DAD8D3">
        <div style="{{ cur.stageStyle }}">
          <img class="slide" src="{{ cur.img }}" alt="{{ cur.alt }}" style="width:min(640px,88%);height:auto;display:block;margin:0 auto">
          <span style="{{ cur.chipStyle }}">Proposition {{ cur.num }} / 05</span>
        </div>
        <div style="padding:30px 36px 36px;display:flex;flex-direction:column;gap:24px">
          <h2 style="{{ cur.titleStyle }}">{{ cur.name }} <span style="font-weight:400;color:#5A5A5E;font-size:20px">— {{ cur.claim }}</span></h2>
          <p style="margin:0;font-size:17px;line-height:1.6;max-width:680px">{{ cur.desc }}</p>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:22px">
            <div style="display:flex;flex-direction:column;gap:10px">
              <span style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5A5A5E">Palette</span>
              <div style="display:flex;gap:8px">
                <sc-for list="{{ cur.swatches }}" as="s" hint-placeholder-count="4">
                  <span style="{{ s.style }}" title="{{ s.hex }}"></span>
                </sc-for>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px">
              <span style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5A5A5E">Typographie</span>
              <span style="font-size:15px">{{ cur.fonts }}</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px">
              <span style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5A5A5E">Moment-signature</span>
              <span style="font-size:15px;line-height:1.5">{{ cur.moment }}</span>
            </div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{ cur.pages }}" as="p" hint-placeholder-count="3">
              <a class="pg" href="{{ p.href }}" style="display:inline-flex;align-items:center;min-height:44px;padding:0 18px;font-size:15px;text-decoration:none;color:#1C1C1E;border:1px solid #CFCDC8;border-radius:999px">{{ p.label }}</a>
            </sc-for>
          </div>
          <a class="cta" href="{{ cur.home }}" style="align-self:flex-start;display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:0 26px;font-size:16px;font-weight:600;text-decoration:none;border-radius:4px;background:#D42A20;color:#FFFFFF">Ouvrir la proposition {{ cur.name }}
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg>
          </a>
        </div>
      </article>
    </section>

    <section style="display:flex;flex-direction:column;gap:24px">
      <h2 style="margin:0;font-weight:600;font-size:38px;letter-spacing:-.01em">Les cinq, côte à côte</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:16px">
        <sc-for list="{{ dirs }}" as="d" hint-placeholder-count="5">
          <a class="card" href="{{ d.home }}" style="display:flex;flex-direction:column;gap:12px;text-decoration:none;color:#1C1C1E">
            <span class="stage" style="{{ d.cardStage }}">
              <img src="{{ d.img }}" alt="{{ d.alt }}" style="width:92%;height:auto;display:block">
            </span>
            <span style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
              <span style="{{ d.nameStyle }}">{{ d.num }} · {{ d.name }}</span>
              <svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg>
            </span>
            <span style="font-size:14px;line-height:1.45;color:#5A5A5E">{{ d.tag }}</span>
          </a>
        </sc-for>
      </div>
    </section>

    <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:24px;border-top:1px solid #DAD8D3;padding-top:32px">
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#D42A20;font-weight:600">Ce qui a changé</span>
        <p style="margin:0;font-size:15px;line-height:1.6;color:#45454A">Les vitrines sont dessinées (vue de face, cotes, plans) au lieu des photos de pâtisseries ; chaque module des 5 lignes a son visuel et mène à une fiche.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#D42A20;font-weight:600">Une landing qui convertit</span>
        <p style="margin:0;font-size:15px;line-height:1.6;color:#45454A">Accueil plus court, header collant avec « Plan 3D offert » et numéro vert, formulaire court en bas de page, secteurs et réalisations en appui.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#D42A20;font-weight:600">À compléter par RGTE</span>
        <p style="margin:0;font-size:15px;line-height:1.6;color:#45454A">Les vraies photos produits et chantiers, les prix hors 101 cm, les horaires et coloris : ils apparaissent en marqueurs [..] dans les maquettes.</p>
      </div>
    </section>

    <footer style="border-top:1px solid #DAD8D3;padding-top:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:#5A5A5E">
      <span>Concepts de refonte — non officiels. RGTE · R.G. Technologies · Puget-sur-Argens.</span>
      <span>Rendus de vitrines dessinés · contenus et produits repris de rgte.eu</span>
    </footer>
  </div>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0 }; }
  renderVals() {
    const PAGES = [['Accueil', 'Accueil'], ["Lignes d'agencement", 'Lignes'], ['Module Gourmandise', 'Module']];
    const D = [
      { k: 'Showroom', name: 'Showroom', claim: 'le showroom en ligne', font: "'Jost',sans-serif", weight: 600, tag: 'L’évolution directe du site actuel : la vitrine sur fond gris studio, ligne par ligne.', desc: 'Blanc, gris studio et rouge RGTE, en Jost (la plus proche de Brandon Grotesque). Le héros présente une vitrine par ligne d’agencement, comme dans une salle d’exposition ; les produits sont posés sur des podiums, et la fiche Gourmandise se lit comme un produit premium.', img: '../assets/v2/vitrine-gourmandise.svg', alt: 'Vitrine Gourmandise', stage: '#ECEBE8', sw: ['#FFFFFF', '#ECEBE8', '#D42A20', '#1C1C1E'], fonts: 'Jost', moment: 'Un rail des 5 lignes change la vitrine du héros en fondu, avec sa légende matériaux et le prix Gourmandise dès 5 800 € HT.' },
      { k: 'Fabricant', name: 'Fabricant', claim: 'le fabricant du froid sur mesure', font: "'Archivo',sans-serif", weight: 800, upper: true, tag: 'Graphite et rouge : la vitrine annotée comme un dessin d’ingénieur.', desc: 'Un ton d’industriel français : bureau d’études, fabrication, installation. Le héros sombre montre la Gourmandise annotée de repères techniques ; le catalogue compare les lignes et la fiche produit se lit comme une fiche technique, avec configurateur collant.', img: '../assets/v2/vitrine-gourmandise.svg', alt: 'Vitrine Gourmandise annotée', stage: '#1C1C1E', sw: ['#1C1C1E', '#F4F2EE', '#D42A20', '#8A8D91'], fonts: 'Archivo · IBM Plex Mono', moment: '7 repères numérotés sur la vitrine (froid ventilé, groupe logé, vitrages coulissants…) qui ouvrent chacun leur fiche.' },
      { k: 'Metiers', name: 'Métiers', claim: 'votre métier, vos vitrines', font: "'Figtree',sans-serif", weight: 800, tag: 'On choisit son métier, le site recommande les vitrines adaptées.', desc: 'Treize métiers de bouche, une seule question : « Vous êtes… ». Le choix met à jour la vitrine conseillée, la température et les modules recommandés, puis filtre le catalogue, les réalisations et le formulaire. Le produit reste au centre, sans photo de pâtisserie en héros.', img: '../assets/v2/vitrine-saladette.svg', alt: 'Saladette réfrigérée', stage: '#F3F2EF', sw: ['#FFFFFF', '#F3F2EF', '#D42A20', '#1C1C1E'], fonts: 'Figtree', moment: 'Les 13 métiers en chips : la vitrine conseillée glisse, la température et le CTA « Plan 3D offert pour ma… » suivent.' },
      { k: 'Gamme', name: 'Gamme', claim: 'le catalogue pro', font: "'Barlow Condensed',sans-serif", weight: 700, upper: true, tag: 'Un catalogue B2B : recherche, filtres et comparateur dès l’accueil.', desc: 'L’esprit d’un fabricant d’équipement professionnel : filets fins, numérotation de catalogue, Barlow. La grille des 45 modules arrive très tôt sur la landing, filtrable par ligne, usage, température et métier, avec un comparateur de 2 à 3 modules.', img: '../assets/v2/vitrine-industry.svg', alt: 'Vitrine Ligne Industry', stage: '#ECEBE8', sw: ['#FFFFFF', '#ECEBE8', '#D42A20', '#2A2A2D'], fonts: 'Barlow · Barlow Condensed', moment: 'La recherche « Je cherche une vitrine pour… » pilote en direct la grille ; cocher 2 à 3 modules ouvre la comparaison.' },
      { k: 'Projet', name: 'Projet 3D', claim: 'votre agencement, dessiné et offert', font: "'Manrope',sans-serif", weight: 800, tag: 'Conversion d’abord : la demande de plan 3D est dans le héros.', desc: 'Le plan 3D offert devient la porte d’entrée. À gauche, un comptoir de 3 modules qui bascule de la vue de face au plan coté ; à droite, la demande en 3 étapes. Les produits sont « les modules de votre plan » et s’ajoutent depuis le catalogue.', img: '../assets/v2/vitrine-plane.svg', alt: 'Vitrine Plane', stage: '#F3F2EF', sw: ['#FFFFFF', '#F3F2EF', '#D42A20', '#1C1C1E'], fonts: 'Manrope', moment: 'Le comptoir se recompose selon le métier choisi et bascule Face / Plan, avec la longueur saisie en cote rouge.' },
    ];
    const sel = this.state.sel;
    const nameCss = (d, size) => 'font-family:' + d.font + ';font-size:' + size + 'px;line-height:1.1;font-weight:' + d.weight + (d.upper ? ';text-transform:uppercase;letter-spacing:.02em' : '');
    const dirs = D.map((d, i) => ({
      ...d, num: String(i + 1).padStart(2, '0'), home: d.k + '-Accueil.html',
      pick: () => this.setState({ sel: i }),
      rowStyle: 'display:flex;gap:16px;align-items:flex-start;width:100%;min-height:44px;padding:18px ' + (i === sel ? '18px' : '8px') + ';border:0;border-bottom:1px solid #DAD8D3;border-left:3px solid ' + (i === sel ? '#D42A20' : 'transparent') + ';cursor:pointer;font:inherit;color:#1C1C1E;background:' + (i === sel ? '#F3F2EF' : 'transparent') + ';transition:padding .3s',
      numStyle: 'font-size:13px;font-weight:600;padding-top:5px;min-width:22px;color:' + (i === sel ? '#D42A20' : '#77777C'),
      nameStyle: nameCss(d, 22),
      cardStage: 'display:flex;align-items:center;justify-content:center;height:220px;overflow:hidden;background:' + d.stage,
    }));
    const c = D[sel];
    const cur = {
      ...c, num: String(sel + 1).padStart(2, '0'), home: c.k + '-Accueil.html',
      pages: PAGES.map(([label, f]) => ({ label, href: c.k + '-' + f + '.html' })),
      swatches: c.sw.map((h) => ({ hex: h, style: 'width:40px;height:40px;border-radius:50%;background:' + h + ';border:1px solid rgba(0,0,0,.15)' })),
      stageStyle: 'position:relative;padding:48px 24px 36px;background:' + c.stage + ';transition:background .5s',
      chipStyle: 'position:absolute;top:16px;left:16px;font-size:12px;letter-spacing:.08em;padding:6px 10px;background:#FFFFFF;color:#1C1C1E',
      titleStyle: 'margin:0;' + nameCss(c, 36),
    };
    return { dirs, cur };
  }
}
</script>
</body>
</html>
