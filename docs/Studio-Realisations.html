<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Studio — Réalisations</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#FAFAF8}
sc-for,sc-if{display:contents}
.st{--acc:#D42A20;font-family:'Onest',system-ui,sans-serif;color:#16181A;background:#FAFAF8;-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
.st *,.st *::before,.st *::after{box-sizing:border-box}
.st img{display:block;max-width:100%}
.st h1,.st h2,.st h3,.st h4,.st p{margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.wrap{max-width:1320px;margin:0 auto;padding:0 32px}
.topbar{background:#16181A;color:#B9BCB7;font-size:12px}
.topbar-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:38px}
.topbar a{color:#FAFAF8;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:38px}
.topbar a:hover{text-decoration:underline;text-underline-offset:3px}
.hdr{position:sticky;top:0;z-index:60;background:rgba(250,250,248,.9);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid #E2E3DF}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:76px}
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#16181A;min-height:44px}
.logo-glyph{display:flex;align-items:flex-end;gap:2px;height:24px}
.logo-glyph i{display:block;width:7px;border-radius:1px;background:#16181A}
.logo-word{display:block;font-weight:800;font-size:25px;letter-spacing:-.045em;line-height:1}
.logo-sub{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5B6066;margin-top:4px;line-height:1}
.nav{display:flex;gap:2px;background:#ECEDEA;padding:4px;border-radius:999px}
.nav-a{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;color:#5B6066;text-decoration:none;transition:background .2s,color .2s,box-shadow .2s}
.nav-a:hover{color:#16181A;background:rgba(255,255,255,.65)}
.nav-a.on{background:#fff;color:#16181A;box-shadow:0 1px 3px rgba(22,24,26,.1)}
.hdr-r{display:flex;align-items:center;gap:14px}
.tel{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#16181A;min-height:44px}
.tel-ico{width:38px;height:38px;border-radius:50%;background:#D8EDE3;display:grid;place-items:center;flex:none}
.tel b{display:block;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;line-height:1.15}
.tel small{display:block;font-size:11px;color:#5B6066;line-height:1.2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;border:0;font:600 15px/1 'Onest',system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:transform .2s ease,box-shadow .25s ease,background .2s ease,color .2s}
.btn svg{transition:transform .25s ease;flex:none}
.btn:hover svg{transform:translateX(3px)}
.btn-acc{background:var(--acc);color:#fff}
.btn-acc:hover{transform:translateY(-1px);box-shadow:0 12px 26px -12px var(--acc)}
.btn-ink{background:#16181A;color:#FAFAF8}
.btn-ink:hover{transform:translateY(-1px);box-shadow:0 12px 26px -14px #16181A}
.btn-ghost{background:transparent;color:#16181A;box-shadow:inset 0 0 0 1px #C4C6C1}
.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px #16181A}
.btn-sm{min-height:44px;padding:0 18px;font-size:14px}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1px solid #D5D7D2;background:#fff;align-items:center;justify-content:center;cursor:pointer;color:#16181A}
.mnav{display:none}
.mnav a{display:flex;align-items:center;justify-content:space-between;min-height:50px;padding:0 16px;border-radius:12px;background:#ECEDEA;text-decoration:none;color:#16181A;font-weight:600}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#5B6066}
.eyebrow i{width:8px;height:8px;border-radius:2px;background:var(--acc);display:block}
.h2{font-size:clamp(32px,4.4vw,60px);line-height:1.02;letter-spacing:-.035em;font-weight:700;overflow-wrap:anywhere}
.lead{font-size:clamp(16px,1.4vw,19px);color:#5B6066;line-height:1.55}
.sec{padding:120px 0}
.ftr{background:#ECEDEA;padding:80px 0 28px}
.ftr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px}
.ftr-h{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5B6066;margin-bottom:14px;font-weight:500}
.ftr p{font-size:15px}
.ftr-links a{display:flex;align-items:center;min-height:36px;text-decoration:none;color:#16181A;font-size:15px}
.ftr-links a:hover{color:var(--acc)}
.ftr-tel{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;text-decoration:none;letter-spacing:-.02em;display:inline-block;color:#16181A}
.ftr-bot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-top:64px;padding-top:14px;border-top:1px solid #D5D7D2;font-size:13px;color:#5B6066}
.ftr-bot a{color:#5B6066;font-size:13px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.ftr-bot a:hover{color:#16181A}
.legal{display:flex;flex-wrap:wrap;gap:0 20px}
.st :focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .45s ease both}
@media(max-width:1080px){.nav,.tel{display:none}.burger{display:inline-flex}.mnav{display:grid;gap:6px;padding:4px 16px 16px}}
@media(max-width:720px){.wrap{padding:0 16px}.sec{padding:80px 0}.topbar-note{display:none}.hdr-cta{display:none}}
@media (prefers-reduced-motion:reduce){.st *{animation:none !important;transition:none !important}}

/* ---- Réalisations ---- */
.phero{padding:64px 0 40px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;align-items:end}
.h1{font-size:clamp(44px,7vw,104px);line-height:.92;letter-spacing:-.055em;font-weight:800;margin-top:18px;overflow-wrap:anywhere}
.h1 em{font-style:normal;color:var(--acc)}
.fbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;background:#ECEDEA;border-radius:22px;padding:8px;position:sticky;top:86px;z-index:20}
.fgroup{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.flab{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#5B6066;padding:0 8px 0 10px}
.fchip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:0;border-radius:12px;font:500 14px/1 'Onest',sans-serif;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.fchip:hover{box-shadow:inset 0 0 0 1px #16181A}
.fchip .c{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.7}
.vt{display:flex;background:#fff;border-radius:12px;padding:3px;gap:2px}
.vt button{width:44px;height:40px;border:0;border-radius:9px;cursor:pointer;display:grid;place-items:center}
.lay{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;margin-top:20px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:12px}
.card{display:flex;flex-direction:column;text-align:left;border:0;padding:0;background:#fff;border-radius:22px;overflow:hidden;cursor:pointer;font-family:'Onest',sans-serif;color:#16181A;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s;animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.card:hover{transform:translateY(-4px)}
.card .im{display:block;width:100%;height:200px;overflow:hidden;background:#ECEDEA}
.card img{width:100%;height:200px;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.07)}
.card .bd{display:block;padding:14px 16px 16px;width:100%}
.card .top{display:flex;width:100%;justify-content:space-between;gap:8px;align-items:center}
.card .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:#5B6066}
.card b{display:block;font-size:17px;letter-spacing:-.02em;line-height:1.2;margin-top:8px}
.card .pl{display:block;font-size:13px;color:#5B6066;margin-top:4px}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:999px;background:#16181A;color:#fff;font-family:'JetBrains Mono',monospace;font-size:10px}
.list{display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:50px 64px minmax(0,1fr) auto;align-items:center;gap:14px;min-height:76px;padding:6px 14px 6px 6px;border:0;border-radius:18px;text-align:left;cursor:pointer;font-family:'Onest',sans-serif;color:#16181A;transition:background .2s,box-shadow .2s,transform .2s;animation:fade .4s ease both}
.lrow:hover{transform:translateX(4px)}
.lrow img{width:64px;height:64px;object-fit:cover;border-radius:12px}
.lrow .n{font-family:'JetBrains Mono',monospace;font-size:12px;color:#5B6066;text-align:center}
.insp{position:sticky;top:170px;background:#ECEDEA;border-radius:28px;padding:8px;display:flex;flex-direction:column;gap:8px}
.ihero{position:relative;border-radius:22px;overflow:hidden;height:280px;background:#16181A}
.ihero img{width:100%;height:280px;object-fit:cover;animation:kb 8s ease-out both}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
.inav{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.inav button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(250,250,248,.92);cursor:pointer;display:grid;place-items:center;color:#16181A;transition:background .2s}
.inav button:hover{background:#fff}
.icap{position:absolute;left:12px;bottom:12px;font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(250,250,248,.9);border-radius:8px;padding:5px 8px}
.ibody{background:#FAFAF8;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:16px}
.ibody h2{font-size:clamp(28px,3vw,40px);font-weight:800;letter-spacing:-.04em;line-height:1}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kv div{background:#fff;border-radius:14px;padding:12px 14px}
.kv span{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5B6066}
.kv b{display:block;font-size:15px;margin-top:4px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;background:#D8EDE3;font-size:13px;font-weight:500}
.mini{position:relative;background:#fff;border-radius:18px;padding:110px 56px 34px 26px;background-image:linear-gradient(#F0F1EE 1px,transparent 1px),linear-gradient(90deg,#F0F1EE 1px,transparent 1px);background-size:16px 16px}
.mini .tag{position:absolute;top:12px;left:14px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#5B6066}
.counter{position:relative;z-index:0;display:flex;align-items:flex-end;width:100%}
.blk{animation:blkIn .5s cubic-bezier(.2,.9,.3,1.15) both}
.blk:nth-child(2){animation-delay:.08s}.blk:nth-child(3){animation-delay:.16s}.blk:nth-child(4){animation-delay:.24s}
@keyframes blkIn{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
.floor{position:absolute;left:-10px;right:-40px;bottom:-12px;height:16px;background:radial-gradient(ellipse at center,rgba(22,24,26,.18),transparent 70%);z-index:-1}
.empty{padding:48px;border-radius:22px;border:1.5px dashed #C4C6C1;text-align:center;color:#5B6066}
.ctaband{background:#16181A;color:#FAFAF8;border-radius:32px;padding:56px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:center}
@media(max-width:1080px){.lay{grid-template-columns:minmax(0,1fr)}.insp{position:static;order:-1}.fbar{position:static}}
@media(max-width:960px){.phero,.ctaband{grid-template-columns:minmax(0,1fr)}.ctaband{padding:36px}}
@media(max-width:720px){.lrow{grid-template-columns:40px 56px minmax(0,1fr)}.lrow .badge{display:none}.lrow img{width:56px;height:56px}.kv{grid-template-columns:minmax(0,1fr)}.mini{padding:100px 50px 30px 18px}}
</style>
</helmet>
<div class="st" style="{{ rootStyle }}">

<div class="topbar">
  <div class="wrap topbar-in">
    <span class="mono topbar-note">Proposition 06 · Studio — configurateur</span>
    <a href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Toutes les propositions</a>
  </div>
</div>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="Studio-Accueil.html" aria-label="RGTE, R.G. Technologies — accueil">
      <span class="logo-glyph" aria-hidden="true"><i style="height:12px"></i><i style="height:24px;background:var(--acc)"></i><i style="height:17px"></i></span>
      <span><span class="logo-word">RGTE</span><span class="logo-sub">R.G. Technologies</span></span>
    </a>
    <nav class="nav" aria-label="Navigation principale">
      <a class="nav-a" href="Studio-Lignes.html">Lignes</a>
      <a class="nav-a" href="Studio-Secteurs.html">Secteurs</a>
      <a class="nav-a on" href="Studio-Realisations.html" aria-current="page">Réalisations</a>
      <a class="nav-a" href="Studio-Contact.html">Showroom &amp; contact</a>
    </nav>
    <div class="hdr-r">
      <a class="tel" href="tel:0800951313"><span class="tel-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16181A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg></span><span><b>0 800 95 13 13</b><small>Appel gratuit</small></span></a>
      <a class="btn btn-acc btn-sm hdr-cta" href="Studio-Contact.html">Plan 3D offert</a>
      <button type="button" class="burger" aria-label="Ouvrir ou fermer le menu" onClick="{{ toggleMenu }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav fade" aria-label="Navigation mobile">
      <a href="Studio-Lignes.html">Lignes <span class="mono">01</span></a>
      <a href="Studio-Secteurs.html">Secteurs <span class="mono">02</span></a>
      <a href="Studio-Realisations.html">Réalisations <span class="mono">03</span></a>
      <a href="Studio-Contact.html">Showroom &amp; contact <span class="mono">04</span></a>
      <a href="tel:0800951313">0 800 95 13 13 <span class="mono">Gratuit</span></a>
      <a href="Studio-Contact.html" style="background:var(--acc);color:#fff">Plan 3D offert <span class="mono">→</span></a>
    </nav>
  </sc-if>
</header>

<main>
<section class="wrap">
  <div class="phero">
    <div class="rise">
      <span class="eyebrow"><i></i>Réalisations</span>
      <h1 class="h1">14 linéaires,<br><em>module par module.</em></h1>
    </div>
    <p class="lead rise d2">De Paris à La Réunion, chaque projet est décomposé en modules. Filtrez par ligne ou par métier, ouvrez un projet : son linéaire se redessine dans l'inspecteur.</p>
  </div>

  <div class="fbar rise d3">
    <div class="fgroup" role="group" aria-label="Filtrer par ligne">
      <span class="flab">Ligne</span>
      <sc-for list="{{ lineF }}" as="f" hint-placeholder-count="4">
        <button type="button" class="fchip" style="{{ f.style }}" aria-pressed="{{ f.on }}" onClick="{{ f.pick }}">{{ f.name }}<span class="c">{{ f.count }}</span></button>
      </sc-for>
    </div>
    <div class="fgroup" role="group" aria-label="Filtrer par type">
      <span class="flab">Type</span>
      <sc-for list="{{ typeF }}" as="f" hint-placeholder-count="6">
        <button type="button" class="fchip" style="{{ f.style }}" aria-pressed="{{ f.on }}" onClick="{{ f.pick }}">{{ f.name }}</button>
      </sc-for>
    </div>
    <div class="vt" role="group" aria-label="Affichage">
      <button type="button" aria-label="Affichage en grille" style="{{ gridBtn }}" onClick="{{ setGrid }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></button>
      <button type="button" aria-label="Affichage en liste" style="{{ listBtn }}" onClick="{{ setList }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></button>
    </div>
  </div>

  <div class="lay">
    <div>
      <p class="mono" style="font-size:12px;color:#5B6066;margin:6px 0 14px">{{ countTxt }} · images d'ambiance, photos des projets à intégrer</p>
      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <div class="empty fade">Aucune réalisation pour cette combinaison.<br><button type="button" class="btn btn-ink" style="margin-top:18px" onClick="{{ resetF }}">Réinitialiser les filtres</button></div>
      </sc-if>
      <sc-if value="{{ showGrid }}" hint-placeholder-val="{{ true }}">
        <div class="grid">
          <sc-for list="{{ items }}" as="r" hint-placeholder-count="6">
            <button type="button" class="card" style="{{ r.style }}" onClick="{{ r.pick }}" aria-pressed="{{ r.on }}">
              <span class="im"><img src="{{ r.img }}" alt="{{ r.alt }}"></span>
              <span class="bd">
                <span class="top"><span class="n">N° {{ r.n }}</span><span class="badge">{{ r.line }}</span></span>
                <b>{{ r.title }}</b>
                <span class="pl">{{ r.place }}</span>
              </span>
            </button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ showList }}" hint-placeholder-val="{{ false }}">
        <div class="list">
          <sc-for list="{{ items }}" as="r" hint-placeholder-count="6">
            <button type="button" class="lrow" style="{{ r.rowStyle }}" onClick="{{ r.pick }}" aria-pressed="{{ r.on }}">
              <span class="n">{{ r.n }}</span>
              <img src="{{ r.img }}" alt="{{ r.alt }}">
              <span><b style="font-size:16px">{{ r.title }}</b><br><span style="font-size:13px;color:#5B6066">{{ r.place }} · {{ r.modsTxt }}</span></span>
              <span class="badge">{{ r.line }}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ true }}">
      <aside class="insp" aria-label="Projet sélectionné">
        <div class="ihero">
          <sc-for list="{{ selImg }}" as="i" hint-placeholder-count="1"><img src="{{ i.img }}" alt="{{ i.alt }}"></sc-for>
          <div class="inav">
            <button type="button" aria-label="Projet précédent" onClick="{{ prev }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
            <button type="button" aria-label="Projet suivant" onClick="{{ next }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
          </div>
          <span class="icap">Image d'ambiance</span>
        </div>
        <div class="ibody">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span class="mono" style="font-size:12px;color:#5B6066">RÉALISATION {{ sel.n }} / 14 · {{ posTxt }}</span><span class="badge">Ligne {{ sel.line }}</span></div>
