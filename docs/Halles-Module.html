<div style="display:flex;flex-wrap:wrap;gap:8px"><span class="sign" style="background:#1C1B19;color:#F7F5F0">Ligne Stone</span><span class="sign" style="background:#ECE8DF;color:#1C1B19">Exposition centrale</span></div>
<h1 class="p-name">Gourmandise</h1>
<p class="p-lead">Exposition centrale à hauteur du plan de travail, vitrages coulissants des 2 côtés : pâtisseries, macarons ou chocolats. Profondeur d'exposition 60 cm.</p>

<div class="cfg-g">

</div>
</div>

<div class="cfg-g">
<p class="cfg-l">Température <em>selon vos produits</em></p>
<div class="temps" role="group" aria-label="Plage de température">
<sc-for list="{{ temps }}" as="t" hint-placeholder-count="2"><button type="button" class="tp" style="{{ t.style }}" onClick="{{ t.pick }}" aria-pressed="{{ t.sel }}"><span>{{ t.sector }}</span><b>{{ t.n }}</b></button></sc-for>
</div>
</div>

</div>
</div>

<p style="margin-top:16px">Deux plages au choix : <strong>+2 °C / +8 °C</strong> pour les pâtisseries et macarons, <strong>+14 °C / +18 °C</strong> pour les chocolats. Six longueurs de 101 à 222 cm, ou sur mesure.</p>

</form>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3600},"accent":{"editor":"color","default":"#D42A20","options":["#D42A20","#1C1B19","#3F6C8C"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { len: '101', temp: 'p', fin: 'blanc', view: 'draw', tab: 'desc', menu: false, sent: false, tried: false,
      nom: '', tel: '', email: '', sec: '', cp: '', ville: '', msg: '' };
  }
  renderVals() {
    const st = this.state;
    const acc = (this.props && this.props.accent) || '#D42A20';
    const LENS = ['101','117','146','169','191','222','mesure'];
    const lenLabel = id => id === 'mesure' ? 'Sur mesure' : id + ' cm';
    const TEMPS = [
      { id:'p', n:'+2 / +8 °C', sector:'Pâtisserie · macarons', bg:'#D98C8C', fg:'#1C1B19', glass:'rgba(217,140,140,.28)', prods:['#D98C8C','#E3B85C','#F2EFE8','#B9A3D0','#9AA27A'] },
      { id:'c', n:'+14 / +18 °C', sector:'Chocolats', bg:'#5A3A2C', fg:'#F7F5F0', glass:'rgba(90,58,44,.22)', prods:['#5A3A2C','#3A2A22','#7A4E3A','#2B1E18'] }
    ];
    const FINS = [
      { id:'blanc', n:'Pierre acrylique blanche', c:'#F2EFE8' },
      { id:'c1', n:'[COLORIS] clair', c:'#CDBFA8' },
      { id:'c2', n:'[COLORIS] foncé', c:'#3B3A37' }
    ];
    const t = TEMPS.find(x => x.id === st.temp) || TEMPS[0];
    const fin = FINS.find(x => x.id === st.fin) || FINS[0];
    const lenN = st.len === 'mesure' ? 240 : parseInt(st.len, 10);
    const widthPct = st.len === 'mesure' ? 96 : Math.round(lenN / 240 * 96);
    const nProds = Math.max(4, Math.round(lenN / 17));
    const prods = [];
    for (let i = 0; i < nProds; i++) prods.push({ style: 'background:' + t.prods[i % t.prods.length] + ';box-shadow:inset 0 0 0 1px rgba(28,27,25,.15)' });
    const priced = st.len === '101' && st.fin === 'blanc';
    const priceList = [ priced
      ? { v: '5 800,00 € HT', note: 'Modèle 101 cm, pierre acrylique blanche.' }
      : { v: 'Sur devis', note: st.len === '101' ? 'Autre coloris : [PRIX] sur devis.' : 'Autres longueurs : [PRIX] sur devis.' } ];
    const set = k => e => this.setState({ [k]: e.target.value });
    const f = { nom: st.nom, tel: st.tel, email: st.email, sec: st.sec, cp: st.cp, ville: st.ville, msg: st.msg };
    const bad = {
      nom: !st.nom.trim(), tel: !st.tel.trim(),
      email: !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(st.email.trim()), msg: !st.msg.trim()
    };
    const e = { nom: st.tried && bad.nom, tel: st.tried && bad.tel, email: st.tried && bad.email, msg: st.tried && bad.msg };
    const TABS = [['desc','Description'],['car','Caractéristiques'],['dim','Dimensions']];
    const SPECS = ['Piliers et plan de travail en pierre acrylique blanche','Monté sur pied en pierre acrylique blanche','Groupe logé','Froid ventilé','Fréon R134A','Contrôle électronique de la température','Dégivrage automatique','Ré-évaporation automatique des eaux de condensation','Sans réserve réfrigérée','Dimensions extérieures 101 × 80 × 80 + 25 h','Exposition en verre 81 × 60 cm','Vitrages coulissants des 2 côtés'];
    const dimRows = LENS.map(id => ({
      n: lenLabel(id),
      ext: id === '101' ? '101 × 80 × 80 + 25 h' : (id === 'mesure' ? 'Selon votre local' : '[DIMENSIONS]'),
      expo: id === '101' ? '81 × 60 cm' : (id === 'mesure' ? 'Profondeur 60 cm' : '[EXPOSITION] × 60 cm'),
      prix: id === '101' ? '5 800,00 €' : 'Sur devis',
      style: id === st.len ? 'background:#F2EEE6;box-shadow:inset 4px 0 0 #1C1B19' : ''
    }));
    return {
      cta: 'background:' + acc,
      menuOpen: st.menu,
      toggleMenu: () => this.setState({ menu: !st.menu }),
      vDraw: st.view === 'draw' ? 'background:#1C1B19;color:#F7F5F0' : 'background:transparent;color:#1C1B19',
      vPhoto: st.view === 'photo' ? 'background:#1C1B19;color:#F7F5F0' : 'background:transparent;color:#1C1B19',
      showDraw: () => this.setState({ view: 'draw' }),
      showPhoto: () => this.setState({ view: 'photo' }),
      phStyle: st.view === 'photo' ? 'opacity:1;visibility:visible' : 'opacity:0;visibility:hidden',
      gmStyle: 'width:' + widthPct + '%' + (st.len === 'mesure' ? ';outline:2px dashed rgba(28,27,25,.45);outline-offset:10px' : ''),
      glassStyle: 'background:' + t.glass,
      finStyle: 'background:' + fin.c,
      prods,
      c: { len: lenLabel(st.len), lenId: st.len, temp: t.n + ' — ' + t.sector, tempShort: t.n, fin: fin.n },
      lens: LENS.map(id => ({ n: id === 'mesure' ? 'Sur mesure' : id, sel: id === st.len ? 'true' : 'false',
        pick: () => this.setState({ len: id }),
        style: (id === st.len ? 'background:#1C1B19;color:#F7F5F0;box-shadow:none' : '') + (id === 'mesure' ? ';grid-column:span 2' : '') })),
      temps: TEMPS.map(x => ({ n: x.n, sector: x.sector, sel: x.id === st.temp ? 'true' : 'false',
        pick: () => this.setState({ temp: x.id }),
        style: 'background:' + x.bg + ';color:' + x.fg + ';' + (x.id === st.temp ? 'box-shadow:0 0 0 3px #F7F5F0,0 0 0 5px #1C1B19' : 'box-shadow:inset 0 0 0 1px rgba(28,27,25,.15)') })),
      fins: FINS.map(x => ({ n: x.n, sel: x.id === st.fin ? 'true' : 'false', pick: () => this.setState({ fin: x.id }),
        sw: 'background:' + x.c, style: x.id === st.fin ? 'box-shadow:inset 0 0 0 2px #1C1B19' : 'box-shadow:inset 0 0 0 1px #D8D2C6' })),
      priceList,
      tabs: TABS.map(x => ({ n: x[1], sel: x[0] === st.tab ? 'true' : 'false', pick: () => this.setState({ tab: x[0] }),
        style: x[0] === st.tab ? 'box-shadow:inset 0 -3px 0 #D42A20' : 'color:#5C574F' })),
      isDesc: st.tab === 'desc', isCar: st.tab === 'car', isDim: st.tab === 'dim',
      specs: SPECS.map(n => ({ n })),
      dimRows,
      f, e, sent: st.sent,
      setNom: set('nom'), setTel: set('tel'), setEmail: set('email'), setSec: set('sec'), setCp: set('cp'), setVille: set('ville'), setMsg: set('msg'),
      setModel: ev => this.setState({ len: ev.target.value }),
      submit: ev => {
        ev.preventDefault();
        const ok = !bad.nom && !bad.tel && !bad.email && !bad.msg;
        this.setState({ tried: true, sent: ok });
      },
      assoc: [
        { n:'Réfrigérée Centrale', s:'Exposition centrale, vitrages coulissants des 2 côtés, profondeur 60 cm.', t:'+2/+8 ou +14/+18 °C' },
        { n:'Réfrigérée Plane', s:'Exposition à hauteur du plan de travail, profondeur 53 ou 60 cm.', t:'+2/+8 ou +14/+18 °C' },
        { n:'Réfrigérée Vision', s:'Exposition 8 cm sous le plan de travail, profondeur 53 ou 60 cm.', t:'+2/+8 ou +14/+18 °C' },
        { n:'Comptoir caisse', s:'Tout commerce, avec ou sans tablette PMR.', t:'Neutre' }
      ]
    };
  }
}
</script>
