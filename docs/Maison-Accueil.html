<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maison — Accueil</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&amp;family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
.m{--iv:#FBF7F2;--iv2:#F4EDE4;--pi:#C9D8B6;--ro:#EBC9C6;--pr:#3B2A26;--go:#B8955A;--mu:#6A5550;font-family:'Karla',system-ui,sans-serif;color:var(--pr);background:var(--iv);line-height:1.6;font-size:16px;overflow-x:hidden}
.m *,.m *::before,.m *::after{box-sizing:border-box}
.m img{display:block;max-width:100%}
.m a{color:inherit}
.m p{margin:0}
.disp{font-family:'Gilda Display',Georgia,serif;font-weight:400;line-height:1.04;letter-spacing:-.005em;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
.kick{display:inline-flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--mu);margin:0}
.kick::before{content:"";width:28px;height:1px;background:var(--go);flex:none}
.lead{font-size:18px;color:var(--mu);max-width:620px}
.h2{font-size:clamp(36px,4.4vw,64px);overflow-wrap:anywhere}
.h3{font-size:clamp(26px,2.6vw,36px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border-radius:999px;font:700 14px/1 'Karla',sans-serif;letter-spacing:.06em;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:transform .35s cubic-bezier(.2,.7,.2,1),background .35s,box-shadow .35s,color .35s;white-space:nowrap}
.btn-red{background:var(--accent);color:#fff}
.btn-red:hover{transform:translateY(-2px);box-shadow:0 14px 28px -14px var(--accent)}
.btn-line{border-color:var(--pr);color:var(--pr);background:transparent}
.btn-line:hover{background:var(--pr);color:var(--iv)}
.m :focus-visible{outline:2px solid var(--pr);outline-offset:3px}
.tb{background:var(--pr);color:#F3EAE0;font-size:13px}
.tb .wrap{display:flex;justify-content:space-between;align-items:center;gap:8px 20px;min-height:40px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.tb a{color:#F3EAE0;text-decoration:none}
.tb a:hover{text-decoration:underline}
.tb-r{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hd{border-bottom:1px solid var(--go);background:var(--iv);position:relative;z-index:30}
.hd .wrap{display:flex;align-items:center;gap:24px;min-height:88px}
.logo{display:inline-flex;flex-direction:column;align-items:center;text-decoration:none;padding:7px 2px;border-top:1px solid var(--go);border-bottom:1px solid var(--go);line-height:1;flex:none}
.logo b{font-family:'Gilda Display',serif;font-weight:400;font-size:30px;letter-spacing:.3em;margin-right:-.3em}
.logo small{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;margin-top:6px;font-weight:700;margin-right:-.34em}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{position:relative;text-decoration:none;font-size:15px;padding:0 14px;min-height:44px;display:inline-flex;align-items:center}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:1px;background:var(--go);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.hd-tel{font-weight:700;text-decoration:none;font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.burger{display:none;width:48px;height:48px;border:1px solid var(--pr);border-radius:50%;background:transparent;color:var(--pr);align-items:center;justify-content:center;cursor:pointer}
@media(max-width:1060px){.nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--iv);border-bottom:1px solid var(--go);padding:8px 24px 20px}.hd-tel{display:none}.hd-cta{margin-left:auto}.burger{display:inline-flex}}
@media(max-width:700px){.wrap{padding:0 16px}}
@media(max-width:560px){.hd-cta{display:none}.burger{margin-left:auto}}
.rib{position:relative;height:60px;display:flex;align-items:center;justify-content:center;--rc:var(--pi);--bc:var(--ro)}
.rib.ro{--rc:var(--ro);--bc:var(--pi)}
.rib::before{content:"";position:absolute;left:0;right:0;top:23px;height:14px;background:var(--rc);border-top:1px solid var(--go);border-bottom:1px solid var(--go)}
.bow{position:relative;width:100px;height:50px;animation:bowSway 7s ease-in-out infinite;transform-origin:50% 40%}
.bow g{fill:var(--bc);stroke:var(--go);stroke-width:1}
@keyframes bowSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.ft{background:var(--pr);color:#EFE6DC}
.ft-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:40px;padding:72px 0 48px}
.ft h4{font-family:'Gilda Display',serif;font-weight:400;font-size:21px;margin:0 0 16px;color:#fff}
.ft p{font-size:15px;margin-bottom:12px}
.ft a{color:#EFE6DC;text-decoration:none}
.ft a:hover{color:#fff;text-decoration:underline}
.ft ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ft li a{display:inline-flex;min-height:32px;align-items:center}
.ft .logo{color:#fff;margin-bottom:18px}
.ft-b{border-top:1px solid rgba(184,149,90,.55);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:22px 0 30px;font-size:13px;color:#D6C9BD}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.48s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid rgba(59,42,38,.28);border-radius:999px;font-size:14px;text-decoration:none;background:#fff;transition:background .3s,border-color .3s,transform .3s}
.chip:hover{background:var(--ro);border-color:var(--go);transform:translateY(-2px)}
.lnk{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-weight:700;text-decoration:none;border-bottom:1px solid var(--go)}
.lnk svg{transition:transform .35s}
.lnk:hover svg{transform:translateX(5px)}
.scf{position:relative;background:var(--sf,#fff);padding:16px}
.sc{position:absolute;pointer-events:none}
.sc-t{left:0;right:0;top:-11px;height:12px;background:radial-gradient(circle at 12px 12px,var(--sf,#fff) 11.5px,transparent 12px) 0 0/24px 12px repeat-x}
.sc-b{left:0;right:0;bottom:-11px;height:12px;background:radial-gradient(circle at 12px 0,var(--sf,#fff) 11.5px,transparent 12px) 0 0/24px 12px repeat-x}
.sc-l{top:0;bottom:0;left:-11px;width:12px;background:radial-gradient(circle at 12px 12px,var(--sf,#fff) 11.5px,transparent 12px) 0 0/12px 24px repeat-y}
.sc-r{top:0;bottom:0;right:-11px;width:12px;background:radial-gradient(circle at 0 12px,var(--sf,#fff) 11.5px,transparent 12px) 0 0/12px 24px repeat-y}
.sec{padding:110px 0}
.sec-h{display:grid;gap:18px;margin-bottom:56px;max-width:780px}
.alt{background:var(--iv2)}

/* hero */
.hero{position:relative;padding:72px 0 110px;overflow:hidden}
.hero-disc{position:absolute;right:-180px;top:40px;width:760px;height:760px;border-radius:50%;background:var(--pi);opacity:.38}
.hero-disc::after{content:"";position:absolute;inset:40px;border-radius:50%;border:1px solid var(--go)}
.hero-g{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center}
.h1{font-size:clamp(44px,5.6vw,86px);overflow-wrap:anywhere;margin:22px 0 26px}
.hl{position:relative;white-space:nowrap}
.hl::after{content:"";position:absolute;left:0;right:0;bottom:.06em;height:.16em;background:var(--ro);z-index:-1;transform-origin:left;animation:hlIn 1.2s cubic-bezier(.2,.7,.2,1) 1.4s both}
@keyframes hlIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero-t{position:relative;z-index:1}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.hero-facts{display:flex;gap:0;margin-top:48px;border-top:1px solid var(--go);border-bottom:1px solid var(--go)}
.hero-facts div{flex:1;padding:18px 12px 16px;display:grid;gap:4px}
.hero-facts div+div{border-left:1px solid var(--go)}
.hero-facts b{font-size:38px;line-height:1}
.hero-facts span{font-size:13px;color:var(--mu);font-weight:600}
.stage{position:relative;max-width:520px;width:100%;margin:0 auto;padding:22px}
.napperon{--sf:#fff;background:radial-gradient(circle,var(--iv) 1.7px,transparent 2.2px) 0 0/12px 12px,#fff;filter:drop-shadow(0 34px 40px rgba(59,42,38,.16))}
.win{position:relative;height:560px;overflow:hidden;border:1px solid var(--go);background:var(--ro)}
.win img{width:100%;height:560px;object-fit:cover}
.lid{position:absolute;top:0;bottom:0;width:50.5%;z-index:3;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,transparent 1px 10px);display:flex;flex-direction:column;justify-content:flex-start;padding-top:70px}
.lid-l{left:0;align-items:flex-end;padding-right:40px;box-shadow:inset -1px 0 0 var(--go)}
.lid-r{right:0;align-items:flex-start;padding-left:40px;box-shadow:inset 1px 0 0 var(--go)}
.lid::before{content:"";position:absolute;top:0;bottom:0;width:18px;background:var(--rb)}
.lid-l::before{right:0;border-left:1px solid var(--go)}
.lid-r::before{left:0;border-right:1px solid var(--go)}
.lid::after{content:"";position:absolute;left:0;right:0;top:270px;height:36px;background:var(--rb);border-top:1px solid var(--go);border-bottom:1px solid var(--go)}
.mono{font-size:96px;line-height:.9;letter-spacing:.08em}
.lid-cap{font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;margin-top:14px}
.lid-foot{position:absolute;bottom:34px;font-size:12px;font-weight:600;letter-spacing:.06em}
.lid-l .lid-foot{right:40px}
.lid-r .lid-foot{left:40px}
.hbow{position:absolute;left:50%;top:288px;width:170px;height:86px;z-index:4;transform:translate(-50%,-50%)}
.hbow g{fill:var(--bc);stroke:var(--go);stroke-width:1}
@keyframes lidL{0%{transform:none}14%{transform:translateX(5px)}100%{transform:translateX(-104%)}}
@keyframes lidR{0%{transform:none}14%{transform:translateX(-5px)}100%{transform:translateX(104%)}}
@keyframes lidLb{0%{transform:none}14%{transform:translateX(5px)}100%{transform:translateX(-104%)}}
@keyframes lidRb{0%{transform:none}14%{transform:translateX(-5px)}100%{transform:translateX(104%)}}
@keyframes bowOff{0%{transform:translate(-50%,-50%) scale(1)}35%{transform:translate(-50%,-56%) scale(1.1) rotate(-6deg)}100%{transform:translate(-50%,-260%) scale(.5) rotate(18deg);opacity:0}}
@keyframes bowOffb{0%{transform:translate(-50%,-50%) scale(1)}35%{transform:translate(-50%,-56%) scale(1.1) rotate(-6deg)}100%{transform:translate(-50%,-260%) scale(.5) rotate(18deg);opacity:0}}
@keyframes kb{from{transform:scale(1.18)}to{transform:scale(1)}}
@keyframes kbb{from{transform:scale(1.18)}to{transform:scale(1)}}
.tag{position:absolute;left:-14px;bottom:96px;z-index:6;background:var(--iv);border:1px solid var(--go);padding:14px 18px 14px 34px;font-size:13px;line-height:1.45;transform:rotate(-5deg);box-shadow:0 18px 30px -18px rgba(59,42,38,.4);animation:tagIn 1s cubic-bezier(.3,1.5,.5,1) 2.4s both}
.tag::before{content:"";position:absolute;left:13px;top:50%;width:9px;height:9px;margin-top:-5px;border-radius:50%;border:1px solid var(--go);background:#fff}
.tag b{font-family:'Gilda Display',serif;font-weight:400;font-size:20px}
@keyframes tagIn{from{opacity:0;transform:rotate(-14deg) translateY(-20px)}to{opacity:1;transform:rotate(-5deg)}}
.replay{display:flex;align-items:center;gap:10px;margin:30px auto 0;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid rgba(59,42,38,.3);background:var(--iv);color:var(--pr);font:600 14px 'Karla',sans-serif;cursor:pointer;transition:border-color .3s,background .3s}
.replay:hover{border-color:var(--go);background:#fff}
.replay svg{transition:transform .6s}
.replay:hover svg{transform:rotate(-180deg)}
@media(max-width:960px){.hero-g{grid-template-columns:1fr}.hero-disc{width:520px;height:520px;right:-200px;top:auto;bottom:40px}}
@media(max-width:560px){.win,.win img{height:440px}.mono{font-size:64px}.lid{padding-top:50px}.lid::after{top:210px}.hbow{top:228px;width:130px;height:66px}.lid-l{padding-right:28px}.lid-r{padding-left:28px}.tag{left:0;bottom:84px}}

/* carte des lignes */
.cl-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:start}
@media(max-width:960px){.cl-g{grid-template-columns:1fr}}
.carte{background:#fff;border:1px solid var(--go);padding:9px;box-shadow:0 30px 60px -40px rgba(59,42,38,.35)}
.carte-in{border:1px solid var(--go);padding:40px 30px 34px;text-align:center}
.carte-k{font-size:12px;letter-spacing:.4em;text-transform:uppercase;font-weight:700;color:var(--mu)}
.carte-t{font-size:clamp(30px,3vw,42px);margin:10px 0 6px}
.orn{display:block;width:120px;height:14px;margin:0 auto 26px}
.orn path{fill:none;stroke:var(--go);stroke-width:1}
.c-item{display:grid;grid-template-columns:34px auto 1fr auto;align-items:baseline;column-gap:12px;width:100%;background:transparent;border:0;padding:14px 18px;font:inherit;color:inherit;cursor:pointer;text-align:left;border-radius:30px;transition:background .35s;min-height:64px;margin-bottom:4px}
.c-item:hover{background:var(--iv2)}
.c-n{font-size:12px;font-weight:700;color:var(--mu)}
.c-nm{font-family:'Gilda Display',serif;font-size:24px;line-height:1.2}
.c-dots{border-bottom:1px dotted rgba(59,42,38,.45);transform:translateY(-6px)}
.c-pr{font-size:13px;font-weight:700;color:var(--mu);white-space:nowrap}
.c-sub{grid-column:2 / 5;font-size:14px;color:var(--mu);margin-top:2px}
.carte-f{margin-top:22px;padding-top:18px;border-top:1px solid var(--go);font-size:13px;color:var(--mu);font-weight:600;letter-spacing:.04em}
.cl-p{display:grid;gap:22px;padding-top:6px}
.vt{position:relative;height:270px;width:100%;max-width:470px;margin:0 auto 6px}
.vt-glass{position:absolute;left:9%;right:9%;top:16px;height:96px;border:1.5px solid var(--pr);border-bottom:0;background:rgba(255,255,255,.6);transition:border-radius .6s cubic-bezier(.2,.7,.2,1),opacity .4s}
.vt-cakes{position:absolute;left:14%;right:14%;top:70px;height:40px;display:flex;justify-content:space-around;align-items:flex-end;transition:opacity .4s}
.vt-cakes i{display:block;width:30px;height:24px;border-radius:7px 7px 2px 2px;background:var(--ro);border:1px solid rgba(59,42,38,.35)}
.vt-cakes i:nth-child(2n){background:var(--pi);height:30px}
.vt-cakes i:nth-child(3n){background:#E9D6B4;border-radius:50% 50% 3px 3px}
.vt-top{position:absolute;left:4%;right:4%;top:112px;height:14px;background:var(--top);border:1px solid var(--pr);transition:background .6s}
.vt-body{position:absolute;left:6%;right:6%;top:126px;height:112px;background:var(--body);border:1px solid var(--pr);border-top:0;padding:14px;display:flex;transition:background .6s}
.vt-front{flex:1;background:var(--front);border:1px solid rgba(59,42,38,.3)}
.vt-pl{position:absolute;left:6%;right:6%;top:238px;height:16px;background:var(--pl);border:1px solid var(--pr);border-top:0;transition:background .6s}
.vt-sh{position:absolute;left:2%;right:2%;top:256px;height:10px;border-radius:50%;background:rgba(59,42,38,.12)}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));border-top:1px solid var(--go)}
.specs div{padding:14px 0 12px;border-bottom:1px solid rgba(184,149,90,.6);padding-right:16px}
.specs span{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--mu)}
.specs b{font-weight:500;font-size:16px}
.more{font-size:14px;color:var(--mu)}

/* secteurs macarons */
.sx-g{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;align-items:start}
@media(max-width:960px){.sx-g{grid-template-columns:1fr}}
.mbox{background:#fff;border:1px solid var(--go);outline:1px solid var(--go);outline-offset:-9px;padding:34px 26px}
.macs{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:14px 6px}
.mac{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;background:none;border:0;padding:10px 4px 12px;cursor:pointer;font:inherit;color:inherit;min-height:44px}
.mac-b{position:relative;width:74px;height:60px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.mac:hover .mac-b{transform:translateY(-6px) rotate(-5deg)}
.mac-b i{position:absolute;display:block}
.mac-b .t{left:0;right:0;top:0;height:25px;background:var(--c);border-radius:37px 37px 30px 30px / 22px 22px 7px 7px;box-shadow:inset 0 5px 6px rgba(255,255,255,.4),inset 0 -2px 0 rgba(59,42,38,.08)}
.mac-b .b{left:0;right:0;bottom:0;height:24px;background:var(--c);border-radius:30px 30px 37px 37px / 7px 7px 22px 22px;box-shadow:inset 0 -4px 6px rgba(59,42,38,.1)}
.mac-b .p1,.mac-b .p2{left:3px;right:3px;height:5px;background:radial-gradient(circle,var(--c) 2px,transparent 2.6px) 0 0/5px 5px}
.mac-b .p1{top:22px}.mac-b .p2{bottom:21px}
.mac-b .f{left:6px;right:6px;top:25px;height:11px;background:var(--f);border-radius:6px}
.mac-ring{position:absolute;left:50%;top:66px;width:70px;height:10px;margin-left:-35px;border-radius:50%;border:1px solid var(--go);transition:opacity .35s,transform .45s}
.mac-nm{font-size:13.5px;font-weight:600;text-align:center;line-height:1.25;padding-bottom:2px;border-bottom:1px solid transparent;transition:border-color .3s}
.sx-p{position:relative;padding:38px 34px;background:var(--iv);border:1px solid var(--go)}
.sx-sw{width:54px;height:54px;border-radius:50%;border:1px solid var(--go);margin-bottom:18px}
.temp{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border-radius:999px;background:var(--pi);font-weight:700;font-size:15px;margin:18px 0}
.sx-note{font-size:14px;color:var(--mu);margin:14px 0 18px}

/* process */
.steps{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:28px}
.steps::before{content:"";position:absolute;left:40px;right:40px;top:39px;height:10px;background:var(--pi);border-top:1px solid var(--go);border-bottom:1px solid var(--go)}
@media(max-width:1100px){.steps::before{display:none}}
.step{position:relative;padding:0 6px;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.step:hover{transform:translateY(-6px)}
.num{position:relative;width:88px;height:88px;border-radius:50%;background:var(--iv);border:1px solid var(--go);display:flex;align-items:center;justify-content:center;font-family:'Gilda Display',serif;font-size:34px;margin-bottom:26px;transition:background .4s}
.num::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid var(--go)}
.step:hover .num{background:var(--ro)}
.step h3{font-family:'Gilda Display',serif;font-weight:400;font-size:28px;margin:0 0 10px}
.step p{color:var(--mu);font-size:15.5px}

/* realisations vedette */
.rv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:28px}
.rv-c{display:block;text-decoration:none;background:#fff;border:1px solid var(--go);padding:10px 10px 22px;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s}
.rv-c:hover{transform:translateY(-8px);box-shadow:0 30px 50px -34px rgba(59,42,38,.45)}
.rv-im{position:relative;height:300px;overflow:hidden}
.rv-im img{width:100%;height:300px;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.rv-c:hover .rv-im img{transform:scale(1.07)}
.rv-rb{position:absolute;top:0;bottom:0;right:26px;width:16px;background:var(--ro);border-left:1px solid var(--go);border-right:1px solid var(--go);transform:translateY(-101%);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.rv-c:hover .rv-rb{transform:none}
.rv-il{position:absolute;left:10px;bottom:10px;background:var(--iv);font-size:11px;padding:4px 8px;font-weight:600}
