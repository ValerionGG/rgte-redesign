<style>
body{margin:0;background:#F5F2EC}
sc-for,sc-if{display:contents}
.rg{--red:#D42A20;--redd:#B8231A;--paper:#F5F2EC;--ink:#121212;--pink:#F2D6D0;--line:2px solid #121212;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.rg *,.rg *::before,.rg *::after{box-sizing:border-box}
.rg a{color:inherit}
.rg img{display:block;max-width:100%}
.rg button{font:inherit;color:inherit;cursor:pointer;border-radius:0}
.rg h1,.rg h2,.rg h3,.rg p{margin:0}
.d{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-stretch:75%;font-variation-settings:"wdth" 75,"opsz" 96;font-weight:800;letter-spacing:-.025em;line-height:.88}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s9{grid-column:span 9}.s12{grid-column:1/-1}
.ey{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.redt{color:var(--redd)}
.top{background:var(--ink);color:var(--paper);font-size:13px}
.top-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:44px}
.top a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;min-height:44px}
.top a:hover{text-decoration:underline}
.hd{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:var(--line)}
.hd-in{display:flex;align-items:center;gap:24px;min-height:84px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
.logo-w{background:var(--red);color:#fff;font-size:34px;padding:9px 10px 5px;line-height:.9;letter-spacing:-.01em}
.logo-s{font-size:12px;font-weight:700;line-height:1.15;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;gap:2px;margin-left:auto}
.nl{display:flex;align-items:baseline;gap:6px;padding:12px;min-height:44px;text-decoration:none;font-weight:600;font-size:15px;position:relative}
.nl span{font-size:11px;color:var(--redd);font-weight:700}
.nl::after{content:"";position:absolute;left:12px;right:12px;bottom:6px;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.7,0,.2,1)}
.nl:hover::after,.nl[aria-current="page"]::after{transform:scaleX(1)}
.tel{display:flex;align-items:center;gap:10px;text-decoration:none;min-height:44px}
.tel b{display:block;font-size:16px;line-height:1.1}
.tel small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--redd);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 22px;font-weight:600;font-size:15px;text-decoration:none;border:2px solid var(--ink);background:transparent;color:var(--ink);transition:background .25s,color .25s,border-color .25s;white-space:nowrap}
.btn svg{transition:transform .3s}
.btn:hover svg{transform:translateX(4px)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-red:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-paper{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.btn-paper:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.burger{display:none;width:48px;height:48px;border:2px solid var(--ink);background:transparent;align-items:center;justify-content:center;margin-left:auto}
.mnav{display:none}
.rg :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.on-red :focus-visible{outline-color:#fff}
.ft{background:var(--ink);color:var(--paper);padding-top:72px;overflow:hidden}
.ft-top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.ft-claim{font-size:clamp(32px,4vw,56px);max-width:720px}
.ft-big{color:var(--red);font-size:clamp(96px,38vw,560px);line-height:.74;letter-spacing:-.04em;margin:56px 0 0 -.03em;overflow-wrap:anywhere}
.ft-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:32px;padding:48px 0;border-top:1px solid #3a3a3a;margin-top:40px}
.ft-h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#bdb8b0;margin-bottom:14px!important;font-weight:700}
.ft p{font-size:15px}
.ft-tel{font-size:36px;text-decoration:none;color:#fff}
.ft-mut{color:#bdb8b0;margin-top:8px!important}
.ft-l a{display:flex;align-items:center;min-height:44px;text-decoration:none;font-size:15px;border-bottom:1px solid #2a2a2a;transition:padding .2s}
.ft-l a:hover{color:#fff;padding-left:6px}
.ft-b{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:16px 0 24px;border-top:1px solid #3a3a3a;font-size:13px;color:#bdb8b0}
.ft-b a{min-height:44px;display:inline-flex;align-items:center}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes up{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.dl2{animation-delay:.16s}

/* réalisations */
.ph{padding:48px 0 40px;align-items:end}
.crumb{display:flex;gap:10px;font-size:13px;font-weight:600;margin-bottom:24px}
.crumb a{text-decoration:none;border-bottom:2px solid var(--red)}
.ph-t{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;animation:up 1s cubic-bezier(.7,0,.2,1) both}
.ph-n{font-size:clamp(120px,19vw,300px);line-height:.76;color:var(--red)}
.ph-w{font-size:clamp(56px,8vw,128px);line-height:.8;padding-bottom:.06em}
.feat{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);border:var(--line);animation:wipe .7s cubic-bezier(.7,0,.2,1) both}
.feat-img{position:relative;overflow:hidden;background:var(--ink);border-right:var(--line)}
.feat-img img{width:100%;height:520px;object-fit:cover;animation:kb 14s ease-in-out infinite alternate}
.feat-img small{position:absolute;left:0;bottom:0;background:var(--paper);font-size:12px;font-weight:600;padding:6px 10px}
.feat-i{background:var(--red);color:#fff;padding:28px;display:flex;flex-direction:column;gap:16px}
.feat-n{font-size:clamp(110px,12vw,190px);line-height:.78}
.feat-t{font-size:clamp(36px,3.6vw,58px)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.6);font-size:15px}
.kv span:first-child{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips a{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:2px solid #fff;text-decoration:none;font-size:14px;font-weight:600;transition:background .2s,color .2s}
.mchips a:hover{background:#fff;color:var(--ink)}
.nav2{display:flex;gap:8px;margin-top:auto}
.nav2 button{width:52px;height:52px;border:2px solid #fff;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.nav2 button:hover{background:#fff;color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;padding:28px 0 20px;border-bottom:var(--line);margin-top:56px;position:sticky;top:86px;background:var(--paper);z-index:5}
.fgrp{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{min-height:44px;padding:0 14px;border:2px solid var(--ink);background:transparent;font-size:14px;font-weight:600;transition:background .2s,color .2s}
.fchip:hover{background:var(--pink)}
.fchip span{font-size:12px;margin-left:6px;opacity:.8}
.cnt{font-size:clamp(40px,4vw,64px);line-height:.9}
.toggle{display:flex;border:2px solid var(--ink)}
.toggle button{min-height:44px;padding:0 14px;border:0;background:transparent;font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:24px;padding-top:28px}
.card{display:flex;flex-direction:column;width:100%;border:var(--line);background:var(--paper);padding:0;text-align:left;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.card:hover{transform:translateY(-6px)}
.card-img{position:relative;overflow:hidden;border-bottom:var(--line);background:var(--ink)}
.card-img img{width:100%;height:260px;object-fit:cover;transition:transform 1s cubic-bezier(.2,.8,.2,1),filter .5s;filter:grayscale(.2)}
.card:hover .card-img img{transform:scale(1.07);filter:none}
.card-n{position:absolute;left:0;top:0;background:var(--red);color:#fff;font-size:40px;padding:8px 12px 2px;line-height:.9}
.card-b{padding:16px;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:background .3s,color .3s}
.card:hover .card-b{background:var(--pink)}
.card-t{font-size:30px;line-height:.95}
.card-l{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:13px;font-weight:700}
.tagl{background:var(--ink);color:var(--paper);padding:3px 8px;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.list{border-top:var(--line);margin-top:28px}
.lrow{display:grid;grid-template-columns:64px minmax(0,2fr) minmax(0,1.2fr) minmax(0,.8fr) minmax(0,2.4fr);gap:16px;align-items:center;width:100%;min-height:76px;padding:10px 16px;border:0;border-bottom:var(--line);background:transparent;text-align:left;transition:background .2s,color .2s}
.lrow:hover{background:var(--pink)}
.lrow b{font-size:30px}
.empty{padding:56px 24px;border:var(--line);border-top:0;text-align:center}
.empty b{display:block;font-size:48px;margin-bottom:12px}
.band{background:var(--red);color:#fff;margin-top:104px;padding:72px 0}
.band-t{font-size:clamp(48px,7vw,112px);line-height:.84}
@media (max-width:1100px){.nav,.tel,.hd-in>.btn{display:none}.burger{display:flex}.mnav{display:grid;border-top:var(--line)}.mnav a{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 24px;border-bottom:1px solid var(--ink);text-decoration:none;font-weight:600;font-size:18px}.bar{position:static}}
@media (max-width:900px){.g12>*{grid-column:1/-1}.feat{grid-template-columns:1fr}.feat-img{border-right:0;border-bottom:var(--line)}.feat-img img{height:340px}.lrow{grid-template-columns:48px 1fr}.lrow span:nth-child(n+3){grid-column:2}}
@media (max-width:640px){.top-r{display:none}}
@media (prefers-reduced-motion:reduce){.rg *{animation:none!important;transition:none!important}}
</style>
</helmet>
