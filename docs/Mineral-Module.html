<body>

<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap">
<style>
body{margin:0;background:#F4F2EE}
sc-for,sc-if{display:contents}
.mn{--g:#F4F2EE;--s:#E6E2DB;--s2:#DAD5CC;--ink:#2B2926;--mu:#6E6A63;--mu2:#5C5852;--gl:#C9D3D6;--ln:rgba(43,41,38,.16);--ln2:rgba(43,41,38,.08);background:var(--g);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mn *,.mn *::before,.mn *::after{box-sizing:border-box}
.mn img{display:block;max-width:100%}
.mn a{color:inherit}
.mn :focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px}
.sf{font-family:'Newsreader',Georgia,serif;font-weight:300}
.sc{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--mu)}
.no{font-family:'Newsreader',Georgia,serif;font-variant-caps:all-small-caps;letter-spacing:.14em;font-size:18px;color:var(--mu)}
.strip{border-bottom:1px solid var(--ln2);font-size:13px;color:var(--mu)}
.strip-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:44px}
.strip a{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px;min-height:44px}
.strip a:hover{color:var(--red)}
.hd{position:sticky;top:0;z-index:30;background:rgba(244,242,238,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln2)}
.hd-in{display:flex;align-items:center;justify-content:space-between;gap:24px;height:84px}
.logo{display:inline-flex;align-items:center;gap:14px;text-decoration:none;min-height:44px}
.logo-w{font-weight:600;font-size:19px;letter-spacing:.34em;position:relative}
.logo-w::after{content:"";position:absolute;right:-1px;top:0;width:5px;height:5px;background:var(--red)}
.logo-s{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:15px;color:var(--mu);padding-left:14px;border-left:1px solid var(--ln)}
.nav{display:flex;gap:2px}
.nav a{position:relative;text-decoration:none;font-size:15px;padding:0 14px;min-height:44px;display:inline-flex;align-items:center}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.nav a:hover::after{transform:scaleX(1)}
.nav a.on::after{transform:scaleX(1);background:var(--red)}
.hd-r{display:flex;align-items:center;gap:20px}
.tel{text-decoration:none;display:flex;flex-direction:column;line-height:1.25;min-height:44px;justify-content:center;font-size:15px;font-weight:500}
.tel small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;font:500 15px/1 'Hanken Grotesk',sans-serif;text-decoration:none;cursor:pointer;transition:background .35s,color .35s,border-color .35s,transform .35s,box-shadow .35s;white-space:nowrap}
.btn svg{transition:transform .35s}
.btn:hover svg{transform:translateX(4px)}
.btn-r{background:var(--red);color:#fff}
.btn-r:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px var(--red)}
.btn-o{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-o:hover{background:var(--ink);color:var(--g)}
.burger{display:none;width:48px;height:48px;border-radius:999px;border:1px solid var(--ln);background:transparent;color:var(--ink);align-items:center;justify-content:center;cursor:pointer}
.mnav{display:flex;flex-direction:column;padding:8px 20px 28px;border-top:1px solid var(--ln2)}
.mnav a{font-family:'Newsreader',Georgia,serif;font-size:26px;font-weight:300;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--ln2);min-height:44px}
.h1{font-family:'Newsreader',Georgia,serif;font-weight:300;letter-spacing:-.025em;line-height:.98;margin:0;overflow-wrap:anywhere}
.h2{font-family:'Newsreader',Georgia,serif;font-weight:300;letter-spacing:-.02em;line-height:1.04;margin:0;font-size:clamp(34px,4.4vw,64px);overflow-wrap:anywhere}
.h1 em,.h2 em{font-style:italic}
.lead{font-size:18px;line-height:1.65;color:var(--mu);max-width:560px;margin:0}
.ft{background:var(--s);padding:96px 0 0;border-top:1px solid var(--ln2)}
.ft-cta{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;padding-bottom:72px;border-bottom:1px solid var(--ln)}
.ft-cta .h2{max-width:780px}
.ft-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px;padding:56px 0}
.ft-g h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--mu2);margin:0 0 14px}
.ft-g p{margin:0;font-size:15px;line-height:1.7}
.ft-l a{display:flex;align-items:center;min-height:44px;text-decoration:none;font-size:15px;border-bottom:1px solid var(--ln2);transition:color .3s,padding .4s}
.ft-l a:hover{color:var(--red);padding-left:6px}
.ft-b{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;padding:14px 0 22px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu2)}
.ft-b a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center;color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rv{animation:rise 1.1s cubic-bezier(.2,.7,.1,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.5s}
@supports (animation-timeline: view()){.rs{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 80%}}
@media (max-width:1080px){.nav,.tel{display:none}.burger{display:inline-flex}}
@media (min-width:1081px){.mnav{display:none}}
@media (max-width:720px){.wrap{padding:0 20px}.hd-in{height:72px}.ft{padding-top:64px}}
@media (max-width:520px){.hd-r .btn{display:none}.logo-s{display:none}}

.t-corian{background:#F6F4F0 url(assets/marble-white.webp) center/cover}
.t-autre{background-color:#CBC4B8;background-image:repeating-linear-gradient(45deg,rgba(43,41,38,.16) 0 1px,transparent 1px 8px)}
.tx{position:absolute;inset:0;transition:opacity .9s cubic-bezier(.2,.7,.1,1)}

.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:26px 0 0;font-size:13px;color:var(--mu)}
.crumb a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.crumb a:hover{color:var(--red)}
.cfg{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:56px;align-items:start;padding:24px 0 104px}
.vis{position:sticky;top:108px}
.stg{position:relative;height:540px;background:var(--s);overflow:hidden}
.stg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(43,41,38,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(43,41,38,.05) 1px,transparent 1px);background-size:40px 40px}
.stg-tl{position:absolute;left:22px;top:20px;display:flex;align-items:center;gap:10px;z-index:3}
.stg-tr{position:absolute;right:22px;top:22px;z-index:3;text-align:right}
.stg-b{position:absolute;left:22px;right:22px;bottom:18px;display:flex;justify-content:space-between;gap:12px;z-index:3;font-size:12px;color:var(--mu2)}
.thermo{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--g);border:1px solid var(--ln);font-size:14px;font-weight:500}
.thermo i{display:block;width:10px;height:10px;border-radius:50%;transition:background .6s}
.cv-w{position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center;transform-origin:50% 0}
.cv{position:relative;height:330px;transition:width 1.1s cubic-bezier(.2,.7,.1,1)}
.cv-hood{position:absolute;left:6px;right:6px;top:0;height:62px;border:1px solid var(--ink);border-bottom:0;border-radius:3px 3px 0 0;overflow:hidden;transition:background 1s}
.cv-mid{position:absolute;left:50%;top:6px;bottom:0;border-left:1px dashed rgba(43,41,38,.45)}
.cv-sheen{position:absolute;top:-20px;bottom:-20px;width:26px;background:rgba(255,255,255,.55);transform:skewX(-24deg);left:-60px;animation:sheen 6s 1s ease-in-out infinite}
@keyframes sheen{0%{left:-60px}55%,100%{left:110%}}
.cv-pil{position:absolute;top:0;width:11px;height:62px;overflow:hidden;border:1px solid var(--ink);z-index:2}
.goods{position:absolute;left:18px;right:18px;bottom:0;height:30px;display:flex;align-items:flex-end;gap:10px;overflow:hidden;transition:opacity .8s}
.g-dome{flex:none;width:34px;height:20px;border-radius:20px 20px 0 0;background:#EFE9DF;border:1px solid var(--ink);border-bottom:0}
.g-tart{flex:none;width:40px;height:9px;border-radius:2px;background:#EFE9DF;border:1px solid var(--ink);border-bottom:0}
.g-mac{flex:none;width:14px;height:9px;border-radius:6px;background:#EFE9DF;border:1px solid var(--ink)}
.g-cake{flex:none;width:30px;height:18px;background:#EFE9DF;border:1px solid var(--ink);border-bottom:0;box-shadow:inset 0 6px 0 -5px var(--ink)}
.g-bon{flex:none;width:12px;height:11px;border-radius:3px;background:#5B4636;border:1px solid var(--ink)}
.g-ball{flex:none;width:12px;height:12px;border-radius:50%;background:#6E5543;border:1px solid var(--ink)}
.g-bar{flex:none;width:28px;height:8px;border-radius:1px;background:#4E3B2E;border:1px solid var(--ink)}
.cv-top{position:absolute;left:0;right:0;top:62px;height:18px;overflow:hidden;border:1px solid rgba(43,41,38,.5);z-index:2}
.cv-top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(43,41,38,.08));z-index:2}
.cv-ped{position:absolute;left:16px;right:16px;top:80px;height:170px;overflow:hidden;border:1px solid rgba(43,41,38,.35);border-top:0}
.cv-ped::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(43,41,38,.18),rgba(43,41,38,0) 22%)}
.cv-grille{position:absolute;left:50%;bottom:18px;width:64px;margin-left:-32px;height:14px;z-index:3;background:repeating-linear-gradient(90deg,rgba(43,41,38,.5) 0 1px,transparent 1px 6px)}
.cv-sock{position:absolute;left:26px;right:26px;top:250px;height:12px;background:#B9B2A7}
.cv-fl{position:absolute;left:-30px;right:-30px;top:252px;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(43,41,38,.28),rgba(43,41,38,0))}
.dim-h{position:absolute;left:0;right:0;top:288px;height:1px;background:var(--ink)}
.dim-h::before,.dim-h::after{content:"";position:absolute;top:-5px;width:1px;height:11px;background:var(--ink)}
.dim-h::before{left:0}.dim-h::after{right:0}
.dim-l{position:absolute;left:-40px;right:-40px;top:296px;text-align:center;font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:19px;white-space:nowrap}
.dim-v{position:absolute;right:-26px;width:1px;background:var(--ink)}
.dim-v::before,.dim-v::after{content:"";position:absolute;left:-4px;width:9px;height:1px;background:var(--ink)}
.dim-v::before{top:0}.dim-v::after{bottom:0}
.dim-vl{position:absolute;right:-74px;font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:15px;white-space:nowrap}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.pics div{height:200px;overflow:hidden}
.pics img{width:100%;height:200px;object-fit:cover;transition:transform 1.6s cubic-bezier(.2,.7,.1,1)}
.pics div:hover img{transform:scale(1.06)}
.pic-n{font-size:12px;color:var(--mu);margin:8px 0 0}
@media (max-width:1200px) and (min-width:981px){.cv-w{transform:scale(.82)}}
@media (max-width:980px){.cfg{grid-template-columns:1fr}.vis{position:relative;top:0}}
@media (max-width:700px){.stg{height:400px}.cv-w{transform:scale(.52);top:120px}.stg-tr{display:none}}

.pt{font-size:clamp(48px,5.6vw,88px);margin:12px 0 18px}
.grp{padding:24px 0;border-top:1px solid var(--ln)}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.grp-h b{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:400;font-size:17px}
.og{display:flex;flex-wrap:wrap;gap:8px}
.ob{min-width:64px;min-height:48px;padding:0 16px;border:1px solid var(--ln);border-radius:999px;background:transparent;font:500 15px/1 'Hanken Grotesk',sans-serif;color:var(--ink);cursor:pointer;transition:background .3s,color .3s,border-color .3s,transform .3s}
.ob:hover{border-color:var(--ink);transform:translateY(-2px)}
.inp-c{display:flex;align-items:center;gap:12px;margin-top:14px}
.inp-c label{font-size:14px;color:var(--mu)}
.inp-c input{width:140px;min-height:48px;border:0;border-bottom:1px solid var(--ink);background:transparent;font:400 20px 'Newsreader',Georgia,serif;color:var(--ink);padding:0 4px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:18px 18px 16px;border:1px solid var(--ln);transition:border-color .3s,background .3s}
.tb:hover{border-color:var(--ink)}
.tb b{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:30px;line-height:1.05}
.tb span{font-size:13px;color:var(--mu)}
.fin{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:8px 18px 8px 8px;border:1px solid var(--ln);min-height:64px;transition:border-color .3s,background .3s}
.fin:hover{border-color:var(--ink)}
.fin-s{position:relative;width:46px;height:46px;overflow:hidden;flex:none}
.fin-t{display:flex;flex-direction:column;line-height:1.3;font-size:15px}
.fin-t small{font-size:12px;color:var(--mu)}
.rc{margin-top:8px;background:#FBFAF8;border:1px solid var(--ln);padding:26px 26px 24px}
.rc dl{display:grid;grid-template-columns:120px 1fr;margin:14px 0 18px}
.rc dt,.rc dd{margin:0;padding:9px 0;border-bottom:1px solid var(--ln2);font-size:14px}
.rc dt{color:var(--mu)}
.price{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.price b{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:46px;line-height:1;letter-spacing:-.01em;transition:color .4s}
.price small{display:block;font-size:13px;color:var(--mu);margin-top:6px}

.sec{padding:112px 0;border-top:1px solid var(--ln2)}
.sec-s{background:var(--s)}
.sec-s .sc,.sec-s .no{color:var(--mu2)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--ln);margin:28px 0 40px;overflow-x:auto}
.tab{all:unset;box-sizing:border-box;position:relative;cursor:pointer;padding:0 28px 0 0;min-height:56px;display:inline-flex;align-items:center;font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:28px;white-space:nowrap;transition:color .3s}
.tab:hover{color:var(--ink)}
.tab-bar{position:absolute;left:0;right:28px;bottom:-1px;height:2px;background:var(--red);transform-origin:left;transition:transform .6s cubic-bezier(.2,.7,.1,1)}
.pane{animation:rise .7s cubic-bezier(.2,.7,.1,1) both}
.pane-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.pane p{font-size:18px;line-height:1.7;margin:0 0 18px}
.sp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);border-top:1px solid var(--ink)}
.sp dt,.sp dd{margin:0;padding:13px 0;border-bottom:1px solid var(--ln);font-size:15px}
.sp dt{color:var(--mu2);padding-right:16px}
.lr{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.lr-b{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--ln);min-height:56px;transition:background .3s,padding .4s}
.lr-b:hover{padding-left:12px}
.lr-b b{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:26px}
.lr-b span{font-size:14px}
.sec-v{background:var(--g);padding:20px;margin-top:20px}
@media (max-width:900px){.pane-g{grid-template-columns:1fr}.sec{padding:80px 0}}

.fm{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:64px;align-items:start}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:4px 28px}
.fd{display:flex;flex-direction:column;padding-top:14px}
.fd-w{grid-column:1/-1}
.fd label{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu2);font-weight:500}
.fd input,.fd select,.fd textarea{min-height:48px;border:0;border-bottom:1px solid rgba(43,41,38,.4);background:transparent;font:400 17px 'Hanken Grotesk',sans-serif;color:var(--ink);padding:8px 2px;border-radius:0;transition:border-color .3s}
.fd textarea{min-height:120px;resize:vertical}
.fd input:focus,.fd select:focus,.fd textarea:focus{outline:none;border-bottom-color:var(--ink);box-shadow:0 1px 0 var(--ink)}
.fd input[readonly]{color:var(--mu2)}
.err{font-size:13px;color:#B5231B;margin-top:6px}
.ok{padding:40px;background:var(--g);border:1px solid var(--ln);animation:rise .8s cubic-bezier(.2,.7,.1,1) both}
.ok-i{width:56px;height:56px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
@media (max-width:900px){.fm{grid-template-columns:1fr}}

.as{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:1px;background:var(--ln);border:1px solid var(--ln)}
.ac{display:flex;flex-direction:column;gap:14px;padding:26px;background:var(--g);text-decoration:none;min-height:220px;transition:background .4s}
.ac:hover{background:#FBFAF8}
.ac svg{transition:transform .7s cubic-bezier(.2,.7,.1,1)}
.ac:hover svg{transform:translateX(8px)}
.ac h3{font-size:28px;margin:0;line-height:1.05;transition:color .3s}
.ac:hover h3{color:var(--red)}
.ac p{margin:0;font-size:14px;color:var(--mu)}
@media (prefers-reduced-motion:reduce){.mn *{animation:none !important;transition:none !important}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4700},"accent":{"editor":"color","default":"#D42A20","options":["#D42A20","#2B2926","#9A7B4F"]}}'>

    const lenLabel = isSur ? (validC ? cNum + NB + 'cm — sur mesure' : 'Sur mesure') : s.len + NB + 'cm';

    const tempLabel = pat ? '+2' + NB + '°C / +8' + NB + '°C' : '+14' + NB + '°C / +18' + NB + '°C';

    const is101 = s.len === 101;
    const price101 = '5' + NB + '800,00' + NB + '€ HT';

    const sel = (on, st) => on ? st : '';
    const ON_PILL = 'background:#2B2926;color:#F4F2EE;border-color:#2B2926';
    const ON_CARD = 'border-color:#2B2926;background:#FBFAF8;box-shadow:inset 0 0 0 1px #2B2926';

    const lens = LENS.map(l => ({ label: l === 'sur' ? 'Sur mesure' : String(l), sel: s.len === l ? 'true' : 'false',
      st: sel(s.len === l, ON_PILL), pick: () => this.setState({ len:l }) }));
    const lrows = LENS.map(l => ({ label: l === 'sur' ? 'Sur mesure' : l + NB + 'cm',

      st: sel(s.len === l, 'background:#FBFAF8;padding-left:12px;box-shadow:inset 2px 0 0 ' + accent),
      pick: () => this.setState({ len:l }) }));

    const TABS = [['desc','Description'],['carac','Caractéristiques'],['dim','Dimensions']];
    const tabs = TABS.map(t => ({ label:t[1], sel: s.tab === t[0] ? 'true' : 'false',
      st: s.tab === t[0] ? 'color:#2B2926' : 'color:#5C5852',
      bar: s.tab === t[0] ? 'transform:scaleX(1)' : 'transform:scaleX(0)',
      pick: () => this.setState({ tab:t[0] }) }));

    const spec = [
      ['Piliers et plan de travail','Pierre acrylique blanche'],
      ['Pied','Monté sur pied en pierre acrylique blanche'],
      ['Groupe','Logé'],
      ['Froid','Ventilé'],

      ['Réserve réfrigérée','Sans'],
      ['Exposition en verre','81 × 60 cm'],
      ['Plages','+2 °C / +8 °C ou +14 °C / +18 °C'],
      ['Prix (101 cm)', '5 800,00 € HT']
    ].map(x => ({ k:x[0], v:x[1] }));

    const modelLabel = 'Gourmandise ' + lenLabel + ' · ' + tempLabel + ' · ' + finLabel;
    const emailOk = /\S+@\S+\.\S+/.test(s.f_email);
    const set = k => e => this.setState({ [k]: e.target.value });

    const assoc = [
      { n:'Plane', name:'Réfrigérée Plane', sub:'Exposition à hauteur du plan de travail · 53 ou 60 cm · +2/+8 ou +14/+18' },
      { n:'Vision', name:'Réfrigérée Vision', sub:'Exposition 8 cm sous le plan de travail · 53 ou 60 cm' },
      { n:'Centrale', name:'Réfrigérée Centrale', sub:'Vitrages coulissants des 2 côtés · profondeur 60 cm' },
      { n:'Panorama', name:'Réfrigérée Panorama', sub:'2 ou 3 étagères réfrigérées +4/+8' },
      { n:'Caisse', name:'Comptoir caisse', sub:'Tout commerce, avec ou sans tablette PMR' }
    ];

    return {
      rootStyle: '--red:' + accent,
      menu: s.menu,
      toggleMenu: () => this.setState({ menu: !s.menu }),
      lens, lrows, isSur,
      setCustom: e => this.setState({ custom: e.target.value }),
      lenLabel, tempLabel, usage, finLabel,
      cvSt: 'width:' + drawW + 'px',
      hoodSt: pat ? 'background:rgba(201,211,214,.42)' : 'background:rgba(222,212,196,.42)',
      dotSt: pat ? 'background:#7E9AA3' : 'background:#9A7B4F',
      gPat: op(pat), gChoc: op(!pat),
      fBlanc: op(blanc), fAutre: op(!blanc),
      tPat: { sel: pat ? 'true' : 'false', st: sel(pat, ON_CARD), pick: () => this.setState({ temp:'pat' }) },
      tChoc: { sel: !pat ? 'true' : 'false', st: sel(!pat, ON_CARD), pick: () => this.setState({ temp:'choc' }) },
      nBlanc: { sel: blanc ? 'true' : 'false', st: sel(blanc, ON_CARD), pick: () => this.setState({ fin:'blanc' }) },
      nAutre: { sel: !blanc ? 'true' : 'false', st: sel(!blanc, ON_CARD), pick: () => this.setState({ fin:'autre' }) },
      dims: is101 ? '101 × 80 × 80 + 25 h' : '[DIMENSIONS] — ' + lenLabel,
      price: is101 ? price101 : 'Sur devis',
      priceSt: is101 ? 'color:#2B2926' : 'color:' + accent + ';font-style:italic',
      priceNote: is101 ? 'Modèle 101 cm, hors taxes.' : 'Prix publié pour le 101 cm uniquement — autres longueurs : [PRIX].',
      drawLabel: 'Élévation du module Gourmandise, ' + lenLabel + ', ' + tempLabel + ', ' + finLabel,
      tabs, isDesc: s.tab === 'desc', isCarac: s.tab === 'carac', isDim: s.tab === 'dim', spec,
      modelLabel,
      setNom: set('f_nom'), setTel: set('f_tel'), setEmail: set('f_email'), setSecteur: set('f_secteur'), setCp: set('f_cp'), setVille: set('f_ville'), setMsg: set('f_msg'),
      eNom: s.tried && !s.f_nom.trim(), eTel: s.tried && !s.f_tel.trim(), eEmail: s.tried && !emailOk, eMsg: s.tried && !s.f_msg.trim(),
      submit: e => {
        e.preventDefault();
        const ok = s.f_nom.trim() && s.f_tel.trim() && emailOk && s.f_msg.trim();
        this.setState(ok ? { sent:true, tried:false } : { tried:true });
      },
      sent: s.sent, notSent: !s.sent, fNom: s.f_nom.trim(),
      reset: () => this.setState({ sent:false, tried:false, f_nom:'', f_tel:'', f_email:'', f_secteur:'', f_cp:'', f_ville:'', f_msg:'' }),
      assoc
    };
  }
}
</script>
</body>
</html>
