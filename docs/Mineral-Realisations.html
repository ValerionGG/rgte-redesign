<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Minéral — Réalisations</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap">
<style>
body{margin:0;background:#F4F2EE}
sc-for,sc-if{display:contents}
.mn{--g:#F4F2EE;--s:#E6E2DB;--s2:#DAD5CC;--ink:#2B2926;--mu:#6E6A63;--mu2:#5C5852;--gl:#C9D3D6;--ln:rgba(43,41,38,.16);--ln2:rgba(43,41,38,.08);background:var(--g);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mn *,.mn *::before,.mn *::after{box-sizing:border-box}
.mn img{display:block;max-width:100%}
.mn a{color:inherit}
.mn :focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px}
.sf{font-family:'Newsreader',Georgia,serif;font-weight:300}
.sc{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--mu)}
.no{font-family:'Newsreader',Georgia,serif;font-variant-caps:all-small-caps;letter-spacing:.14em;font-size:18px;color:var(--mu)}
.strip{border-bottom:1px solid var(--ln2);font-size:13px;color:var(--mu)}
.strip-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:44px}
.strip a{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px;min-height:44px}
.strip a:hover{color:var(--red)}
.hd{position:sticky;top:0;z-index:30;background:rgba(244,242,238,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln2)}
.hd-in{display:flex;align-items:center;justify-content:space-between;gap:24px;height:84px}
.logo{display:inline-flex;align-items:center;gap:14px;text-decoration:none;min-height:44px}
.logo-w{font-weight:600;font-size:19px;letter-spacing:.34em;position:relative}
.logo-w::after{content:"";position:absolute;right:-1px;top:0;width:5px;height:5px;background:var(--red)}
.logo-s{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:15px;color:var(--mu);padding-left:14px;border-left:1px solid var(--ln)}
.nav{display:flex;gap:2px}
.nav a{position:relative;text-decoration:none;font-size:15px;padding:0 14px;min-height:44px;display:inline-flex;align-items:center}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.nav a:hover::after{transform:scaleX(1)}
.nav a.on::after{transform:scaleX(1);background:var(--red)}
.hd-r{display:flex;align-items:center;gap:20px}
.tel{text-decoration:none;display:flex;flex-direction:column;line-height:1.25;min-height:44px;justify-content:center;font-size:15px;font-weight:500}
.tel small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;font:500 15px/1 'Hanken Grotesk',sans-serif;text-decoration:none;cursor:pointer;transition:background .35s,color .35s,border-color .35s,transform .35s,box-shadow .35s;white-space:nowrap}
.btn svg{transition:transform .35s}
.btn:hover svg{transform:translateX(4px)}
.btn-r{background:var(--red);color:#fff}
.btn-r:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px var(--red)}
.btn-o{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-o:hover{background:var(--ink);color:var(--g)}
.burger{display:none;width:48px;height:48px;border-radius:999px;border:1px solid var(--ln);background:transparent;color:var(--ink);align-items:center;justify-content:center;cursor:pointer}
.mnav{display:flex;flex-direction:column;padding:8px 20px 28px;border-top:1px solid var(--ln2)}
.mnav a{font-family:'Newsreader',Georgia,serif;font-size:26px;font-weight:300;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--ln2);min-height:44px}
.h1{font-family:'Newsreader',Georgia,serif;font-weight:300;letter-spacing:-.025em;line-height:.98;margin:0;overflow-wrap:anywhere}
.h2{font-family:'Newsreader',Georgia,serif;font-weight:300;letter-spacing:-.02em;line-height:1.04;margin:0;font-size:clamp(34px,4.4vw,64px);overflow-wrap:anywhere}
.h1 em,.h2 em{font-style:italic}
.lead{font-size:18px;line-height:1.65;color:var(--mu);max-width:560px;margin:0}
.ft{background:var(--s);padding:96px 0 0;border-top:1px solid var(--ln2)}
.ft-cta{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;padding-bottom:72px;border-bottom:1px solid var(--ln)}
.ft-cta .h2{max-width:780px}
.ft-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px;padding:56px 0}
.ft-g h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--mu2);margin:0 0 14px}
.ft-g p{margin:0;font-size:15px;line-height:1.7}
.ft-l a{display:flex;align-items:center;min-height:44px;text-decoration:none;font-size:15px;border-bottom:1px solid var(--ln2);transition:color .3s,padding .4s}
.ft-l a:hover{color:var(--red);padding-left:6px}
.ft-b{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;padding:14px 0 22px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu2)}
.ft-b a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center;color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rv{animation:rise 1.1s cubic-bezier(.2,.7,.1,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.5s}
@supports (animation-timeline: view()){.rs{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 80%}}
@media (max-width:1080px){.nav,.tel{display:none}.burger{display:inline-flex}}
@media (min-width:1081px){.mnav{display:none}}
@media (max-width:720px){.wrap{padding:0 20px}.hd-in{height:72px}.ft{padding-top:64px}}
@media (max-width:520px){.hd-r .btn{display:none}.logo-s{display:none}}

.ph{padding:72px 0 44px}
.ph .h1{font-size:clamp(46px,6.4vw,104px);margin:22px 0 0}
.ph-g{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:48px;align-items:end}
@media (max-width:900px){.ph-g{grid-template-columns:1fr}}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 32px;padding:18px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);position:sticky;top:85px;background:rgba(244,242,238,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10}
.fg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fg .sc{margin-right:8px}
.fb{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--ln);background:transparent;font:400 14px/1 'Hanken Grotesk',sans-serif;color:var(--ink);cursor:pointer;transition:all .3s}
.fb:hover{border-color:var(--ink)}
.fb i{font-style:normal;font-size:12px;opacity:.75}
.vt{display:inline-flex;border:1px solid var(--ln);border-radius:999px;padding:3px}
.vb{width:44px;height:40px;border:0;border-radius:999px;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s,color .3s}
@media (max-width:720px){.bar{position:relative;top:0}}

.rz{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;align-items:start;padding:48px 0 112px}
.cnt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:28px 20px}
.cd{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;animation:rise .7s cubic-bezier(.2,.7,.1,1) both}
.cd-p{position:relative;height:300px;overflow:hidden;background:var(--s)}
.cd-p img{width:100%;height:300px;object-fit:cover;filter:saturate(.8);transition:transform 1.6s cubic-bezier(.2,.7,.1,1),filter .8s}
.cd:hover .cd-p img{transform:scale(1.06);filter:saturate(1)}
.cd-ring{position:absolute;inset:0;box-shadow:inset 0 0 0 0 var(--red);transition:box-shadow .5s}
.cd-m{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 8px;border-bottom:1px solid var(--ln)}
.cd-t{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:26px;line-height:1.1;margin:12px 0 4px;transition:color .3s}
.cd:hover .cd-t{color:var(--red)}
.cd-l{font-size:14px;color:var(--mu)}
.lst{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.li{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1.3fr) minmax(0,1fr) 90px;gap:16px;align-items:baseline;padding:18px 8px 18px 0;border-bottom:1px solid var(--ln);min-height:64px;transition:padding .5s cubic-bezier(.2,.7,.1,1),background .4s;animation:rise .6s cubic-bezier(.2,.7,.1,1) both}
.li:hover{padding-left:12px}
.li-t{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:24px;line-height:1.15}
.li-l{font-size:14px;color:var(--mu)}
@media (max-width:640px){.li{grid-template-columns:44px 1fr}.li .li-l,.li .sc{grid-column:2}}
.empty{padding:48px 0;color:var(--mu)}

.dt{position:sticky;top:180px}
.dt-p{position:relative;height:420px;overflow:hidden;background:var(--s2)}
.dt-p img{position:absolute;left:0;top:0;width:100%;height:420px;object-fit:cover;transition:opacity 1s,transform 1.8s cubic-bezier(.2,.7,.1,1)}
.dt-n{position:absolute;left:20px;top:16px;font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:72px;line-height:1;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.dt-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0 0}
.nv{display:flex;gap:8px}
.nb{width:48px;height:48px;border-radius:999px;border:1px solid var(--ln);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.nb:hover{background:var(--ink);color:var(--g);border-color:var(--ink)}
.dt-t{font-size:clamp(38px,3.8vw,56px);line-height:1.02;letter-spacing:-.02em;margin:12px 0 20px}
.dl{display:grid;grid-template-columns:120px 1fr;border-top:1px solid var(--ln);margin:0 0 22px}
.dl dt,.dl dd{margin:0;padding:12px 0;border-bottom:1px solid var(--ln);font-size:15px}
.dl dt{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);padding-top:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--ln);border-radius:999px;font-size:14px;text-decoration:none;transition:border-color .3s,background .3s,transform .3s}
.chip:hover{border-color:var(--ink);background:#FBFAF8;transform:translateY(-2px)}
.note{font-size:13px;color:var(--mu);margin:14px 0 0}
@media (max-width:980px){.rz{grid-template-columns:1fr}.dt{position:relative;top:0;order:-1}}

.sec{padding:112px 0;border-top:1px solid var(--ln2)}
.sec-s{background:var(--s)}
.sec-s .sc,.sec-s .no{color:var(--mu2)}
.pl{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--ln);margin-top:40px}
.pl span{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:clamp(24px,2.6vw,38px);padding:16px 28px 16px 0;margin-right:28px;border-right:1px solid var(--ln);line-height:1.2}
.pl span:last-child{border-right:0}
@media (max-width:900px){.sec{padding:80px 0}}
@media (prefers-reduced-motion:reduce){.mn *{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="mn" style="{{ rootStyle }}">

<div class="strip"><div class="wrap strip-in"><a href="index.html"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M9 2 4 7l5 5"></path></svg>Toutes les propositions</a><span>Proposition 02 · Minéral</span></div></div>

<header class="hd">
  <div class="wrap hd-in">
    <a class="logo" href="Mineral-Accueil.html" aria-label="RGTE, R.G. Technologies — accueil"><span class="logo-w">RGTE</span><span class="logo-s">R.G. Technologies</span></a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="Mineral-Lignes.html">Lignes</a>
      <a href="Mineral-Secteurs.html">Secteurs</a>
      <a href="Mineral-Realisations.html" class="on" aria-current="page">Réalisations</a>
      <a href="Mineral-Contact.html">Showroom &amp; contact</a>
    </nav>
    <div class="hd-r">
      <a class="tel" href="tel:0800951313"><span>0 800 95 13 13</span><small>Appel gratuit</small></a>
      <a class="btn btn-r" href="Mineral-Contact.html">Plan 3D offert</a>
      <button type="button" class="burger" aria-label="Ouvrir le menu" onClick="{{ toggleMenu }}"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 7h14M3 13h14"></path></svg></button>
    </div>
  </div>
  <sc-if value="{{ menu }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav" aria-label="Navigation mobile">
      <a href="Mineral-Lignes.html">Lignes</a>
      <a href="Mineral-Secteurs.html">Secteurs</a>
      <a href="Mineral-Realisations.html">Réalisations</a>
      <a href="Mineral-Contact.html">Showroom &amp; contact</a>
      <a href="tel:0800951313">0 800 95 13 13 — appel gratuit</a>
    </nav>
  </sc-if>
</header>

<section class="ph">
  <div class="wrap">
    <div class="ph-g">
      <div>
        <p class="sc rv">N° 05 — Réalisations</p>
        <h1 class="h1 rv d1">Quatorze vitrines,<br><em>de Paris à La Réunion</em>.</h1>
      </div>
      <p class="lead rv d2">Pâtissiers, chocolatiers, boulangers, traiteurs, bars à salades ou à couscous&nbsp;: filtrez par ligne ou par type de commerce, puis ouvrez un projet.</p>
    </div>
  </div>
</section>

<div class="wrap">
  <div class="bar rv d3">
    <div class="fg" role="group" aria-label="Filtrer par ligne">
      <span class="sc">Ligne</span>
      <sc-for list="{{ fLigne }}" as="f" hint-placeholder-count="4">
        <button type="button" class="fb" style="{{ f.st }}" aria-pressed="{{ f.sel }}" onClick="{{ f.pick }}">{{ f.label }} <i>{{ f.c }}</i></button>
      </sc-for>
    </div>
    <div class="fg" role="group" aria-label="Filtrer par type">
      <span class="sc">Type</span>
      <sc-for list="{{ fType }}" as="f" hint-placeholder-count="5">
        <button type="button" class="fb" style="{{ f.st }}" aria-pressed="{{ f.sel }}" onClick="{{ f.pick }}">{{ f.label }} <i>{{ f.c }}</i></button>
      </sc-for>
    </div>
    <div class="vt" role="group" aria-label="Affichage">
      <button type="button" class="vb" style="{{ vGrid.st }}" aria-pressed="{{ vGrid.sel }}" aria-label="Affichage en grille" onClick="{{ vGrid.pick }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="2" width="5" height="5"></rect><rect x="9" y="2" width="5" height="5"></rect><rect x="2" y="9" width="5" height="5"></rect><rect x="9" y="9" width="5" height="5"></rect></svg></button>
      <button type="button" class="vb" style="{{ vList.st }}" aria-pressed="{{ vList.sel }}" aria-label="Affichage en liste" onClick="{{ vList.pick }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"></path></svg></button>
    </div>
  </div>

  <div class="rz">
    <div>
      <div class="cnt"><span class="no">{{ countLabel }}</span><span class="sc">Visuels d’ambiance</span></div>
      <sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}">
        <div class="grid">
          <sc-for list="{{ items }}" as="r" hint-placeholder-count="6">
            <button type="button" class="cd" aria-pressed="{{ r.sel }}" aria-label="{{ r.aria }}" onClick="{{ r.pick }}">
              <span class="cd-p"><img src="{{ r.img }}" alt=""><span class="cd-ring" style="{{ r.ring }}"></span></span>
              <span class="cd-m"><span class="no">N° {{ r.n }}</span><span class="sc">{{ r.l }}</span></span>
              <span class="cd-t">{{ r.t }}</span>
              <span class="cd-l">{{ r.lieu }}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
        <div class="lst">
          <sc-for list="{{ items }}" as="r" hint-placeholder-count="6">
            <button type="button" class="li" style="{{ r.lst }}" aria-pressed="{{ r.sel }}" onClick="{{ r.pick }}">
              <span class="no">{{ r.n }}</span>
              <span class="li-t">{{ r.t }}</span>
              <span class="li-l">{{ r.lieu }} — {{ r.mods }}</span>
              <span class="sc">{{ r.l }}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ none }}" hint-placeholder-val="{{ false }}">
        <div class="empty">Aucune réalisation ne correspond à ces filtres. <button type="button" class="fb" style="margin-left:10px" onClick="{{ resetF }}">Réinitialiser</button></div>
      </sc-if>
    </div>

    <aside class="dt" aria-live="polite">
      <div class="dt-p">
        <sc-for list="{{ pics }}" as="p" hint-placeholder-count="14">
          <img src="{{ p.img }}" alt="" style="{{ p.st }}">
        </sc-for>
        <span class="dt-n">{{ D.n }}</span>
      </div>
      <div class="dt-h">
        <span class="sc">Ligne {{ D.l }} · {{ D.type }}</span>
        <div class="nv">
          <button type="button" class="nb" aria-label="Réalisation précédente" onClick="{{ prev }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M14 8H3M7 4 3 8l4 4"></path></svg></button>
          <button type="button" class="nb" aria-label="Réalisation suivante" onClick="{{ next }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"></path></svg></button>
        </div>
      </div>
      <h2 class="dt-t sf">{{ D.t }}</h2>
      <dl class="dl">
        <dt>Lieu</dt><dd>{{ D.lieu }}</dd>
        <dt>Ligne</dt><dd>{{ D.l }}</dd>
        <dt>Secteur</dt><dd><a href="Mineral-Secteurs.html">{{ D.sect }}</a></dd>
      </dl>
      <span class="sc">Modules installés</span>
      <div class="chips" style="margin:12px 0 26px">
        <sc-for list="{{ D.mods }}" as="m" hint-placeholder-count="3">
          <a class="chip" href="Mineral-Module.html">{{ m.n }}</a>
        </sc-for>
      </div>
      <a class="btn btn-r" href="Mineral-Contact.html">Un projet similaire <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"></path></svg></a>
      <p class="note">Visuel d’ambiance — photographies du projet&nbsp;: [PHOTOS].</p>
    </aside>
  </div>
</div>

<section class="sec sec-s">
  <div class="wrap">
    <span class="no">Où nous avons agencé</span>
    <h2 class="h2" style="margin-top:14px">Une carte <em>de France</em>, en quatorze adresses.</h2>
    <div class="pl">
      <span>Paris 4e</span><span>Département 13</span><span>Gap &amp; Grenoble</span><span>Chamonix</span><span>Nice</span><span>Toute la France</span><span>La Réunion</span><span>Département 33</span><span>Paris</span><span>Département 69</span><span>Marseille</span><span>Isère</span><span>Département 92</span><span>Nice 06</span>
    </div>
  </div>
</section>

<footer class="ft">
  <div class="wrap">
    <div class="ft-cta">
      <h2 class="h2">La prochaine réalisation <em>pourrait être la vôtre</em>.</h2>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn btn-r" href="Mineral-Contact.html">Demande de devis <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"></path></svg></a><a class="btn btn-o" href="tel:0800951313">0 800 95 13 13</a></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4300},"accent":{"editor":"color","default":"#D42A20","options":["#D42A20","#2B2926","#9A7B4F"]}}'>
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { fl:'all', ft:'all', view:'grid', sel:1, menu:false }; }
  renderVals(){
    const s = this.state;
    const accent = this.props.accent || '#D42A20';
    const TYPES = { pat:'Pâtisserie & chocolat', boul:'Boulangerie', trait:'Traiteur & snacking', bar:'Bars' };
    // [id, titre, lieu, ligne, modules, type, secteur, image]
    const R = [
      [1,'Pâtisserie','Paris 4e','Stone',['Vitrine réfrigérée Plane','Caisse'],'pat','Pâtisserie','assets/vitrine-slice.webp'],
      [2,'Bar à salades','Département 13','Stone',['Saladette','Caisse','Panorama'],'bar','Bar à salades','assets/saladette-bacs.webp'],
      [3,'Chocolatier','Gap & Grenoble','Stone',['Plane','Caisse'],'pat','Chocolats','assets/chocolate-display.webp'],
      [4,'Sandwicherie','Chamonix','Basique',['Panoramique','Basse','Murale self-service'],'trait','Sandwichs','assets/vitrine-cookies.webp'],
      [5,'Bar à olives','Nice','Stone',['Saladette sur mesure avec trous arrondis'],'bar','[SECTEUR]','assets/bakery-window.webp'],
      [6,'Bar à yogourt glacé (chaîne)','Toute la France','Stone',['Saladette sur mesure trous arrondis','Surface plane'],'bar','Bar à topping','assets/topping-bar.webp'],
      [7,'Boulangerie pâtisserie','La Réunion','Basique',['Amandine','Caisse'],'boul','Boulangerie','assets/vitrine-viennoiserie.webp'],
      [8,'Boulangerie','Département 33','Legno',['Réfrigérée statique','Neutre','Module arrière'],'boul','Boulangerie','assets/bakery-shelves.webp'],
      [9,'Pizza sur composition','Paris','Stone',['Saladette','Caisse','Plane'],'trait','Pizza al taglio','assets/baker-table.webp'],
      [10,'Pâtissier chocolatier','Département 69','Stone',['Centrale','Caisse','Plane'],'pat','Pâtisserie','assets/macarons-rows.webp'],
      [11,'Traiteur asiatique (chaîne)','Marseille','Stone',['Plane','Caisse','Saladette','Comptoir bar'],'trait','Traiteur','assets/bakery-counter-bright.webp'],
      [12,'Bar à couscous','Isère','Stone',['Bain-marie avec trous arrondis sur mesure'],'bar','Bar à couscous','assets/bakery-hall-dark.webp'],
      [13,'Traiteur poissonnier','Département 92','Stone',['Panorama','Surface plane','Caisse'],'trait','Poissonnerie','assets/fish-ice.webp'],
      [14,'Pâtissier chocolatier Canet','Nice 06','Stone',['Plane pâtissière +2/+8','Plane chocolats +14/+18'],'pat','Chocolats','assets/vitrine-colorful.webp']
    ];
    const pill = on => on ? 'background:#2B2926;color:#F4F2EE;border-color:#2B2926' : '';
    const okL = r => s.fl === 'all' || r[3] === s.fl;
    const okT = r => s.ft === 'all' || r[5] === s.ft;

    const fLigne = [['all','Toutes'],['Stone','Stone'],['Basique','Basique'],['Legno','Legno']].map(f => ({
      label:f[1], c: R.filter(r => (f[0] === 'all' || r[3] === f[0]) && okT(r)).length,
      sel: s.fl === f[0] ? 'true' : 'false', st: pill(s.fl === f[0]), pick: () => this.setState({ fl:f[0] }) }));
    const fType = [['all','Tous']].concat(Object.keys(TYPES).map(k => [k, TYPES[k]])).map(f => ({
      label:f[1], c: R.filter(r => (f[0] === 'all' || r[5] === f[0]) && okL(r)).length,
      sel: s.ft === f[0] ? 'true' : 'false', st: pill(s.ft === f[0]), pick: () => this.setState({ ft:f[0] }) }));

    const list = R.filter(r => okL(r) && okT(r));
    const items = list.map(r => {
      const on = s.sel === r[0];
      return { n:String(r[0]).padStart(2, '0'), t:r[1], lieu:r[2], l:r[3], mods:r[4].join(' · '), img:r[7],
        sel: on ? 'true' : 'false',
        ring: on ? 'box-shadow:inset 0 0 0 3px ' + accent : '',
        lst: on ? 'background:#FBFAF8;padding-left:14px;box-shadow:inset 2px 0 0 ' + accent : '',
        aria: 'Réalisation ' + r[0] + ' : ' + r[1] + ', ' + r[2],
        pick: () => this.setState({ sel:r[0] }) };
    });

    const cur = R.find(r => r[0] === s.sel);
    const idx = list.findIndex(r => r[0] === s.sel);
    const step = d => () => {
      if (!list.length) return;
      const i = idx < 0 ? 0 : (idx + d + list.length) % list.length;
      this.setState({ sel: list[i][0] });
    };

    return {
      rootStyle: '--red:' + accent,
      menu: s.menu,
      toggleMenu: () => this.setState({ menu: !s.menu }),
      fLigne, fType,
      vGrid: { sel: s.view === 'grid' ? 'true' : 'false', st: s.view === 'grid' ? 'background:#2B2926;color:#F4F2EE' : '', pick: () => this.setState({ view:'grid' }) },
      vList: { sel: s.view === 'list' ? 'true' : 'false', st: s.view === 'list' ? 'background:#2B2926;color:#F4F2EE' : '', pick: () => this.setState({ view:'list' }) },
      isGrid: s.view === 'grid' && list.length > 0, isList: s.view === 'list' && list.length > 0, none: list.length === 0,
      items, countLabel: list.length + ' / 14 réalisations',
      resetF: () => this.setState({ fl:'all', ft:'all' }),
      pics: R.map(r => ({ img:r[7], st: r[0] === s.sel ? 'opacity:1;transform:scale(1)' : 'opacity:0;transform:scale(1.05)' })),
      D: { n:String(cur[0]).padStart(2, '0'), t:cur[1], lieu:cur[2], l:cur[3], type:TYPES[cur[5]], sect:cur[6], mods:cur[4].map(n => ({ n })) },
      prev: step(-1), next: step(1)
    };
  }
}
</script>
