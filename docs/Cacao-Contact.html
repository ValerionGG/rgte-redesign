<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap">
<style>
body{margin:0;background:#1B110D}
sc-for,sc-if{display:contents}
.cc{font-family:'Albert Sans',system-ui,sans-serif;color:#F1E6DA;background:#1B110D;-webkit-font-smoothing:antialiased;line-height:1.55}
.cc *{box-sizing:border-box}
.pf{font-family:'Playfair Display',Georgia,serif}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px;position:relative}
.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#C07A4A;font-weight:500}
.muted{color:#B9A797}
.hair{position:absolute;top:0;bottom:0;left:0;right:0;pointer-events:none;background-image:linear-gradient(to right,rgba(192,122,74,.11) 1px,transparent 1px);background-size:calc(100% / 6) 100%;background-position:center}
.navl{color:#F1E6DA;text-decoration:none;font-size:14px;letter-spacing:.04em;padding:0 4px;min-height:44px;display:inline-flex;align-items:center;position:relative}
.navl::after{content:'';position:absolute;left:4px;right:4px;bottom:9px;height:1px;background:#C07A4A;transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.navl:hover::after,.navl.on::after{transform:scaleX(1)}
.btn-cu{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 22px;border-radius:999px;background:#C07A4A;color:#1B110D;font-weight:600;font-size:14px;letter-spacing:.02em;text-decoration:none;border:0;cursor:pointer;font-family:inherit;transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s,filter .3s}
.btn-cu:hover{transform:translateY(-2px);box-shadow:0 16px 34px -14px rgba(192,122,74,.8);filter:brightness(1.08)}
.btn-gh{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 22px;border-radius:999px;background:transparent;color:#F1E6DA;font-weight:500;font-size:14px;text-decoration:none;border:1px solid rgba(192,122,74,.55);cursor:pointer;font-family:inherit;transition:background .4s,border-color .4s}
.btn-gh:hover{background:rgba(192,122,74,.12);border-color:#C07A4A}
.btn-cu svg,.btn-gh svg{transition:transform .4s}
.btn-cu:hover svg{transform:translateX(4px)}
.cc :focus-visible{outline:2px solid #C07A4A;outline-offset:3px}
.burger{display:none;width:46px;height:46px;border-radius:999px;border:1px solid rgba(192,122,74,.5);background:transparent;color:#F1E6DA;align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none}
.ft-h{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#C07A4A;font-weight:500;margin:0 0 16px}
.ft-l{color:#B9A797;text-decoration:none;display:flex;min-height:40px;align-items:center;transition:color .3s;font-size:15px}
.ft-l:hover{color:#F1E6DA}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(192,122,74,.35);color:#F1E6DA;font-size:14px;background:transparent;cursor:pointer;font-family:inherit;transition:border-color .35s,background .35s,color .35s,transform .35s}
.chip:hover{border-color:#C07A4A;background:rgba(192,122,74,.14);transform:translateY(-1px)}
.fade-up{animation:fu 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.step-in{animation:si .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes si{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.melt{display:block;animation:melt 2s cubic-bezier(.6,.05,.3,1) both}
@keyframes melt{
0%{clip-path:polygon(0% 0%,100% 0%,100% 0%,87% 0%,75% 0%,62% 0%,50% 0%,37% 0%,25% 0%,12% 0%,0% 0%);transform:translateY(-10px)}
55%{clip-path:polygon(0% 0%,100% 0%,100% 72%,87% 96%,75% 58%,62% 88%,50% 52%,37% 92%,25% 62%,12% 100%,0% 70%);transform:translateY(-2px)}
100%{clip-path:polygon(0% 0%,100% 0%,100% 135%,87% 135%,75% 135%,62% 135%,50% 135%,37% 135%,25% 135%,12% 135%,0% 135%);transform:none}}
.sheen{position:absolute;top:0;bottom:0;left:0;right:0;pointer-events:none;background:linear-gradient(105deg,transparent 0%,transparent 40%,rgba(255,224,190,0) 44%,rgba(255,224,190,.16) 50%,rgba(255,224,190,0) 56%,transparent 60%,transparent 100%);background-size:300% 100%;animation:sheen 10s cubic-bezier(.45,0,.2,1) infinite;mix-blend-mode:screen}
@keyframes sheen{0%{background-position:100% 0}65%,100%{background-position:0% 0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.4);opacity:.9}to{transform:scale(2.4);opacity:0}}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 4s 1s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.town{transition:opacity .4s}
.town:hover{opacity:1}
.fld{display:block}
.fld span{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#B9A797;margin-bottom:8px}
.inp{width:100%;min-height:50px;padding:12px 16px;border-radius:12px;border:1px solid rgba(192,122,74,.35);background:#1B110D;color:#F1E6DA;font-family:inherit;font-size:15px;transition:border-color .3s,box-shadow .3s}
.inp:focus{outline:none;border-color:#C07A4A;box-shadow:0 0 0 3px rgba(192,122,74,.2)}
textarea.inp{min-height:120px;resize:vertical}
.faq-q{display:flex;justify-content:space-between;align-items:center;gap:20px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid rgba(192,122,74,.25);padding:24px 0;min-height:44px;cursor:pointer;font-family:inherit;color:#F1E6DA;transition:padding .5s cubic-bezier(.2,.7,.2,1)}
.faq-q:hover{padding-left:10px}
.faq-ic{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.faq-a{animation:fu .6s cubic-bezier(.2,.7,.2,1) both}
@media(max-width:960px){.navlinks{display:none}.burger{display:inline-flex}.hdr-tel{display:none}.mnav{display:block}.form-grid{grid-template-columns:1fr}}
@media(max-width:700px){.wrap{padding:0 20px}.hdr-cta{display:none}}
@media(prefers-reduced-motion:reduce){.melt,.sheen,.fade-up,.pulse,.draw,.step-in,.faq-a{animation:none}.draw{stroke-dashoffset:0}}
</style>
</helmet>

      <button type="button" class="burger" aria-label="Ouvrir le menu" onClick="{{ toggleMenu }}">

      </button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div class="mnav" style="border-top:1px solid rgba(192,122,74,.22);background:#1B110D">
      <div class="wrap" style="display:flex;flex-direction:column;padding-top:12px;padding-bottom:20px">
        <a class="navl" href="Cacao-Lignes.html">Lignes</a>
        <a class="navl" href="Cacao-Secteurs.html">Secteurs</a>
        <a class="navl" href="Cacao-Realisations.html">Réalisations</a>
        <a class="navl" href="Cacao-Contact.html">Showroom &amp; contact</a>
        <a class="navl" href="tel:0800951313">0 800 95 13 13 — appel gratuit</a>
        <a class="btn-cu" href="#devis" style="margin-top:12px">Plan 3D offert</a>
      </div>

<!-- FORMULAIRE DEVIS -->
<section id="devis" aria-labelledby="t-devis" style="position:relative;padding:100px 0;background:#2A1B15;border-top:1px solid rgba(192,122,74,.22);border-bottom:1px solid rgba(192,122,74,.22)">
  <div class="hair" aria-hidden="true" style="opacity:.6"></div>
  <div class="wrap">
    <p class="eyebrow" style="margin:0 0 16px">Demande de devis &amp; plan 3D</p>
    <h2 id="t-devis" class="pf" style="margin:0 0 44px;font-weight:400;font-size:clamp(36px,4vw,58px);line-height:1.05">Trois étapes, <em style="color:#C07A4A">une vitrine.</em></h2>

    <div class="form-grid" style="display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:32px;align-items:start">
      <div style="background:#1B110D;border:1px solid rgba(192,122,74,.3);border-radius:22px;padding:34px;min-height:560px">
        <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
          <div>
            <div role="list" aria-label="Étapes" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:34px">
              <sc-for list="{{ stepsNav }}" as="sn" hint-placeholder-count="3">
                <div role="listitem" aria-current="{{ sn.cur }}">
                  <span style="{{ sn.bar }}"></span>
                  <span style="display:flex;gap:8px;align-items:baseline;margin-top:10px"><span class="pf" style="font-style:italic;color:#C07A4A;font-size:14px">{{ sn.n }}</span><span style="{{ sn.lbl }}">{{ sn.t }}</span></span>
                </div>
              </sc-for>
            </div>

            <sc-if value="{{ st0 }}" hint-placeholder-val="{{ true }}">
              <div class="step-in">
                <p style="margin:0 0 12px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#B9A797">Votre demande</p>
                <div role="group" aria-label="Type de demande" style="display:flex;flex-wrap:wrap;gap:8px">
                  <sc-for list="{{ types }}" as="t" hint-placeholder-count="3">
                    <button type="button" class="chip" aria-pressed="{{ t.sel }}" style="{{ t.style }}" onClick="{{ t.pick }}">{{ t.label }}</button>
                  </sc-for>
                </div>
                <p style="margin:28px 0 12px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#B9A797">Votre secteur *</p>
                <div role="group" aria-label="Secteur d’activité" style="display:flex;flex-wrap:wrap;gap:8px">
                  <sc-for list="{{ sects }}" as="s" hint-placeholder-count="13">
                    <button type="button" class="chip" aria-pressed="{{ s.sel }}" style="{{ s.style }}" onClick="{{ s.pick }}">{{ s.label }}</button>
                  </sc-for>
                </div>
                <sc-if value="{{ err0 }}" hint-placeholder-val="{{ false }}">
                  <p role="alert" style="margin:16px 0 0;color:#F4C7BF;font-size:14px">Choisissez un secteur pour continuer.</p>
                </sc-if>
              </div>
            </sc-if>

            <sc-if value="{{ st1 }}" hint-placeholder-val="{{ false }}">
              <div class="step-in" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:18px">
                <label class="fld"><span>Longueur disponible (cm)</span><input class="inp" type="number" min="0" inputmode="numeric" value="{{ v.longueur }}" onInput="{{ inLong }}"></label>
                <label class="fld"><span>Profondeur disponible (cm)</span><input class="inp" type="number" min="0" inputmode="numeric" value="{{ v.profondeur }}" onInput="{{ inProf }}"></label>
                <div style="grid-column:1 / -1">
                  <p style="margin:6px 0 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#B9A797">Forme du comptoir</p>
                  <div role="group" aria-label="Forme du comptoir" style="display:flex;flex-wrap:wrap;gap:8px">
                    <sc-for list="{{ formes }}" as="f" hint-placeholder-count="3">
                      <button type="button" class="chip" aria-pressed="{{ f.sel }}" style="{{ f.style }}" onClick="{{ f.pick }}">
                        <svg width="22" height="16" viewBox="0 0 22 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="{{ f.d }}"></path></svg>{{ f.label }}
                      </button>
                    </sc-for>
                  </div>
                </div>
                <div style="grid-column:1 / -1">
                  <p style="margin:6px 0 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#B9A797">Plages de température souhaitées</p>
                  <div role="group" aria-label="Plages de température" style="display:flex;flex-wrap:wrap;gap:8px">
                    <sc-for list="{{ temps }}" as="t" hint-placeholder-count="5">
                      <button type="button" class="chip" aria-pressed="{{ t.sel }}" style="{{ t.style }}" onClick="{{ t.pick }}">{{ t.label }}</button>
                    </sc-for>
                  </div>
                </div>
                <label class="fld" style="grid-column:1 / -1"><span>Votre projet en quelques mots</span><textarea class="inp" value="{{ v.msg }}" onInput="{{ inMsg }}"></textarea></label>
              </div>
            </sc-if>

            <sc-if value="{{ st2 }}" hint-placeholder-val="{{ false }}">
              <div class="step-in" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:18px">
                <label class="fld"><span>Nom *</span><input class="inp" type="text" autocomplete="name" value="{{ v.nom }}" style="{{ e.nom }}" onInput="{{ inNom }}"></label>
                <label class="fld"><span>Établissement</span><input class="inp" type="text" autocomplete="organization" value="{{ v.soc }}" onInput="{{ inSoc }}"></label>
                <label class="fld"><span>Téléphone *</span><input class="inp" type="tel" autocomplete="tel" value="{{ v.tel }}" style="{{ e.tel }}" onInput="{{ inTel }}"></label>
                <label class="fld"><span>Email *</span><input class="inp" type="email" autocomplete="email" value="{{ v.email }}" style="{{ e.email }}" onInput="{{ inEmail }}"></label>
                <label class="fld"><span>Code postal</span><input class="inp" type="text" inputmode="numeric" autocomplete="postal-code" value="{{ v.cp }}" onInput="{{ inCp }}"></label>
                <label class="fld"><span>Ville</span><input class="inp" type="text" autocomplete="address-level2" value="{{ v.ville }}" onInput="{{ inVille }}"></label>
                <sc-if value="{{ err2 }}" hint-placeholder-val="{{ false }}">

                <button type="button" class="btn-gh" onClick="{{ back }}">Retour</button>

              <button type="button" class="btn-cu" style="{{ ctaStyle }}" onClick="{{ next }}">{{ nextLabel }} <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M9 4l4 4-4 4"></path></svg></button>
            </div>
          </div>

        <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
          <div class="step-in" role="status" style="position:relative;min-height:490px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;overflow:hidden">

            <svg width="54" height="54" viewBox="0 0 44 44" fill="none" stroke="#C07A4A" stroke-width="1.3" aria-hidden="true"><circle cx="22" cy="22" r="20"></circle><path d="M13 22.5l6 6 12-13"></path></svg>
            <p class="pf" style="margin:20px 0 0;font-size:clamp(32px,3.4vw,48px);line-height:1.08">Merci {{ v.nom }}, <em style="color:#C07A4A">c’est noté.</em></p>
            <p style="margin:14px 0 0;font-size:16px;max-width:520px;line-height:1.65">{{ sentLine }}</p>
            <p class="muted" style="margin:8px 0 0;font-size:14px">Prototype — rien n’est envoyé.</p>
            <button type="button" class="btn-gh" style="margin-top:26px" onClick="{{ restart }}">Nouvelle demande</button>
          </div>
        </sc-if>
      </div>

      <!-- Récap -->
      <aside aria-label="Récapitulatif" style="position:sticky;top:104px;border:1px solid rgba(192,122,74,.3);border-radius:22px;padding:28px;background:rgba(27,17,13,.6)">
        <p class="eyebrow" style="margin:0 0 14px">Votre projet</p>
        <sc-for list="{{ recap }}" as="r" hint-placeholder-count="5">
          <div style="display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(192,122,74,.16);font-size:14px">

        <div style="margin-top:22px;padding:18px;border-radius:14px;background:#C07A4A;color:#1B110D">
          <p class="pf" style="margin:0;font-size:22px;line-height:1.2">Plan 3D offert</p>
          <p style="margin:6px 0 0;font-size:13px;line-height:1.5">Le bureau d’études élabore votre plan 3D d’agencement à partir de ces informations.</p>

        <a href="tel:0800951313" style="display:flex;align-items:center;gap:10px;margin-top:18px;min-height:44px;color:#F1E6DA;text-decoration:none;font-size:15px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C07A4A" stroke-width="1.5" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>
          Plutôt au téléphone ? 0 800 95 13 13</a>

    </div>
  </div>
</section>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3500},"accent":{"editor":"color","default":"#C07A4A","options":["#C07A4A","#D4A373","#D42A20"]},"sheen":{"editor":"boolean","default":true}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { menuOpen:false, step:0, tried0:false, tried2:false, sent:false, faq:0,
      v:{ type:'Plan 3D', sect:'', forme:'Droit', temps:[], longueur:'', profondeur:'', msg:'', nom:'', soc:'', tel:'', email:'', cp:'', ville:'' } };
  }
  renderVals(){
    const p = this.props || {};
    const accent = p.accent || '#C07A4A';
    const s = this.state;
    const v = s.v;
    const on = 'background:#C07A4A;color:#1B110D;border-color:#C07A4A;font-weight:600;';
    const set = patch => this.setState({ v: Object.assign({}, this.state.v, patch) });
    const fld = k => e => set({ [k]: e.target.value });

    const TYPES = ['Plan 3D','Devis','Visite du show-room'];
    const SECTS = ['Boulangerie','Pâtisserie','Chocolats','Sandwichs','Traiteur','Poissonnerie','Bar à salades','Bar à couscous','Fromagerie','Bar','Bar à topping','Coffee shop / Café','Pizza al taglio'];
    const FORMES = [['Droit','M2 8h18'],['En L','M2 3v10h18'],['En U','M2 3v10h18V3']];
    const TEMPS = ['+2 / +8 °C','+14 / +18 °C','−2 / 0 °C','+30 / +90 °C','Neutre'];

    const emailOk = /.+@.+\..+/.test(v.email || '');
    const miss = [];
    if (!v.nom) miss.push('Nom');
    if (!v.tel) miss.push('Téléphone');
    if (!emailOk) miss.push('Email valide');
    const bad = 'border-color:#D42A20;';

    const LBL = ['Projet','Local','Coordonnées'];
    const stepsNav = LBL.map((t, i) => ({ n:'0' + (i + 1), t,
      cur: i === s.step ? 'step' : 'false',
      bar: 'display:block;height:3px;border-radius:3px;transition:background .6s;background:' + (i <= s.step ? '#C07A4A' : 'rgba(192,122,74,.2)') + ';',
      lbl: 'font-size:14px;color:' + (i === s.step ? '#F1E6DA' : '#B9A797') + ';' }));

    const FAQ = [
      ['Le plan 3D est-il vraiment offert ?','Oui. L’élaboration de votre plan 3D d’agencement fait partie de l’étude de votre projet par le bureau d’études : il vous est offert.'],
      ['Les vitrines s’adaptent-elles à mon local ?','Oui, les vitrines sont adaptées à votre local et à vos dimensions. Le module Gourmandise, par exemple, existe en 101, 117, 146, 169, 191 et 222 cm, ou sur mesure.'],
      ['Quelles plages de température proposez-vous ?','+2 °C / +8 °C pour la pâtisserie, +14 °C / +18 °C pour le chocolat, −2 °C / 0 °C pour la poissonnerie et +30 °C / +90 °C pour le bain-marie chaud.'],
      ['Quelles matières puis-je choisir ?','Pierre acrylique type Corian, granit, bois mélaminé avec moulures et verre sérigraphié à votre image, selon la ligne d’agencement.'],
      ['Combien coûte une vitrine ?','À titre de repère, le module Gourmandise 101 cm de la Ligne Stone est à 5 800,00 € HT. Les autres longueurs et configurations sont établies sur devis.'],
      ['Où voir les vitrines ?','Au bureau d’études et show-room : 423, Chemin des Vernèdes, Espace Vernèdes 3, 83480 Puget-sur-Argens. Horaires : [HORAIRES].']
    ];

    const next = () => {
      if (s.step === 0) { if (!v.sect) { this.setState({ tried0:true }); return; } this.setState({ step:1 }); return; }
      if (s.step === 1) { this.setState({ step:2 }); return; }
      if (miss.length) { this.setState({ tried2:true }); return; }
      this.setState({ sent:true });
    };

    const dims = (v.longueur || v.profondeur) ? ((v.longueur || '—') + ' × ' + (v.profondeur || '—') + ' cm') : '—';
    return {
      menuOpen: s.menuOpen,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      ctaStyle: 'background:' + accent + ';',
      v, stepsNav,
      st0: s.step === 0, st1: s.step === 1, st2: s.step === 2,
      notSent: !s.sent, sent: s.sent,
      canBack: s.step > 0,
      back: () => this.setState({ step: Math.max(0, this.state.step - 1) }),
      next,
      nextLabel: s.step === 2 ? 'Envoyer la demande' : 'Continuer',
      types: TYPES.map(t => ({ label:t, sel: v.type === t ? 'true' : 'false', style: v.type === t ? on : '', pick: () => set({ type:t }) })),
      sects: SECTS.map(t => ({ label:t, sel: v.sect === t ? 'true' : 'false', style: v.sect === t ? on : '', pick: () => { set({ sect:t }); } })),
      err0: s.tried0 && !v.sect,
      formes: FORMES.map(f => ({ label:f[0], d:f[1], sel: v.forme === f[0] ? 'true' : 'false', style: v.forme === f[0] ? on : '', pick: () => set({ forme:f[0] }) })),
      temps: TEMPS.map(t => {
        const has = v.temps.indexOf(t) > -1;
        return { label:t, sel: has ? 'true' : 'false', style: has ? on : '', pick: () => set({ temps: has ? this.state.v.temps.filter(x => x !== t) : this.state.v.temps.concat([t]) }) };
      }),
      inLong: fld('longueur'), inProf: fld('profondeur'), inMsg: fld('msg'),
      inNom: fld('nom'), inSoc: fld('soc'), inTel: fld('tel'), inEmail: fld('email'), inCp: fld('cp'), inVille: fld('ville'),
      e: { nom: s.tried2 && !v.nom ? bad : '', tel: s.tried2 && !v.tel ? bad : '', email: s.tried2 && !emailOk ? bad : '' },
      err2: s.tried2 && miss.length > 0,
      err2Msg: 'À compléter : ' + miss.join(', ') + '.',
      sentLine: 'Demande « ' + v.type + ' » pour un projet ' + (v.sect ? v.sect.toLowerCase() : '') + (v.temps.length ? ', plages ' + v.temps.join(', ') : '') + '. Le bureau d’études vous rappellera au ' + (v.tel || 'numéro indiqué') + '.',
      restart: () => this.setState({ sent:false, step:0, tried0:false, tried2:false, v:{ type:'Plan 3D', sect:'', forme:'Droit', temps:[], longueur:'', profondeur:'', msg:'', nom:'', soc:'', tel:'', email:'', cp:'', ville:'' } }),
      recap: [
        { k:'Demande', v:v.type },
        { k:'Secteur', v:v.sect || '—' },
        { k:'Local (L × P)', v:dims },
        { k:'Forme', v:v.forme },
        { k:'Températures', v: v.temps.length ? v.temps.join(' · ') : '—' }
      ],
      faqs: FAQ.map((f, i) => ({ q:f[0], a:f[1], isOpen: s.faq === i, open: s.faq === i ? 'true' : 'false',
        ic: 'transform:rotate(' + (s.faq === i ? '45' : '0') + 'deg);',
        toggle: () => this.setState({ faq: this.state.faq === i ? -1 : i }) }))
    };
  }
}
</script>
