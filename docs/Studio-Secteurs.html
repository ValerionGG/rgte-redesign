<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Studio — Secteurs</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#FAFAF8}
sc-for,sc-if{display:contents}
.st{--acc:#D42A20;font-family:'Onest',system-ui,sans-serif;color:#16181A;background:#FAFAF8;-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
.st *,.st *::before,.st *::after{box-sizing:border-box}
.st img{display:block;max-width:100%}
.st h1,.st h2,.st h3,.st h4,.st p{margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.wrap{max-width:1320px;margin:0 auto;padding:0 32px}
.topbar{background:#16181A;color:#B9BCB7;font-size:12px}
.topbar-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:38px}
.topbar a{color:#FAFAF8;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:38px}
.topbar a:hover{text-decoration:underline;text-underline-offset:3px}
.hdr{position:sticky;top:0;z-index:60;background:rgba(250,250,248,.9);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid #E2E3DF}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:76px}
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#16181A;min-height:44px}
.logo-glyph{display:flex;align-items:flex-end;gap:2px;height:24px}
.logo-glyph i{display:block;width:7px;border-radius:1px;background:#16181A}
.logo-word{display:block;font-weight:800;font-size:25px;letter-spacing:-.045em;line-height:1}
.logo-sub{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5B6066;margin-top:4px;line-height:1}
.nav{display:flex;gap:2px;background:#ECEDEA;padding:4px;border-radius:999px}
.nav-a{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;color:#5B6066;text-decoration:none;transition:background .2s,color .2s,box-shadow .2s}
.nav-a:hover{color:#16181A;background:rgba(255,255,255,.65)}
.nav-a.on{background:#fff;color:#16181A;box-shadow:0 1px 3px rgba(22,24,26,.1)}
.hdr-r{display:flex;align-items:center;gap:14px}
.tel{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#16181A;min-height:44px}
.tel-ico{width:38px;height:38px;border-radius:50%;background:#D8EDE3;display:grid;place-items:center;flex:none}
.tel b{display:block;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;line-height:1.15}
.tel small{display:block;font-size:11px;color:#5B6066;line-height:1.2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;border:0;font:600 15px/1 'Onest',system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:transform .2s ease,box-shadow .25s ease,background .2s ease,color .2s}
.btn svg{transition:transform .25s ease;flex:none}
.btn:hover svg{transform:translateX(3px)}
.btn-acc{background:var(--acc);color:#fff}
.btn-acc:hover{transform:translateY(-1px);box-shadow:0 12px 26px -12px var(--acc)}
.btn-ink{background:#16181A;color:#FAFAF8}
.btn-ink:hover{transform:translateY(-1px);box-shadow:0 12px 26px -14px #16181A}
.btn-ghost{background:transparent;color:#16181A;box-shadow:inset 0 0 0 1px #C4C6C1}
.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px #16181A}
.btn-sm{min-height:44px;padding:0 18px;font-size:14px}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1px solid #D5D7D2;background:#fff;align-items:center;justify-content:center;cursor:pointer;color:#16181A}
.mnav{display:none}
.mnav a{display:flex;align-items:center;justify-content:space-between;min-height:50px;padding:0 16px;border-radius:12px;background:#ECEDEA;text-decoration:none;color:#16181A;font-weight:600}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#5B6066}
.eyebrow i{width:8px;height:8px;border-radius:2px;background:var(--acc);display:block}
.h2{font-size:clamp(32px,4.4vw,60px);line-height:1.02;letter-spacing:-.035em;font-weight:700;overflow-wrap:anywhere}
.lead{font-size:clamp(16px,1.4vw,19px);color:#5B6066;line-height:1.55}
.sec{padding:120px 0}
.ftr{background:#ECEDEA;padding:80px 0 28px}
.ftr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px}
.ftr-h{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5B6066;margin-bottom:14px;font-weight:500}
.ftr p{font-size:15px}
.ftr-links a{display:flex;align-items:center;min-height:36px;text-decoration:none;color:#16181A;font-size:15px}
.ftr-links a:hover{color:var(--acc)}
.ftr-tel{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;text-decoration:none;letter-spacing:-.02em;display:inline-block;color:#16181A}
.ftr-bot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-top:64px;padding-top:14px;border-top:1px solid #D5D7D2;font-size:13px;color:#5B6066}
.ftr-bot a{color:#5B6066;font-size:13px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.ftr-bot a:hover{color:#16181A}
.legal{display:flex;flex-wrap:wrap;gap:0 20px}
.st :focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .45s ease both}
@media(max-width:1080px){.nav,.tel{display:none}.burger{display:inline-flex}.mnav{display:grid;gap:6px;padding:4px 16px 16px}}
@media(max-width:720px){.wrap{padding:0 16px}.sec{padding:80px 0}.topbar-note{display:none}.hdr-cta{display:none}}
@media (prefers-reduced-motion:reduce){.st *{animation:none !important;transition:none !important}}

/* ---- Secteurs ---- */
.phero{padding:64px 0 44px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;align-items:end}
.h1{font-size:clamp(44px,7vw,104px);line-height:.92;letter-spacing:-.055em;font-weight:800;margin-top:18px;overflow-wrap:anywhere}
.h1 em{font-style:normal;color:var(--acc)}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:8px;background:#ECEDEA;border-radius:30px;padding:8px;align-items:start}
.list{background:#FAFAF8;border-radius:24px;padding:10px;display:grid;gap:2px;position:sticky;top:92px}
.sbtn{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 12px;border:0;border-radius:14px;text-align:left;cursor:pointer;font:500 15px/1.2 'Onest',sans-serif;color:#16181A;transition:background .2s,color .2s,padding .25s}
.sbtn:hover{background:#ECEDEA;padding-left:16px}
.sbtn .ix{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.7}
.sbtn .tp{font-family:'JetBrains Mono',monospace;font-size:10px;padding:4px 7px;border-radius:6px;white-space:nowrap}
.detail{display:flex;flex-direction:column;gap:8px;min-width:0}
.dhero{position:relative;border-radius:24px;overflow:hidden;height:380px;background:#16181A}
.dhero img{width:100%;height:380px;object-fit:cover;opacity:.88;animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.dcap{position:absolute;left:0;right:0;bottom:0;padding:28px;background:linear-gradient(0deg,rgba(22,24,26,.82),rgba(22,24,26,0));color:#fff}
.dcap h2{font-size:clamp(36px,5vw,72px);font-weight:800;letter-spacing:-.05em;line-height:.95;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.card{background:#fff;border-radius:24px;padding:28px}
.ctitle{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ctitle h3{font-size:20px;font-weight:700;letter-spacing:-.02em}
.flag{font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 9px;border-radius:7px;background:#FBEFD9;color:#6A4A12}
.scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.band{position:relative;border-radius:16px;padding:16px 14px 14px;min-height:108px;display:flex;flex-direction:column;justify-content:space-between;transition:background .35s,color .35s,transform .35s,box-shadow .35s}
.band b{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;letter-spacing:-.03em}
.band span{font-size:12px;line-height:1.3}
.band .dot{position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;background:var(--acc);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,42,32,.45)}50%{box-shadow:0 0 0 8px rgba(212,42,32,0)}}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:8px}
.mcard{display:flex;flex-direction:column;text-decoration:none;color:#16181A;border-radius:18px;overflow:hidden;background:#F5F5F2;transition:transform .3s,box-shadow .3s;animation:fade .45s ease both}
.mcard:hover{transform:translateY(-3px);box-shadow:0 0 0 1px #16181A}
.mst{height:130px;padding:58px 44px 20px 24px;display:flex;align-items:flex-end;background-image:linear-gradient(#ECEDEA 1px,transparent 1px),linear-gradient(90deg,#ECEDEA 1px,transparent 1px);background-size:14px 14px}
.counter{position:relative;z-index:0;display:flex;align-items:flex-end;width:100%;max-width:120px;transition:transform .35s}
.mcard:hover .counter{transform:translateY(-3px)}
.mbd{padding:12px 14px 14px;background:#fff;flex:1}
.mbd b{display:block;font-size:14px;line-height:1.25}
.mbd span{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:#5B6066;margin-top:4px}
.reals{display:grid;gap:6px}
.ritem{display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:center;gap:14px;min-height:60px;padding:0 16px;border-radius:14px;background:#F5F5F2;text-decoration:none;color:#16181A;transition:background .2s,transform .2s}
.ritem:hover{background:#ECEDEA;transform:translateX(4px)}
.ritem .n{font-family:'JetBrains Mono',monospace;font-size:12px;color:#5B6066}
.badge{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;background:#16181A;color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px}
.none{padding:18px;border-radius:14px;border:1.5px dashed #C4C6C1;color:#5B6066;font-size:14px}
.matrix{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:40px}
.col{background:#ECEDEA;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:280px}
.col h3{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;letter-spacing:-.03em}
.col p{font-size:12px;color:#5B6066;margin-bottom:8px}
.mchip{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 12px;border:0;border-radius:12px;font:500 14px/1.2 'Onest',sans-serif;cursor:pointer;text-align:left;transition:background .2s,color .2s,transform .15s}
.mchip:hover{transform:translateX(3px)}
@media(max-width:1080px){.layout{grid-template-columns:minmax(0,1fr)}.list{position:static;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr))}.matrix{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:960px){.phero{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){.scale{grid-template-columns:repeat(2,minmax(0,1fr))}.dhero,.dhero img{height:280px}.card{padding:20px}.matrix{grid-template-columns:minmax(0,1fr)}.col{min-height:0}}
</style>
</helmet>
<div class="st" style="{{ rootStyle }}">

<div class="topbar">
  <div class="wrap topbar-in">
    <span class="mono topbar-note">Proposition 06 · Studio — configurateur</span>
    <a href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Toutes les propositions</a>
  </div>
</div>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="Studio-Accueil.html" aria-label="RGTE, R.G. Technologies — accueil">
      <span class="logo-glyph" aria-hidden="true"><i style="height:12px"></i><i style="height:24px;background:var(--acc)"></i><i style="height:17px"></i></span>
      <span><span class="logo-word">RGTE</span><span class="logo-sub">R.G. Technologies</span></span>
    </a>
    <nav class="nav" aria-label="Navigation principale">
      <a class="nav-a" href="Studio-Lignes.html">Lignes</a>
      <a class="nav-a on" href="Studio-Secteurs.html" aria-current="page">Secteurs</a>
      <a class="nav-a" href="Studio-Realisations.html">Réalisations</a>
      <a class="nav-a" href="Studio-Contact.html">Showroom &amp; contact</a>
    </nav>
    <div class="hdr-r">
      <a class="tel" href="tel:0800951313"><span class="tel-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16181A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg></span><span><b>0 800 95 13 13</b><small>Appel gratuit</small></span></a>
      <a class="btn btn-acc btn-sm hdr-cta" href="Studio-Contact.html">Plan 3D offert</a>
      <button type="button" class="burger" aria-label="Ouvrir ou fermer le menu" onClick="{{ toggleMenu }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav fade" aria-label="Navigation mobile">
      <a href="Studio-Lignes.html">Lignes <span class="mono">01</span></a>
      <a href="Studio-Secteurs.html">Secteurs <span class="mono">02</span></a>
      <a href="Studio-Realisations.html">Réalisations <span class="mono">03</span></a>
      <a href="Studio-Contact.html">Showroom &amp; contact <span class="mono">04</span></a>
      <a href="tel:0800951313">0 800 95 13 13 <span class="mono">Gratuit</span></a>
      <a href="Studio-Contact.html" style="background:var(--acc);color:#fff">Plan 3D offert <span class="mono">→</span></a>
    </nav>
  </sc-if>
</header>

<main>
<section class="wrap">
  <div class="phero">
    <div class="rise">
      <span class="eyebrow"><i></i>Secteurs d'activité</span>
      <h1 class="h1">Votre métier,<br><em>votre froid.</em></h1>
    </div>
    <p class="lead rise d2">Treize métiers de bouche. Sélectionnez le vôtre : plage de température, modules conseillés et réalisations liées s'affichent. Les recommandations marquées « à valider » sont confirmées par le bureau d'études.</p>
  </div>

  <div class="layout rise d3">
    <div class="list" role="tablist" aria-label="Secteurs d'activité">
      <sc-for list="{{ sectors }}" as="s" hint-placeholder-count="13">
        <button type="button" role="tab" class="sbtn" style="{{ s.style }}" aria-selected="{{ s.on }}" onClick="{{ s.pick }}"><span class="ix">{{ s.n }}</span><span>{{ s.name }}</span><span class="tp" style="{{ s.tpStyle }}">{{ s.short }}</span></button>
      </sc-for>
    </div>

    <div class="detail">
      <div class="dhero">
        <sc-for list="{{ heroImg }}" as="h" hint-placeholder-count="1"><img src="{{ h.img }}" alt="{{ h.alt }}"></sc-for>
        <div class="dcap">
          <span class="mono" style="font-size:12px;opacity:.85">SECTEUR {{ cur.n }} / 13 · image d'ambiance</span>
          <h2 style="margin-top:8px">{{ cur.name }}</h2>
        </div>
      </div>

      <div class="card">
        <div class="ctitle"><h3>Plage de température</h3><sc-if value="{{ cur.tFlag }}" hint-placeholder-val="{{ false }}"><span class="flag">à valider</span></sc-if></div>
        <div class="scale">
          <sc-for list="{{ bands }}" as="b" hint-placeholder-count="4">
            <div class="band" style="{{ b.style }}">
              <sc-if value="{{ b.on }}" hint-placeholder-val="{{ false }}"><span class="dot" aria-hidden="true"></span></sc-if>
              <b>{{ b.range }}</b><span>{{ b.label }}</span>
            </div>
          </sc-for>
        </div>
        <p class="mono" style="font-size:12px;color:#5B6066;margin-top:14px">{{ cur.tNote }}</p>
      </div>

      <div class="card">
        <div class="ctitle"><h3>Modules conseillés</h3><sc-if value="{{ cur.mFlag }}" hint-placeholder-val="{{ false }}"><span class="flag">à valider</span></sc-if></div>
        <div class="mods">
          <sc-for list="{{ mods }}" as="m" hint-placeholder-count="4">
            <a class="mcard" href="Studio-Module.html" aria-label="{{ m.aria }}">
              <div class="mst">
                <div class="counter">
                  <sc-for list="{{ m.blk }}" as="b" hint-placeholder-count="1">
                    <div style="{{ b.wStyle }}">
                      <span style="{{ b.topStyle }}"></span>
                      <sc-if value="{{ b.hasGlass }}" hint-placeholder-val="{{ true }}">
                        <span style="{{ b.glassStyle }}"><span style="{{ b.glassTopStyle }}"></span><span style="{{ b.shelfStyle }}"></span><span style="{{ b.treat2Style }}"></span><span style="{{ b.treatStyle }}"></span></span>
                      </sc-if>
                      <sc-if value="{{ b.isCaisse }}" hint-placeholder-val="{{ false }}"><span style="{{ b.regStyle }}"></span></sc-if>
                      <span style="{{ b.edgeStyle }}"></span>
                      <span style="{{ b.panelStyle }}"></span>
                      <span style="{{ b.plinthStyle }}"></span>
                    </div>
                  </sc-for>
                  <span style="{{ m.side }}"></span>
                </div>
              </div>
              <div class="mbd"><b>{{ m.name }}</b><span>Ligne {{ m.line }}</span></div>
            </a>
          </sc-for>
        </div>
      </div>

      <div class="card">
        <div class="ctitle"><h3>Réalisations liées</h3><span class="mono" style="font-size:12px;color:#5B6066">{{ realCount }}</span></div>
        <sc-if value="{{ hasReals }}" hint-placeholder-val="{{ true }}">
          <div class="reals">
            <sc-for list="{{ reals }}" as="r" hint-placeholder-count="2">
              <a class="ritem" href="Studio-Realisations.html"><span class="n">N° {{ r.n }}</span><span><b style="font-size:15px">{{ r.title }}</b><br><span style="font-size:13px;color:#5B6066">{{ r.place }} · {{ r.mods }}</span></span><span class="badge">{{ r.line }}</span></a>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ noReals }}" hint-placeholder-val="{{ false }}">
          <p class="none">Aucune réalisation présentée pour ce secteur pour l'instant — [À COMPLÉTER].</p>
        </sc-if>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
          <a class="btn btn-acc" href="Studio-Accueil.html#composer">Composer ce linéaire<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
          <a class="btn btn-ghost" href="Studio-Contact.html">Demande de devis</a>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <span class="eyebrow"><i></i>Vue d'ensemble</span>
    <h2 class="h2" style="margin-top:16px;max-width:880px">Les secteurs rangés par plage de température.</h2>
    <p class="lead" style="margin-top:14px;max-width:640px">Plages issues des modules RGTE. Un astérisque signale une association à valider. Cliquez un secteur pour l'ouvrir plus haut.</p>
    <div class="matrix">
      <sc-for list="{{ matrix }}" as="c" hint-placeholder-count="5">
        <div class="col">
          <h3>{{ c.range }}</h3>
          <p>{{ c.label }}</p>
          <sc-for list="{{ c.items }}" as="i" hint-placeholder-count="3">
            <button type="button" class="mchip" style="{{ i.style }}" onClick="{{ i.pick }}">{{ i.name }}<span class="mono" style="font-size:11px">{{ i.star }}</span></button>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
</section>
</main>
