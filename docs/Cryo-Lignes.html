<body>

<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F1F5F7}
.cx,.cx *{box-sizing:border-box}
.cx{font-family:'Sora',system-ui,sans-serif;color:#0F1C24;background:#F1F5F7;-webkit-font-smoothing:antialiased;line-height:1.55}
.cx a{color:inherit}
.cx h1,.cx h2,.cx h3,.cx p{margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.04em}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.tnum{font-variant-numeric:tabular-nums}
.navl{position:relative;text-decoration:none;font-size:14px;font-weight:500;display:inline-flex;align-items:center;min-height:44px}
.navl::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:1px;background:#3A7CA5;transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.navl:hover::after,.navl.on::after{transform:scaleX(1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font:600 14px/1 'Sora',sans-serif;text-decoration:none;border:0;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s,border-color .25s}
.btn-red{background:#D42A20;color:#fff!important;box-shadow:0 12px 26px -14px rgba(212,42,32,.75)}
.btn-red:hover{transform:translateY(-2px);box-shadow:0 18px 32px -14px rgba(212,42,32,.85)}
.btn-ghost{background:rgba(255,255,255,.62);color:#0F1C24;border:1px solid rgba(15,28,36,.16)}
.btn-ghost:hover{background:#fff;border-color:#3A7CA5}
.btn-dark{background:#0F1C24;color:#fff!important}
.btn-dark:hover{transform:translateY(-2px);background:#1B2F3B}
.frost{background:linear-gradient(160deg,rgba(255,255,255,.80),rgba(255,255,255,.46));backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 30px 60px -32px rgba(15,28,36,.32)}
.dew{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.95) 0 1.1px,transparent 1.7px),radial-gradient(circle,rgba(15,28,36,.10) 0 1.6px,transparent 2.2px),radial-gradient(circle,rgba(255,255,255,.85) 0 2.2px,transparent 3px),radial-gradient(circle,rgba(58,124,165,.16) 0 .8px,transparent 1.3px);background-size:23px 19px,47px 41px,71px 63px,13px 17px;background-position:0 0,12px 9px,30px 22px,5px 3px}
.gridbg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(15,28,36,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(15,28,36,.05) 1px,transparent 1px);background-size:64px 64px}
.lab{font-size:12px;color:#2B6688;display:flex;gap:12px;align-items:center;text-transform:uppercase}
.lab i{display:inline-block;width:40px;height:1px;background:#3A7CA5}
.h2{font-size:clamp(32px,4.2vw,58px);font-weight:300;letter-spacing:-.025em;line-height:1.05}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(15,28,36,.14);background:rgba(255,255,255,.7);font-size:13.5px;cursor:pointer;font-family:'Sora',sans-serif;transition:border-color .25s,background .25s,color .25s}
.chip:hover{border-color:#3A7CA5}
.tab{cursor:pointer;border:0;font-family:'Sora',sans-serif;text-align:left;transition:background .3s,color .3s,box-shadow .3s,transform .3s}
.tab:hover{transform:translateY(-2px)}
.mod{display:flex;flex-direction:column;text-decoration:none;border-radius:20px;padding:20px;min-height:200px;background:rgba(255,255,255,.75);border:1px solid rgba(15,28,36,.09);position:relative;overflow:hidden;transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s,background .4s;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.mod:hover{transform:translateY(-5px);background:#fff;box-shadow:0 26px 44px -28px rgba(15,28,36,.45)}
.mod .go{transition:transform .35s}
.mod:hover .go{transform:translateX(4px)}
.colh{cursor:pointer;border:0;font-family:'Sora',sans-serif;text-align:left;width:100%;transition:background .3s,color .3s}
.colh:hover{background:#DDE7EC}
.spec{transition:background .3s}
.spec:hover{background:rgba(255,255,255,.9)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{transform-origin:left;animation:sweep 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes flow{to{stroke-dashoffset:-96}}
.flow{stroke-dasharray:6 10;animation:flow 2s linear infinite}
:focus-visible{outline:2px solid #3A7CA5;outline-offset:3px}
.burger{display:none!important}
@media(max-width:980px){.navd{display:none!important}.burger{display:inline-flex!important}}
@media(max-width:640px){.wrap{padding:0 18px}.hide-sm{display:none!important}}
@media(prefers-reduced-motion:reduce){.cx *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="cx">

<header style="position:sticky;top:0;z-index:50;background:rgba(241,245,247,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(15,28,36,.08)">
  <div class="mono" style="background:#0F1C24;color:#C9D7DF;font-size:11.5px">
    <div class="wrap" style="display:flex;justify-content:space-between;gap:16px;min-height:34px;align-items:center">
      <span class="hide-sm">BUREAU D'ÉTUDES &amp; SHOW-ROOM · PUGET-SUR-ARGENS (83)</span>
      <a href="tel:0800951313" style="text-decoration:none;color:#fff;display:inline-flex;align-items:center;min-height:34px">N° VERT 0 800 95 13 13 · APPEL GRATUIT</a>
    </div>
  </div>
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:76px">
    <a href="Cryo-Accueil.html" aria-label="RGTE, retour à l'accueil" style="display:flex;align-items:center;gap:14px;text-decoration:none;min-height:44px">
      <span style="font-weight:700;font-size:26px;letter-spacing:.08em">RGTE</span>
      <span style="width:1px;height:30px;background:rgba(15,28,36,.25)"></span>
      <span class="mono" style="font-size:10.5px;line-height:1.3;color:#4A5D69">R.G.<br>TECHNOLOGIES</span>
    </a>
    <nav class="navd" aria-label="Navigation principale" style="display:flex;gap:32px">
      <a class="navl on" href="Cryo-Lignes.html" aria-current="page">Lignes</a>
      <a class="navl" href="Cryo-Secteurs.html">Secteurs</a>
      <a class="navl" href="Cryo-Realisations.html">Réalisations</a>
      <a class="navl" href="Cryo-Contact.html">Showroom &amp; contact</a>
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="btn btn-ghost navd" href="tel:0800951313" style="font-family:'IBM Plex Mono',monospace;font-weight:500">0 800 95 13 13</a>
      <a class="btn btn-red navd" href="Cryo-Contact.html" style="{{ ctaStyle }}">Plan 3D offert</a>
      <button type="button" class="btn btn-ghost burger" aria-label="Ouvrir ou fermer le menu" onClick="{{ toggleMenu }}" style="width:48px;padding:0">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#0F1C24" stroke-width="1.6"><path d="M3 6h14M3 10h14M3 14h14"></path></svg>
      </button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid rgba(15,28,36,.08);background:#F1F5F7">
      <div class="wrap" style="display:flex;flex-direction:column;padding-top:8px;padding-bottom:20px">
        <a class="navl" href="Cryo-Lignes.html">Lignes</a>
        <a class="navl" href="Cryo-Secteurs.html">Secteurs</a>
        <a class="navl" href="Cryo-Realisations.html">Réalisations</a>
        <a class="navl" href="Cryo-Contact.html">Showroom &amp; contact</a>
        <a class="btn btn-red" href="Cryo-Contact.html" style="margin-top:12px">Plan 3D offert</a>
      </div>
    </div>
  </sc-if>
</header>

<!-- EN-TÊTE DE PAGE -->
<section style="position:relative;overflow:hidden;background:#E3EDF2">
  <div aria-hidden="true" class="gridbg"></div>
  <div aria-hidden="true" class="dew" style="opacity:.7"></div>
  <div class="wrap" style="position:relative;padding-top:64px;padding-bottom:72px">
    <div class="mono rise" style="font-size:11.5px;color:#4A5D69"><a href="Cryo-Accueil.html" style="text-decoration:none">ACCUEIL</a> / LIGNES D'AGENCEMENT</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:40px;align-items:end;margin-top:26px">
      <h1 class="rise d1" style="font-size:clamp(44px,7vw,108px);font-weight:200;letter-spacing:-.045em;line-height:.95;overflow-wrap:anywhere">Lignes<br><span style="font-weight:600">d'agencement.</span></h1>
      <div class="rise d2">
        <p style="font-size:17px;color:#33454F;max-width:520px">Cinq familles de vitrines et de comptoirs : de la composition libre de la Ligne Basique aux vitrines standardisées Industry. Chaque module s'ouvre sur sa fiche.</p>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:rgba(15,28,36,.12);border-radius:18px;overflow:hidden;margin-top:26px;border:1px solid rgba(15,28,36,.12)">
          <div style="background:rgba(255,255,255,.75);padding:16px 18px"><div class="mono" style="font-size:10.5px;color:#4A5D69">LIGNES</div><div class="tnum" style="font-size:34px;font-weight:200">05</div></div>
          <div style="background:rgba(255,255,255,.75);padding:16px 18px"><div class="mono" style="font-size:10.5px;color:#4A5D69">RÉFÉRENCES</div><div class="tnum" style="font-size:34px;font-weight:200">{{ total }}</div></div>
          <div style="background:rgba(255,255,255,.75);padding:16px 18px"><div class="mono" style="font-size:10.5px;color:#4A5D69">PLAGE</div><div class="tnum" style="font-size:22px;font-weight:300;margin-top:8px">−2 → <span style="color:#B3241B">+90</span> °C</div></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- SÉLECTEUR -->
<section style="padding:56px 0 0">
  <div class="wrap">
    <div role="tablist" aria-label="Choisir une ligne" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px">
      <sc-for list="{{ lignes }}" as="l" hint-placeholder-count="5">
        <button type="button" role="tab" class="tab" style="{{ l.st }}" onClick="{{ l.pick }}" aria-selected="{{ l.on }}">
          <span class="mono" style="display:flex;justify-content:space-between;font-size:11px;opacity:.75"><span>{{ l.code }}</span><span>{{ l.cnt }}</span></span>
          <span style="display:block;font-size:22px;font-weight:500;margin-top:8px">{{ l.n }}</span>
          <span style="display:block;font-size:12.5px;opacity:.8;margin-top:2px">{{ l.tag }}</span>
        </button>
      </sc-for>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:24px;margin-top:24px">
      <div class="frost" style="border-radius:28px;padding:36px">
        <div class="mono" style="font-size:11.5px;color:#2B6688">{{ lig.code }} · LIGNE {{ lig.up }}</div>
        <h2 style="font-size:clamp(40px,5vw,68px);font-weight:300;letter-spacing:-.035em;line-height:1;margin-top:12px">{{ lig.n }}</h2>
        <p style="font-size:18px;font-weight:300;margin-top:18px;color:#1E2F39">{{ lig.desc }}</p>
        <div style="margin-top:26px">
          <div class="spec" style="display:flex;justify-content:space-between;gap:16px;padding:14px 8px;border-bottom:1px dashed rgba(15,28,36,.2)"><span class="mono" style="font-size:11.5px;color:#4A5D69">STRUCTURE</span><span style="text-align:right;font-weight:500">{{ lig.st }}</span></div>
          <div class="spec" style="display:flex;justify-content:space-between;gap:16px;padding:14px 8px;border-bottom:1px dashed rgba(15,28,36,.2)"><span class="mono" style="font-size:11.5px;color:#4A5D69">PANNEAU FRONTAL</span><span style="text-align:right;font-weight:500">{{ lig.fr }}</span></div>
          <div class="spec" style="display:flex;justify-content:space-between;gap:16px;padding:14px 8px;border-bottom:1px dashed rgba(15,28,36,.2)"><span class="mono" style="font-size:11.5px;color:#4A5D69">PLAN DE TRAVAIL</span><span style="text-align:right;font-weight:500">{{ lig.pl }}</span></div>
          <div class="spec" style="display:flex;justify-content:space-between;gap:16px;padding:14px 8px;border-bottom:1px dashed rgba(15,28,36,.2)"><span class="mono" style="font-size:11.5px;color:#4A5D69">FORMAT</span><span style="text-align:right;font-weight:500">{{ lig.fmt }}</span></div>
          <div class="spec" style="display:flex;justify-content:space-between;gap:16px;padding:14px 8px;border-bottom:1px dashed rgba(15,28,36,.2)"><span class="mono" style="font-size:11.5px;color:#4A5D69">MODES</span><span style="text-align:right;font-weight:500">{{ lig.modes }}</span></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="position:relative;border-radius:28px;overflow:hidden;height:300px;background:#0F1C24">
          <img src="{{ lig.img }}" alt="{{ lig.alt }}" style="width:100%;height:300px;object-fit:cover;display:block">
          <span class="mono" style="position:absolute;left:14px;top:14px;padding:6px 10px;border-radius:999px;background:rgba(15,28,36,.6);color:#fff;font-size:11px">PHOTO D'AMBIANCE</span>
        </div>
        <div style="position:relative;border-radius:28px;background:#0F1C24;padding:20px 22px;overflow:hidden">
          <div class="mono" style="display:flex;justify-content:space-between;font-size:11px;color:#7FB3D3"><span>ÉLÉVATION · SCHÉMA</span><span>{{ lig.up }}</span></div>
          <svg viewBox="0 0 640 200" role="img" aria-label="{{ lig.aria }}" style="width:100%;height:auto;display:block;margin-top:10px">
            <path d="M30 186 L610 186" stroke="rgba(127,179,211,.4)"></path>
            <rect x="40" y="96" width="170" height="84" rx="3" fill="{{ lig.face }}" stroke="#DDE7EC" stroke-dasharray="{{ lig.dash }}"></rect>
            <rect x="214" y="96" width="170" height="84" rx="3" fill="{{ lig.face }}" stroke="#DDE7EC" stroke-dasharray="{{ lig.dash }}"></rect>
            <rect x="388" y="96" width="110" height="84" rx="3" fill="{{ lig.face }}" stroke="#DDE7EC" stroke-dasharray="{{ lig.dash }}"></rect>
            <rect x="502" y="70" width="98" height="110" rx="3" fill="{{ lig.face }}" stroke="#DDE7EC" stroke-dasharray="{{ lig.dash }}"></rect>
            <rect x="36" y="88" width="568" height="8" rx="2" fill="{{ lig.top }}"></rect>
            <rect x="40" y="176" width="560" height="8" fill="{{ lig.plinth }}"></rect>
            <path d="M44 88 L44 52 Q46 26 80 24 L206 24 L206 88" fill="rgba(168,210,234,.16)" stroke="#A8D2EA" stroke-width="1.4"></path>
            <path d="M218 88 L218 52 Q220 26 254 24 L380 24 L380 88" fill="rgba(168,210,234,.16)" stroke="#A8D2EA" stroke-width="1.4"></path>
            <path class="flow" d="M196 80 C190 40 150 34 110 36 C80 38 60 52 58 80" fill="none" stroke="#7FB3D3" stroke-width="1.4"></path>
            <path class="flow" d="M370 80 C364 40 324 34 284 36 C254 38 234 52 232 80" fill="none" stroke="#7FB3D3" stroke-width="1.4"></path>
            <text x="58" y="146" fill="{{ lig.ink }}" font-family="IBM Plex Mono" font-size="12">{{ lig.label }}</text>
            <text x="400" y="146" fill="{{ lig.ink }}" font-family="IBM Plex Mono" font-size="12">CAISSE</text>
          </svg>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- MODULES -->
<section style="padding:80px 0 40px">
  <div class="wrap">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:end">
      <div>
        <div class="lab mono"><span>{{ lig.code }}</span><i></i><span>Modules de la ligne</span></div>
        <h2 class="h2" style="margin-top:20px">{{ shownTxt }}</h2>
      </div>
      <div role="group" aria-label="Filtrer par type" style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
          <button type="button" class="chip" style="{{ f.st }}" onClick="{{ f.pick }}" aria-pressed="{{ f.on }}">{{ f.n }} <span class="mono" style="font-size:11px;opacity:.7">{{ f.c }}</span></button>
        </sc-for>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px;margin-top:34px">
      <sc-for list="{{ mods }}" as="m" hint-placeholder-count="8">
        <a class="mod" href="Cryo-Module.html" style="{{ m.st }}">
          <span class="mono" style="display:flex;justify-content:space-between;font-size:11px;color:#4A5D69"><span>{{ m.k }}</span><span style="{{ m.tagSt }}">{{ m.type }}</span></span>
          <span style="display:block;font-size:20px;font-weight:500;letter-spacing:-.01em;margin-top:16px">{{ m.n }}</span>
          <span style="display:block;font-size:13.5px;color:#33454F;margin-top:6px;flex:1">{{ m.note }}</span>
          <span style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
            <span class="mono tnum" style="{{ m.tSt }}">{{ m.t }}</span>
            <svg class="go" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#0F1C24" stroke-width="1.5" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"></path></svg>
          </span>
        </a>
      </sc-for>
    </div>
    <sc-if value="{{ none }}" hint-placeholder-val="{{ false }}">
      <div class="frost" style="border-radius:20px;padding:28px;margin-top:14px">
        <p style="font-size:16px">Aucun module de ce type dans la Ligne {{ lig.n }}. <button type="button" class="chip" onClick="{{ resetFilter }}" style="margin-left:8px">Afficher tout</button></p>
      </div>
    </sc-if>
  </div>
</section>

<!-- COMPARATEUR -->
<section style="padding:80px 0">
  <div class="wrap">
    <div class="lab mono"><span>CMP</span><i></i><span>Comparateur</span></div>
    <h2 class="h2" style="margin-top:20px">Les cinq lignes, côte à côte.</h2>
    <p class="mono" style="margin-top:14px;font-size:11.5px;color:#4A5D69">CLIQUER SUR UNE COLONNE POUR LA SÉLECTIONNER</p>
    <div style="overflow-x:auto;margin-top:26px;border-radius:24px;border:1px solid rgba(15,28,36,.1);background:#fff">
      <div style="min-width:980px">
        <div style="display:grid;grid-template-columns:180px repeat(5,minmax(0,1fr))">
          <div style="padding:18px 20px;border-bottom:1px solid rgba(15,28,36,.1)"></div>
          <sc-for list="{{ lignes }}" as="c" hint-placeholder-count="5">
            <button type="button" class="colh" style="{{ c.colSt }}" onClick="{{ c.pick }}" aria-pressed="{{ c.on }}">
              <span class="mono" style="display:block;font-size:10.5px;opacity:.75">{{ c.code }}</span>
              <span style="display:block;font-size:18px;font-weight:600">{{ c.n }}</span>
            </button>
          </sc-for>
        </div>
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
          <div style="display:grid;grid-template-columns:180px repeat(5,minmax(0,1fr))">
            <div class="mono" style="padding:16px 20px;font-size:11px;color:#4A5D69;border-bottom:1px solid rgba(15,28,36,.08)">{{ r.k }}</div>
            <sc-for list="{{ r.cells }}" as="cell" hint-placeholder-count="5">
              <div style="{{ cell.st }}">{{ cell.v }}</div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</section>

<!-- INSTRUMENT : PLAGES STONE -->
<section style="background:#0F1C24;color:#E6EEF2;padding:100px 0;position:relative;overflow:hidden">
  <div aria-hidden="true" style="position:absolute;inset:0;background-image:linear-gradient(rgba(127,179,211,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(127,179,211,.07) 1px,transparent 1px);background-size:48px 48px"></div>
  <div class="wrap" style="position:relative">
    <div class="lab mono" style="color:#7FB3D3"><span>STONE</span><i style="background:#7FB3D3"></i><span>Plages de température</span></div>
    <h2 class="h2" style="margin-top:20px;max-width:760px">Chaque module, sa plage.</h2>
    <div style="margin-top:40px;border:1px solid rgba(127,179,211,.22);border-radius:24px;padding:10px 24px 24px;background:rgba(255,255,255,.03)">
      <div class="hide-sm" style="display:grid;grid-template-columns:200px 1fr 160px;gap:20px;padding:14px 0;border-bottom:1px solid rgba(127,179,211,.2)">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4700},"accent":{"editor":"color","default":"#D42A20","options":["#D42A20","#0F1C24","#3A7CA5"]},"ligne":{"editor":"enum","default":"stone","options":["basique","stone","legno","encastrable","industry"]}}'>

      { code:'L-05', n:'Industry', tag:'Standardisée', img:'assets/vitrine-bakery-tall.webp', alt:'Vitrine haute de boulangerie',

    const list = L0.mods.filter(m => s.filtre==='tous' || m.type===s.filtre);
    const mods = list.map((m,i) => { const hot = m.type==='chaud'; const feat = m.n==='Gourmandise';
      return Object.assign({}, m, {

    const ROWS = [ ['STRUCTURE','st'], ['PANNEAU FRONTAL','fr'], ['PLAN DE TRAVAIL','pl'], ['FORMAT','fmt'], ['MODES','modes'], ['MODULES','cnt'] ];
