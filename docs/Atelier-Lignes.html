<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Atelier — Lignes</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Young+Serif&amp;display=swap">
<style>
body{margin:0;background:#F3ECE1}
*,*::before,*::after{box-sizing:border-box}
sc-for,sc-if{display:contents}
.at{font-family:'Manrope',system-ui,sans-serif;color:#4A3426;background:#F3ECE1;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.at img{display:block;max-width:100%}
.at a{color:inherit}
.at button,.at input{font:inherit;color:inherit}
.at h1,.at h2,.at h3,.at h4,.at p{margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.serif{font-family:'Young Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.sc{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
.crust{color:#8A4F22}
.kraft{background-color:#D9C6A5;background-image:radial-gradient(rgba(74,52,38,.11) 1px,transparent 1.4px),radial-gradient(rgba(255,255,255,.3) 1px,transparent 1.6px);background-size:7px 7px,13px 13px;background-position:0 0,4px 6px}
.wood{background-color:#4A3426;background-image:repeating-linear-gradient(179.4deg,rgba(255,232,200,.05) 0 2px,transparent 2px 6px,rgba(0,0,0,.12) 6px 7px,transparent 7px 15px,rgba(168,100,46,.18) 15px 16px,transparent 16px 27px),repeating-linear-gradient(90deg,transparent 0 359px,rgba(0,0,0,.28) 359px 361px),linear-gradient(180deg,#56402F,#3E2B1F)}
.at :focus-visible{outline:3px solid #4A3426;outline-offset:3px}
.on-dark :focus-visible{outline-color:#F3ECE1}
.topbar{font-size:13px}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:0 24px;min-height:44px;flex-wrap:wrap}
.topbar a{text-decoration:none;font-weight:700;min-height:44px;display:inline-flex;align-items:center}
.topbar a:hover{text-decoration:underline;text-underline-offset:3px}
.hdr{position:relative;z-index:20;background:#F3ECE1;border-bottom:1px solid rgba(74,52,38,.16)}
.hdr-in{display:flex;align-items:center;gap:20px;min-height:86px}
.logo{display:inline-flex;flex-direction:column;text-decoration:none;line-height:1;margin-right:auto;padding:6px 0}
.logo-w{font-family:'Young Serif',Georgia,serif;font-size:34px;letter-spacing:.06em;position:relative;display:inline-block;padding-right:14px}
.logo-w::after{content:'';position:absolute;right:0;top:3px;width:9px;height:9px;border-radius:50%;background:var(--ac)}
.logo-s{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:800;margin-top:7px}
.nav{display:flex;align-items:center;gap:2px}
.navlink{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;text-decoration:none;font-weight:600;font-size:15px}
.navlink::after{content:'';position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:#A8642E;transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.navlink:hover::after,.navlink.on::after{transform:scaleX(1)}
.tel-h{display:inline-flex;flex-direction:column;line-height:1.15;text-decoration:none;padding:4px 0 4px 18px;border-left:1px solid rgba(74,52,38,.2);min-height:44px;justify-content:center}
.tel-h b{font-size:16px;font-weight:800;letter-spacing:.02em}
.tel-h span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#8A4F22}
.btn-stamp{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border:0;border-radius:2px;background:var(--ac);color:#fff;text-decoration:none;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 0 0 3px #F3ECE1,0 0 0 4.5px var(--ac);cursor:pointer;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.btn-stamp:hover{transform:rotate(-1.5deg) translateY(-2px);box-shadow:0 0 0 4px #F3ECE1,0 0 0 5.5px var(--ac),0 12px 22px -8px rgba(42,29,21,.5)}
.at .btn-stamp{color:#fff}
.btn-line{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border:1.5px solid currentColor;border-radius:2px;background:transparent;text-decoration:none;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.btn-line:hover{background:#4A3426;color:#F3ECE1;border-color:#4A3426}
.burger{display:none;width:48px;height:48px;border:1.5px solid rgba(74,52,38,.35);border-radius:2px;background:transparent;align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none}
.ft{color:#F3ECE1;padding:72px 0 24px}
.ft-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px}
.ft h4{margin:0 0 14px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#D9C6A5;font-weight:800}
.ft a{text-decoration:none}
.ft a:hover{text-decoration:underline;text-underline-offset:3px}
.ft-links{display:flex;flex-direction:column}
.ft-links a{min-height:44px;display:inline-flex;align-items:center}
.ft-bot{display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between;align-items:center;margin-top:48px;padding-top:12px;border-top:1px solid rgba(243,236,225,.2);font-size:13.5px}
.ft-legal{display:flex;flex-wrap:wrap;gap:0 20px}
.ft-legal a{min-height:44px;display:inline-flex;align-items:center}
.ft-note{color:#D9C6A5;font-size:12.5px;letter-spacing:.08em}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rv{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .55s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}
.sec{padding:100px 0}
.kick{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.kick::before{content:'';width:34px;height:1.5px;background:#A8642E}
.h2{font-size:clamp(32px,4vw,54px);line-height:1.05}
.lead{font-size:18px;line-height:1.65;max-width:640px}

/* hero : étagère de 5 vitrines */
.ph{padding:80px 0 0}
.h1{font-size:clamp(42px,6.2vw,92px);line-height:.98;overflow-wrap:anywhere}
.rack{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;align-items:end;margin-top:64px;padding:0 12px}
.mv{display:block;width:100%;padding:0 0 14px;border:0;background:none;cursor:pointer;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.mv:hover{transform:translateY(-8px)}
.mv-g{position:relative;height:78px;border:1.5px solid rgba(74,52,38,.45);border-bottom:0;border-radius:64px 4px 0 0;background:linear-gradient(115deg,rgba(255,255,255,.85),rgba(255,255,255,.2) 40%,rgba(255,255,255,.6) 60%,rgba(255,255,255,.15))}
.mv-g::after{content:'';position:absolute;left:18%;right:8%;bottom:6px;height:14px;background:radial-gradient(ellipse 8px 6px at 50% 60%,#A8642E 0 95%,transparent 100%) 0 0/22px 14px repeat-x}
.mv-t{height:8px}
.mv-b{height:64px}
.mv-p{height:8px}
.mv-l{display:block;margin-top:12px;font-family:'Young Serif',Georgia,serif;font-size:20px;text-align:center}
.plank{height:26px;position:relative;box-shadow:0 18px 24px -12px rgba(42,29,21,.55)}
.plank::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,236,210,.2)}

/* fiche ligne */
.lband{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:56px;align-items:center}
.spec{margin-top:28px;border-top:1.5px solid #4A3426}
.spec-r{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid rgba(74,52,38,.22)}
.vt{width:100%;max-width:520px;margin:0 auto;position:relative}
.vt-glass{position:relative;height:190px;border:2px solid rgba(74,52,38,.45);border-bottom:0;border-radius:160px 6px 0 0;background:linear-gradient(115deg,rgba(255,255,255,.85),rgba(255,255,255,.15) 38%,rgba(255,255,255,.55) 58%,rgba(255,255,255,.1));overflow:hidden}
.vt-glass::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);animation:glint 5s ease-in-out infinite}
@keyframes glint{0%,60%{left:-40%}100%{left:120%}}
.vt-sh{position:absolute;left:16%;right:5%;height:2px;background:rgba(74,52,38,.35)}
.vt-g{position:absolute;left:18%;right:7%;height:28px;background:radial-gradient(ellipse 17px 11px at 50% 70%,#A8642E 0 95%,transparent 100%) 0 0/46px 28px repeat-x}
.vt-g2{background:radial-gradient(circle at 50% 65%,#E9B8B0 0 10px,transparent 11px) 0 0/34px 28px repeat-x}
.vt-top{height:16px}
.vt-body{height:150px;display:flex;align-items:center;justify-content:center}
.vt-mark{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;padding:9px 14px}
.vt-pl{height:18px}
.lstamp{position:absolute;top:-34px;right:-10px;width:110px;height:110px;border-radius:50%;border:3px solid var(--ac);color:#B8231A;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);background:rgba(243,236,225,.7);animation:stampin .6s cubic-bezier(.3,1.5,.5,1) both}
.lstamp::before{content:'';position:absolute;inset:5px;border-radius:50%;border:1px solid var(--ac)}
@keyframes stampin{0%{opacity:0;transform:rotate(-30deg) scale(1.7)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}

/* modules */
.mtools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px;margin-bottom:36px}
.search{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border:1.5px solid rgba(74,52,38,.4);background:#FBF7F0;min-width:min(340px,100%)}
.search input{border:0;background:transparent;outline:none;min-height:48px;width:100%;font-size:15px}
.search:focus-within{border-color:#4A3426;box-shadow:0 0 0 3px rgba(74,52,38,.15)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:18px}
.mc{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:170px;padding:22px 22px 18px 34px;text-decoration:none;transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s}
.mc::before{content:'';position:absolute;left:12px;top:22px;width:10px;height:10px;border-radius:50%;background:#F3ECE1;box-shadow:inset 0 0 0 1.5px rgba(74,52,38,.45)}
.mc:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 22px 30px -18px rgba(74,52,38,.65)}
.mc-go{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin-top:16px}
.mc-go svg{transition:transform .35s}
.mc:hover .mc-go svg{transform:translateX(5px)}
.price{position:absolute;top:-12px;right:14px;background:var(--ac);color:#fff;font-weight:800;font-size:12px;letter-spacing:.08em;padding:6px 10px;transform:rotate(3deg)}

/* comparateur */
.cmp-scroll{overflow-x:auto;margin-top:40px;border:1px solid rgba(74,52,38,.2);background:#FBF7F0}
.cmp{display:grid;grid-template-columns:180px repeat(5,minmax(150px,1fr));min-width:940px}
.cmp-h{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;min-height:96px;padding:16px;border:0;border-left:1px solid rgba(74,52,38,.15);text-align:left;cursor:pointer;transition:background .35s,color .35s}
.cmp-c{padding:16px;border-top:1px solid rgba(74,52,38,.15);border-left:1px solid rgba(74,52,38,.15);font-size:14.5px;transition:background .35s,color .35s}
.cmp-l{padding:16px;border-top:1px solid rgba(74,52,38,.15);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}

.ticket{position:relative;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;padding:60px}
.perf{position:absolute;left:0;right:0;height:14px;background:radial-gradient(circle at 7px 0,#F3ECE1 6px,transparent 6.5px) 0 0/14px 14px repeat-x}
.perf-t{top:0}.perf-b{bottom:0;transform:rotate(180deg)}

@media (max-width:1080px){.tel-h{display:none}}
@media (max-width:900px){.nav{display:none}.burger{display:inline-flex}.mnav{display:flex;flex-direction:column;padding-bottom:16px;border-top:1px solid rgba(74,52,38,.14)}.mnav a{min-height:48px;display:flex;align-items:center;text-decoration:none;font-weight:700;border-bottom:1px dashed rgba(74,52,38,.25)}.ticket{grid-template-columns:1fr;padding:44px 26px}}
@media (max-width:760px){.rack{grid-template-columns:repeat(3,1fr);row-gap:8px}.sec{padding:72px 0}.spec-r{grid-template-columns:1fr;gap:2px}.lstamp{width:86px;height:86px;right:0}}
@media (max-width:560px){.wrap{padding:0 16px}.hdr .btn-stamp{display:none}.rack{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.at *,.at *::before,.at *::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="at" style="{{ rootStyle }}">

<div class="topbar kraft">
  <div class="wrap topbar-in">
    <span class="sc" style="font-size:11px">Bureau d’études &amp; show-room · Puget-sur-Argens, Var</span>
    <div style="display:flex;gap:0 22px;flex-wrap:wrap">
      <a href="index.html">Toutes les propositions</a>
      <a href="tel:0800951313">0 800 95 13 13 · appel gratuit</a>
    </div>
  </div>
</div>
<header class="hdr">
  <div class="wrap hdr-in">
    <a href="Atelier-Accueil.html" class="logo" aria-label="RGTE, R.G. Technologies — accueil"><span class="logo-w">RGTE</span><span class="logo-s">R.G. Technologies</span></a>
    <nav class="nav" aria-label="Navigation principale">
      <a class="navlink on" href="Atelier-Lignes.html" aria-current="page">Lignes</a>
      <a class="navlink" href="Atelier-Secteurs.html">Secteurs</a>
      <a class="navlink" href="Atelier-Realisations.html">Réalisations</a>
      <a class="navlink" href="Atelier-Contact.html">Showroom &amp; contact</a>
    </nav>
    <a class="tel-h" href="tel:0800951313"><b>0 800 95 13 13</b><span>Numéro vert</span></a>
    <a class="btn-stamp" href="Atelier-Contact.html">Plan 3D offert</a>
    <button type="button" class="burger" aria-label="Ouvrir le menu" aria-expanded="{{ menuExp }}" onClick="{{ toggleMenu }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></button>
  </div>
  <sc-if value="{{ menu }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav wrap fade" aria-label="Navigation mobile">
      <a href="Atelier-Lignes.html">Lignes d’agencement</a>
      <a href="Atelier-Secteurs.html">Secteurs d’activité</a>
      <a href="Atelier-Realisations.html">Réalisations</a>
      <a href="Atelier-Contact.html">Showroom &amp; contact</a>
      <a href="tel:0800951313">Numéro vert 0 800 95 13 13</a>
      <a href="Atelier-Contact.html">Plan 3D offert</a>
    </nav>
  </sc-if>
</header>

<!-- hero : l'étagère des cinq lignes -->
<section class="ph">
  <div class="wrap">
    <p class="sc crust kick rv">Lignes d’agencement</p>
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:28px">
      <h1 class="serif h1 rv d1" style="max-width:900px">L’établi des cinq lignes.</h1>
      <p class="lead rv d2" style="max-width:420px">Basique, Stone, Legno, Encastrable, Industry : choisissez une vitrine sur l’étagère pour ouvrir sa fiche, ses modules et ses matières.</p>
    </div>
    <div class="rack" role="tablist" aria-label="Choisir une ligne">
      <sc-for list="{{ lignes }}" as="L" hint-placeholder-count="5">
        <button type="button" class="mv" role="tab" aria-selected="{{ L.sel }}" aria-label="{{ L.aria }}" style="{{ L.lift }}" onClick="{{ L.pick }}">
          <span class="mv-g" style="display:block"></span>
          <span class="mv-t" style="{{ L.topD }}"></span>
          <span class="mv-b" style="{{ L.bodyD }}"></span>
          <span class="mv-p" style="{{ L.plinthD }}"></span>
          <span class="mv-l" style="{{ L.labelStyle }}">{{ L.name }}</span>
        </button>
      </sc-for>
    </div>
  </div>
  <div class="plank wood" aria-hidden="true"></div>
</section>

<!-- fiche de la ligne sélectionnée -->
<section class="sec">
  <div class="wrap">
    <sc-for list="{{ lignes }}" as="L" hint-placeholder-count="1">
      <sc-if value="{{ L.on }}" hint-placeholder-val="{{ true }}">
        <div class="lband fade" role="tabpanel">
          <div>
            <p class="sc crust">Ligne {{ L.n }} — {{ L.kicker }}</p>
            <h2 class="serif" style="font-size:clamp(46px,6vw,84px);line-height:1;margin-top:12px">{{ L.name }}</h2>
            <p class="lead" style="margin-top:20px">{{ L.desc }}</p>
            <div class="spec">
              <div class="spec-r"><span class="sc crust">Structure</span><span>{{ L.struct }}</span></div>
              <div class="spec-r"><span class="sc crust">Panneau frontal</span><span>{{ L.front }}</span></div>
              <div class="spec-r"><span class="sc crust">Plan de travail</span><span>{{ L.worktop }}</span></div>
              <div class="spec-r"><span class="sc crust">Format</span><span>{{ L.format }}</span></div>
            </div>
          </div>
          <div class="vt" aria-hidden="true">
            <div class="lstamp"><span class="serif" style="font-size:30px;line-height:1">{{ L.n }}</span><span class="sc" style="font-size:9.5px;margin-top:4px">{{ L.count }}</span></div>
            <div class="vt-glass">
              <div class="vt-sh" style="top:80px"></div>
              <div class="vt-g vt-g2" style="top:48px"></div>
              <div class="vt-g" style="bottom:10px"></div>
            </div>
            <div class="vt-top" style="{{ L.top }}"></div>
            <div class="vt-body" style="{{ L.body }}"><span class="vt-mark" style="{{ L.markStyle }}">{{ L.mark }}</span></div>
            <div class="vt-pl" style="{{ L.plinth }}"></div>
          </div>
        </div>
      </sc-if>
    </sc-for>
  </div>
</section>

<!-- modules de la ligne -->
<section class="sec kraft">
  <div class="wrap">
    <div class="mtools">
      <div>
        <p class="sc kick">Les étiquettes de la ligne {{ ligneName }}</p>
        <h2 class="serif h2">{{ modCount }}</h2>
      </div>
      <label class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Filtrer les modules</span>
        <input type="search" placeholder="Filtrer : plane, comptoir, chaud…" value="{{ q }}" onInput="{{ setQ }}">
      </label>
    </div>
    <div class="mgrid">
      <sc-for list="{{ modules }}" as="M" hint-placeholder-count="8">
        <a class="mc fade" href="Atelier-Module.html" style="{{ M.card }}">
          <sc-if value="{{ M.hasPrice }}" hint-placeholder-val="{{ false }}"><span class="price">5 800 € HT · 101 cm</span></sc-if>
          <div>
            <span class="sc" style="font-size:10.5px">{{ M.code }}</span>
            <h3 class="serif" style="font-size:24px;line-height:1.15;margin-top:8px">{{ M.name }}</h3>
            <p style="font-size:13.5px;margin-top:6px">{{ M.note }}</p>
          </div>
          <span class="mc-go">Voir la fiche <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
        </a>
      </sc-for>
    </div>
    <sc-if value="{{ noResult }}" hint-placeholder-val="{{ false }}">
      <p class="fade" style="margin-top:24px;font-weight:700">Aucun module de cette ligne ne correspond à « {{ q }} ».</p>
    </sc-if>
  </div>
</section>

<!-- comparateur -->
<section class="sec">
  <div class="wrap">
    <p class="sc crust kick">Comparateur</p>
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:24px">
      <h2 class="serif h2" style="max-width:760px">Matières, panneau frontal, plan de travail : côte à côte.</h2>
      <p style="max-width:360px">Cliquez sur une ligne pour la mettre en lumière. Les cases [À PRÉCISER] seront complétées avec le bureau d’études.</p>
    </div>
    <div class="cmp-scroll">
      <div class="cmp" role="table" aria-label="Comparatif des lignes">
        <div class="cmp-l" style="border-top:0;display:flex;align-items:flex-end" role="columnheader">Critère</div>
        <sc-for list="{{ lignes }}" as="L" hint-placeholder-count="5">
          <button type="button" class="cmp-h" role="columnheader" aria-pressed="{{ L.sel }}" style="{{ L.head }}" onClick="{{ L.pick }}">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4900},"accent":{"editor":"color","default":"#D42A20","options":["#D42A20","#A8642E","#4A3426"]},"ligneDepart":{"editor":"enum","default":"stone","options":["basique","stone","legno","encastrable","industry"]}}'>
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { menu: false, ligne: (props && props.ligneDepart) || "stone", q: "" }; }
  renderVals() {
    const p = this.props || {};
    const ac = p.accent || "#D42A20";
    const st = this.state;
    const WOODL = "background:repeating-linear-gradient(179deg,rgba(255,240,215,.16) 0 2px,transparent 2px 7px,rgba(74,52,38,.18) 7px 8px,transparent 8px 17px),linear-gradient(180deg,#C49567,#A97A4D)";
    const GRANIT = "background:radial-gradient(#1F1D1C 1px,transparent 1.6px) 0 0/6px 6px,radial-gradient(#A8A39C 1px,transparent 1.7px) 3px 4px/9px 9px,#5D5955";
    const MAT = {
      basique: { top: GRANIT, body: "background:linear-gradient(180deg,#E8DCC8,#D8C9AF);border:1px solid #C7B697", plinth: GRANIT, mark: "Mélaminé ou verre", markStyle: "color:#4A3426;border:1px solid rgba(74,52,38,.4)" },
      stone: { top: "background:linear-gradient(180deg,#FFFFFF,#EEEAE3);border:1px solid #D6CFC2", body: "background:linear-gradient(180deg,#FBFAF7,#E9E4DB);border:1px solid #D6CFC2", plinth: "background:#E2DCD1", mark: "Votre sérigraphie", markStyle: "color:#4A3426;border:1px dashed rgba(74,52,38,.5)" },
      legno: { top: "background:#4A3426", body: WOODL, plinth: "background:#4A3426", mark: "Bois mélaminé", markStyle: "color:#F3ECE1;background:rgba(74,52,38,.7)" },
      encastrable: { top: "background:repeating-linear-gradient(90deg,#9C9A95 0 2px,#AEACA6 2px 4px)", body: "background:repeating-linear-gradient(90deg,#A3A19C 0 2px,#B4B2AC 2px 5px);outline:2px dashed rgba(74,52,38,.5);outline-offset:-10px", plinth: "background:#8D8B86", mark: "Prêt à habiller", markStyle: "color:#4A3426;background:#F3ECE1" },
      industry: { top: "background:#2E2A27", body: "background:linear-gradient(180deg,#3B3632,#2A2623)", plinth: "background:#1E1B19", mark: "Longueurs standard", markStyle: "color:#F3ECE1;border:1px solid rgba(243,236,225,.5)" }
    };
    const LIG = [
      { id: "basique", n: "01", name: "Basique", kicker: "L’assemblage libre",
        desc: "Association de modules différents ; choix du coloris et des matériaux selon votre souhait.",
        struct: "Modules associés ; coloris et matériaux au choix", front: "Bois mélaminé, ou verre en option", worktop: "Granit, plinthe en granit", format: "Sur mesure, association de modules",
        mods: [["Comptoir bar", "Neutre ou réfrigéré"], ["Comptoir caisse", "Avec ou sans tablette PMR"], ["Saladette réfrigérée", "Bacs gastronormes"], ["Vitrine réfrigérée Cube", "Vitrage cubique, 2 ou 3 étagères verre"], ["Pastry Show", "Froid ventilé, vitrage droit, plaques 600 × 400"], ["Statique", "Froid statique"], ["Basse", "Exposition basse"], ["Murale self-service", "Libre-service mural"], ["Panoramique", "Exposition panoramique"], ["Chaud", "Bain-marie ou plaque chaude"], ["Vitrine rétro", "Esprit rétro"], ["Amandine", "Montants modernes, plaques 600 × 400, froid ventilé"]] },
      { id: "stone", n: "02", name: "Stone", kicker: "La pierre acrylique",
        desc: "Association de modules ; structure en pierre acrylique type Corian ; panneau frontal en verre avec la sérigraphie de votre enseigne.",
        struct: "Pierre acrylique type Corian", front: "Verre avec sérigraphie du client", worktop: "Pierre acrylique", format: "Sur mesure, association de modules",
        mods: [["Réfrigérée Plane", "Hauteur du plan de travail · prof. 53 ou 60 cm"], ["Vision", "8 cm sous le plan de travail · prof. 53 ou 60 cm"], ["Saladette", "Bacs gastronormes · +2/+8 °C"], ["Chaud bain-marie", "Bacs gastronormes · +30/+90 °C"], ["Centrale", "Vitrages coulissants des 2 côtés · prof. 60 cm"], ["Gourmandise", "Centrale · 101 à 222 cm · sur mesure"], ["Comptoir caisse", "Avec ou sans tablette PMR"], ["Comptoir bar", "Neutre ou réfrigéré"], ["Poissonnerie", "Froid statique, serpentin · −2/0 °C"], ["Panorama", "2 ou 3 étagères réfrigérées +4/+8 °C"], ["Surface plane", "Plan d’exposition"]] },
      { id: "legno", n: "03", name: "Legno", kicker: "La chaleur du bois",
        desc: "Association de modules ; panneau frontal en bois mélaminé, pour un comptoir chaleureux comme un établi.",
        struct: "Association de modules", front: "Bois mélaminé", worktop: "[À PRÉCISER]", format: "Sur mesure, association de modules",
        mods: [["Plane", "Exposition plane"], ["Arrière neutre", "Meuble arrière"], ["Caisse et vitrine neutre", "Encaissement + exposition neutre"], ["Comptoir bar", "Neutre ou réfrigéré"], ["Réfrigérée statique", "Froid statique"], ["Vitrine réfrigérée ventilée plane", "Froid ventilé"], ["Vitrine neutre", "Sans froid"], ["Réfrigéré ventilé", "Froid ventilé"], ["Vitrine chauffante sèche", "Chaud sec"]] },
      { id: "encastrable", n: "04", name: "Encastrable", kicker: "Le module brut",
        desc: "Module brut prêt à être habillé : en version comptoir ou en meuble entier sur pied.",
        struct: "Module brut prêt à être habillé", front: "À habiller selon votre projet", worktop: "À habiller selon votre projet", format: "Version comptoir ou meuble entier sur pied",
        mods: [["Cuve froid ventilé", "Version comptoir ou sur pied"], ["Cuve froid statique", "Version comptoir ou sur pied"]] },
      { id: "industry", n: "05", name: "Industry", kicker: "Le standard indépendant",
        desc: "Vitrines standardisées en longueurs et indépendantes, du snack au supermarché.",
        struct: "Vitrines standardisées, indépendantes", front: "[À PRÉCISER]", worktop: "[À PRÉCISER]", format: "Longueurs standardisées",
        mods: [["Olympe", "Murale"], ["Nepal", "Snack"], ["Aramis", "Boucherie"], ["Rubis", "[USAGE]"], ["Argentine", "[USAGE]"], ["Hanoi", "Poissonnerie"], ["Loire", "Boulangerie"], ["Argent", "Murale froid"], ["Sugar", "Hauteur comptoir"], ["Hawaii", "Supermarché"], ["4 faces vitrées", "Exposition sur 4 faces"]] }
    ];
    const cur = LIG.find(l => l.id === st.ligne) || LIG[1];
    const lignes = LIG.map(l => {
      const on = l.id === st.ligne;
      const m = MAT[l.id];
      return Object.assign({}, l, m, {
        on: on, sel: on ? "true" : "false", aria: "Ligne " + l.name,
        count: l.mods.length + " modules",
        topD: "display:block;" + m.top, bodyD: "display:block;" + m.body, plinthD: "display:block;" + m.plinth,
        lift: on ? "transform:translateY(-14px)" : "",
        labelStyle: on ? "color:#4A3426;text-decoration:underline;text-decoration-color:" + ac + ";text-decoration-thickness:3px;text-underline-offset:8px" : "color:#4A3426;opacity:.75",
        head: on ? "background:#4A3426;color:#F3ECE1" : "background:transparent;color:#4A3426",
        pick: () => this.setState({ ligne: l.id, q: "" })
      });
    });
    const q = (st.q || "").toLowerCase().trim();
    const modules = cur.mods
      .map((m, i) => ({ name: m[0], note: m[1], code: cur.name.toUpperCase() + " · M-" + String(i + 1).padStart(2, "0") }))
      .filter(m => !q || (m.name + " " + m.note).toLowerCase().indexOf(q) > -1)
      .map(m => {
        const g = m.name === "Gourmandise";
        return Object.assign({}, m, {
          hasPrice: g,
          card: g ? "background:#4A3426;color:#F3ECE1" : "background:#F3ECE1;color:#4A3426;box-shadow:0 1px 0 rgba(74,52,38,.2)"
        });
      });
    const KEYS = [["struct", "Structure"], ["front", "Panneau frontal"], ["worktop", "Plan de travail"], ["format", "Format"], ["n_mods", "Modules"]];
    const rows = KEYS.map(k => ({
      label: k[1],
      cells: LIG.map(l => {
        const on = l.id === st.ligne;
        const txt = k[0] === "n_mods" ? l.mods.length + " modules" : l[k[0]];
        return { txt: txt, style: on ? "background:#EADCC6;font-weight:700" : "background:transparent" };
      })
    }));
    return {
      rootStyle: "--ac:" + ac,
      menu: st.menu, menuExp: st.menu ? "true" : "false",
      toggleMenu: () => this.setState({ menu: !this.state.menu }),
      lignes: lignes, rows: rows, modules: modules,
      ligneName: cur.name,
      modCount: modules.length + (modules.length > 1 ? " modules à composer" : " module à composer"),
      noResult: modules.length === 0,
      q: st.q,
      setQ: (e) => this.setState({ q: e.target.value })
    };
  }
}
</script>
