<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cacao — Lignes</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap">
<style>
body{margin:0;background:#1B110D}
sc-for,sc-if{display:contents}
.cc{font-family:'Albert Sans',system-ui,sans-serif;color:#F1E6DA;background:#1B110D;-webkit-font-smoothing:antialiased;line-height:1.55}
.cc *{box-sizing:border-box}
.pf{font-family:'Playfair Display',Georgia,serif}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px;position:relative}
.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#C07A4A;font-weight:500}
.muted{color:#B9A797}
.hair{position:absolute;top:0;bottom:0;left:0;right:0;pointer-events:none;background-image:linear-gradient(to right,rgba(192,122,74,.11) 1px,transparent 1px);background-size:calc(100% / 6) 100%;background-position:center}
.navl{color:#F1E6DA;text-decoration:none;font-size:14px;letter-spacing:.04em;padding:0 4px;min-height:44px;display:inline-flex;align-items:center;position:relative}
.navl::after{content:'';position:absolute;left:4px;right:4px;bottom:9px;height:1px;background:#C07A4A;transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.navl:hover::after,.navl.on::after{transform:scaleX(1)}
.btn-cu{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 22px;border-radius:999px;background:#C07A4A;color:#1B110D;font-weight:600;font-size:14px;letter-spacing:.02em;text-decoration:none;border:0;cursor:pointer;font-family:inherit;transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s,filter .3s}
.btn-cu:hover{transform:translateY(-2px);box-shadow:0 16px 34px -14px rgba(192,122,74,.8);filter:brightness(1.08)}
.btn-gh{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 22px;border-radius:999px;background:transparent;color:#F1E6DA;font-weight:500;font-size:14px;text-decoration:none;border:1px solid rgba(192,122,74,.55);cursor:pointer;font-family:inherit;transition:background .4s,border-color .4s}
.btn-gh:hover{background:rgba(192,122,74,.12);border-color:#C07A4A}
.btn-cu svg,.btn-gh svg{transition:transform .4s}
.btn-cu:hover svg,.btn-gh:hover svg{transform:translateX(4px)}
.cc :focus-visible{outline:2px solid #C07A4A;outline-offset:3px}
.burger{display:none;width:46px;height:46px;border-radius:999px;border:1px solid rgba(192,122,74,.5);background:transparent;color:#F1E6DA;align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none}
.ft-h{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#C07A4A;font-weight:500;margin:0 0 16px}
.ft-l{color:#B9A797;text-decoration:none;display:flex;min-height:40px;align-items:center;transition:color .3s;font-size:15px}
.ft-l:hover{color:#F1E6DA}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(192,122,74,.35);color:#F1E6DA;text-decoration:none;font-size:14px;background:transparent;cursor:pointer;font-family:inherit;transition:border-color .35s,background .35s,transform .35s,color .35s}
.chip:hover{border-color:#C07A4A;background:rgba(192,122,74,.14)}
.fade-up{animation:fu 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.melt{display:block;animation:melt 2s cubic-bezier(.6,.05,.3,1) both}
@keyframes melt{
0%{clip-path:polygon(0% 0%,100% 0%,100% 0%,87% 0%,75% 0%,62% 0%,50% 0%,37% 0%,25% 0%,12% 0%,0% 0%);transform:translateY(-10px)}
55%{clip-path:polygon(0% 0%,100% 0%,100% 72%,87% 96%,75% 58%,62% 88%,50% 52%,37% 92%,25% 62%,12% 100%,0% 70%);transform:translateY(-2px)}
100%{clip-path:polygon(0% 0%,100% 0%,100% 135%,87% 135%,75% 135%,62% 135%,50% 135%,37% 135%,25% 135%,12% 135%,0% 135%);transform:none}}
.hero-bg{position:absolute;top:-20px;bottom:-20px;left:-20px;right:-20px;background:url(assets/marble-veins.webp) center/cover;filter:brightness(.32) sepia(.6) saturate(1.4);animation:kb 30s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.02)}}
.sheen{position:absolute;top:0;bottom:0;left:0;right:0;pointer-events:none;background:linear-gradient(105deg,transparent 0%,transparent 40%,rgba(255,224,190,0) 44%,rgba(255,224,190,.15) 50%,rgba(255,224,190,0) 56%,transparent 60%,transparent 100%);background-size:300% 100%;animation:sheen 10s cubic-bezier(.45,0,.2,1) infinite;mix-blend-mode:screen}
@keyframes sheen{0%{background-position:100% 0}65%,100%{background-position:0% 0}}
.ltab{flex:1 1 180px;text-align:left;cursor:pointer;font-family:inherit;padding:22px 22px 20px;min-height:44px;border-radius:14px;transition:background .5s,border-color .5s,color .5s,transform .5s cubic-bezier(.2,.7,.2,1)}
.ltab:hover{transform:translateY(-3px)}
.part{position:absolute;transition:all 1s cubic-bezier(.6,0,.2,1)}
.mcard{position:relative;display:block;text-decoration:none;color:#F1E6DA;background:#2A1B15;border:1px solid rgba(192,122,74,.22);border-radius:14px;padding:22px;min-height:190px;overflow:hidden;transition:transform .7s cubic-bezier(.2,.7,.2,1),border-color .5s,box-shadow .7s;animation:fu .8s cubic-bezier(.2,.7,.2,1) both}
.mcard .sil{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.mcard .mname{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.mcard .go{position:absolute;right:18px;bottom:18px;opacity:0;transform:translateX(-8px);transition:opacity .5s,transform .5s}
.mcard:hover{transform:translateY(-6px);border-color:#C07A4A;box-shadow:0 30px 50px -30px rgba(0,0,0,.9)}
.mcard:hover .sil{transform:translate(8px,-6px) scale(1.06)}
.mcard:hover .mname{transform:translateY(-4px)}
.mcard:hover .go{opacity:1;transform:none}
.cmp-cell{padding:18px 16px;border-bottom:1px solid rgba(192,122,74,.16);font-size:14px;line-height:1.45;transition:background .5s,color .5s}
.cmp-h{cursor:pointer;font-family:inherit;text-align:left;padding:18px 16px;min-height:44px;border:0;transition:background .5s,color .5s}
@media(max-width:960px){.navlinks{display:none}.burger{display:inline-flex}.hdr-tel{display:none}.mnav{display:block}.det-grid{grid-template-columns:1fr}}
@media(max-width:700px){.wrap{padding:0 20px}.hdr-cta{display:none}}
@media(prefers-reduced-motion:reduce){.melt,.hero-bg,.sheen,.fade-up,.mcard{animation:none}}
</style>
</helmet>
<div class="cc" style="position:relative;overflow:hidden">

<header style="position:sticky;top:0;z-index:60;background:rgba(27,17,13,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(192,122,74,.22)">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:24px;height:84px">
    <a href="Cacao-Accueil.html" aria-label="RGTE, retour à l’accueil" style="text-decoration:none;display:flex;align-items:baseline;gap:12px;min-height:44px;padding-top:10px">
      <span class="pf" style="font-size:30px;font-weight:600;letter-spacing:.06em;color:#F1E6DA;line-height:1">RGTE<span style="color:#D42A20">.</span></span>
      <span style="font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#B9A797">R.G. Technologies</span>
    </a>
    <nav class="navlinks" aria-label="Navigation principale" style="display:flex;gap:30px">
      <a class="navl on" href="Cacao-Lignes.html" aria-current="page">Lignes</a>
      <a class="navl" href="Cacao-Secteurs.html">Secteurs</a>
      <a class="navl" href="Cacao-Realisations.html">Réalisations</a>
      <a class="navl" href="Cacao-Contact.html">Showroom &amp; contact</a>
    </nav>
    <div style="display:flex;align-items:center;gap:18px">
      <a class="hdr-tel" href="tel:0800951313" style="text-decoration:none;color:#F1E6DA;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;min-height:44px;justify-content:center">
        <span style="font-size:15px;font-weight:600;letter-spacing:.04em">0 800 95 13 13</span>
        <span style="font-size:11px;color:#B9A797;letter-spacing:.08em">appel gratuit</span>
      </a>
      <a class="btn-cu hdr-cta" href="Cacao-Contact.html" style="{{ ctaStyle }}">Plan 3D offert</a>
      <button type="button" class="burger" aria-label="Ouvrir le menu" onClick="{{ toggleMenu }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
      </button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div class="mnav" style="border-top:1px solid rgba(192,122,74,.22);background:#1B110D">
      <div class="wrap" style="display:flex;flex-direction:column;padding-top:12px;padding-bottom:20px">
        <a class="navl" href="Cacao-Lignes.html">Lignes</a>
        <a class="navl" href="Cacao-Secteurs.html">Secteurs</a>
        <a class="navl" href="Cacao-Realisations.html">Réalisations</a>
        <a class="navl" href="Cacao-Contact.html">Showroom &amp; contact</a>
        <a class="navl" href="tel:0800951313">0 800 95 13 13 — appel gratuit</a>
        <a class="btn-cu" href="Cacao-Contact.html" style="margin-top:12px">Plan 3D offert</a>
      </div>
    </div>
  </sc-if>
</header>

<!-- HERO -->
<section style="position:relative;overflow:hidden;padding:110px 0 70px">
  <div class="hero-bg" aria-hidden="true"></div>
  <div aria-hidden="true" style="position:absolute;top:0;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(27,17,13,.4),#1B110D 92%)"></div>
  <div class="hair" aria-hidden="true"></div>
  <sc-if value="{{ sheenOn }}" hint-placeholder-val="{{ true }}"><div class="sheen" aria-hidden="true"></div></sc-if>
  <div class="wrap">
    <p class="eyebrow fade-up" style="margin:0 0 22px;animation-delay:.6s"><a href="Cacao-Accueil.html" style="color:#B9A797;text-decoration:none">Accueil</a> <span class="muted">/</span> Lignes d’agencement</p>
    <h1 class="pf" style="margin:0;font-weight:400;font-size:clamp(44px,6.4vw,96px);line-height:1;letter-spacing:-.015em;max-width:1100px;overflow-wrap:anywhere">
      <span class="melt" style="animation-delay:.3s">Cinq lignes,</span>
      <span class="melt" style="animation-delay:.6s;font-style:italic;color:#C07A4A;padding-bottom:6px">cinq textures de froid.</span>
    </h1>
    <p class="fade-up muted" style="margin:28px 0 0;max-width:620px;font-size:18px;line-height:1.65;animation-delay:1.1s">De l’association libre de modules à la vitrine standardisée, chaque ligne se compose selon votre local, vos dimensions et vos produits.</p>
    <div role="tablist" aria-label="Choisir une ligne" class="fade-up" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:56px;animation-delay:1.3s">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
        <button type="button" role="tab" class="ltab" aria-selected="{{ t.sel }}" style="{{ t.style }}" onClick="{{ t.pick }}">
          <span class="pf" style="display:block;font-size:14px;font-style:italic;color:#C07A4A">{{ t.num }}</span>
          <span class="pf" style="display:block;font-size:28px;line-height:1.1;margin-top:4px">{{ t.nom }}</span>
          <span style="display:block;font-size:12px;margin-top:6px;color:#B9A797">{{ t.count }}</span>
        </button>
      </sc-for>
    </div>
  </div>
</section>

<!-- DETAIL LIGNE -->
<section aria-label="Ligne sélectionnée" style="position:relative;padding:40px 0 100px">
  <div class="wrap">
    <div class="det-grid" style="display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;align-items:start">
      <!-- Dessin CSS de la vitrine -->
      <div style="position:relative;background:#2A1B15;border:1px solid rgba(192,122,74,.28);border-radius:20px;padding:32px;overflow:hidden">
        <div class="hair" aria-hidden="true" style="opacity:.7"></div>
        <div style="position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:12px">
          <p class="eyebrow" style="margin:0">Élévation de principe</p>
          <p class="muted" style="margin:0;font-size:12px">dessin indicatif · non coté</p>
        </div>
        <div role="img" aria-label="{{ draw.label }}" style="position:relative;height:380px;margin-top:20px">
          <div class="part" style="{{ draw.glass }}">
            <div style="position:absolute;bottom:10px;left:8%;width:14%;height:34px;border-radius:40px 40px 4px 4px;background:rgba(192,122,74,.55)"></div>
            <div style="position:absolute;bottom:10px;left:28%;width:10%;height:26px;border-radius:6px;background:rgba(241,230,218,.5)"></div>
            <div style="position:absolute;bottom:10px;left:44%;width:16%;height:40px;border-radius:50px 50px 4px 4px;background:rgba(122,74,48,.9)"></div>
            <div style="position:absolute;bottom:10px;left:66%;width:9%;height:22px;border-radius:999px;background:rgba(217,184,184,.6)"></div>
            <div style="position:absolute;bottom:10px;left:80%;width:12%;height:30px;border-radius:6px;background:rgba(192,122,74,.4)"></div>
            <div style="position:absolute;top:0;bottom:0;left:12%;width:18%;background:linear-gradient(100deg,transparent,rgba(255,240,225,.18),transparent)"></div>
          </div>
          <div class="part" style="{{ draw.plan }}"></div>
          <div class="part" style="{{ draw.panel }}">
            <span style="{{ draw.logo }}">{{ draw.logoText }}</span>
          </div>
          <div class="part" style="{{ draw.plinth }}"></div>
          <div style="position:absolute;left:6%;right:6%;top:350px;height:1px;background:#C07A4A"></div>
          <div style="position:absolute;left:6%;top:344px;width:1px;height:13px;background:#C07A4A"></div>
          <div style="position:absolute;right:6%;top:344px;width:1px;height:13px;background:#C07A4A"></div>
          <p style="position:absolute;left:0;right:0;top:356px;margin:0;text-align:center;font-size:12px;letter-spacing:.14em;color:#B9A797">{{ draw.dim }}</p>
        </div>
        <div style="position:relative;display:flex;flex-wrap:wrap;gap:18px;margin-top:22px;font-size:12px;color:#B9A797">
          <span style="display:inline-flex;align-items:center;gap:8px"><span style="{{ draw.kPlan }}"></span>Plan de travail</span>
          <span style="display:inline-flex;align-items:center;gap:8px"><span style="{{ draw.kPanel }}"></span>Panneau frontal</span>
          <span style="display:inline-flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:3px;border:1px solid rgba(241,230,218,.6);display:inline-block"></span>Vitrage</span>
        </div>
      </div>
      <!-- Texte -->
      <div>
        <p class="pf" style="margin:0;font-size:16px;font-style:italic;color:#C07A4A">Ligne {{ cur.num }}</p>
        <h2 class="pf" style="margin:6px 0 0;font-weight:400;font-size:clamp(44px,5vw,72px);line-height:1">{{ cur.nom }}</h2>
        <p style="margin:22px 0 0;font-size:17px;line-height:1.7">{{ cur.desc }}</p>
        <div style="margin-top:30px;border-top:1px solid rgba(192,122,74,.3)">
          <sc-for list="{{ cur.specs }}" as="sp" hint-placeholder-count="4">
            <div style="display:grid;grid-template-columns:150px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid rgba(192,122,74,.16)">
              <span style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#B9A797;padding-top:2px">{{ sp.k }}</span>
              <span style="font-size:15px">{{ sp.v }}</span>
            </div>
          </sc-for>
        </div>
        <img src="{{ cur.img }}" alt="{{ cur.alt }}" style="display:block;width:100%;height:220px;object-fit:cover;border-radius:14px;margin-top:28px;filter:saturate(.9)">
        <p class="muted" style="margin:8px 0 0;font-size:12px">Image d’ambiance.</p>
      </div>
    </div>
  </div>
</section>

<!-- MODULES -->
<section aria-labelledby="t-mods" style="position:relative;padding:100px 0;background:#2A1B15;border-top:1px solid rgba(192,122,74,.22);border-bottom:1px solid rgba(192,122,74,.22)">
  <div class="hair" aria-hidden="true" style="opacity:.6"></div>
  <div class="wrap">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:24px;margin-bottom:40px">
      <div>
        <p class="eyebrow" style="margin:0 0 16px">Modules · Ligne {{ cur.nom }}</p>
        <h2 id="t-mods" class="pf" style="margin:0;font-weight:400;font-size:clamp(34px,3.8vw,54px);line-height:1.05">{{ modsTitle }}</h2>
      </div>
      <div role="group" aria-label="Filtrer par plage de température" style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
          <button type="button" class="chip" aria-pressed="{{ f.sel }}" style="{{ f.style }}" onClick="{{ f.pick }}">{{ f.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px">
      <sc-for list="{{ mods }}" as="m" hint-placeholder-count="8">
        <a class="mcard" href="Cacao-Module.html" style="{{ m.cardStyle }}">
          <svg class="sil" width="96" height="48" viewBox="0 0 96 48" fill="none" stroke="#C07A4A" stroke-width="1.2" aria-hidden="true">
            <path d="M8 22 Q8 6 24 6 H72 Q88 6 88 22"></path><path d="M4 22 H92"></path><path d="M8 22 V40 H88 V22"></path><path d="M8 40 V44 H88 V40"></path><path d="M20 16 h10 M40 16 h14 M64 16 h10" stroke-opacity=".6"></path>
          </svg>
          <p class="pf mname" style="margin:18px 0 0;font-size:24px;line-height:1.15">{{ m.nom }}</p>
          <p class="muted" style="margin:8px 0 0;font-size:13px;line-height:1.5;padding-right:30px">{{ m.note }}</p>
          <sc-if value="{{ m.star }}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute;top:18px;right:18px;padding:6px 10px;border-radius:999px;background:#C07A4A;color:#1B110D;font-size:11px;font-weight:600;letter-spacing:.08em">FICHE DÉTAILLÉE</span>
          </sc-if>
          <svg class="go" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#C07A4A" stroke-width="1.5" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"></path></svg>
        </a>
      </sc-for>
    </div>
    <sc-if value="{{ noMods }}" hint-placeholder-val="{{ false }}">
      <div style="padding:40px;border:1px dashed rgba(192,122,74,.5);border-radius:14px;text-align:center">
        <p class="pf" style="margin:0;font-size:24px">Aucune plage renseignée pour cette ligne.</p>
        <p class="muted" style="margin:8px 0 0;font-size:14px">Températures des modules {{ cur.nom }} : [À CONFIRMER] — affichez « Tous » ou contactez le bureau d’études.</p>
      </div>
    </sc-if>
  </div>
</section>

<!-- COMPARATEUR -->
<section aria-labelledby="t-cmp" style="position:relative;padding:110px 0">
  <div class="wrap">
    <p class="eyebrow" style="margin:0 0 16px">Comparateur</p>
    <h2 id="t-cmp" class="pf" style="margin:0 0 14px;font-weight:400;font-size:clamp(34px,3.8vw,54px);line-height:1.05">Matières, façade, plan : <em style="color:#C07A4A">côte à côte.</em></h2>
    <p class="muted" style="margin:0 0 40px;font-size:15px">Cliquez une colonne pour l’afficher en détail ci-dessus.</p>
    <div style="overflow-x:auto;border:1px solid rgba(192,122,74,.28);border-radius:16px">
      <div style="min-width:960px">
        <div style="display:grid;grid-template-columns:170px repeat(5,minmax(150px,1fr));border-bottom:1px solid rgba(192,122,74,.3)">
          <div style="padding:18px 16px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#B9A797">Critère</div>
          <sc-for list="{{ cmpHead }}" as="h" hint-placeholder-count="5">
            <button type="button" class="cmp-h" style="{{ h.style }}" aria-pressed="{{ h.sel }}" onClick="{{ h.pick }}">
              <span class="pf" style="display:block;font-size:13px;font-style:italic;color:#C07A4A">{{ h.num }}</span>
              <span class="pf" style="display:block;font-size:22px">{{ h.nom }}</span>
            </button>
          </sc-for>
        </div>
        <sc-for list="{{ cmpRows }}" as="r" hint-placeholder-count="5">
          <div style="display:grid;grid-template-columns:170px repeat(5,minmax(150px,1fr))">
            <div class="cmp-cell" style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#B9A797">{{ r.k }}</div>
            <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="5">
              <div class="cmp-cell" style="{{ c.style }}">{{ c.v }}</div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</section>

<!-- CTA -->
