<style>
body{margin:0;background:#F4F3EF}
.pl *{box-sizing:border-box}
.pl a{color:inherit}
.pl-wrap{max-width:1320px;margin:0 auto;padding:0 40px}
.mono{font-family:'Red Hat Mono',ui-monospace,monospace}
.disp{font-family:'Red Hat Display',sans-serif}
.pl :focus-visible{outline:2px solid var(--red);outline-offset:3px}
.nav-a{position:relative;text-decoration:none;font-weight:500;font-size:15px;padding:12px 0;display:inline-flex;align-items:center;min-height:44px}
.nav-a::after{content:"";position:absolute;left:0;right:100%;bottom:6px;height:1px;background:var(--red);transition:right .45s cubic-bezier(.6,.1,.2,1)}
.nav-a:hover::after,.nav-a.on::after{right:0}
.btn-red{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;background:var(--red);color:#fff !important;text-decoration:none;font-family:'Red Hat Display',sans-serif;font-weight:700;font-size:15px;border:0;cursor:pointer;transition:transform .3s,box-shadow .3s}
.btn-red:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px var(--red)}
.btn-line{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border:1px solid currentColor;text-decoration:none;font-family:'Red Hat Display',sans-serif;font-weight:700;font-size:15px;background:transparent;cursor:pointer;transition:background .3s,color .3s}
.btn-line:hover{background:#E8EEF4;color:#0E2A47 !important}
.btn-line.dk:hover{background:#0E2A47;color:#F4F3EF !important}
.burger{display:none;width:48px;height:48px;align-items:center;justify-content:center;background:transparent;border:1px solid rgba(143,179,207,.5);color:#E8EEF4;cursor:pointer}
.toplink{text-decoration:none;min-height:34px;display:inline-flex;align-items:center}
.toplink:hover{color:#E8EEF4}
.rise{opacity:0;transform:translateY(22px);animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.mask{clip-path:inset(0 0 100% 0);animation:mask 1.1s cubic-bezier(.7,0,.2,1) forwards}
@keyframes mask{to{clip-path:inset(0 0 0 0)}}
.swap{animation:swap .6s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grow{transform-origin:left;animation:grow .9s cubic-bezier(.6,.1,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.chip{transition:background .25s,color .25s,border-color .25s}
.chip:hover{border-color:#0E2A47 !important}
.ibtn{transition:background .25s,color .25s}
.ibtn:hover{background:#E8EEF4;color:#0E2A47}
.card{text-decoration:none;display:block;cursor:pointer}
.card .ph{position:relative;overflow:hidden}
.card img{transition:transform 1.4s cubic-bezier(.2,.7,.1,1)}
.card:hover img{transform:scale(1.06)}
.card .bp{position:absolute;inset:0;opacity:0;transition:opacity .45s;background-image:linear-gradient(rgba(232,238,244,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(232,238,244,.22) 1px,transparent 1px);background-size:28px 28px;background-color:rgba(14,42,71,.6)}
.card:hover .bp{opacity:1}
.card .arr{transition:transform .35s}
.card:hover .arr{transform:translate(4px,-4px)}
.lnk{text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}
.lnk:hover{color:var(--red)}
.foot a{text-decoration:none;display:inline-flex;min-height:32px;align-items:center}
.foot a:hover{color:#fff;text-decoration:underline}
.mnav a{display:flex;min-height:52px;align-items:center;border-bottom:1px solid rgba(143,179,207,.2);text-decoration:none;font-size:18px}
@media (max-width:980px){.desk-nav{display:none !important}.burger{display:inline-flex}.hide-m{display:none !important}}
@media (max-width:720px){.pl-wrap{padding:0 16px}.btn-red.hdr{padding:0 14px;font-size:14px}}
</style>

            <button type="button" class="ibtn" aria-label="Réalisation suivante" onClick="{{ next }}" style="width:52px;height:52px;border:0;border-left:1px solid rgba(143,179,207,.35);background:transparent;color:#E8EEF4;cursor:pointer"><svg width="16" height="10" viewBox="0 0 16 10" aria-hidden="true"><path d="M0 5H15M11 1L15 5L11 9" stroke="currentColor" stroke-width="1.5" fill="none"></path></svg></button>

          <h2 class="disp" style="margin:0;font-size:38px;font-weight:900;line-height:1.02">{{ cur.type }}</h2>
          <div class="mono" style="display:grid;grid-template-columns:1fr 1fr;border:1px solid rgba(143,179,207,.35);font-size:13px">

            <div style="padding:12px"><span style="display:block;font-size:10px;letter-spacing:.12em;color:#8FB3CF">LIGNE</span>{{ cur.ligne }}</div>

            <a href="Plan-Lignes.html" class="btn-line">Ligne {{ cur.ligne }}</a>
          </div>
        </div>

<!-- FILTRES + GRILLE -->
<section style="background:#F4F3EF;color:#0E2A47">

      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:28px 24px;margin-top:40px">
      <sc-for list="{{ list }}" as="r" hint-placeholder-count="6">

          <div class="ph" style="{{ r.phStyle }}">
            <img src="{{ r.img }}" alt="{{ r.alt }}" style="width:100%;height:100%;object-fit:cover;display:block">
            <div class="bp"><span class="mono" style="position:absolute;left:14px;right:14px;bottom:14px;color:#E8EEF4;font-size:11px;letter-spacing:.1em;line-height:1.7">{{ r.modsTxt }}</span></div>
            <span class="mono" style="position:absolute;top:0;left:0;background:#F4F3EF;color:#0E2A47;font-size:11px;letter-spacing:.1em;padding:6px 10px">{{ r.code }}</span>
          </div>
          <div style="display:flex;justify-content:space-between;gap:12px;padding-top:12px">
            <div>
              <span class="mono" style="font-size:11px;letter-spacing:.12em;color:#5A6E84">{{ r.lieuUp }} · {{ r.ligneUp }}</span>
              <span class="disp" style="display:block;font-size:21px;font-weight:700;margin-top:4px">{{ r.type }}</span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3800},"accent":{"editor":"color","default":"#D42A20","options":["#D42A20","#1A1A1A","#B08D57"]},"grille":{"editor":"boolean","default":true}}'>
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { menu:false, sel:1, view:'plan', ligne:'toutes', type:'tous' }; }
  renderVals() {
    const p = this.props || {};
    const R = p.accent || '#D42A20';
    const grid = p.grille !== false;
    const s = this.state;
    const gridBg = grid ? 'background-image:linear-gradient(rgba(143,179,207,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(143,179,207,.09) 1px,transparent 1px);background-size:40px 40px;' : '';
    const G = { pat:'PÂTISSERIE & CHOCOLAT', boul:'BOULANGERIE', trait:'TRAITEUR & SNACKING', bar:'BARS & COMPTOIRS' };
    const P = [
      { id:1, type:'Pâtisserie', lieu:'Paris 4e', ligne:'Stone', g:'pat', mods:['Vitrine réfrigérée Plane','Caisse'], img:'assets/vitrine-cakes.webp', alt:'Gâteaux en vitrine' },
      { id:2, type:'Bar à salades', lieu:'Département 13', ligne:'Stone', g:'bar', mods:['Saladette','Caisse','Panorama'], img:'assets/saladette-bacs.webp', alt:'Bacs gastronormes inox colorés' },
      { id:3, type:'Chocolatier', lieu:'Gap & Grenoble', ligne:'Stone', g:'pat', mods:['Plane','Caisse'], img:'assets/chocolates-dark.webp', alt:'Bonbons de chocolat' },
      { id:4, type:'Sandwicherie', lieu:'Chamonix', ligne:'Basique', g:'trait', mods:['Panoramique','Basse','Murale self-service'], img:'assets/vitrine-cookies.webp', alt:'Vitrine de cookies' },
      { id:5, type:'Bar à olives', lieu:'Nice', ligne:'Stone', g:'bar', mods:['Saladette sur mesure à trous arrondis'], img:'assets/bakery-domes.webp', alt:'Cloches en verre, ambiance rustique' },
      { id:6, type:'Bar à yogourt glacé (chaîne)', lieu:'Toute la France', ligne:'Stone', g:'bar', mods:['Saladette sur mesure à trous arrondis','Surface plane'], img:'assets/topping-bar.webp', alt:'Bar à toppings' },
      { id:7, type:'Boulangerie pâtisserie', lieu:'La Réunion', ligne:'Basique', g:'boul', mods:['Amandine','Caisse'], img:'assets/vitrine-viennoiserie.webp', alt:'Vitrine de viennoiseries étiquetées' },
      { id:8, type:'Boulangerie', lieu:'Département 33', ligne:'Legno', g:'boul', mods:['Réfrigérée statique','Neutre','Module arrière'], img:'assets/bakery-shelves.webp', alt:'Étagères à pains' },
      { id:9, type:'Pizza sur composition', lieu:'Paris', ligne:'Stone', g:'trait', mods:['Saladette','Caisse','Plane'], img:'assets/baker-table.webp', alt:'Plan de travail avec pains et rouleau' },
      { id:10, type:'Pâtissier chocolatier', lieu:'Département 69', ligne:'Stone', g:'pat', mods:['Centrale','Caisse','Plane'], img:'assets/vitrine-colorful.webp', alt:'Entremets colorés étagés' },
      { id:11, type:'Traiteur asiatique (chaîne)', lieu:'Marseille', ligne:'Stone', g:'trait', mods:['Plane','Caisse','Saladette','Comptoir bar'], img:'assets/vitrine-slice.webp', alt:'Parts derrière le verre' },
      { id:12, type:'Bar à couscous', lieu:'Isère', ligne:'Stone', g:'bar', mods:['Bain-marie à trous arrondis sur mesure'], img:'assets/bakery-hall-dark.webp', alt:'Grande halle sombre' },
      { id:13, type:'Traiteur poissonnier', lieu:'Département 92', ligne:'Stone', g:'trait', mods:['Panorama','Surface plane','Caisse'], img:'assets/fish-ice.webp', alt:'Poissons sur glace' },
      { id:14, type:'Pâtissier chocolatier Canet', lieu:'Nice 06', ligne:'Stone', g:'pat', mods:['Plane pâtissière +2/+8','Plane chocolats +14/+18'], img:'assets/macarons-rows.webp', alt:'Rangées de macarons' }
    ];
    const code = id => 'PL-' + String(id).padStart(2, '0');
    const filtered = P.filter(x => (s.ligne === 'toutes' || x.ligne.toLowerCase() === s.ligne) && (s.type === 'tous' || x.g === s.type));
    const raw = P.find(x => x.id === s.sel) || P[0];
    const weight = n => /caisse|comptoir|neutre|surface/i.test(n) ? 1 : (/murale|panorama|arrière/i.test(n) ? 1.3 : 1.8);
    const blocks = raw.mods.map((m, i) => ({ nom: m.toUpperCase(),
      style: 'flex:' + weight(m) + ' 1 0;min-width:0;display:flex;flex-direction:column;gap:8px;padding:10px;border:1.2px solid #E8EEF4;background:rgba(232,238,244,.06);animation-delay:' + (i * 0.12) + 's;overflow-wrap:anywhere' }));
    const cur = Object.assign({}, raw, { code: code(raw.id), ligneUp: raw.ligne.toUpperCase(), groupe: G[raw.g], blocks });
    const plan = s.view === 'plan';
    const pool = filtered.length ? filtered : P;
    const pos = Math.max(0, pool.findIndex(x => x.id === s.sel));
    const go = d => () => { const n = pool[(pos + d + pool.length) % pool.length]; this.setState({ sel:n.id }); };
    const chip = on => 'min-height:44px;padding:0 16px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px solid ' + (on ? '#0E2A47' : 'rgba(14,42,71,.25)') + ';' + (on ? 'background:#0E2A47;color:#F4F3EF;' : 'background:transparent;color:#0E2A47;');
    const LG = [ ['toutes','Toutes'], ['stone','Stone'], ['basique','Basique'], ['legno','Legno'] ];
    const TY = [ ['tous','Tous'], ['pat','Pâtisserie & chocolat'], ['boul','Boulangerie'], ['trait','Traiteur & snacking'], ['bar','Bars & comptoirs'] ];
    const fLigne = LG.map(o => { const on = s.ligne === o[0]; const n = P.filter(x => (o[0] === 'toutes' || x.ligne.toLowerCase() === o[0]) && (s.type === 'tous' || x.g === s.type)).length; return { label: o[1] + ' · ' + n, sel: on ? 'true' : 'false', style: chip(on), pick: () => this.setState({ ligne:o[0] }) }; });
    const fType = TY.map(o => { const on = s.type === o[0]; return { label:o[1], sel: on ? 'true' : 'false', style: chip(on), pick: () => this.setState({ type:o[0] }) }; });
    const list = filtered.map(x => { const on = x.id === s.sel; return { code: code(x.id), type:x.type, img:x.img, alt:x.alt, lieuUp: x.lieu.toUpperCase(), ligneUp: x.ligne.toUpperCase(), modsTxt: x.mods.join(' · ').toUpperCase(), current: on ? 'true' : 'false',
      pick: () => this.setState({ sel:x.id, view:'plan' }),
      phStyle: 'height:300px;background:#0E2A47;outline:' + (on ? '3px solid ' + R : '0 solid transparent') + ';outline-offset:4px;transition:outline-color .3s' }; });
    const ib = on => 'min-height:44px;padding:0 16px;border:0;cursor:pointer;font-size:12px;letter-spacing:.14em;' + (on ? 'background:#E8EEF4;color:#0E2A47;' : 'background:transparent;color:#E8EEF4;');
    return {
      rootStyle: '--red:' + R + ';font-family:\'Red Hat Text\',sans-serif;background:#F4F3EF;color:#0E2A47;',
      menuOpen: s.menu, burgerLabel: s.menu ? 'Fermer le menu' : 'Ouvrir le menu', toggleMenu: () => this.setState({ menu: !this.state.menu }),
      heroStyle: 'background-color:#0E2A47;color:#E8EEF4;' + gridBg,
      cur,
      photoStyle: 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:clip-path 1.1s cubic-bezier(.7,0,.2,1),transform 1.6s;' + (plan ? 'clip-path:inset(0 0 0 100%);transform:scale(1.06);' : 'clip-path:inset(0 0 0 0);transform:scale(1);'),
      planStyle: 'position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;transition:opacity .8s;background-image:linear-gradient(rgba(143,179,207,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(143,179,207,.12) 1px,transparent 1px);background-size:24px 24px;' +(plan ? 'opacity:1;' : 'opacity:0;pointer-events:none;'),
      bPlan: ib(plan), bPhoto: ib(!plan), pPlan: plan ? 'true' : 'false', pPhoto: plan ? 'false' : 'true',
      showPlan: () => this.setState({ view:'plan' }), showPhoto: () => this.setState({ view:'photo' }),
      prev: go(-1), next: go(1),
      count: filtered.length, empty: filtered.length === 0, list, fLigne, fType,
      resetF: () => this.setState({ ligne:'toutes', type:'tous' })
    };
  }
}
</script>
