<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Instrument+Sans:wdth,wght@75..100,400..700&amp;display=swap">
<style>
body{margin:0;background:#F5F2EC}
sc-for,sc-if{display:contents}
.rg{--red:#D42A20;--redd:#B8231A;--paper:#F5F2EC;--ink:#121212;--pink:#F2D6D0;--line:2px solid #121212;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.rg *,.rg *::before,.rg *::after{box-sizing:border-box}
.rg a{color:inherit}
.rg img{display:block;max-width:100%}
.rg button{font:inherit;color:inherit;cursor:pointer;border-radius:0}
.rg h1,.rg h2,.rg h3,.rg p{margin:0}
.d{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-stretch:75%;font-variation-settings:"wdth" 75,"opsz" 96;font-weight:800;letter-spacing:-.025em;line-height:.88}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s9{grid-column:span 9}.s12{grid-column:1/-1}
.ey{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.redt{color:var(--redd)}
.top{background:var(--ink);color:var(--paper);font-size:13px}
.top-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:44px}
.top a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;min-height:44px}
.top a:hover{text-decoration:underline}
.hd{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:var(--line)}
.hd-in{display:flex;align-items:center;gap:24px;min-height:84px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
.logo-w{background:var(--red);color:#fff;font-size:34px;padding:9px 10px 5px;line-height:.9;letter-spacing:-.01em}
.logo-s{font-size:12px;font-weight:700;line-height:1.15;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;gap:2px;margin-left:auto}
.nl{display:flex;align-items:baseline;gap:6px;padding:12px;min-height:44px;text-decoration:none;font-weight:600;font-size:15px;position:relative}
.nl span{font-size:11px;color:var(--redd);font-weight:700}
.nl::after{content:"";position:absolute;left:12px;right:12px;bottom:6px;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.7,0,.2,1)}
.nl:hover::after,.nl[aria-current="page"]::after{transform:scaleX(1)}
.tel{display:flex;align-items:center;gap:10px;text-decoration:none;min-height:44px}
.tel b{display:block;font-size:16px;line-height:1.1}
.tel small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--redd);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 22px;font-weight:600;font-size:15px;text-decoration:none;border:2px solid var(--ink);background:transparent;color:var(--ink);transition:background .25s,color .25s,border-color .25s;white-space:nowrap}
.btn svg{transition:transform .3s}
.btn:hover svg{transform:translateX(4px)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-red:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-paper{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.btn-paper:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.burger{display:none;width:48px;height:48px;border:2px solid var(--ink);background:transparent;align-items:center;justify-content:center;margin-left:auto}
.mnav{display:none}
.rg :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.on-red :focus-visible{outline-color:#fff}
.ft{background:var(--ink);color:var(--paper);padding-top:72px;overflow:hidden}
.ft-top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.ft-claim{font-size:clamp(32px,4vw,56px);max-width:720px}
.ft-big{color:var(--red);font-size:clamp(96px,38vw,560px);line-height:.74;letter-spacing:-.04em;margin:56px 0 0 -.03em;overflow-wrap:anywhere}
.ft-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:32px;padding:48px 0;border-top:1px solid #3a3a3a;margin-top:40px}
.ft-h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#bdb8b0;margin-bottom:14px!important;font-weight:700}
.ft p{font-size:15px}
.ft-tel{font-size:36px;text-decoration:none;color:#fff}
.ft-mut{color:#bdb8b0;margin-top:8px!important}
.ft-l a{display:flex;align-items:center;min-height:44px;text-decoration:none;font-size:15px;border-bottom:1px solid #2a2a2a}
.ft-l a:hover{color:#fff;padding-left:6px;transition:padding .2s}
.ft-b{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:16px 0 24px;border-top:1px solid #3a3a3a;font-size:13px;color:#bdb8b0}
.ft-b a{min-height:44px;display:inline-flex;align-items:center}
@keyframes rise{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes up{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes kb{from{background-position:20% 30%}to{background-position:80% 70%}}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.dl1{animation-delay:.08s}.dl2{animation-delay:.16s}.dl3{animation-delay:.24s}.dl4{animation-delay:.32s}.dl5{animation-delay:.5s}

/* hero */
.hero{padding-top:20px}
.hero-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-bottom:14px}
.cap{font-size:15px;max-width:520px;text-align:right;min-height:48px}
.cap b{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--redd)}
.letters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:var(--line);border-left:var(--line)}
.cell{position:relative;display:block;width:100%;border:0;border-right:var(--line);border-bottom:var(--line);background:var(--paper);padding:30px 0 6px;text-align:center;overflow:hidden;transition:background .5s cubic-bezier(.7,0,.2,1);animation:up 1.1s cubic-bezier(.7,0,.2,1) both}
.cell:hover{background:var(--red)}
.cell:nth-child(2){animation-delay:.1s}.cell:nth-child(3){animation-delay:.2s}.cell:nth-child(4){animation-delay:.3s}
.lt-box{position:relative;display:block}
.lt{display:block;font-size:clamp(96px,31vw,450px);line-height:.86;padding:.05em 0 .02em;color:transparent;-webkit-background-clip:text;background-clip:text;background-size:cover;background-position:center;animation:kb 16s ease-in-out infinite alternate}
.lt-alt{position:absolute;left:0;right:0;top:0;opacity:0;transition:opacity .5s ease}
.cell:hover .lt-alt{opacity:1}
.lt-r{background-image:url(assets/vitrine-glass-pastry.webp)}
.lt-r2{background-image:url(assets/vitrine-colorful.webp)}
.lt-g{background-image:url(assets/macarons-stack.webp)}
.lt-g2{background-image:url(assets/macarons-rows.webp)}
.lt-t{background-image:url(assets/fromagerie.webp)}
.lt-t2{background-image:url(assets/fromagerie-labels.webp)}
.lt-e{background-image:url(assets/croissants.webp)}
.lt-e2{background-image:url(assets/croissant-dark.webp)}
.tag{position:absolute;left:12px;top:10px;z-index:2;background:var(--paper);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--ink)}
.tag-r{left:auto;right:12px;background:var(--ink);color:var(--paper)}
.hero-row{padding:40px 0 72px;align-items:end}
.h1{font-size:clamp(44px,6.6vw,108px);overflow-wrap:anywhere}
.h1 em{font-style:normal;color:var(--red)}
.lead{font-size:18px;line-height:1.55;margin-bottom:24px!important}
.btns{display:flex;gap:12px;flex-wrap:wrap}

/* marquee */
.mq{background:var(--red);color:#fff;overflow:hidden;border-top:var(--line);border-bottom:var(--line)}
.mq-track{display:flex;width:max-content;animation:mq 80s linear infinite}
.mq:hover .mq-track{animation-play-state:paused}
.mq-item{display:flex;align-items:center;gap:40px;padding:22px 40px 12px 0;font-size:clamp(56px,9vw,136px);text-decoration:none;white-space:nowrap;color:#fff;transition:color .25s}
.mq-item:hover{color:var(--ink)}
.mq-item i{display:block;width:.26em;height:.26em;background:var(--paper);transform:rotate(45deg)}
.mq2{background:var(--pink);color:var(--ink)}
.mq2 .mq-track{animation-direction:reverse;animation-duration:110s}
.mq2 .mq-item{font-size:clamp(40px,5.4vw,84px);color:transparent;-webkit-text-stroke:2px var(--ink);padding:16px 40px 8px 0}
.mq2 .mq-item:hover{color:var(--red);-webkit-text-stroke:2px var(--red)}
.mq2 .mq-item i{background:var(--red)}

/* sections */
.sh{padding:104px 0 44px;align-items:end}
.h2{font-size:clamp(40px,5.8vw,92px);overflow-wrap:anywhere}
.tabs{display:flex;flex-direction:column;border-top:var(--line)}
.ltab{display:flex;align-items:center;gap:16px;width:100%;border:0;border-bottom:var(--line);background:transparent;padding:12px 16px;min-height:84px;text-align:left;transition:background .3s,color .3s,padding .3s}
.ltab:hover{background:var(--pink);padding-left:26px}
.ltab-n{font-size:48px;min-width:64px}
.ltab-t{font-size:20px;font-weight:600;line-height:1.2}
.ltab-c{margin-left:auto;font-size:13px;font-weight:600}
.poster{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);border:var(--line);min-height:560px;animation:wipe .75s cubic-bezier(.7,0,.2,1) both}
.poster-l{background:var(--red);color:#fff;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.poster-n{font-size:clamp(120px,15vw,230px);line-height:.78}
.poster-name{font-size:clamp(40px,4.4vw,70px)}
.poster-r{padding:28px;display:flex;flex-direction:column;gap:18px}
.pts{display:grid;gap:0;border-top:1px solid var(--ink)}
.pt{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--ink);font-size:15px}
.pt b{color:var(--redd);font-weight:700;min-width:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:2px solid var(--ink);text-decoration:none;font-size:14px;font-weight:600;transition:background .2s,color .2s}
.chip:hover{background:var(--ink);color:var(--paper)}
.chip-red{background:var(--red);border-color:var(--red);color:#fff}
.vit{width:100%;max-width:440px;height:auto;display:block;margin-top:auto}
@media (max-width:760px){.poster{grid-template-columns:1fr}}

.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));border-top:var(--line);border-left:var(--line)}
.sbtn{display:flex;flex-direction:column;justify-content:space-between;gap:18px;border:0;border-right:var(--line);border-bottom:var(--line);background:transparent;text-align:left;padding:14px 16px;min-height:112px;transition:background .25s,color .25s}
.sbtn:hover{background:var(--pink)}
.sbtn-n{font-size:12px;font-weight:700;letter-spacing:.1em}
.sbtn-t{font-size:24px;line-height:1}
.spanel{background:var(--ink);color:var(--paper);padding:32px;position:sticky;top:110px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.spanel-t{font-size:clamp(44px,4.6vw,76px);color:var(--red)}
.temp{display:flex;align-items:baseline;gap:12px;padding:18px 0;border-top:1px solid #3a3a3a;border-bottom:1px solid #3a3a3a;margin:22px 0}
.temp b{font-size:clamp(32px,3vw,46px)}
.temp span{font-size:13px;color:#bdb8b0}
.spanel .chip{border-color:#5a5a5a;color:var(--paper)}
.spanel .chip:hover{background:var(--paper);color:var(--ink)}
.note{display:inline-block;margin-top:14px!important;font-size:13px;color:#bdb8b0}
.spanel .btn{margin-top:24px;border-color:var(--paper);color:var(--paper)}
.spanel .btn:hover{background:var(--paper);color:var(--ink)}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));border-top:var(--line);border-left:var(--line)}
.step{padding:28px;border-right:var(--line);border-bottom:var(--line);min-height:380px;display:flex;flex-direction:column;gap:16px;transition:background .35s,color .35s}
.step:hover{background:var(--red);color:#fff}
.step-n{font-size:120px;line-height:.8}
.step h3{font-size:44px}
.step p{font-size:16px;margin-top:auto!important}
.step:hover .redt{color:#fff}

.fc{position:relative;display:block;overflow:hidden;text-decoration:none;background:var(--ink)}
.fc img{width:100%;height:560px;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.fc-s img{height:420px}
.fc:hover img{transform:scale(1.06)}
.fc-info{position:absolute;left:0;bottom:0;max-width:92%;background:var(--paper);padding:16px 20px;display:flex;flex-direction:column;gap:2px;transition:background .3s,color .3s}
.fc:hover .fc-info{background:var(--red);color:#fff}
.fc-n{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:44px;padding:10px 14px 4px;line-height:.9}
.fc-info b{font-size:20px}
.fc-info span{font-size:14px}

.sw{display:flex;flex-direction:column;width:100%;border:var(--line);background:var(--paper);padding:0;text-align:left;transition:transform .3s}
.sw:hover{transform:translateY(-6px)}
.sw-img{display:block;height:220px;background-size:cover;background-position:center;border-bottom:var(--line)}
.sw-corian{background-image:url(assets/marble-white.webp)}
.sw-granit{background-image:url(assets/marble-veins.webp)}
.sw-bois{background:repeating-linear-gradient(90deg,#8E5B35 0 18px,#7C4E2C 18px 21px,#9A6640 21px 36px,#85552F 36px 38px)}
.sw-verre{background-color:#DCE4E3;background-image:radial-gradient(#121212 1.3px,transparent 1.6px);background-size:14px 14px}
.sw-l{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;min-height:60px;font-weight:600}
.matgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:24px}
.matinfo{margin-top:24px;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;border-top:var(--line);border-bottom:var(--line);padding:22px 0;animation:rise .45s both}
.matinfo b{font-size:clamp(32px,3.4vw,52px)}

.show{background:var(--pink);margin-top:104px;border-top:var(--line);border-bottom:var(--line)}
.show-in{padding:72px 0}
.addr{font-size:22px;line-height:1.35;margin:22px 0!important}
.map{width:100%;height:auto;display:block;border:var(--line);background:var(--paper)}
.mk-p{transform-origin:300px 196px;animation:pulse 2.2s ease-out infinite}

.cta{background:var(--red);color:#fff;padding:96px 0}
.cta-t{font-size:clamp(64px,11vw,176px);line-height:.82;overflow-wrap:anywhere}
.cta p{font-size:18px;max-width:440px}

@media (max-width:1100px){.nav,.tel,.hd-in>.btn{display:none}.burger{display:flex}.mnav{display:grid;border-top:var(--line)}.mnav a{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 24px;border-bottom:1px solid var(--ink);text-decoration:none;font-weight:600;font-size:18px}}
@media (max-width:900px){.g12>*{grid-column:1/-1}.cap{text-align:left}.spanel{position:static}}
@media (max-width:640px){.top-r{display:none}.tag{display:none}.sh{padding-top:72px}}
@media (prefers-reduced-motion:reduce){.rg *{animation:none!important;transition:none!important}}
</style>
</helmet>

<div class="wrap">

</button>

</button>

<span class="lt-box"><span class="lt d lt-e" aria-hidden="true">E</span><span class="lt d lt-e2 lt-alt" style="{{ alt.e }}" aria-hidden="true">E</span></span>
</button>

<div class="g12 hero-row">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":6500},"accent":{"editor":"color","default":"#D42A20","options":["#D42A20","#B8231A","#121212"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { menuOpen:false, pin:"", ligne:"stone", sect:"patisserie", mat:"corian" };
  }
  renderVals(){
    const s = this.state;
    const accent = (this.props && this.props.accent) || "#D42A20";
    const ON = "background:var(--red);color:#fff;border-color:var(--red)";

    const HERO = {
      r:{k:"R — Vitrine", t:"Vitrines réfrigérées pâtissières, dessinées pour votre comptoir et votre local."},
      g:{k:"G — Macarons", t:"Module Gourmandise : exposition centrale, vitrages coulissants des deux côtés."},
      t:{k:"T — Fromagerie", t:"Treize secteurs servis, de la fromagerie à la poissonnerie (−2 °C / 0 °C)."},
      e:{k:"E — Croissants", t:"Boulangerie : Amandine et Pastry Show, plaques pâtissières 600 × 400 mm."}
    };
    const cell = {}, alt = {}, press = {}, pick = {};
    ["r","g","t","e"].forEach(k => {
      const on = s.pin === k;
      cell[k] = on ? "background:var(--red)" : "";
      alt[k] = on ? "opacity:1" : "";
      press[k] = on ? "true" : "false";
      pick[k] = () => this.setState({ pin: s.pin === k ? "" : k });
    });
    const hero = s.pin ? HERO[s.pin] : { k:"Survolez, cliquez une lettre", t:"Chaque lettre est une vitrine : quatre métiers, une seule exigence." };

    const LIGNES = [
      {id:"basique", n:"01", nom:"Basique", pitch:"Association de modules différents, coloris et matériaux au choix du client.",
        pts:["Choix du coloris et des matériaux selon votre souhait","Panneau frontal en bois mélaminé ou en verre (option)","Plan de travail et plinthe en granit"],
        mods:["Comptoir bar","Comptoir caisse","Saladette réfrigérée","Vitrine réfrigérée Cube","Pastry Show","Statique","Basse","Murale self-service","Panoramique","Chaud","Vitrine rétro","Amandine"],
        top:"fill:#4A4A4A", panel:"fill:#9A6A3F", txt:"fill:#F5F2EC", ptxt:"BOIS MÉLAMINÉ OU VERRE", plinth:"fill:#4A4A4A"},
      {id:"stone", n:"02", nom:"Stone", pitch:"Structure en pierre acrylique type Corian, panneau frontal en verre sérigraphié à votre nom.",
        pts:["Structure en pierre acrylique type Corian","Panneau frontal en verre avec sérigraphie du client","Modules associables, du comptoir à la poissonnerie"],
        mods:["Réfrigérée Plane","Vision","Saladette","Chaud bain-marie","Centrale","Gourmandise","Comptoir caisse","Comptoir bar","Poissonnerie","Panorama","Surface plane"],
        top:"fill:#EFECE6", panel:"fill:#D9E3E2", txt:"fill:#B8231A", ptxt:"VOTRE NOM ICI", plinth:"fill:#EFECE6"},
      {id:"legno", n:"03", nom:"Legno", pitch:"Association de modules habillés d’un panneau frontal en bois mélaminé.",
        pts:["Panneau frontal en bois mélaminé","Modules neutres, réfrigérés, ventilés ou chauffants","Matières du plan de travail : [À PRÉCISER]"],
        mods:["Plane","Arrière neutre","Caisse et vitrine neutre","Comptoir bar","Réfrigérée statique","Vitrine réfrigérée ventilée plane","Vitrine neutre","Réfrigéré ventilé","Vitrine chauffante sèche"],
        top:"fill:#2B2B2B", panel:"fill:#7C4E2C", txt:"fill:#F5F2EC", ptxt:"BOIS MÉLAMINÉ", plinth:"fill:#2B2B2B"},
      {id:"encastrable", n:"04", nom:"Encastrable", pitch:"Module brut prêt à être habillé : version comptoir ou meuble entier sur pied.",
        pts:["Module brut prêt à être habillé","Version comptoir ou meuble entier sur pied","Cuve froid ventilé ou froid statique"],
        mods:["Cuve froid ventilé","Cuve froid statique"],
        top:"fill:#C9C9C9", panel:"fill:#F5F2EC;stroke-dasharray:8 6", txt:"fill:#121212", ptxt:"À HABILLER", plinth:"fill:#C9C9C9"},
      {id:"industry", n:"05", nom:"Industry", pitch:"Vitrines standardisées en longueurs et indépendantes, de la murale au supermarché.",
        pts:["Longueurs standardisées","Vitrines indépendantes","Murales, snack, boucherie, poissonnerie, boulangerie…"],
        mods:["Olympe","Nepal","Aramis","Rubis","Argentine","Hanoi","Loire","Argent","Sugar","Hawaii","4 faces vitrées"],
        top:"fill:#121212", panel:"fill:#2A2A2A", txt:"fill:#F5F2EC", ptxt:"STANDARD", plinth:"fill:#121212"}
    ];
    const lignes = LIGNES.map(l => {
      const on = l.id === s.ligne;
      const shown = l.mods.slice(0, 6);
      const rest = l.mods.length - shown.length;
      return {
        n:l.n, nom:l.nom, pitch:l.pitch, label:"Ligne " + l.nom,
        count: l.mods.length + (l.mods.length > 1 ? " modules" : " module"),
        pts: l.pts.map((t,i) => ({ n:"0" + (i+1), t })),
        chips: shown.map(nom => ({ nom })),
        more: rest > 0 ? "+" + rest + " — tout voir" : "Voir la ligne",
        topCss:l.top, panelCss:l.panel, txtCss:l.txt, panelTxt:l.ptxt, plinthCss:l.plinth,
        isSel:on, ariaSel:on ? "true" : "false", tabStyle:on ? ON : "",
        pick: () => this.setState({ ligne:l.id })
      };
    });

    const SECT = [
      {id:"boulangerie", nom:"Boulangerie", temp:"Selon module", tnote:"froid statique, ventilé ou neutre", mods:["Amandine","Pastry Show","Réfrigérée statique","Vitrine neutre","Loire"], real:[7,8]},
      {id:"patisserie", nom:"Pâtisserie", temp:"+2 / +8 °C", tnote:"plage pâtisserie", mods:["Plane","Vision","Panorama","Centrale","Gourmandise","Pastry Show","Cube","Amandine"], real:[1,10,14]},
      {id:"chocolats", nom:"Chocolats", temp:"+14 / +18 °C", tnote:"plage chocolat", mods:["Plane","Vision","Centrale","Gourmandise"], real:[3,10,14]},
      {id:"sandwichs", nom:"Sandwichs", temp:"+2 / +8 °C", tnote:"plage des modules conseillés", mods:["Plane","Panoramique","Basse","Murale self-service","Nepal"], real:[4]},
      {id:"traiteur", nom:"Traiteur", temp:"+2 / +8 °C", tnote:"plage des modules conseillés", mods:["Plane","Saladette","Panorama","Comptoir bar","Comptoir caisse"], real:[11,13]},
      {id:"poissonnerie", nom:"Poissonnerie", temp:"−2 / 0 °C", tnote:"froid statique, serpentin de cuve", mods:["Poissonnerie","Hanoi","Panorama","Surface plane"], real:[13]},
      {id:"salades", nom:"Bar à salades", temp:"+2 / +8 °C", tnote:"saladette, bacs gastronormes", mods:["Saladette","Panorama","Comptoir caisse"], real:[2,5]},
      {id:"couscous", nom:"Bar à couscous", temp:"+30 / +90 °C", tnote:"chaud bain-marie", mods:["Chaud bain-marie"], real:[12]},
      {id:"fromagerie", nom:"Fromagerie", temp:"[TEMPÉRATURE]", tnote:"modules à valider", mods:["Réfrigérée statique","Panorama","Comptoir caisse"], real:[]},
      {id:"bar", nom:"Bar", temp:"Neutre / réfrigéré", tnote:"comptoir bar", mods:["Comptoir bar","Comptoir caisse"], real:[]},
      {id:"topping", nom:"Bar à topping", temp:"+2 / +8 °C", tnote:"saladette sur mesure", mods:["Saladette sur mesure","Surface plane"], real:[6]},
      {id:"cafe", nom:"Coffee shop / Café", temp:"Selon module", tnote:"modules à valider", mods:["Comptoir bar","Comptoir caisse","Cube","Pastry Show"], real:[]},
      {id:"pizza", nom:"Pizza al taglio", temp:"+2 / +8 °C", tnote:"plage des modules conseillés", mods:["Saladette","Plane","Comptoir caisse"], real:[9]}
    ];
    const sects = SECT.map((x,i) => {
      const on = x.id === s.sect;
      return {
        nom:x.nom, temp:x.temp, tnote:x.tnote, n:(i < 9 ? "0" : "") + (i+1),
        lab:"Secteur " + (i < 9 ? "0" : "") + (i+1) + " / 13",
        chips: x.mods.map(nom => ({ nom })),
        realLabel: x.real.length ? "Réalisations liées : n° " + x.real.join(", n° ") : "Pas encore de réalisation publiée pour ce secteur.",
        isSel:on, ariaSel:on ? "true" : "false", style:on ? ON : "",
        pick: () => this.setState({ sect:x.id })
      };
    });
    const marquee = SECT.concat(SECT).map(x => ({ nom:x.nom }));
    const TEMPS = ["+2 / +8 °C pâtisserie","+14 / +18 °C chocolat","−2 / 0 °C poissonnerie","+30 / +90 °C chaud","Froid ventilé","Froid statique","Sur mesure"];
    const marquee2 = TEMPS.concat(TEMPS).map(temp => ({ temp }));

    const MATS = [
      {id:"corian", nom:"Pierre acrylique", txt:"Type Corian : la structure de la Ligne Stone. Sur le module Gourmandise, piliers, plan de travail et pied sont en pierre acrylique blanche."},
      {id:"granit", nom:"Granit", txt:"Plan de travail et plinthe en granit sur la Ligne Basique. Visuel d’illustration ; échantillons au show-room."},
      {id:"bois", nom:"Bois mélaminé", txt:"Panneau frontal en bois mélaminé, avec moulures : Ligne Legno, et Ligne Basique en standard."},
      {id:"verre", nom:"Verre sérigraphié", txt:"Panneau frontal en verre avec la sérigraphie du client : votre identité sur la façade des vitrines Stone."}
    ];
    const matS = {}, matP = {}, matPick = {};
    MATS.forEach(m => {
      const on = m.id === s.mat;
      matS[m.id] = on ? "outline:4px solid var(--red);outline-offset:-2px" : "";
      matP[m.id] = on ? "true" : "false";
      matPick[m.id] = () => this.setState({ mat:m.id });
    });
    const mats = MATS.map(m => ({ nom:m.nom, txt:m.txt, isSel:m.id === s.mat }));

    return {
      rootStyle: "--red:" + accent,
      menuOpen: s.menuOpen, menuAria: s.menuOpen ? "true" : "false",
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      hero, cell, alt, press, pick,
      lignes, sects, marquee, marquee2,
      matS, matP, matPick, mats
    };
  }
}
</script>
