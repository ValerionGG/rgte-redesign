<style>
body{margin:0;background:#F4F2EE}
sc-for,sc-if{display:contents}
.mn{--g:#F4F2EE;--s:#E6E2DB;--s2:#DAD5CC;--ink:#2B2926;--mu:#6E6A63;--mu2:#5C5852;--gl:#C9D3D6;--ln:rgba(43,41,38,.16);--ln2:rgba(43,41,38,.08);background:var(--g);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mn *,.mn *::before,.mn *::after{box-sizing:border-box}
.mn img{display:block;max-width:100%}
.mn a{color:inherit}
.mn :focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px}
.sf{font-family:'Newsreader',Georgia,serif;font-weight:300}
.sc{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--mu)}
.no{font-family:'Newsreader',Georgia,serif;font-variant-caps:all-small-caps;letter-spacing:.14em;font-size:18px;color:var(--mu)}
.strip{border-bottom:1px solid var(--ln2);font-size:13px;color:var(--mu)}
.strip-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:44px}
.strip a{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px;min-height:44px}
.strip a:hover{color:var(--red)}
.hd{position:sticky;top:0;z-index:30;background:rgba(244,242,238,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln2)}
.hd-in{display:flex;align-items:center;justify-content:space-between;gap:24px;height:84px}
.logo{display:inline-flex;align-items:center;gap:14px;text-decoration:none;min-height:44px}
.logo-w{font-weight:600;font-size:19px;letter-spacing:.34em;position:relative}
.logo-w::after{content:"";position:absolute;right:-1px;top:0;width:5px;height:5px;background:var(--red)}
.logo-s{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:15px;color:var(--mu);padding-left:14px;border-left:1px solid var(--ln)}
.nav{display:flex;gap:2px}
.nav a{position:relative;text-decoration:none;font-size:15px;padding:0 14px;min-height:44px;display:inline-flex;align-items:center}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.nav a:hover::after{transform:scaleX(1)}
.nav a.on::after{transform:scaleX(1);background:var(--red)}
.hd-r{display:flex;align-items:center;gap:20px}
.tel{text-decoration:none;display:flex;flex-direction:column;line-height:1.25;min-height:44px;justify-content:center;font-size:15px;font-weight:500}
.tel small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;font:500 15px/1 'Hanken Grotesk',sans-serif;text-decoration:none;cursor:pointer;transition:background .35s,color .35s,border-color .35s,transform .35s,box-shadow .35s;white-space:nowrap}
.btn svg{transition:transform .35s}
.btn:hover svg{transform:translateX(4px)}
.btn-r{background:var(--red);color:#fff}
.btn-r:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px var(--red)}
.btn-o{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-o:hover{background:var(--ink);color:var(--g)}
.burger{display:none;width:48px;height:48px;border-radius:999px;border:1px solid var(--ln);background:transparent;color:var(--ink);align-items:center;justify-content:center;cursor:pointer}
.mnav{display:flex;flex-direction:column;padding:8px 20px 28px;border-top:1px solid var(--ln2)}
.mnav a{font-family:'Newsreader',Georgia,serif;font-size:26px;font-weight:300;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--ln2);min-height:44px}
.h1{font-family:'Newsreader',Georgia,serif;font-weight:300;letter-spacing:-.025em;line-height:.98;margin:0;overflow-wrap:anywhere}
.h2{font-family:'Newsreader',Georgia,serif;font-weight:300;letter-spacing:-.02em;line-height:1.04;margin:0;font-size:clamp(34px,4.4vw,64px);overflow-wrap:anywhere}
.h1 em,.h2 em{font-style:italic}
.lead{font-size:18px;line-height:1.65;color:var(--mu);max-width:560px;margin:0}
.ft{background:var(--s);padding:96px 0 0;border-top:1px solid var(--ln2)}
.ft-cta{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;padding-bottom:72px;border-bottom:1px solid var(--ln)}
.ft-cta .h2{max-width:780px}
.ft-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px;padding:56px 0}
.ft-g h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--mu2);margin:0 0 14px}
.ft-g p{margin:0;font-size:15px;line-height:1.7}
.ft-l a{display:flex;align-items:center;min-height:44px;text-decoration:none;font-size:15px;border-bottom:1px solid var(--ln2);transition:color .3s,padding .4s}
.ft-l a:hover{color:var(--red);padding-left:6px}
.ft-b{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;padding:14px 0 22px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu2)}
.ft-b a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center;color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rv{animation:rise 1.1s cubic-bezier(.2,.7,.1,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.5s}
@supports (animation-timeline: view()){.rs{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 80%}}
@media (max-width:1080px){.nav,.tel{display:none}.burger{display:inline-flex}}
@media (min-width:1081px){.mnav{display:none}}
@media (max-width:720px){.wrap{padding:0 20px}.hd-in{height:72px}.ft{padding-top:64px}}
@media (max-width:520px){.hd-r .btn{display:none}.logo-s{display:none}}

.t-corian{background:#F6F4F0 url(assets/marble-white.webp) center/cover}
.t-granit{background:#4A4743 url(assets/marble-veins.webp) center/cover;filter:grayscale(1) contrast(1.5) brightness(.52)}
.t-granit::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) .8px,transparent 1.3px),radial-gradient(rgba(0,0,0,.55) 1px,transparent 1.6px);background-size:6px 6px,9px 9px;background-position:0 0,3px 4px}
.t-bois{background-color:#B08860;background-image:repeating-linear-gradient(90deg,rgba(84,52,26,.18) 0 1px,transparent 1px 7px),repeating-linear-gradient(90deg,rgba(255,236,210,.14) 0 3px,transparent 3px 29px),linear-gradient(180deg,#B9926A,#A47C55)}
.t-verre{background-color:#C9D3D6;background-image:radial-gradient(rgba(43,41,38,.2) 1px,transparent 1.5px),linear-gradient(118deg,rgba(255,255,255,.6) 0 14%,transparent 14% 36%,rgba(255,255,255,.3) 36% 41%,transparent 41%);background-size:8px 8px,100% 100%}
.t-brut{background-color:#D8D3CA;background-image:radial-gradient(rgba(43,41,38,.09) 1px,transparent 1.4px);background-size:5px 5px}
.t-hatch{background-color:#ECE8E1;background-image:repeating-linear-gradient(45deg,rgba(43,41,38,.24) 0 1px,transparent 1px 9px)}
.t-inox{background-color:#B9BEC0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 1px,transparent 1px 3px),linear-gradient(180deg,#CED3D5,#A9AFB2 55%,#C3C8CA)}
.tx{position:absolute;inset:0;transition:opacity 1s cubic-bezier(.2,.7,.1,1)}
.moul{position:absolute;inset:16px 20px;border:1px solid rgba(60,36,16,.35);box-shadow:inset 0 0 0 7px rgba(255,236,210,.1),inset 0 0 0 8px rgba(60,36,16,.25)}
.seri{position:absolute;left:0;right:0;top:56px;text-align:center;font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:20px;color:rgba(43,41,38,.72)}

.ph{padding:72px 0 56px}
.ph .h1{font-size:clamp(46px,6.4vw,104px);margin:22px 0 30px}
.ph-g{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:48px;align-items:end}
@media (max-width:900px){.ph-g{grid-template-columns:1fr}}

.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.tab{all:unset;box-sizing:border-box;position:relative;cursor:pointer;display:flex;flex-direction:column;gap:14px;padding:26px 22px 24px;border-right:1px solid var(--ln2);transition:background .4s}
.tab:hover{background:#FBFAF8}
.tab:last-child{border-right:0}
.tab-bar{position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--red);transform-origin:left;transition:transform .7s cubic-bezier(.2,.7,.1,1)}
.tab-sw{position:relative;display:block;height:64px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(43,41,38,.1);transition:height .6s cubic-bezier(.2,.7,.1,1)}
.tab:hover .tab-sw{height:76px}
.tab-t{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:32px;line-height:1}
.tab-k{font-size:13px;color:var(--mu)}

.ld{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:72px;align-items:center;padding:88px 0}
.el{position:relative;height:460px;background:var(--s);overflow:hidden}
.el::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(43,41,38,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(43,41,38,.05) 1px,transparent 1px);background-size:40px 40px}
.el-in{position:absolute;left:50%;top:24px;width:520px;height:420px;margin-left:-260px;transform-origin:50% 0}
.el-hood{position:absolute;left:50px;top:40px}
.el-top{position:absolute;left:10px;top:176px;width:500px;height:40px;overflow:hidden;clip-path:polygon(4% 0,96% 0,100% 100%,0 100%)}
.el-top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0));z-index:2}
.el-edge{position:absolute;left:10px;top:216px;width:500px;height:16px;overflow:hidden}
.el-edge::after{content:"";position:absolute;inset:0;background:rgba(43,41,38,.14);z-index:2}
.el-body{position:absolute;left:26px;top:232px;width:468px;height:150px;overflow:hidden}
.el-body::after{content:"";position:absolute;inset:0;z-index:3;background:linear-gradient(180deg,rgba(43,41,38,.2),rgba(43,41,38,0) 24%),repeating-linear-gradient(90deg,rgba(43,41,38,0) 0 155px,rgba(43,41,38,.14) 155px 156px)}
.el-pl{position:absolute;left:34px;top:382px;width:452px;height:14px;overflow:hidden}
.el-pl::after{content:"";position:absolute;inset:0;background:rgba(43,41,38,.2);z-index:2}
.el-fl{position:absolute;left:20px;top:384px;width:480px;height:40px;border-radius:50%;background:radial-gradient(closest-side,rgba(43,41,38,.3),rgba(43,41,38,0))}
.hg{fill:rgba(201,211,214,.36)}
.hl{fill:none;stroke:var(--ink);stroke-width:1.1}
.hp{fill:#EFE9DF;stroke:var(--ink);stroke-width:.9}
.sheen path{stroke:#fff;stroke-width:12;opacity:.6;fill:none}
.sheen{animation:sheen 7s 1s ease-in-out infinite;transform:translateX(-120px)}
@keyframes sheen{0%{transform:translateX(-120px)}50%,100%{transform:translateX(480px)}}
.lgd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--ln)}
.lgd div{padding:14px 14px 0 0}
.lgd b{display:block;font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:400;font-size:16px;line-height:1.3;margin-top:4px}
.ld-t{font-size:clamp(56px,7vw,112px);line-height:.9;letter-spacing:-.03em;margin:14px 0 22px}
.ld-t em{font-style:italic}
.dl{display:grid;grid-template-columns:160px 1fr;border-top:1px solid var(--ln);margin:30px 0 0}
.dl dt,.dl dd{margin:0;padding:14px 0;border-bottom:1px solid var(--ln)}
.dl dt{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);padding-top:17px}
@media (max-width:960px){.ld{grid-template-columns:1fr;gap:40px}}
@media (max-width:600px){.el{height:330px}.el-in{transform:scale(.62)}.lgd{grid-template-columns:1fr}.dl{grid-template-columns:1fr}.dl dt{border-bottom:0;padding-bottom:0}}

.mh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.fl{display:flex;flex-wrap:wrap;gap:8px}
.fb{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--ln);background:transparent;font:400 14px/1 'Hanken Grotesk',sans-serif;color:var(--ink);cursor:pointer;transition:all .3s}
.fb:hover{border-color:var(--ink)}
.fb i{font-style:normal;font-size:12px;color:var(--mu)}
.mds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:1px;background:var(--ln);border:1px solid var(--ln)}
.md{position:relative;display:flex;flex-direction:column;gap:18px;padding:26px 26px 30px;background:var(--g);text-decoration:none;min-height:240px;transition:background .5s}
.md:hover{background:#FBFAF8}
.md-ic{height:56px;color:var(--ink)}
.md-ic svg{transition:transform .7s cubic-bezier(.2,.7,.1,1)}
.md:hover .md-ic svg{transform:translateX(8px)}
.md-t{font-size:30px;line-height:1.05;margin:6px 0 6px;transition:color .3s}
.md:hover .md-t{color:var(--red)}
.md p{margin:0;font-size:14px;color:var(--mu)}
.md-f{position:absolute;top:22px;right:22px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--red);padding:6px 10px;border-radius:999px}
.md-a{position:absolute;right:24px;bottom:24px;width:44px;height:44px;border-radius:999px;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;transition:all .4s}
.md:hover .md-a{background:var(--ink);color:var(--g);border-color:var(--ink)}
.empty{padding:48px;text-align:center;background:var(--g);color:var(--mu)}

.sec{padding:120px 0;border-top:1px solid var(--ln2)}
.sec-s{background:var(--s)}
.sec-s .sc,.sec-s .no{color:var(--mu2)}
.cmp-w{overflow-x:auto;border-top:1px solid var(--ink);margin-top:48px}
.cmp{display:grid;grid-template-columns:180px repeat(5,minmax(160px,1fr));min-width:980px}
.cmp-l{display:flex;flex-direction:column}
.cmp-c{display:flex;flex-direction:column;transition:background .4s,box-shadow .4s}
.cell{padding:16px 16px 16px 0;border-bottom:1px solid var(--ln);min-height:84px;font-size:14px;line-height:1.5}
.cmp-c .cell{padding-left:16px}
.cell-h{min-height:96px;display:flex;align-items:flex-end}
.cmp-b{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;min-height:96px;justify-content:flex-end;padding:16px;border-bottom:1px solid var(--ln)}
.cmp-b:hover .tab-t{font-style:italic}
.cmp-l .cell{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu2);font-weight:500}
.big{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:40px;line-height:1}

.band{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;align-items:center}
.band-pic{height:420px;overflow:hidden}
.band-pic img{width:100%;height:420px;object-fit:cover;transition:transform 2s cubic-bezier(.2,.7,.1,1)}
.band:hover .band-pic img{transform:scale(1.04)}
@media (max-width:900px){.band{grid-template-columns:1fr}.sec{padding:88px 0}}
@media (prefers-reduced-motion:reduce){.mn *{animation:none !important;transition:none !important}}
</style>
</helmet>

<section class="ph">
  <div class="wrap">
    <div class="ph-g">
      <div>
        <p class="sc rv">N° 02 — Lignes d’agencement</p>
        <h1 class="h1 rv d1">Cinq lignes.<br><em>Une matière</em><br>pour chaque métier.</h1>

<section>
  <div class="wrap">
    <div class="tabs rv d3" role="tablist" aria-label="Lignes d’agencement">
      <button type="button" role="tab" class="tab" style="{{ tB.st }}" aria-selected="{{ tB.sel }}" onClick="{{ tB.pick }}"><span class="tab-bar" style="{{ tB.bar }}"></span><span class="no">01</span><span class="tab-sw t-granit"></span><span class="tab-t">Basique</span><span class="tab-k">{{ tB.count }} modules · granit</span></button>
      <button type="button" role="tab" class="tab" style="{{ tS.st }}" aria-selected="{{ tS.sel }}" onClick="{{ tS.pick }}"><span class="tab-bar" style="{{ tS.bar }}"></span><span class="no">02</span><span class="tab-sw t-corian"></span><span class="tab-t">Stone</span><span class="tab-k">{{ tS.count }} modules · Corian</span></button>
      <button type="button" role="tab" class="tab" style="{{ tL.st }}" aria-selected="{{ tL.sel }}" onClick="{{ tL.pick }}"><span class="tab-bar" style="{{ tL.bar }}"></span><span class="no">03</span><span class="tab-sw t-bois"></span><span class="tab-t">Legno</span><span class="tab-k">{{ tL.count }} modules · bois mélaminé</span></button>
      <button type="button" role="tab" class="tab" style="{{ tE.st }}" aria-selected="{{ tE.sel }}" onClick="{{ tE.pick }}"><span class="tab-bar" style="{{ tE.bar }}"></span><span class="no">04</span><span class="tab-sw t-hatch"></span><span class="tab-t">Encastrable</span><span class="tab-k">{{ tE.count }} modules · brut</span></button>
      <button type="button" role="tab" class="tab" style="{{ tI.st }}" aria-selected="{{ tI.sel }}" onClick="{{ tI.pick }}"><span class="tab-bar" style="{{ tI.bar }}"></span><span class="no">05</span><span class="tab-sw t-inox"></span><span class="tab-t">Industry</span><span class="tab-k">{{ tI.count }} modèles · standard</span></button>
    </div>

    <div class="ld" role="tabpanel" aria-label="{{ L.label }}">
      <div>
        <div class="el" role="img" aria-label="{{ L.drawLabel }}">
          <div class="el-in">
            <div class="el-fl"></div>
            <div class="el-body">
              <div class="tx t-bois" style="{{ fBois }}"><span class="moul"></span></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4900},"accent":{"editor":"color","default":"#D42A20","options":["#D42A20","#2B2926","#9A7B4F"]}}'>
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { ligne:'stone', kind:'all', menu:false }; }
  renderVals(){
    const s = this.state;
    const accent = this.props.accent || '#D42A20';
    const op = v => v ? 'opacity:1' : 'opacity:0';
    const KL = { v:'Vitrine', c:'Comptoir', k:'Bacs & cuve' };

    const LINES = {
      basique:{ n:'01', name:'Basique', top:'granit', frontTx:'bois',
        desc:'Association de modules différents. Choix du coloris et des matériaux selon votre souhait&nbsp;; panneau frontal en bois mélaminé ou en verre (option), plan de travail et plinthe en granit.',

        mods:[['Comptoir bar','c','Neutre ou réfrigéré'],['Comptoir caisse','c','Avec ou sans tablette PMR'],['Saladette réfrigérée','k','Bacs gastronormes'],['Vitrine réfrigérée Cube','v','Vitrage cubique, 2 ou 3 étagères verre'],['Pastry Show','v','Froid ventilé, vitrage droit, plaques 600 × 400 mm'],['Statique','v','Froid statique'],['Basse','v','Vitrine basse'],['Murale self-service','v','Libre-service mural'],['Panoramique','v','Vitrine panoramique'],['Chaud','k','Bain-marie ou plaque chaude'],['Vitrine rétro','v','Vitrine de style rétro'],['Amandine','v','Montants modernes, cuve 600 × 400, froid ventilé']] },
      stone:{ n:'02', name:'Stone', top:'corian', frontTx:'verre',
        desc:'Association de modules à la structure en pierre acrylique type Corian, panneau frontal en verre avec la sérigraphie du client.',
        struct:'Pierre acrylique type Corian', front:'Verre, sérigraphie du client', topT:'Pierre acrylique blanche', format:'Association de modules', temps:'+2/+8 · +14/+18 · −2/0 · +30/+90 °C',
        mods:[['Réfrigérée Plane','v','Hauteur du plan de travail · 53 ou 60 cm · +2/+8 ou +14/+18'],['Vision','v','8 cm sous le plan de travail · 53 ou 60 cm'],['Saladette','k','Bacs gastronormes (non fournis) · +2/+8'],['Chaud bain-marie','k','Bacs gastronormes · +30/+90 °C'],['Centrale','v','Vitrages coulissants des 2 côtés · 60 cm'],['Gourmandise','v','Exposition centrale · dès 5 800 € HT (101 cm)'],['Comptoir caisse','c','Avec ou sans tablette PMR'],['Comptoir bar','c','Neutre ou réfrigéré'],['Poissonnerie','k','Froid statique, serpentin de cuve · −2/0 °C'],['Panorama','v','2 ou 3 étagères réfrigérées +4/+8'],['Surface plane','c','Surface d’exposition plane']] },
      legno:{ n:'03', name:'Legno', top:'brut', frontTx:'bois',
        desc:'Association de modules, habillés d’un panneau frontal en bois mélaminé.',
        struct:'[À PRÉCISER]', front:'Bois mélaminé', topT:'[À PRÉCISER]', format:'Association de modules', temps:'[À PRÉCISER] selon module',
        mods:[['Plane','v','Exposition plane'],['Arrière neutre','c','Meuble arrière neutre'],['Caisse et vitrine neutre','c','Caisse et vitrine non réfrigérées'],['Comptoir bar','c','Comptoir'],['Réfrigérée statique','v','Froid statique'],['Vitrine réfrigérée ventilée plane','v','Froid ventilé, exposition plane'],['Vitrine neutre','v','Non réfrigérée'],['Réfrigéré ventilé','v','Froid ventilé'],['Vitrine chauffante sèche','v','Chaleur sèche']] },
      encastrable:{ n:'04', name:'Encastrable', top:'hatch', frontTx:'hatch',
        desc:'Un module brut, prêt à être habillé&nbsp;: en version comptoir ou en meuble entier sur pied.',
        struct:'Module brut prêt à être habillé', front:'Habillage libre', topT:'Habillage libre', format:'Comptoir ou meuble entier sur pied', temps:'[À PRÉCISER]',
        mods:[['Cuve froid ventilé','k','Version comptoir ou meuble sur pied'],['Cuve froid statique','k','Version comptoir ou meuble sur pied']] },
      industry:{ n:'05', name:'Industry', top:'inox', frontTx:'inox',
        desc:'Des vitrines standardisées en longueurs, et indépendantes&nbsp;: chaque modèle répond à un usage.',
        struct:'Vitrines standardisées, indépendantes', front:'[À PRÉCISER]', topT:'[À PRÉCISER]', format:'Longueurs standardisées', temps:'[À PRÉCISER] selon modèle',
        mods:[['Olympe','v','Murale'],['Nepal','v','Snack'],['Aramis','v','Boucherie'],['Rubis','v','Modèle standard'],['Argentine','v','Modèle standard'],['Hanoi','v','Poissonnerie'],['Loire','v','Boulangerie'],['Argent','v','Murale froid'],['Sugar','v','Hauteur comptoir'],['Hawaii','v','Supermarché'],['4 faces vitrées','v','Vitrée sur quatre faces']] }
    };
    const nb = t => t.replace(/&nbsp;/g, ' ');
    const ORDER = ['basique','stone','legno','encastrable','industry'];
    const Lr = LINES[s.ligne];

    const tab = id => {
      const on = s.ligne === id;
      return { sel: on ? 'true' : 'false', count: LINES[id].mods.length,
        st: on ? 'background:#FBFAF8' : '',
        bar: on ? 'transform:scaleX(1)' : 'transform:scaleX(0)',
        pick: () => this.setState({ ligne:id, kind:'all' }) };
    };

    const all = Lr.mods;
    const cnt = k => all.filter(m => m[1] === k).length;
    const fb = (k, c) => {
      const on = s.kind === k;
      return { c, sel: on ? 'true' : 'false',
        st: on ? 'background:#2B2926;color:#F4F2EE;border-color:#2B2926' : '',

    };
    const list = s.kind === 'all' ? all : all.filter(m => m[1] === s.kind);

      feat: m[0] === 'Gourmandise',
      aria: 'Module ' + m[0] + ' — voir la fiche'
    }));

    const cols = ORDER.map(id => {
      const l = LINES[id], on = s.ligne === id;
      return { n:l.n, name:l.name, struct:l.struct, front:l.front, top:l.topT, format:l.format, temps:l.temps, count:l.mods.length,
        sel: on ? 'true' : 'false',
        st: on ? 'background:#FBFAF8;box-shadow:inset 0 2px 0 ' + accent : '',
        pick: () => this.setState({ ligne:id, kind:'all' }) };
    });

    return {
      rootStyle: '--red:' + accent,
      menu: s.menu,
      toggleMenu: () => this.setState({ menu: !s.menu }),
      tB: tab('basique'), tS: tab('stone'), tL: tab('legno'), tE: tab('encastrable'), tI: tab('industry'),

      fBois: op(Lr.frontTx === 'bois'), fVerre: op(Lr.frontTx === 'verre'), fHatch: op(Lr.frontTx === 'hatch'), fInox: op(Lr.frontTx === 'inox'),
      fAll: fb('all', all.length), fV: fb('v', cnt('v')), fC: fb('c', cnt('c')), fK: fb('k', cnt('k')),
      mods, noMods: mods.length === 0, cols
    };
  }
}
</script>
