<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F1F5F7}
.cx,.cx *{box-sizing:border-box}
.cx{font-family:'Sora',system-ui,sans-serif;color:#0F1C24;background:#F1F5F7;-webkit-font-smoothing:antialiased;line-height:1.55}
.cx a{color:inherit}
.cx h1,.cx h2,.cx h3,.cx p{margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.04em}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.tnum{font-variant-numeric:tabular-nums}
.navl{position:relative;text-decoration:none;font-size:14px;font-weight:500;display:inline-flex;align-items:center;min-height:44px}
.navl::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:1px;background:#3A7CA5;transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.navl:hover::after,.navl.on::after{transform:scaleX(1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font:600 14px/1 'Sora',sans-serif;text-decoration:none;border:0;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s,border-color .25s}
.btn-red{background:#D42A20;color:#fff!important;box-shadow:0 12px 26px -14px rgba(212,42,32,.75)}
.btn-red:hover{transform:translateY(-2px);box-shadow:0 18px 32px -14px rgba(212,42,32,.85)}
.btn-ghost{background:rgba(255,255,255,.62);color:#0F1C24;border:1px solid rgba(15,28,36,.16)}
.btn-ghost:hover{background:#fff;border-color:#3A7CA5}
.btn-dark{background:#0F1C24;color:#fff!important}
.btn-dark:hover{transform:translateY(-2px);background:#1B2F3B}
.frost{background:linear-gradient(160deg,rgba(255,255,255,.80),rgba(255,255,255,.46));backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 30px 60px -32px rgba(15,28,36,.32)}
.dew{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.95) 0 1.1px,transparent 1.7px),radial-gradient(circle,rgba(15,28,36,.10) 0 1.6px,transparent 2.2px),radial-gradient(circle,rgba(255,255,255,.85) 0 2.2px,transparent 3px),radial-gradient(circle,rgba(58,124,165,.16) 0 .8px,transparent 1.3px);background-size:23px 19px,47px 41px,71px 63px,13px 17px;background-position:0 0,12px 9px,30px 22px,5px 3px}
.gridbg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(15,28,36,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(15,28,36,.05) 1px,transparent 1px);background-size:32px 32px}
.lab{font-size:12px;color:#2B6688;display:flex;gap:12px;align-items:center;text-transform:uppercase}
.lab i{display:inline-block;width:40px;height:1px;background:#3A7CA5}
.h2{font-size:clamp(30px,3.8vw,52px);font-weight:300;letter-spacing:-.025em;line-height:1.05}
.opt{cursor:pointer;font-family:'Sora',sans-serif;text-align:left;transition:background .3s,color .3s,border-color .3s,transform .3s,box-shadow .3s}
.opt:hover{transform:translateY(-2px);border-color:#3A7CA5!important}
.tab{cursor:pointer;border:0;font-family:'Sora',sans-serif;transition:background .3s,color .3s}
.row{display:flex;justify-content:space-between;gap:18px;padding:15px 6px;border-bottom:1px dashed rgba(15,28,36,.18);transition:background .25s}
.row:hover{background:rgba(255,255,255,.85)}
.drow{cursor:pointer;border:0;width:100%;font-family:'Sora',sans-serif;text-align:left;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:8px 18px;padding:16px 18px;transition:background .25s}
.drow:hover{background:#E3EDF2!important}
.fld{display:flex;flex-direction:column;gap:6px}
.fld span{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;color:#4A5D69;text-transform:uppercase}
.fld input,.fld select,.fld textarea{font:400 15px/1.4 'Sora',sans-serif;color:#0F1C24;background:rgba(255,255,255,.85);border:1px solid rgba(15,28,36,.18);border-radius:14px;padding:12px 14px;min-height:48px;transition:border-color .25s,box-shadow .25s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:#3A7CA5;box-shadow:0 0 0 4px rgba(58,124,165,.18)}
.card{text-decoration:none;display:block;border-radius:22px;overflow:hidden;background:#fff;border:1px solid rgba(15,28,36,.08);transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s}
.card:hover{transform:translateY(-6px);box-shadow:0 30px 50px -30px rgba(15,28,36,.4)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .5s ease both}
@keyframes flow{to{stroke-dashoffset:-96}}
.flow{stroke-dasharray:6 10;animation:flow 1.8s linear infinite}
.flow.f2{animation-duration:2.5s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.live{animation:pulse 1.6s ease-in-out infinite}
:focus-visible{outline:2px solid #3A7CA5;outline-offset:3px}
.burger{display:none!important}
@media(max-width:980px){.navd{display:none!important}.burger{display:inline-flex!important}}
@media(max-width:640px){.wrap{padding:0 18px}.hide-sm{display:none!important}}
@media(prefers-reduced-motion:reduce){.cx *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="cx">

<header style="position:sticky;top:0;z-index:50;background:rgba(241,245,247,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(15,28,36,.08)">
  <div class="mono" style="background:#0F1C24;color:#C9D7DF;font-size:11.5px">
    <div class="wrap" style="display:flex;justify-content:space-between;gap:16px;min-height:34px;align-items:center">
      <span class="hide-sm">BUREAU D'ÉTUDES &amp; SHOW-ROOM · PUGET-SUR-ARGENS (83)</span>
      <a href="tel:0800951313" style="text-decoration:none;color:#fff;display:inline-flex;align-items:center;min-height:34px">N° VERT 0 800 95 13 13 · APPEL GRATUIT</a>
    </div>
  </div>
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:76px">
    <a href="Cryo-Accueil.html" aria-label="RGTE, retour à l'accueil" style="display:flex;align-items:center;gap:14px;text-decoration:none;min-height:44px">
      <span style="font-weight:700;font-size:26px;letter-spacing:.08em">RGTE</span>
      <span style="width:1px;height:30px;background:rgba(15,28,36,.25)"></span>
      <span class="mono" style="font-size:10.5px;line-height:1.3;color:#4A5D69">R.G.<br>TECHNOLOGIES</span>
    </a>
    <nav class="navd" aria-label="Navigation principale" style="display:flex;gap:32px">
      <a class="navl on" href="Cryo-Lignes.html">Lignes</a>
      <a class="navl" href="Cryo-Secteurs.html">Secteurs</a>
      <a class="navl" href="Cryo-Realisations.html">Réalisations</a>
      <a class="navl" href="Cryo-Contact.html">Showroom &amp; contact</a>
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="btn btn-ghost navd" href="tel:0800951313" style="font-family:'IBM Plex Mono',monospace;font-weight:500">0 800 95 13 13</a>
      <a class="btn btn-red navd" href="Cryo-Contact.html" style="{{ ctaStyle }}">Plan 3D offert</a>
      <button type="button" class="btn btn-ghost burger" aria-label="Ouvrir ou fermer le menu" onClick="{{ toggleMenu }}" style="width:48px;padding:0">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#0F1C24" stroke-width="1.6"><path d="M3 6h14M3 10h14M3 14h14"></path></svg>
      </button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid rgba(15,28,36,.08);background:#F1F5F7">
      <div class="wrap" style="display:flex;flex-direction:column;padding-top:8px;padding-bottom:20px">
        <a class="navl" href="Cryo-Lignes.html">Lignes</a>
        <a class="navl" href="Cryo-Secteurs.html">Secteurs</a>
        <a class="navl" href="Cryo-Realisations.html">Réalisations</a>
        <a class="navl" href="Cryo-Contact.html">Showroom &amp; contact</a>
        <a class="btn btn-red" href="Cryo-Contact.html" style="margin-top:12px">Plan 3D offert</a>
      </div>
    </div>
  </sc-if>
</header>

<!-- TITRE -->
<section style="padding:40px 0 0">
  <div class="wrap">
    <div class="mono rise" style="font-size:11.5px;color:#4A5D69"><a href="Cryo-Lignes.html" style="text-decoration:none">LIGNES</a> / <a href="Cryo-Lignes.html" style="text-decoration:none">STONE</a> / MODULE GOURMANDISE</div>
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px;margin-top:18px">
      <h1 class="rise d1" style="font-size:clamp(42px,6.4vw,96px);font-weight:200;letter-spacing:-.045em;line-height:.95;overflow-wrap:anywhere">Module <span style="font-weight:600">Gourmandise</span></h1>
      <div class="mono rise d2" style="display:flex;flex-wrap:wrap;gap:8px;font-size:11.5px">
        <span style="padding:8px 12px;border-radius:999px;background:#fff;border:1px solid rgba(15,28,36,.1)">LIGNE STONE · L-02</span>
        <span style="padding:8px 12px;border-radius:999px;background:#fff;border:1px solid rgba(15,28,36,.1)">FROID VENTILÉ</span>
        <span style="padding:8px 12px;border-radius:999px;background:#fff;border:1px solid rgba(15,28,36,.1)">EXPOSITION CENTRALE</span>
      </div>
    </div>
  </div>
</section>

<!-- VISUEL + CONFIGURATEUR -->
<section style="padding:30px 0 90px">
  <div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));gap:24px;align-items:start">
    <div class="rise d1">
      <div class="frost" style="position:relative;border-radius:30px;overflow:hidden;padding:18px">
        <div style="position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div role="group" aria-label="Type de visuel" style="display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(15,28,36,.06)">
            <button type="button" class="tab" style="{{ vDraw }}" onClick="{{ showDraw }}" aria-pressed="{{ isDraw }}">Dessin technique</button>
            <button type="button" class="tab" style="{{ vPhoto }}" onClick="{{ showPhoto }}" aria-pressed="{{ isPhoto }}">Photo d'ambiance</button>
          </div>
          <span class="mono" style="font-size:11px;color:#4A5D69;display:inline-flex;align-items:center;gap:8px"><span class="live" style="{{ dotStyle }}"></span>{{ rangeTxt }}</span>
        </div>
        <sc-if value="{{ isDraw }}" hint-placeholder-val="{{ true }}">
          <div class="fade" style="position:relative;margin-top:14px;border-radius:22px;overflow:hidden;background:#F6F9FA;border:1px solid rgba(15,28,36,.08)">
            <div aria-hidden="true" class="gridbg"></div>
            <svg viewBox="0 0 800 440" role="img" aria-label="{{ drawAria }}" style="position:relative;width:100%;height:auto;display:block">
              <defs>
                <pattern id="cr-mac" x="0" y="0" width="34" height="26" patternUnits="userSpaceOnUse">
                  <ellipse cx="17" cy="15" rx="12" ry="7" fill="#E9B8C2"></ellipse>
                  <rect x="5" y="13" width="24" height="3" fill="#F6EBDD"></rect>
                </pattern>
                <pattern id="cr-choc" x="0" y="0" width="30" height="26" patternUnits="userSpaceOnUse">
                  <rect x="6" y="9" width="18" height="12" rx="2" fill="#4A2C20"></rect>
                  <path d="M9 12 L21 12" stroke="#7A4A35" stroke-width="1.4"></path>
                </pattern>
              </defs>
              <line x1="{{ g.x0 }}" y1="58" x2="{{ g.x1 }}" y2="58" stroke="#2B6688" stroke-width="1.2"></line>
              <line x1="{{ g.x0 }}" y1="48" x2="{{ g.x0 }}" y2="96" stroke="#2B6688" stroke-width="1.2"></line>
              <line x1="{{ g.x1 }}" y1="48" x2="{{ g.x1 }}" y2="96" stroke="#2B6688" stroke-width="1.2"></line>
              <rect x="{{ g.lblX }}" y="40" width="120" height="34" rx="17" fill="#0F1C24"></rect>
              <text x="{{ g.cx }}" y="62" text-anchor="middle" fill="#FFFFFF" font-family="IBM Plex Mono" font-size="14" font-weight="600">{{ g.lenTxt }}</text>
              <rect x="{{ g.gx }}" y="112" width="{{ g.gw }}" height="112" rx="4" fill="rgba(168,210,234,.22)" stroke="#3A7CA5" stroke-width="1.6"></rect>
              <line x1="{{ g.cx }}" y1="112" x2="{{ g.cx }}" y2="224" stroke="#3A7CA5" stroke-width="1" stroke-dasharray="4 4"></line>
              <rect x="{{ g.px }}" y="190" width="{{ g.pw }}" height="26" fill="url(#cr-mac)" style="{{ g.macSt }}"></rect>
              <rect x="{{ g.px }}" y="190" width="{{ g.pw }}" height="26" fill="url(#cr-choc)" style="{{ g.chocSt }}"></rect>
              <path class="flow" d="{{ g.flow1 }}" fill="none" stroke="#3A7CA5" stroke-width="1.6"></path>
              <path class="flow f2" d="{{ g.flow2 }}" fill="none" stroke="#7FB3D3" stroke-width="1.4"></path>
              <rect x="{{ g.tx }}" y="222" width="{{ g.tw }}" height="12" rx="2" fill="#FFFFFF" stroke="#9FB4C1"></rect>
              <rect x="{{ g.x0 }}" y="234" width="{{ g.w }}" height="72" rx="3" fill="{{ g.face }}" stroke="#9FB4C1"></rect>
              <rect x="{{ g.bx }}" y="306" width="{{ g.bw }}" height="78" rx="3" fill="{{ g.face }}" stroke="#9FB4C1"></rect>
              <line x1="{{ g.x0 }}" y1="384" x2="{{ g.x1 }}" y2="384" stroke="#0F1C24" stroke-width="1.4"></line>
              <text x="{{ g.x0 }}" y="410" fill="#4A5D69" font-family="IBM Plex Mono" font-size="12">{{ g.hTxt }}</text>
              <text x="{{ g.x1 }}" y="410" text-anchor="end" fill="#4A5D69" font-family="IBM Plex Mono" font-size="12">EXPO. PROF. 60 CM</text>
              <text x="{{ g.cx }}" y="104" text-anchor="middle" fill="#2B6688" font-family="IBM Plex Mono" font-size="11">VITRAGES COULISSANTS DES 2 CÔTÉS</text>
              <text x="{{ g.cx }}" y="276" text-anchor="middle" fill="#4A5D69" font-family="IBM Plex Mono" font-size="11">{{ g.finTxt }}</text>
              <path d="{{ g.ext }}" fill="none" stroke="#D42A20" stroke-width="1.4" stroke-dasharray="5 5"></path>
            </svg>
          </div>
        </sc-if>
        <sc-if value="{{ isPhoto }}" hint-placeholder-val="{{ false }}">
          <div class="fade" style="position:relative;margin-top:14px;border-radius:22px;overflow:hidden;height:440px;background:#0F1C24">
            <img src="{{ photo }}" alt="{{ photoAlt }}" style="width:100%;height:440px;object-fit:cover;display:block">
            <span class="mono" style="position:absolute;left:14px;bottom:14px;padding:6px 10px;border-radius:999px;background:rgba(15,28,36,.65);color:#fff;font-size:11px">PHOTO D'ILLUSTRATION · VISUEL PRODUIT [PHOTO]</span>
          </div>
        </sc-if>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:rgba(15,28,36,.1);border:1px solid rgba(15,28,36,.1);border-radius:20px;overflow:hidden;margin-top:16px">
        <div style="background:#fff;padding:16px 18px"><div class="mono" style="font-size:10.5px;color:#4A5D69">PROFONDEUR</div><div class="tnum" style="font-size:24px;font-weight:300;margin-top:4px">60 cm</div></div>
        <div style="background:#fff;padding:16px 18px"><div class="mono" style="font-size:10.5px;color:#4A5D69">LONGUEURS</div><div class="tnum" style="font-size:24px;font-weight:300;margin-top:4px">6 + mesure</div></div>
        <div style="background:#fff;padding:16px 18px"><div class="mono" style="font-size:10.5px;color:#4A5D69">FLUIDE</div><div class="tnum" style="font-size:24px;font-weight:300;margin-top:4px">R134A</div></div>
      </div>
    </div>

    <aside class="frost rise d2" style="position:relative;border-radius:30px;padding:30px;overflow:hidden" aria-label="Configurateur">
      <div aria-hidden="true" class="dew" style="opacity:.35"></div>
      <div style="position:relative">
        <div class="mono" style="font-size:11.5px;color:#2B6688">CONFIGURATEUR · 3 RÉGLAGES</div>

        <div class="mono" style="font-size:11px;color:#4A5D69;margin-top:24px">01 — LONGUEUR</div>
        <div role="radiogroup" aria-label="Longueur" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(92px,100%),1fr));gap:8px;margin-top:10px">
          <sc-for list="{{ lens }}" as="l" hint-placeholder-count="7">
            <button type="button" role="radio" class="opt" style="{{ l.st }}" onClick="{{ l.pick }}" aria-checked="{{ l.on }}"><span class="tnum">{{ l.t }}</span></button>
          </sc-for>
        </div>

        <div class="mono" style="font-size:11px;color:#4A5D69;margin-top:24px">02 — PLAGE DE TEMPÉRATURE</div>
        <div role="radiogroup" aria-label="Plage de température" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px">
          <sc-for list="{{ temps }}" as="t" hint-placeholder-count="2">
            <button type="button" role="radio" class="opt" style="{{ t.st }}" onClick="{{ t.pick }}" aria-checked="{{ t.on }}">
              <span class="tnum" style="display:block;font-size:28px;font-weight:300;letter-spacing:-.02em">{{ t.v }}</span>
              <span class="mono" style="display:block;font-size:11px;margin-top:4px;opacity:.8">{{ t.n }}</span>
            </button>
          </sc-for>
        </div>

        <div class="mono" style="font-size:11px;color:#4A5D69;margin-top:24px">03 — FINITION</div>
        <div role="radiogroup" aria-label="Finition" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px">
          <sc-for list="{{ fins }}" as="f" hint-placeholder-count="2">
            <button type="button" role="radio" class="opt" style="{{ f.st }}" onClick="{{ f.pick }}" aria-checked="{{ f.on }}">
              <span style="{{ f.sw }}"></span>
              <span style="display:block;font-size:14px;font-weight:500;margin-top:10px">{{ f.n }}</span>
              <span class="mono" style="display:block;font-size:11px;margin-top:2px;opacity:.75">{{ f.k }}</span>
            </button>
          </sc-for>
        </div>

        <div style="margin-top:26px;border-radius:22px;background:#0F1C24;color:#E6EEF2;padding:22px 24px">
          <div class="mono" style="display:flex;justify-content:space-between;font-size:11px;color:#7FB3D3"><span>RÉCAPITULATIF</span><span>{{ refTxt }}</span></div>
          <div style="margin-top:12px">
            <div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed rgba(127,179,211,.22);font-size:14px"><span style="color:#9FB4C1">Modèle</span><span>Gourmandise {{ lenLabel }}</span></div>
            <div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed rgba(127,179,211,.22);font-size:14px"><span style="color:#9FB4C1">Plage</span><span class="tnum">{{ rangeTxt }}</span></div>
            <div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed rgba(127,179,211,.22);font-size:14px"><span style="color:#9FB4C1">Finition</span><span>{{ finLabel }}</span></div>
            <div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px"><span style="color:#9FB4C1">Froid</span><span>Ventilé · groupe logé</span></div>
          </div>
          <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px;margin-top:16px">
            <div>
              <div class="mono" style="font-size:11px;color:#7FB3D3">{{ priceLab }}</div>
              <div class="tnum" style="font-size:clamp(30px,3.4vw,44px);font-weight:300;letter-spacing:-.02em;color:#fff">{{ priceTxt }}</div>
            </div>
            <span class="mono" style="font-size:11px;color:#9FB4C1;max-width:210px;text-align:right">{{ priceNote }}</span>
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px">
          <a class="btn btn-red" href="#demande" style="{{ ctaStyle }}">Demander ce modèle</a>
          <a class="btn btn-ghost" href="Cryo-Contact.html">Plan 3D offert</a>
        </div>
      </div>
    </aside>
  </div>
</section>

<!-- ONGLETS FICHE -->
<section style="background:#fff;padding:90px 0">
  <div class="wrap">
    <div class="lab mono"><span>FICHE</span><i></i><span>Fiche technique</span></div>
    <div role="tablist" aria-label="Fiche produit" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:24px;border-bottom:1px solid rgba(15,28,36,.12)">
      <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="3">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3800},"accent":{"editor":"color","default":"#D42A20","options":["#D42A20","#0F1C24","#3A7CA5"]},"plage":{"editor":"enum","default":"patisserie","options":["patisserie","chocolat"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { len:0, plage: (props && props.plage==='chocolat') ? 1 : 0, fin:0, view:'draw', tab:'desc', sent:false, err:'', menuOpen:false };
  }
  renderVals(){
    const s=this.state, accent=this.props.accent || '#D42A20';
    const LENS=[101,117,146,169,191,222,0];
    const L = LENS[s.len];
    const lenLabel = L ? L + ' cm' : 'sur mesure';
    const choco = s.plage===1;
    const rangeTxt = choco ? '+14 / +18 °C' : '+2 / +8 °C';
    const FINS=[ { n:'Pierre acrylique blanche', k:'PAR DÉFAUT', c:'#F7F7F4' }, { n:'Autre coloris', k:'[COLORIS]', c:'#D9CFC3' } ];
    const fin = FINS[s.fin];
    const priced = L===101 && s.fin===0;

    const opt = (on, extra) => 'min-height:48px;padding:10px 12px;border-radius:14px;font-size:14px;font-weight:600;border:1px solid ' + (on ? '#0F1C24' : 'rgba(15,28,36,.14)') + ';background:' + (on ? '#0F1C24' : 'rgba(255,255,255,.8)') + ';color:' + (on ? '#fff' : '#0F1C24') + ';' + (extra || '');
    const lens = LENS.map((v,i) => ({ t: v ? v + ' cm' : 'Sur mesure', on: i===s.len, st: opt(i===s.len, 'text-align:center'), pick: () => this.setState({ len:i }) }));
    const temps = [ { v:'+2 / +8 °C', n:'PÂTISSERIE' }, { v:'+14 / +18 °C', n:'CHOCOLAT' } ].map((x,i) => Object.assign(x, { on: i===s.plage,
      st: 'padding:16px;border-radius:18px;min-height:96px;border:1px solid ' + (i===s.plage ? 'transparent' : 'rgba(15,28,36,.14)') + ';background:' + (i===s.plage ? (i ? '#4A2C20' : '#2B6688') : 'rgba(255,255,255,.8)') + ';color:' + (i===s.plage ? '#fff' : '#0F1C24'),
      pick: () => this.setState({ plage:i }) }));
    const fins = FINS.map((x,i) => Object.assign({}, x, { on: i===s.fin,
      st: 'padding:14px;border-radius:18px;border:' + (i===s.fin ? '2px solid #3A7CA5' : '1px solid rgba(15,28,36,.14)') + ';background:' + (i===s.fin ? '#fff' : 'rgba(255,255,255,.7)') + ';color:#0F1C24',
      sw: 'display:block;height:44px;border-radius:10px;border:1px solid rgba(15,28,36,.12);background:' + x.c + (i===1 ? ';background-image:repeating-linear-gradient(135deg,rgba(15,28,36,.12) 0 2px,transparent 2px 9px)' : ''),
      pick: () => this.setState({ fin:i }) }));

    // dessin technique : largeur proportionnelle à la longueur
    const W = L ? 240 + (L-101)*(440/121) : 680;
    const x0 = 400 - W/2, x1 = 400 + W/2;
    const r = n => Math.round(n*10)/10;
    const gx = x0 + 18, gw = W - 36;
    const g = {
      x0:r(x0), x1:r(x1), w:r(W), cx:400, lblX:340,
      lenTxt: L ? L + ' CM' : 'SUR MESURE',
      gx:r(gx), gw:r(gw), px:r(gx+12), pw:r(gw-24),
      tx:r(x0-8), tw:r(W+16), bx:r(x0+14), bw:r(W-28),
      face: fin.c,
      macSt: 'opacity:' + (choco ? 0 : 1) + ';transition:opacity .5s',
      chocSt: 'opacity:' + (choco ? 1 : 0) + ';transition:opacity .5s',
      flow1: 'M' + r(x1-30) + ' 214 C' + r(x1-30) + ' 130 ' + r(400+W*0.15) + ' 122 400 124 C' + r(400-W*0.15) + ' 126 ' + r(x0+30) + ' 140 ' + r(x0+32) + ' 200',
      flow2: 'M' + r(x1-50) + ' 206 C' + r(x1-50) + ' 150 ' + r(400+W*0.1) + ' 146 400 148 C' + r(400-W*0.1) + ' 150 ' + r(x0+52) + ' 160 ' + r(x0+54) + ' 196',
      hTxt: L===101 ? '101 × 80 × 80 + 25 H' : 'DIMENSIONS [À CONFIRMER]',
      finTxt: s.fin===0 ? 'PIERRE ACRYLIQUE BLANCHE' : 'COLORIS [COLORIS]',
      ext: L ? 'M0 0' : 'M' + r(x0-24) + ' 96 L' + r(x0-24) + ' 384 M' + r(x1+24) + ' 96 L' + r(x1+24) + ' 384'
    };

    const pill = on => 'min-height:44px;padding:0 18px;border-radius:999px;font-size:13.5px;font-weight:600;background:' + (on ? '#0F1C24' : 'transparent') + ';color:' + (on ? '#fff' : '#0F1C24');
    const TABS=[ ['desc','Description'], ['carac','Caractéristiques'], ['dim','Dimensions'] ];
    const tabs = TABS.map(t => { const on = s.tab===t[0]; return { n:t[1], on,
      st: 'min-height:52px;padding:0 22px;font-size:15px;font-weight:' + (on ? 600 : 400) + ';background:transparent;color:' + (on ? '#0F1C24' : '#4A5D69') + ';border-bottom:2px solid ' + (on ? '#3A7CA5' : 'transparent') + ';margin-bottom:-1px',
      pick: () => this.setState({ tab:t[0] }) }; });

    const specs = [
      ['PILIERS ET PLAN DE TRAVAIL','Pierre acrylique blanche'], ['PIED','Monté sur pied en pierre acrylique blanche'], ['GROUPE','Logé'], ['FROID','Ventilé'], ['FLUIDE','Fréon R134A'],
      ['TEMPÉRATURE','Contrôle électronique'], ['DÉGIVRAGE','Automatique'], ['EAUX DE CONDENSATION','Ré-évaporation automatique'], ['DIMENSIONS EXTÉRIEURES','101 × 80 × 80 + 25 h'],
      ['RÉSERVE','Sans réserve réfrigérée'], ['EXPOSITION','Verre 81 × 60 cm'], ['PLAGES','+2/+8 °C ou +14/+18 °C']
    ].map(x => ({ k:x[0], v:x[1] }));
    const dims = LENS.map((v,i) => { const on=i===s.len; return {
      t: v ? v + ' cm' : 'Sur mesure', on,
      ext: v===101 ? '101 × 80 × 80 + 25 h' : '[DIMENSIONS]',
      expo: v===101 ? 'Verre 81 × 60 cm' : 'Profondeur 60 cm',
      prix: v===101 ? '5 800,00 € HT' : 'Sur devis',
      st: 'background:' + (on ? '#E3EDF2' : (i%2 ? '#F6F9FA' : '#fff')) + ';color:#0F1C24;border-bottom:1px solid rgba(15,28,36,.06);box-shadow:' + (on ? 'inset 3px 0 0 #3A7CA5' : 'none'),
      pick: () => this.setState({ len:i }) }; });

    const related = [
      { n:'Réfrigérée Plane', t:'+2/+8 · +14/+18', d:'Exposition à hauteur du plan de travail ; profondeur 53 ou 60 cm.', glass:'M46 90 L46 60 L214 60 L214 90' },
      { n:'Réfrigérée Vision', t:'+2/+8 · +14/+18', d:'Exposition 8 cm sous la hauteur du plan de travail.', glass:'M46 90 L46 52 Q48 36 70 34 L214 34 L214 90' },
      { n:'Réfrigérée Centrale', t:'+2/+8 · +14/+18', d:'Vitrages coulissants des 2 côtés ; profondeur 60 cm.', glass:'M50 90 L50 40 L210 40 L210 90 M130 40 L130 90' },
      { n:'Réfrigérée Panorama', t:'+2/+8 · +14/+18', d:'Étagères réfrigérées +4/+8 ; 2 ou 3 étagères.', glass:'M46 90 L46 24 L214 24 L214 90 M46 46 L214 46 M46 68 L214 68' }
    ];

    return {
      lens, temps, fins, g, tabs, specs, dims, related,
      lenLabel, rangeTxt, finLabel: s.fin===0 ? 'Pierre acrylique blanche' : 'Autre [COLORIS]',
      refTxt: 'GRM-' + (L || 'SM') + '-' + (choco ? 'C' : 'P'),
      priceLab: priced ? 'PRIX · MODÈLE 101 CM' : 'PRIX',
      priceTxt: priced ? '5 800,00 € HT' : 'Sur devis',
      priceNote: priced ? 'Prix indicatif HT, pierre acrylique blanche.' : 'Tarif communiqué par le bureau d’études.',
      dotStyle: "width:7px;height:7px;border-radius:50%;display:inline-block;background:" + (choco ? "#8A5A3C" : "#3A7CA5"),
      drawAria: 'Dessin technique du module Gourmandise, longueur ' + lenLabel + ', plage ' + rangeTxt,
      isDraw: s.view==='draw', isPhoto: s.view==='photo',
      vDraw: pill(s.view==='draw'), vPhoto: pill(s.view==='photo'),
      showDraw: () => this.setState({ view:'draw' }), showPhoto: () => this.setState({ view:'photo' }),
      photo: choco ? 'assets/chocolates-dark.webp' : 'assets/vitrine-glass-pastry.webp',
      photoAlt: choco ? 'Bonbons de chocolat' : 'Vitrine vitrée de pâtisseries',
      tabDesc: s.tab==='desc', tabCarac: s.tab==='carac', tabDim: s.tab==='dim',
      notSent: !s.sent, sent: s.sent, hasErr: !!s.err, errTxt: s.err,
      submit: e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const miss = [];
        if (!String(fd.get('nom') || '').trim()) miss.push('nom');
        if (!String(fd.get('tel') || '').trim()) miss.push('téléphone');
        const em = String(fd.get('email') || '').trim();
        if (!em || em.indexOf('@') < 1) miss.push('email valide');
        if (!String(fd.get('message') || '').trim()) miss.push('message');
        if (miss.length) this.setState({ err: 'À compléter : ' + miss.join(', ') + '.' });
        else this.setState({ sent:true, err:'' });
      },
      resetForm: () => this.setState({ sent:false, err:'' }),
      ctaStyle: 'background:' + accent,
      menuOpen: s.menuOpen, toggleMenu: () => this.setState({ menuOpen: !s.menuOpen })
    };
  }
}
</script>
