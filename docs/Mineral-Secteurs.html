<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Minéral — Secteurs</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap">
<style>
body{margin:0;background:#F4F2EE}
sc-for,sc-if{display:contents}
.mn{--g:#F4F2EE;--s:#E6E2DB;--s2:#DAD5CC;--ink:#2B2926;--mu:#6E6A63;--mu2:#5C5852;--gl:#C9D3D6;--ln:rgba(43,41,38,.16);--ln2:rgba(43,41,38,.08);background:var(--g);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mn *,.mn *::before,.mn *::after{box-sizing:border-box}
.mn img{display:block;max-width:100%}
.mn a{color:inherit}
.mn :focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px}
.sf{font-family:'Newsreader',Georgia,serif;font-weight:300}
.sc{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--mu)}
.no{font-family:'Newsreader',Georgia,serif;font-variant-caps:all-small-caps;letter-spacing:.14em;font-size:18px;color:var(--mu)}
.strip{border-bottom:1px solid var(--ln2);font-size:13px;color:var(--mu)}
.strip-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:44px}
.strip a{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px;min-height:44px}
.strip a:hover{color:var(--red)}
.hd{position:sticky;top:0;z-index:30;background:rgba(244,242,238,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln2)}
.hd-in{display:flex;align-items:center;justify-content:space-between;gap:24px;height:84px}
.logo{display:inline-flex;align-items:center;gap:14px;text-decoration:none;min-height:44px}
.logo-w{font-weight:600;font-size:19px;letter-spacing:.34em;position:relative}
.logo-w::after{content:"";position:absolute;right:-1px;top:0;width:5px;height:5px;background:var(--red)}
.logo-s{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:15px;color:var(--mu);padding-left:14px;border-left:1px solid var(--ln)}
.nav{display:flex;gap:2px}
.nav a{position:relative;text-decoration:none;font-size:15px;padding:0 14px;min-height:44px;display:inline-flex;align-items:center}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.nav a:hover::after{transform:scaleX(1)}
.nav a.on::after{transform:scaleX(1);background:var(--red)}
.hd-r{display:flex;align-items:center;gap:20px}
.tel{text-decoration:none;display:flex;flex-direction:column;line-height:1.25;min-height:44px;justify-content:center;font-size:15px;font-weight:500}
.tel small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;font:500 15px/1 'Hanken Grotesk',sans-serif;text-decoration:none;cursor:pointer;transition:background .35s,color .35s,border-color .35s,transform .35s,box-shadow .35s;white-space:nowrap}
.btn svg{transition:transform .35s}
.btn:hover svg{transform:translateX(4px)}
.btn-r{background:var(--red);color:#fff}
.btn-r:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px var(--red)}
.btn-o{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-o:hover{background:var(--ink);color:var(--g)}
.burger{display:none;width:48px;height:48px;border-radius:999px;border:1px solid var(--ln);background:transparent;color:var(--ink);align-items:center;justify-content:center;cursor:pointer}
.mnav{display:flex;flex-direction:column;padding:8px 20px 28px;border-top:1px solid var(--ln2)}
.mnav a{font-family:'Newsreader',Georgia,serif;font-size:26px;font-weight:300;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--ln2);min-height:44px}
.h1{font-family:'Newsreader',Georgia,serif;font-weight:300;letter-spacing:-.025em;line-height:.98;margin:0;overflow-wrap:anywhere}
.h2{font-family:'Newsreader',Georgia,serif;font-weight:300;letter-spacing:-.02em;line-height:1.04;margin:0;font-size:clamp(34px,4.4vw,64px);overflow-wrap:anywhere}
.h1 em,.h2 em{font-style:italic}
.lead{font-size:18px;line-height:1.65;color:var(--mu);max-width:560px;margin:0}
.ft{background:var(--s);padding:96px 0 0;border-top:1px solid var(--ln2)}
.ft-cta{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;padding-bottom:72px;border-bottom:1px solid var(--ln)}
.ft-cta .h2{max-width:780px}
.ft-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px;padding:56px 0}
.ft-g h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--mu2);margin:0 0 14px}
.ft-g p{margin:0;font-size:15px;line-height:1.7}
.ft-l a{display:flex;align-items:center;min-height:44px;text-decoration:none;font-size:15px;border-bottom:1px solid var(--ln2);transition:color .3s,padding .4s}
.ft-l a:hover{color:var(--red);padding-left:6px}
.ft-b{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;padding:14px 0 22px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu2)}
.ft-b a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center;color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rv{animation:rise 1.1s cubic-bezier(.2,.7,.1,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.5s}
@supports (animation-timeline: view()){.rs{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 80%}}
@media (max-width:1080px){.nav,.tel{display:none}.burger{display:inline-flex}}
@media (min-width:1081px){.mnav{display:none}}
@media (max-width:720px){.wrap{padding:0 20px}.hd-in{height:72px}.ft{padding-top:64px}}
@media (max-width:520px){.hd-r .btn{display:none}.logo-s{display:none}}

.ph{padding:72px 0 48px}
.ph .h1{font-size:clamp(46px,6.4vw,104px);margin:22px 0 0}
.ph-g{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:48px;align-items:end}
@media (max-width:900px){.ph-g{grid-template-columns:1fr}}
.flt{display:flex;flex-wrap:wrap;gap:8px;padding:22px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);align-items:center}
.flt .sc{margin-right:10px}
.fb{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--ln);background:transparent;font:400 14px/1 'Hanken Grotesk',sans-serif;color:var(--ink);cursor:pointer;transition:all .3s}
.fb:hover{border-color:var(--ink)}
.fb i{font-style:normal;font-size:12px;opacity:.75}

.sx{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:64px;align-items:start;padding:56px 0 112px}
.rows{display:flex;flex-direction:column}
.row{all:unset;box-sizing:border-box;position:relative;cursor:pointer;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:baseline;padding:18px 14px 18px 0;border-bottom:1px solid var(--ln);min-height:64px;transition:padding .5s cubic-bezier(.2,.7,.1,1),background .4s;animation:rise .6s cubic-bezier(.2,.7,.1,1) both}
.row:first-child{border-top:1px solid var(--ln)}
.row:hover{padding-left:12px}
.row-mk{position:absolute;left:0;top:50%;width:14px;height:1px;background:var(--red);transform-origin:left;transition:transform .5s}
.row-t{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:clamp(26px,2.4vw,34px);line-height:1.1}
.row-tp{font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:32px 0;color:var(--mu)}
.dt{position:sticky;top:108px}
.dt-pic{position:relative;height:360px;overflow:hidden;background:var(--s2)}
.dt-pic img{position:absolute;left:0;top:0;width:100%;height:360px;object-fit:cover;transition:opacity 1s,transform 1.8s cubic-bezier(.2,.7,.1,1)}
.dt-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:22px 0 0}
.dt-t{font-size:clamp(44px,4.8vw,72px);line-height:1;letter-spacing:-.02em;margin:6px 0 26px}
.box{padding:22px 0;border-top:1px solid var(--ln)}
.box-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.box-h b{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:34px;line-height:1}
.rul{position:relative;height:56px;margin:6px 0 4px}
.rul-l{position:absolute;left:0;right:0;top:18px;height:12px;background-image:repeating-linear-gradient(90deg,rgba(43,41,38,.45) 0 1px,transparent 1px);background-size:calc(100% / 24) 12px;border-bottom:1px solid var(--ink)}
.rul-h .rul-l{background-size:calc(100% / 16) 12px}
.rul-band{position:absolute;top:10px;height:28px;background:var(--gl);border:1px solid var(--ink);mix-blend-mode:multiply;transition:left .8s cubic-bezier(.2,.7,.1,1),width .8s cubic-bezier(.2,.7,.1,1)}
.rul-n{position:absolute;top:38px;font-size:12px;color:var(--mu2);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border:1px solid var(--ln);border-radius:999px;font-size:12px;color:var(--mu2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--ln);border-radius:999px;font-size:14px;text-decoration:none;transition:border-color .3s,background .3s,transform .3s}
.chip:hover{border-color:var(--ink);background:#FBFAF8;transform:translateY(-2px)}
.rl{display:flex;flex-direction:column}
.rl a{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;min-height:56px;padding:10px 0;border-bottom:1px solid var(--ln2);text-decoration:none;transition:padding .4s,color .3s}
.rl a:hover{padding-left:8px;color:var(--red)}
.rl span{font-size:13px;color:var(--mu)}
.note{font-size:13px;color:var(--mu);margin:12px 0 0}
@media (max-width:960px){.sx{grid-template-columns:1fr}.dt{position:relative;top:0}}

.sec{padding:112px 0;border-top:1px solid var(--ln2)}
.sec-s{background:var(--s)}
.sec-s .sc,.sec-s .no{color:var(--mu2)}
.tc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:20px;margin-top:48px}
.tcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:28px 26px 30px;background:var(--g);min-height:260px;position:relative;overflow:hidden;transition:transform .6s cubic-bezier(.2,.7,.1,1),box-shadow .6s}
.tcard:hover{transform:translateY(-6px);box-shadow:0 40px 70px -46px rgba(43,41,38,.6)}
.tcard b{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:46px;line-height:1;letter-spacing:-.02em;margin-top:auto}
.tcard p{margin:0;font-size:14px;color:var(--mu2)}
.frost{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:var(--gl);opacity:.5;transition:transform 1s cubic-bezier(.2,.7,.1,1)}
.tcard:hover .frost{transform:scale(1.4)}
@media (max-width:900px){.sec{padding:80px 0}}
@media (prefers-reduced-motion:reduce){.mn *{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="mn" style="{{ rootStyle }}">

<div class="strip"><div class="wrap strip-in"><a href="index.html"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M9 2 4 7l5 5"></path></svg>Toutes les propositions</a><span>Proposition 02 · Minéral</span></div></div>

<header class="hd">
  <div class="wrap hd-in">
    <a class="logo" href="Mineral-Accueil.html" aria-label="RGTE, R.G. Technologies — accueil"><span class="logo-w">RGTE</span><span class="logo-s">R.G. Technologies</span></a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="Mineral-Lignes.html">Lignes</a>
      <a href="Mineral-Secteurs.html" class="on" aria-current="page">Secteurs</a>
      <a href="Mineral-Realisations.html">Réalisations</a>
      <a href="Mineral-Contact.html">Showroom &amp; contact</a>
    </nav>
    <div class="hd-r">
      <a class="tel" href="tel:0800951313"><span>0 800 95 13 13</span><small>Appel gratuit</small></a>
      <a class="btn btn-r" href="Mineral-Contact.html">Plan 3D offert</a>
      <button type="button" class="burger" aria-label="Ouvrir le menu" onClick="{{ toggleMenu }}"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 7h14M3 13h14"></path></svg></button>
    </div>
  </div>
  <sc-if value="{{ menu }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav" aria-label="Navigation mobile">
      <a href="Mineral-Lignes.html">Lignes</a>
      <a href="Mineral-Secteurs.html">Secteurs</a>
      <a href="Mineral-Realisations.html">Réalisations</a>
      <a href="Mineral-Contact.html">Showroom &amp; contact</a>
      <a href="tel:0800951313">0 800 95 13 13 — appel gratuit</a>
    </nav>
  </sc-if>
</header>

<section class="ph">
  <div class="wrap">
    <div class="ph-g">
      <div>
        <p class="sc rv">N° 03 — Secteurs d’activité</p>
        <h1 class="h1 rv d1">Treize métiers,<br><em>un froid juste</em>.</h1>
      </div>
      <p class="lead rv d2">Chaque produit a sa température&nbsp;: la pâtisserie se garde entre +2 et +8 °C, le chocolat entre +14 et +18 °C, le poisson entre −2 et 0 °C. Choisissez votre métier pour voir les modules adaptés et les réalisations liées.</p>
    </div>
  </div>
</section>

<div class="wrap">
  <div class="flt rv d3" role="group" aria-label="Filtrer par température">
    <span class="sc">Température</span>
    <sc-for list="{{ filters }}" as="f" hint-placeholder-count="6">
      <button type="button" class="fb" style="{{ f.st }}" aria-pressed="{{ f.sel }}" onClick="{{ f.pick }}">{{ f.label }} <i>{{ f.c }}</i></button>
    </sc-for>
  </div>

  <div class="sx">
    <div class="rows" role="listbox" aria-label="Secteurs d’activité">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="13">
        <button type="button" role="option" class="row" style="{{ r.st }}" aria-selected="{{ r.sel }}" onClick="{{ r.pick }}">
          <span class="row-mk" style="{{ r.mk }}"></span>
          <span class="no">{{ r.n }}</span>
          <span class="row-t" style="{{ r.tst }}">{{ r.name }}</span>
          <span class="row-tp">{{ r.temp }}</span>
        </button>
      </sc-for>
      <sc-if value="{{ noRows }}" hint-placeholder-val="{{ false }}"><p class="empty">Aucun secteur pour ce filtre.</p></sc-if>
    </div>

    <div class="dt">
      <div class="dt-pic">
        <sc-for list="{{ pics }}" as="p" hint-placeholder-count="13">
          <img src="{{ p.img }}" alt="" style="{{ p.st }}">
        </sc-for>
      </div>
      <div class="dt-h"><span class="no">Secteur {{ S.n }} / 13</span><span class="sc">{{ S.group }}</span></div>
      <h2 class="dt-t sf">{{ S.name }}</h2>

      <div class="box">
        <div class="box-h"><span class="sc">Température d’exposition</span><b>{{ S.temp }}</b></div>
        <sc-if value="{{ S.cold }}" hint-placeholder-val="{{ true }}">
          <div class="rul" aria-hidden="true">
            <div class="rul-l"></div>
            <sc-if value="{{ S.known }}" hint-placeholder-val="{{ true }}"><div class="rul-band" style="{{ S.band }}"></div></sc-if>
            <span class="rul-n" style="left:0">−4</span><span class="rul-n" style="left:16.667%">0</span><span class="rul-n" style="left:33.333%">+4</span><span class="rul-n" style="left:50%">+8</span><span class="rul-n" style="left:66.667%">+12</span><span class="rul-n" style="left:83.333%">+16</span><span class="rul-n" style="left:100%">+20 °C</span>
          </div>
        </sc-if>
        <sc-if value="{{ S.hot }}" hint-placeholder-val="{{ false }}">
          <div class="rul rul-h" aria-hidden="true">
            <div class="rul-l"></div>
            <div class="rul-band" style="{{ S.band }}"></div>
            <span class="rul-n" style="left:0">+20</span><span class="rul-n" style="left:25%">+40</span><span class="rul-n" style="left:50%">+60</span><span class="rul-n" style="left:75%">+80</span><span class="rul-n" style="left:100%">+100 °C</span>
          </div>
        </sc-if>
        <p class="note">{{ S.tnote }}</p>
      </div>

      <div class="box">
        <div class="box-h"><span class="sc">Modules conseillés</span><span class="tag">{{ S.status }}</span></div>
        <div class="chips">
          <sc-for list="{{ S.mods }}" as="m" hint-placeholder-count="5">
            <a class="chip" href="Mineral-Module.html">{{ m.n }}</a>
          </sc-for>
        </div>
      </div>

      <div class="box">
        <div class="box-h"><span class="sc">Réalisations liées</span><span class="tag">{{ S.rc }}</span></div>
        <div class="rl">
          <sc-for list="{{ S.reals }}" as="x" hint-placeholder-count="2">
            <a href="Mineral-Realisations.html"><span class="no">{{ x.n }}</span><div>{{ x.t }} <span>— {{ x.lieu }}</span></div><span>Ligne {{ x.l }}</span></a>
          </sc-for>
        </div>
        <sc-if value="{{ S.noReal }}" hint-placeholder-val="{{ false }}"><p class="note" style="margin-top:0">Pas encore de réalisation présentée pour ce secteur.</p></sc-if>
      </div>

      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px">
        <a class="btn btn-r" href="Mineral-Contact.html">Plan 3D — {{ S.name }} <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"></path></svg></a>
        <a class="btn btn-o" href="Mineral-Lignes.html">Voir les lignes</a>
      </div>
    </div>
  </div>
</div>

<section class="sec sec-s">
  <div class="wrap">
    <span class="no">Les plages de température</span>
    <h2 class="h2" style="margin-top:14px">Quatre réglages,<br><em>quatre</em> métiers.</h2>
    <div class="tc">
      <button type="button" class="tcard rs" onClick="{{ goPat }}"><span class="frost"></span><span class="sc">Pâtisserie · bar à salades</span><b>+2 / +8 °C</b><p>Plane, Vision, Centrale, Gourmandise, Panorama, Saladette.</p></button>
      <button type="button" class="tcard rs" onClick="{{ goChoc }}"><span class="frost" style="background:#E2D6C4"></span><span class="sc">Chocolats</span><b>+14 / +18 °C</b><p>Plane, Vision, Centrale, Gourmandise, Panorama.</p></button>
      <button type="button" class="tcard rs" onClick="{{ goPoi }}"><span class="frost"></span><span class="sc">Poissonnerie</span><b>−2 / 0 °C</b><p>Froid statique avec serpentin de cuve, vidange de cuve.</p></button>
      <button type="button" class="tcard rs" onClick="{{ goChaud }}"><span class="frost" style="background:#E8D2C4"></span><span class="sc">Chaud · bain-marie</span><b>+30 / +90 °C</b><p>Bacs gastronormes — bar à couscous.</p></button>
    </div>
  </div>
</section>

<footer class="ft">
  <div class="wrap">
    <div class="ft-cta">
      <h2 class="h2">Votre agencement, <em>dessiné en 3D</em> avant d’être fabriqué.</h2>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn btn-r" href="Mineral-Contact.html">Demande de devis <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"></path></svg></a><a class="btn btn-o" href="tel:0800951313">0 800 95 13 13</a></div>
    </div>

    const s = this.state;

    };
