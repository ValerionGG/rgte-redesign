<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RGTE · Configurateur — Showroom et contact</title>
<script src="../vendor/preact.min.js"></script>
<script src="../dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#FFFFFF}
sc-for,sc-if{display:contents}
.cf{--acc:#D42A20;--acc2:#B3221A;--ink:#17181B;--mute:#5C5E64;--line:#E1E0DC;--studio:#EFEEEB;--floor:#E3E2DE;--soft:#F6F6F4;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#FFFFFF;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-feature-settings:"tnum" 1}
.cf *,.cf *::before,.cf *::after{box-sizing:border-box}
.cf img{display:block;max-width:100%}
:where(.cf) :is(h1,h2,h3,h4,p){margin:0}
:where(.cf) :is(button,input,textarea){font-family:inherit;color:inherit}
.cf :focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px}
section[id]{scroll-margin-top:90px}
/* header */
.tb{background:var(--ink);color:#C8C9CC;font-size:13px}
.tb-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:38px}
.tb a{color:#FFFFFF;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.tb a:hover{text-decoration:underline;text-underline-offset:3px}
.hd{position:sticky;top:0;z-index:90;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hd-in{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:74px}
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-height:44px}
.logo-w{font-weight:800;font-size:26px;letter-spacing:-.045em;line-height:1;position:relative;padding-bottom:5px}
.logo-w::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--acc)}
.logo-s{font-size:12px;font-weight:500;color:var(--mute);line-height:1.2;border-left:1px solid var(--line);padding-left:12px}
.nav{display:flex;gap:2px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 13px;border-radius:22px;font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;transition:background .2s}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--ink);color:#FFFFFF}
.hd-r{display:flex;align-items:center;gap:8px}
.tel{display:inline-flex;flex-direction:column;justify-content:center;text-decoration:none;color:var(--ink);min-height:44px;padding:0 8px;line-height:1.15}
.tel b{font-size:16px;font-weight:800}
.tel small{font-size:11.5px;color:var(--mute);font-weight:500}
.pbtn{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 8px 0 14px;border-radius:22px;border:1px solid var(--line);background:#FFFFFF;font-size:14px;font-weight:700;cursor:pointer;transition:border-color .2s,background .2s}
.pbtn:hover{border-color:var(--ink)}
.pbtn[aria-expanded="true"]{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.badge{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:var(--acc);color:#FFFFFF;font-size:13px;font-weight:800;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:12px;border:0;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;transition:background .2s,box-shadow .2s,transform .15s,color .2s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-acc{background:var(--acc);color:#FFFFFF}
.btn-acc:hover{background:var(--acc2)}
.btn-ink{background:var(--ink);color:#FFFFFF}
.btn-ink:hover{background:#34363B}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px #BEBDB8}
.btn-line:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn-sm{min-height:44px;padding:0 16px;font-size:14px}
.burger{display:none;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#FFFFFF;align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none}
.pp{position:absolute;right:max(16px,calc((100% - 1360px) / 2 + 40px));top:calc(100% + 8px);width:min(440px,calc(100% - 32px));background:#FFFFFF;border-radius:18px;box-shadow:0 0 0 1px var(--line),0 40px 80px -30px rgba(23,24,27,.35);padding:20px;animation:fd .3s cubic-bezier(.2,.7,.2,1) both;z-index:95}
@keyframes fd{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.pp-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pp-h b{font-size:17px}
.pp-h span{font-size:13px;color:var(--mute)}
.pp-st{container-type:inline-size;margin:14px 0 4px;padding:18px 14px 12px;border-radius:12px;background:linear-gradient(#F3F2EF 0 70%,var(--floor) 70%);display:flex;justify-content:center}
.pp-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.pp-row img{width:52px;height:38px;object-fit:contain}
.pp-row span{color:var(--mute);font-size:12.5px;display:block}
.pp-tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px;border-top:1px solid var(--ink);margin-top:2px}
.pp-tot b{font-size:30px;font-weight:300;letter-spacing:-.03em}
.xb{width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.xb:hover{background:var(--soft);color:var(--ink)}
.empty{font-size:14px;color:var(--mute);padding:14px 0}
.lu{display:inline-flex;flex-direction:column;align-items:stretch;max-width:100%}
.row{display:flex;align-items:flex-end;justify-content:center}
.pk{position:relative;flex:none;border:0;padding:0;background:transparent;animation:drop .7s cubic-bezier(.2,.8,.2,1) both}
.pk::before{content:'';position:absolute;left:4%;right:4%;bottom:-6%;height:16%;border-radius:50%;background:radial-gradient(closest-side,rgba(23,24,27,.32),rgba(23,24,27,0));filter:blur(3px);z-index:0}
.cut{position:absolute;inset:0;overflow:hidden;z-index:1}
.cut img{position:absolute;max-width:none;height:auto}
@keyframes drop{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
.cote{position:relative;height:18px;border-left:1.5px solid var(--acc);border-right:1.5px solid var(--acc)}
.cote::before{content:'';position:absolute;left:0;right:0;top:8px;border-top:1.5px solid var(--acc)}
.cote span{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:var(--floor);padding:0 10px;color:var(--acc);font-size:14px;font-weight:800;white-space:nowrap;line-height:28px}
/* type */
.h1{font-size:clamp(44px,6.4vw,100px);line-height:.92;letter-spacing:-.055em;font-weight:800;overflow-wrap:anywhere}
.h2{font-size:clamp(32px,3.8vw,56px);line-height:.98;letter-spacing:-.045em;font-weight:800;overflow-wrap:anywhere}
.h3{font-size:clamp(20px,1.7vw,24px);line-height:1.15;letter-spacing:-.02em;font-weight:700}
.lead{font-size:clamp(16px,1.2vw,18px);color:var(--mute);line-height:1.55;max-width:58ch}
.lab{font-size:13.5px;font-weight:600;color:var(--mute)}
.num{font-weight:200;letter-spacing:-.05em;line-height:.9}
.note{font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;border:0;font-size:14.5px;font-weight:600;cursor:pointer;transition:background .2s,box-shadow .2s,color .2s}
.chip:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
/* hero */
.hero{background:linear-gradient(180deg,#F7F7F5,#EFEEEB);padding:64px 0 72px}
.hero-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:48px;align-items:stretch}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:36px;border-top:1px solid #D6D5D0}
.facts div{padding:18px 18px 18px 0;border-bottom:1px solid #D6D5D0;font-size:15.5px}
.facts span{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:4px}
.facts a{color:var(--ink);text-decoration:none;font-weight:800;font-size:clamp(22px,2vw,28px);letter-spacing:-.025em;white-space:nowrap}
.facts a:hover{color:var(--acc)}
.map{position:relative;border-radius:24px;overflow:hidden;background:#E9E8E4;min-height:520px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;left:58%;top:47%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;z-index:2}
.pin b{background:var(--ink);color:#FFFFFF;border-radius:14px;padding:10px 14px;font-size:13.5px;line-height:1.3;white-space:nowrap;box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}
.pin b small{display:block;font-weight:500;color:#C8C9CC;font-size:12px}
.pin i{width:2px;height:22px;background:var(--ink)}
.pin em{width:18px;height:18px;border-radius:9px;background:var(--acc);box-shadow:0 0 0 6px rgba(212,42,32,.18);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,42,32,.35)}70%{box-shadow:0 0 0 18px rgba(212,42,32,0)}100%{box-shadow:0 0 0 0 rgba(212,42,32,0)}}
.map-cap{position:absolute;left:16px;bottom:16px;background:#FFFFFF;border-radius:12px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--mute);z-index:2}
/* formulaire */
.dv{padding:96px 0}
.dv-g{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:40px;align-items:start}
.card{background:#FFFFFF;border-radius:24px;box-shadow:0 0 0 1px var(--line),0 40px 80px -60px rgba(23,24,27,.4);padding:34px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:22px 0 28px}
.stp{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:56px;padding:0;border:0;background:transparent;cursor:pointer;text-align:left;font-size:14px;font-weight:700}
.stp i{display:block;width:100%;height:4px;border-radius:2px;transition:background .3s}
.cf .q{font-size:16px;font-weight:700;margin:26px 0 10px}
.cf .q:first-child{margin-top:0}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13.5px;font-weight:700}
.fld input,.fld textarea{font:500 15px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--soft);border:1px solid var(--line);border-radius:12px;min-height:50px;padding:12px 14px;outline:0;width:100%;transition:border-color .2s,box-shadow .2s,background .2s}
.fld textarea{min-height:110px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,24,27,.08);background:#FFFFFF}
.unit{display:flex;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:12px}
.unit input{border:0;background:transparent;font:300 30px/1 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:-.03em;min-height:64px;padding:0 16px;width:100%;outline:0}
.unit span{padding:0 16px;font-weight:700;color:var(--mute)}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.err{font-size:12.5px;color:#B3261C;font-weight:600}
.fnav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.att{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;border:0;width:100%;text-align:left;cursor:pointer;transition:background .2s,box-shadow .2s}
.att .bx{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.ok{animation:fd .4s ease both}
.okic{width:56px;height:56px;border-radius:28px;background:var(--acc);display:grid;place-items:center;color:#FFFFFF}
.rr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.rr span{color:var(--mute)}
.rr b{text-align:right}
.side{position:sticky;top:94px;display:flex;flex-direction:column;gap:12px}
.sbox{border-radius:22px;padding:24px;background:var(--soft)}
.sbox.dark{background:var(--ink);color:#FFFFFF}
.sb-st{container-type:inline-size;display:flex;justify-content:center;padding:30px 14px 16px;margin-top:14px;border-radius:14px;background:linear-gradient(#FBFBFA 0 66%,var(--floor) 66%)}
.bigtel{display:block;color:#FFFFFF;text-decoration:none;font-size:clamp(30px,2.6vw,38px);font-weight:800;letter-spacing:-.03em;margin-top:6px}
.bigtel:hover{color:#FF9D95}
/* visite + faq */
.vis{background:var(--soft);padding:96px 0}
.vis-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:40px}
.vc{background:#FFFFFF;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.vc img{width:100%;height:220px;object-fit:cover}
.vc div{padding:20px 22px 22px}
.vc b{display:block;font-size:18px;letter-spacing:-.015em}
.vc p{font-size:14.5px;color:var(--mute);margin-top:6px}
.faq{padding:96px 0}
.faq-g{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:56px;align-items:start}
.fq{border-top:1px solid var(--line)}
.fq:last-child{border-bottom:1px solid var(--line)}
.fq button{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;min-height:68px;padding:12px 0;border:0;background:transparent;text-align:left;cursor:pointer;font-size:18px;font-weight:700;letter-spacing:-.015em}
.fq svg{flex:none;transition:transform .3s}
.fq p{padding:0 48px 22px 0;font-size:15.5px;color:var(--mute);animation:fd .3s ease both}
/* footer */
.ft{background:#FFFFFF;border-top:1px solid var(--line);padding:72px 0 24px}
.ft-g{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:40px}
.cf .ft-h{font-size:13px;font-weight:700;color:var(--mute);margin-bottom:12px}
.ft p{font-size:14.5px;color:var(--mute)}
.ft-l a{display:flex;align-items:center;min-height:36px;color:var(--ink);text-decoration:none;font-size:14.5px}
.ft-l a:hover{color:var(--acc)}
.ft-tel{font-size:26px;font-weight:800;color:var(--ink);text-decoration:none;letter-spacing:-.02em}
.ft-bot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 20px;margin-top:56px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.ft-bot a{color:var(--mute);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.ft-bot a:hover{color:var(--ink)}
.legal{display:flex;flex-wrap:wrap;gap:0 18px}
@media(max-width:1280px){.tel{display:none}.logo-s{display:none}}
@media(max-width:1080px){.nav{display:none}.burger{display:inline-flex}.mnav{display:grid;gap:6px;padding:4px 0 16px}.mnav a{display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:12px;background:var(--soft);text-decoration:none;color:var(--ink);font-weight:700}
.hero-g,.dv-g,.faq-g{grid-template-columns:minmax(0,1fr)}.side{position:static}.vis-g{grid-template-columns:minmax(0,1fr)}.ft-g{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.wrap{padding:0 16px}.hd-cta{display:none}.tb-note{display:none}.pbtn .pl-t{display:none}.pp{right:16px}
.hero{padding:36px 0 48px}.facts{grid-template-columns:minmax(0,1fr)}.map{min-height:340px}.pin b{font-size:12px;padding:8px 10px}.dv,.vis,.faq{padding:72px 0}.card{padding:20px}.f2{grid-template-columns:minmax(0,1fr)}.steps{gap:4px}.stp{font-size:12.5px}.fq button{font-size:16px}.fq p{padding-right:0}.ft-g{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.cf *{animation:none !important;transition:none !important}html{scroll-behavior:auto}}
</style>
</helmet>
<div class="cf" style="{{ rootStyle }}">

<div class="tb">
  <div class="wrap tb-in">
    <a href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Toutes les propositions</a>
    <span class="tb-note">Bureau d'études et show-room à Puget-sur-Argens, dans le Var</span>
  </div>
</div>

<header class="hd">
  <div class="wrap hd-in">
    <a class="logo" href="Config-Accueil.html" aria-label="RGTE, R.G. Technologies — accueil"><span class="logo-w">RGTE</span><span class="logo-s">R.G. Technologies<br>Vitrines réfrigérées</span></a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="Config-Lignes.html">Lignes d'agencement</a>
      <a href="Config-Secteurs.html">Secteurs</a>
      <a href="Config-Realisations.html">Réalisations</a>
      <a class="on" href="Config-Contact.html" aria-current="page">Showroom &amp; contact</a>
    </nav>
    <div class="hd-r">
      <a class="tel" href="tel:0800951313"><b>0 800 95 13 13</b><small>Appel gratuit</small></a>
      <button type="button" class="pbtn" onClick="{{ togglePP }}" aria-expanded="{{ ppOpenS }}" aria-label="Mon projet : voir les modules choisis"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18v9H3z"></path><path d="M5 10V6h14v4M9 10v9M15 10v9"></path></svg><span class="pl-t">Mon projet</span><span class="badge" key="{{ badgeKey }}">{{ pj.count }}</span></button>
      <a class="btn btn-acc btn-sm hd-cta" href="#devis">Plan 3D offert</a>
      <button type="button" class="burger" aria-label="Ouvrir ou fermer le menu" aria-expanded="{{ menuS }}" onClick="{{ toggleMenu }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav class="wrap mnav" aria-label="Navigation mobile">
      <a href="Config-Lignes.html">Lignes d'agencement</a>
      <a href="Config-Secteurs.html">Secteurs</a>
      <a href="Config-Realisations.html">Réalisations</a>
      <a href="Config-Contact.html">Showroom &amp; contact</a>
      <a href="tel:0800951313">0 800 95 13 13 · appel gratuit</a>
      <a href="#devis" onClick="{{ closeMenu }}" style="background:var(--acc);color:#FFFFFF">Plan 3D offert</a>
    </nav>
  </sc-if>
  <sc-if value="{{ ppOpen }}" hint-placeholder-val="{{ false }}">
    <div class="pp" role="dialog" aria-label="Mon projet">
      <div class="pp-h"><b>Mon projet</b><span>{{ pj.ligneTxt }}</span></div>
      <sc-if value="{{ pj.has }}" hint-placeholder-val="{{ true }}">
        <div class="pp-st"><div class="lu"><div class="row" style="{{ pjMini.rowStyle }}">
          <sc-for list="{{ pjMini.mods }}" as="m" hint-placeholder-count="3"><span class="pk" style="{{ m.shape }}"><span class="cut"><img src="{{ m.src }}" alt="{{ m.alt }}" style="{{ m.imgStyle }}"></span></span></sc-for>
        </div></div></div>
        <sc-for list="{{ pj.rows }}" as="r" hint-placeholder-count="3">
          <div class="pp-row"><img src="{{ r.thumb }}" alt=""><div><b>{{ r.name }}</b><span>{{ r.sub }}</span></div><button type="button" class="xb" onClick="{{ r.remove }}" aria-label="{{ r.removeLabel }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
        </sc-for>
        <div class="pp-tot"><span class="lab">Longueur totale</span><b>{{ pj.total }} cm</b></div>
      </sc-if>
      <sc-if value="{{ pj.none }}" hint-placeholder-val="{{ false }}"><p class="empty">Votre projet est vide : composez votre comptoir sur l'accueil.</p></sc-if>
      <div style="display:grid;gap:8px;margin-top:12px">
        <a class="btn btn-acc" href="#devis" onClick="{{ closePP }}">Recevoir mon plan 3D offert</a>
        <a class="btn btn-line" href="Config-Accueil.html">Modifier dans le composeur</a>
      </div>
    </div>
  </sc-if>
</header>

<main>
<section class="hero">

<section class="dv" id="devis">
  <div class="wrap dv-g">
    <div class="card">
      <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
        <div>
          <h2 class="h2" style="font-size:clamp(30px,3vw,44px)">Votre demande en trois étapes.</h2>
          <div class="steps" role="list">
            <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
              <button type="button" class="stp" role="listitem" style="{{ s.style }}" onClick="{{ s.go }}" aria-current="{{ s.cur }}"><i style="{{ s.bar }}"></i>{{ s.label }}</button>
            </sc-for>
          </div>

          <sc-if value="{{ isS1 }}" hint-placeholder-val="{{ true }}">
            <div class="ok">
              <p class="q">Que souhaitez-vous ?</p>
              <div class="chips" role="group" aria-label="Objet de la demande">
                <sc-for list="{{ objs }}" as="o" hint-placeholder-count="3"><button type="button" class="chip" style="{{ o.style }}" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}">{{ o.label }}</button></sc-for>
              </div>
              <p class="q">Votre secteur d'activité</p>
              <div class="chips" role="group" aria-label="Secteur d'activité">
                <sc-for list="{{ sects }}" as="x" hint-placeholder-count="13"><button type="button" class="chip" style="{{ x.style }}" onClick="{{ x.pick }}" aria-pressed="{{ x.on }}">{{ x.name }}</button></sc-for>
              </div>
              <sc-if value="{{ eSect }}" hint-placeholder-val="{{ false }}"><p class="err" style="margin-top:8px">Choisissez votre secteur, ou « Autre ».</p></sc-if>
              <p class="q">Votre composition</p>
              <button type="button" class="att" style="{{ attStyle }}" onClick="{{ toggleAtt }}" aria-pressed="{{ attS }}">
                <span class="bx" style="{{ attBox }}"><sc-if value="{{ att }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>
                <span><b style="display:block;font-size:15px">Joindre « Mon projet »</b><span class="note" style="font-size:13.5px">{{ pj.summary }}</span></span>
              </button>
              <div class="fnav"><span class="note">Étape 1 sur 3</span><button type="button" class="btn btn-acc" onClick="{{ next1 }}">Continuer</button></div>
            </div>
          </sc-if>

          <sc-if value="{{ isS2 }}" hint-placeholder-val="{{ false }}">
            <div class="ok">
              <p class="q">Les dimensions de votre local</p>
              <div class="f2">
                <div class="fld"><label for="c-long">Longueur disponible pour les vitrines</label><div class="unit"><input id="c-long" type="text" inputmode="numeric" placeholder="ex. 420" value="{{ f.long }}" onInput="{{ inLong }}"><span>cm</span></div></div>
                <div class="fld"><label for="c-prof">Profondeur disponible</label><div class="unit"><input id="c-prof" type="text" inputmode="numeric" placeholder="ex. 180" value="{{ f.prof }}" onInput="{{ inProf }}"><span>cm</span></div></div>
              </div>
              <button type="button" class="chip" style="{{ noCoteStyle }};margin-top:10px" onClick="{{ toggleNoCote }}" aria-pressed="{{ noCoteS }}">Je n'ai pas encore les cotes</button>
              <sc-if value="{{ eDim }}" hint-placeholder-val="{{ false }}"><p class="err" style="margin-top:8px">Indiquez au moins la longueur en centimètres, ou choisissez « Je n'ai pas encore les cotes ».</p></sc-if>
              <p class="q">Ligne préférée</p>
              <div class="chips" role="group" aria-label="Ligne préférée">
                <sc-for list="{{ ligs }}" as="l" hint-placeholder-count="6"><button type="button" class="chip" style="{{ l.style }}" onClick="{{ l.pick }}" aria-pressed="{{ l.on }}">{{ l.label }}</button></sc-for>
              </div>
              <div class="fld" style="margin-top:20px"><label for="c-msg">Votre message</label><textarea id="c-msg" placeholder="Produits exposés, contraintes du local, calendrier…" value="{{ f.msg }}" onInput="{{ inMsg }}"></textarea></div>
              <div class="fnav"><button type="button" class="btn btn-line" onClick="{{ back }}">Retour</button><button type="button" class="btn btn-acc" onClick="{{ next2 }}">Continuer</button></div>
            </div>
          </sc-if>

          <sc-if value="{{ isS3 }}" hint-placeholder-val="{{ false }}">
            <form class="ok" onSubmit="{{ submit }}" novalidate>
              <div style="display:grid;gap:12px">
                <div class="f2">
                  <div class="fld"><label for="c-nom">Nom *</label><input id="c-nom" type="text" autocomplete="name" value="{{ f.nom }}" onInput="{{ inNom }}" style="{{ eNomS }}"><sc-if value="{{ eNom }}" hint-placeholder-val="{{ false }}"><span class="err">Indiquez votre nom.</span></sc-if></div>
                  <div class="fld"><label for="c-soc">Commerce ou société</label><input id="c-soc" type="text" autocomplete="organization" value="{{ f.soc }}" onInput="{{ inSoc }}"></div>
                </div>
                <div class="f2">
                  <div class="fld"><label for="c-tel">Téléphone *</label><input id="c-tel" type="tel" autocomplete="tel" value="{{ f.tel }}" onInput="{{ inTel }}" style="{{ eTelS }}"><sc-if value="{{ eTel }}" hint-placeholder-val="{{ false }}"><span class="err">Indiquez un numéro de téléphone.</span></sc-if></div>
                  <div class="fld"><label for="c-mail">Email *</label><input id="c-mail" type="email" autocomplete="email" value="{{ f.mail }}" onInput="{{ inMail }}" style="{{ eMailS }}"><sc-if value="{{ eMail }}" hint-placeholder-val="{{ false }}"><span class="err">Indiquez un email valide, par exemple nom@domaine.fr.</span></sc-if></div>
                </div>
                <div class="f2">
                  <div class="fld"><label for="c-cp">Code postal</label><input id="c-cp" type="text" inputmode="numeric" autocomplete="postal-code" value="{{ f.cp }}" onInput="{{ inCp }}"></div>
                  <div class="fld"><label for="c-ville">Ville</label><input id="c-ville" type="text" autocomplete="address-level2" value="{{ f.ville }}" onInput="{{ inVille }}"></div>
                </div>
              </div>
              <div class="fnav"><button type="button" class="btn btn-line" onClick="{{ back }}">Retour</button><button type="submit" class="btn btn-acc">{{ submitTxt }}</button></div>
            </form>
          </sc-if>
        </div>
      </sc-if>
      <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
        <div class="ok" role="status">
          <span class="okic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
          <h2 class="h2" style="font-size:clamp(28px,2.8vw,40px);margin-top:18px">Demande prête, {{ f.nom }}.</h2>
          <p class="lead" style="margin-top:8px">{{ sendNote }}</p>
          <div style="margin-top:18px">
            <div class="rr"><span>Demande</span><b>{{ objTxt }}</b></div>
            <div class="rr"><span>Secteur</span><b>{{ sectTxt }}</b></div>
            <div class="rr"><span>Local</span><b>{{ dimTxt }}</b></div>
            <div class="rr"><span>Ligne préférée</span><b>{{ ligTxt }}</b></div>
            <div class="rr"><span>Mon projet</span><b>{{ attTxt }}</b></div>
          </div>
          <button type="button" class="btn btn-ink" style="margin-top:20px" onClick="{{ reset }}">Modifier ma demande</button>
        </div>
      </sc-if>
    </div>

    <aside class="side">
      <div class="sbox">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><b style="font-size:17px">Mon projet</b><span class="note">{{ pj.ligneTxt }}</span></div>
        <sc-if value="{{ pj.has }}" hint-placeholder-val="{{ true }}">
          <div class="sb-st"><div class="lu">
            <div class="row" style="{{ sideLu.rowStyle }}"><sc-for list="{{ sideLu.mods }}" as="m" hint-placeholder-count="3"><span class="pk" style="{{ m.shape }}" key="{{ m.key }}"><span class="cut"><img src="{{ m.src }}" alt="{{ m.alt }}" style="{{ m.imgStyle }}"></span></span></sc-for></div>
            <div class="cote" style="margin-top:20px"><span>{{ pj.total }} cm</span></div>
          </div></div>
          <p class="note" style="margin-top:12px">{{ pj.names }}</p>
        </sc-if>
        <sc-if value="{{ pj.none }}" hint-placeholder-val="{{ false }}"><p class="empty">Aucun module choisi. Vous pouvez composer votre comptoir avant d'envoyer la demande.</p></sc-if>
        <a class="btn btn-line btn-sm" style="margin-top:14px" href="Config-Accueil.html">Modifier la composition</a>
      </div>
      <div class="sbox dark">
        <span class="lab" style="color:#A6A7AB">Plutôt de vive voix ?</span>
        <a class="bigtel" href="tel:0800951313">0 800 95 13 13</a>
        <p class="note" style="color:#BFC0C4;margin-top:4px">Numéro vert, appel gratuit. Horaires : [HORAIRES]</p>
      </div>
    </aside>
  </div>
</section>

<section class="vis" id="visite">
  <div class="wrap">
    <h2 class="h2">Pour votre visite au show-room.</h2>
    <div class="vis-g">
      <div class="vc"><img src="../assets/photos/realisations/stone-poissonnier-plan.webp" alt="Plan 3D d'un comptoir de traiteur poissonnier" loading="lazy"><div><b>Apportez vos cotes</b><p>Longueur et profondeur disponibles, emplacements des arrivées : le plan 3D part de vos dimensions.</p></div></div>
      <div class="vc"><img src="../assets/photos/ambiance/matiere-pierre-blanche.webp" alt="Surface de pierre blanche (ambiance)" loading="lazy"><div><b>Touchez les matières</b><p>Pierre acrylique type Corian, granit, bois mélaminé avec moulures, verre sérigraphié.</p></div></div>
      <div class="vc"><img src="../assets/photos/produits/stone-gourmandise-photo.webp" alt="Vitrine Gourmandise garnie de chocolats" loading="lazy"><div><b>Comparez les modules</b><p>Plane ou Vision, ventilé ou statique, plage +2/+8 °C ou +14/+18 °C : choisissez selon vos produits.</p></div></div>
    </div>
  </div>
</section>

<section class="faq" id="faq">
  <div class="wrap faq-g">
    <div>
      <h2 class="h2">Questions fréquentes.</h2>
      <p class="lead" style="margin-top:16px">Une autre question ? Appelez le 0 800 95 13 13.</p>
    </div>
    <div>
      <sc-for list="{{ faq }}" as="q" hint-placeholder-count="6">
        <div class="fq">
          <button type="button" onClick="{{ q.toggle }}" aria-expanded="{{ q.openS }}">{{ q.q }}<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="{{ q.ic }}"><path d="M12 5v14M5 12h14"></path></svg></button>
          <sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}"><p>{{ q.a }}</p></sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</section>
</main>

class Component extends DCLogic {

    this.state = { proj: loadProj(), menu:false, pp:false, bump:0, step: st, obj:'plan', sect:'', att:true, noCote:false, lig:'conseil',
      f:{ long:'', prof:'', msg:'', nom:'', soc:'', tel:'', mail:'', cp:'', ville:'' }, err:{}, sent:false, faq:0 };
  }
  setProj(p){ saveProj(p); this.setState({ proj:p, bump:this.state.bump + 1 }); }
  removeK(k){ const p = this.state.proj; this.setProj({ n:p.n, items:p.items.filter(it => it.k !== k) }); }
  setF(k, e, num){ const f = Object.assign({}, this.state.f); f[k] = num ? e.target.value.replace(/[^0-9]/g, '').slice(0, 4) : e.target.value; const err = Object.assign({}, this.state.err); err[k] = false; if (k === 'long') err.dim = false; this.setState({ f, err }); }
  submit(e){ if (e && e.preventDefault) e.preventDefault(); const f = this.state.f;
    const err = { nom: !f.nom.trim(), tel: !f.tel.trim(), mail: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.mail.trim()) };
    if (err.nom || err.tel || err.mail) { this.setState({ err }); return; } this.setState({ sent:true, err:{} }); this.sendLead(); }
  sendLead(){
    const s = this.state, f = s.f, items = s.proj.items, joint = s.att && items.length > 0;
    const longN = parseInt(f.long, 10), profN = parseInt(f.prof, 10);
    const details = { 'Demande': OBJS.find(o => o[0] === s.obj)[1], 'Plan 3D souhaité': s.obj === 'plan' };
    if (longN > 0) details['Longueur disponible'] = longN + ' cm';
    if (profN > 0) details['Profondeur disponible'] = profN + ' cm';
    if (s.noCote) details['Cotes à relever'] = true;
    details['Ligne préférée'] = LIGS.find(l => l[0] === s.lig)[1];
    details['Projet joint'] = joint;
    if (joint) {
      const ligs = items.map(it => LNAME[KIT[it.id].ligne]).filter((v, i, a) => a.indexOf(v) === i);
      details['Ligne'] = ligs.length === 1 ? ligs[0] : 'Mixte : ' + ligs.join(', ');
      details['Modules'] = items.map(it => KIT[it.id].name + ' ' + it.len + ' cm' + (ligs.length > 1 ? ' (' + LNAME[KIT[it.id].ligne] + ')' : ''));
      details['Nombre de modules'] = items.length;
      details['Longueur totale'] = items.reduce((a, it) => a + it.len, 0) + ' cm';
    }
    this.send(joint ? 'projet' : (s.obj === 'plan' ? 'plan3d' : (s.obj === 'devis' ? 'devis' : 'contact')), {
      nom: f.nom.trim(), telephone: f.tel.trim(), email: f.mail.trim(), societe: f.soc.trim(), secteur: s.sect,
      codePostal: f.cp.trim(), ville: f.ville.trim(), message: f.msg.trim(), details });
  }
  projVals(){
    const items = this.state.proj.items;
    const ligs = items.map(it => KIT[it.id].ligne).filter((v, i, a) => a.indexOf(v) === i);
    const total = items.reduce((a, it) => a + it.len, 0);
    return { count: items.length, total, has: items.length > 0, none: !items.length,
      ligneTxt: !items.length ? 'Aucun module' : (ligs.length === 1 ? 'Ligne ' + LNAME[ligs[0]] : 'Lignes mixtes'),
      names: items.map(it => KIT[it.id].name + ' ' + it.len + ' cm').join(', '),
      summary: items.length ? items.length + ' modules, ' + total + ' cm : ' + items.map(it => KIT[it.id].name).join(', ') : 'Aucun module choisi pour l\'instant',
      rows: items.map(it => { const k = KIT[it.id]; return { name:k.name, sub:'Ligne ' + LNAME[k.ligne] + ' · ' + it.len + ' cm', thumb:P + 'produits/' + k.f + '.webp', removeLabel:'Retirer ' + k.name + ' du projet', remove: () => this.removeK(it.k) }; }) };
  }
  renderVals(){
    const s = this.state;
    const acc = (this.props && this.props.accent) || '#D42A20';
    const pj = this.projVals(), items = s.proj.items;
    const selC = 'background:var(--ink);color:#FFFFFF', offC = 'background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)';
    const e = s.err || {}, bad = 'border-color:#B3261C;box-shadow:0 0 0 3px rgba(179,38,28,.12)';
    const steps = [['1','Projet'],['2','Local'],['3','Coordonnées']].map((d, i) => { const n = i + 1, cur = s.step === n, done = s.step > n;
      return { label: d[0] + '. ' + d[1], cur: cur ? 'step' : 'false', style: cur || done ? 'color:var(--ink)' : 'color:var(--mute)', bar: 'background:' + (cur ? 'var(--acc)' : (done ? 'var(--ink)' : 'var(--line)')), go: () => { if (n <= s.step) this.setState({ step:n }); } }; });
    const longN = parseInt(s.f.long, 10);
    const objTxt = OBJS.find(o => o[0] === s.obj)[1];
    return {
      rootStyle: '--acc:' + acc,
      menuOpen: s.menu, menuS: s.menu ? 'true' : 'false', toggleMenu: () => this.setState({ menu: !s.menu, pp:false }), closeMenu: () => this.setState({ menu:false }),
      ppOpen: s.pp, ppOpenS: s.pp ? 'true' : 'false', togglePP: () => this.setState({ pp: !s.pp, menu:false }), closePP: () => this.setState({ pp:false }),
      badgeKey: 'b' + s.bump, pj, pjMini: lineup(items, 110, 4), sideLu: lineup(items, 120, 6),
      pickVisit: () => this.setState({ obj:'visite', step:1, sent:false }),
      steps, isS1: s.step === 1, isS2: s.step === 2, isS3: s.step === 3,
      objs: OBJS.map(o => ({ label:o[1], on: s.obj === o[0] ? 'true' : 'false', style: s.obj === o[0] ? selC : offC, pick: () => this.setState({ obj:o[0] }) })),
      sects: SECTS.map(x => ({ name:x, on: s.sect === x ? 'true' : 'false', style: s.sect === x ? selC : offC, pick: () => this.setState({ sect:x, err: Object.assign({}, s.err, { sect:false }) }) })),
      eSect: !!e.sect,
      att: s.att && pj.has, attS: s.att && pj.has ? 'true' : 'false', toggleAtt: () => this.setState({ att: !s.att }),
      attStyle: s.att && pj.has ? 'background:#FBEDEC;box-shadow:inset 0 0 0 1.5px var(--acc)' : 'background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)',
      attBox: s.att && pj.has ? 'background:var(--acc);color:#FFFFFF' : 'background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #BEBDB8',
      next1: () => { if (!s.sect) { this.setState({ err: Object.assign({}, s.err, { sect:true }) }); return; } this.setState({ step:2 }); },
      f: s.f, inLong: (ev) => this.setF('long', ev, true), inProf: (ev) => this.setF('prof', ev, true), inMsg: (ev) => this.setF('msg', ev),
      noCoteStyle: s.noCote ? selC : offC, noCoteS: s.noCote ? 'true' : 'false', toggleNoCote: () => this.setState({ noCote: !s.noCote, err: Object.assign({}, s.err, { dim:false }) }),
      eDim: !!e.dim,
      ligs: LIGS.map(l => ({ label:l[1], on: s.lig === l[0] ? 'true' : 'false', style: s.lig === l[0] ? selC : offC, pick: () => this.setState({ lig:l[0] }) })),
      next2: () => { if (!s.noCote && !(longN > 0)) { this.setState({ err: Object.assign({}, s.err, { dim:true }) }); return; } this.setState({ step:3 }); },
      back: () => this.setState({ step: Math.max(1, s.step - 1) }),
      inNom: (ev) => this.setF('nom', ev), inSoc: (ev) => this.setF('soc', ev), inTel: (ev) => this.setF('tel', ev), inMail: (ev) => this.setF('mail', ev), inCp: (ev) => this.setF('cp', ev), inVille: (ev) => this.setF('ville', ev),
      eNom: !!e.nom, eTel: !!e.tel, eMail: !!e.mail, eNomS: e.nom ? bad : '', eTelS: e.tel ? bad : '', eMailS: e.mail ? bad : '',
      submitTxt: s.obj === 'plan' ? 'Recevoir mon plan 3D' : (s.obj === 'devis' ? 'Demander mon devis' : 'Demander une visite'),
      submit: (ev) => this.submit(ev), sent: s.sent, notSent: !s.sent, reset: () => this.setState({ sent:false, step:1 }),
      sendNote: this.live ? 'Votre demande est transmise au bureau d\'études. Voici son récapitulatif.' : 'Prototype : rien n\'est envoyé. Voici ce que recevrait le bureau d\'études.',
      objTxt, sectTxt: s.sect || 'Non précisé',
      dimTxt: s.noCote ? 'Cotes à relever' : (longN > 0 ? longN + ' cm' + (parseInt(s.f.prof, 10) > 0 ? ' × ' + parseInt(s.f.prof, 10) + ' cm' : '') : 'Non précisé'),
      ligTxt: LIGS.find(l => l[0] === s.lig)[1],
      attTxt: s.att && pj.has ? pj.count + ' modules, ' + pj.total + ' cm' : 'Non joint',
      faq: FAQ.map((q, i) => ({ q:q[0], a:q[1], open: s.faq === i, openS: s.faq === i ? 'true' : 'false', ic: s.faq === i ? 'transform:rotate(45deg);color:var(--acc)' : '', toggle: () => this.setState({ faq: s.faq === i ? -1 : i }) }))
    };
  }
}
</script>
