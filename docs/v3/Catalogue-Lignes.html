<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RGTE Catalogue — Lignes</title>
<script src="../vendor/preact.min.js"></script>
<script src="../dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#EFEDE8}
sc-for,sc-if{display:contents}
.k{--acc:#D42A20;--acc-d:#B2221A;--ink:#1B1B1A;--ink2:#262624;--sand:#EFEDE8;--plate:#E4E1DA;--plate2:#DAD6CD;--paper:#FFFFFF;--mut:#5F5D58;--ln:#CFCBC2;--lnd:#3B3B38;font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.55;color:var(--ink);background:var(--sand);overflow-x:clip;-webkit-font-smoothing:antialiased}
.k *,.k *::before,.k *::after{box-sizing:border-box}
.k img{display:block;max-width:100%}
.k h1,.k h2,.k h3,.k h4,.k p,.k ul,.k ol,.k dl,.k dd,.k dt,.k figure{margin:0;padding:0}
.k ul{list-style:none}
:where(.k) button,:where(.k) input{font:inherit;color:inherit}
.k :focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.w{max-width:1400px;margin:0 auto;padding:0 40px}
.cd{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;line-height:.9;letter-spacing:-.005em}
.tn{font-variant-numeric:tabular-nums}
.mk{background:#F7DCD8;color:#981C15;padding:0 4px;font-weight:600;font-size:.9em;white-space:nowrap}
.tb{background:var(--ink);color:#BDBBB5;font-size:13px}
.tb .w{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:40px}
.tb a{color:#fff;text-decoration:none;min-height:40px;display:inline-flex;align-items:center;gap:8px}
.tb a:hover{text-decoration:underline;text-underline-offset:3px}
.tb-l,.tb-r{display:flex;gap:22px;align-items:center}
.hd{position:sticky;top:0;z-index:80;background:rgba(239,237,232,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.hd-in{display:flex;align-items:center;gap:28px;min-height:76px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-height:44px;flex:none}
.logo-w{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:42px;line-height:.78;letter-spacing:-.02em;display:flex;align-items:flex-end;gap:3px}
.logo-w i{width:9px;height:9px;background:var(--acc);display:block;margin-bottom:1px}
.logo-s{font-size:11px;line-height:1.25;font-weight:600;letter-spacing:.04em;color:var(--mut);border-left:1px solid var(--ln);padding-left:12px}
.nav{display:flex;align-items:stretch}
.nav a,.nav button{display:inline-flex;align-items:center;gap:6px;min-height:76px;padding:0 13px;background:none;border:0;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;letter-spacing:.02em;text-transform:uppercase;text-decoration:none;color:var(--ink);position:relative;white-space:nowrap}
.nav a::after,.nav button::after{content:"";position:absolute;left:13px;right:13px;bottom:-1px;height:3px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav a:hover::after,.nav button:hover::after,.nav .on::after{transform:scaleX(1)}
.nav .on::after{background:var(--ink)}
.nav button svg{transition:transform .25s}
.nav button[aria-expanded="true"] svg{transform:rotate(180deg)}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:20px}
.tel{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-height:44px}
.tel-i{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.tel b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1;white-space:nowrap}
.tel small{display:block;font-size:12px;color:var(--mut);line-height:1.2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border:0;border-radius:0;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;letter-spacing:.03em;text-transform:uppercase;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.btn-r{background:var(--acc);color:#fff}.btn-r:hover{background:var(--acc-d)}
.btn-k{background:var(--ink);color:#fff}.btn-k:hover{background:#000}
.btn-o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}.btn-o:hover{background:var(--ink);color:#fff}
.btn-w{background:#fff;color:var(--ink)}.btn-w:hover{background:var(--sand)}
.btn-ow{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.65)}.btn-ow:hover{background:#fff;color:var(--ink)}
.burger{display:none;width:48px;height:48px;border:1.5px solid var(--ink);background:transparent;align-items:center;justify-content:center;cursor:pointer}
.mega{position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:1px solid var(--ln);box-shadow:0 40px 60px -40px rgba(0,0,0,.35);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .22s,transform .22s,visibility .22s}
.mega.on{opacity:1;visibility:visible;transform:none}
.mega-g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.25fr);gap:14px;padding-top:26px;padding-bottom:30px}
.mg{display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.mg-pl{position:relative;background:var(--sand);height:150px;overflow:hidden}
.mg-pl img{position:absolute;left:8%;bottom:12%;width:84%;height:74%;object-fit:contain;object-position:50% 100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.mg:hover .mg-pl img{transform:scale(1.06)}
.mg-n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;text-transform:uppercase;line-height:1;margin-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.mg-n small{font-family:'Barlow',sans-serif;font-size:13px;font-weight:500;color:var(--mut);text-transform:none}
.mg-m{font-size:14px;color:var(--mut);margin-top:6px;line-height:1.45}
.mg-x{position:relative;background:var(--ink);color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;text-decoration:none;min-height:200px}
.mg-x img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;transition:transform .6s}
.mg-x:hover img{transform:scale(1.05)}
.mg-x b,.mg-x span{position:relative}
.mg-x b{font-family:'Barlow Condensed',sans-serif;font-size:28px;line-height:.95;text-transform:uppercase}
.mg-x span{font-size:14px;margin-top:6px}
.mnav{display:none;border-top:1px solid var(--ln);background:var(--paper);padding:8px 0 20px}
.mnav.on{display:block}
.mnav a{display:flex;justify-content:space-between;align-items:center;min-height:54px;border-bottom:1px solid var(--plate);text-decoration:none;color:var(--ink);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;text-transform:uppercase}
.mnav .btn{margin-top:16px;width:100%}
.ft{background:var(--ink);color:#C9C7C1;padding:56px 0 28px;font-size:15px}
.ft a{color:#fff;text-decoration:none}
.ft a:hover{text-decoration:underline;text-underline-offset:3px}
.ft-top{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;padding-bottom:48px;border-bottom:1px solid var(--lnd)}
.ft-big{font-size:clamp(44px,6vw,92px);color:#fff;max-width:11ch}
.ft-cta{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.ft-tel{font-family:'Barlow Condensed',sans-serif;font-size:44px;font-weight:700;line-height:1;color:#fff;text-decoration:none;display:inline-flex;align-items:center;min-height:48px}
.ft-g{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;padding:44px 0}
.ft-g h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff;margin-bottom:12px}
.ft-g li a{display:inline-flex;min-height:34px;align-items:center;color:#C9C7C1}
.ft-g li a:hover{color:#fff}
.ft-b{border-top:1px solid var(--lnd);padding-top:20px;display:flex;justify-content:space-between;gap:12px 28px;flex-wrap:wrap;font-size:13px;color:#A3A19B}
.ft-b strong{color:#fff;font-weight:600}
.ft .logo{color:#fff}
.ft .logo-s{color:#A3A19B;border-color:var(--lnd)}
.pl{display:block;position:relative;background:var(--plate);overflow:hidden}
.pl::before{content:"";position:absolute;left:14%;right:14%;bottom:9%;height:22px;background:radial-gradient(closest-side,rgba(40,30,20,.32),rgba(40,30,20,0));filter:blur(3px)}
.pl img{position:absolute;left:7%;bottom:12%;width:86%;height:72%;object-fit:contain;object-position:50% 100%;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.pl.ph::before{display:none}
.pl.ph img{left:0;bottom:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.h-xl{font-size:clamp(54px,7.3vw,112px)}
.h-l{font-size:clamp(44px,5.6vw,84px)}
.h-m{font-size:clamp(32px,3.4vw,48px)}
.lead{font-size:clamp(17px,1.35vw,19px);line-height:1.55;color:var(--mut);max-width:56ch}
.kick{font-size:14px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:10px}
.kick::before{content:"";width:10px;height:10px;background:var(--acc);flex:none}
@keyframes up{from{transform:translateY(105%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes zoomin{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.ref{position:absolute;top:10px;left:10px;z-index:2;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink);background:rgba(255,255,255,.85);padding:3px 7px}
.pc-tg{position:absolute;top:10px;right:10px;z-index:2;font-size:11px;font-weight:500;color:#fff;background:rgba(27,27,26,.78);padding:3px 7px}
.pc-tg:empty{display:none}
.spec{border-top:2px solid var(--ink)}
.spec div{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:14px}
.spec dt{color:var(--mut)}
.spec dd{font-weight:500}
.x{width:44px;height:44px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;display:grid;place-items:center}
.x:hover{background:var(--ink);color:#fff}
.chip{border:1.5px solid var(--ln);background:transparent;cursor:pointer;min-height:44px;padding:0 16px;font-size:15px;font-weight:500;border-radius:999px;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* PAGE HEAD */
.crumb{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut);padding-top:20px}
.crumb a{color:var(--mut);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.crumb a:hover{color:var(--ink)}
.ph{padding-bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px 48px;flex-wrap:wrap}
.ph h1 span{display:block;overflow:hidden}
.ph h1 span span{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
.ph p{animation:rise .8s .3s both}

/* LINE TILES */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tl{border:0;padding:0;cursor:pointer;background:none;text-align:left;display:flex;flex-direction:column;animation:rise .6s both}
.tl:nth-child(2){animation-delay:.05s}.tl:nth-child(3){animation-delay:.1s}.tl:nth-child(4){animation-delay:.15s}.tl:nth-child(5){animation-delay:.2s}.tl:nth-child(6){animation-delay:.25s}
.tl .pl{height:132px;background:var(--plate);transition:background .25s}
.tl:hover .pl img{transform:translateY(-4px) scale(1.05)}
.tl-t{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:10px 12px;background:var(--paper);transition:background .25s,color .25s}
.tl-t b{font-family:'Barlow Condensed',sans-serif;font-size:22px;text-transform:uppercase;line-height:1}
.tl-t small{font-size:12px;color:var(--mut);white-space:nowrap}
.tl.on .tl-t{background:var(--ink);color:#fff}
.tl.on .tl-t small{color:#D4D2CC}
.tl.on .pl{background:#fff}
.tl-all .pl{display:grid;place-items:center;background:var(--ink);color:#fff}
.tl-all .pl::before{display:none}
.tl-all .pl span{font-family:'Barlow Condensed',sans-serif;font-size:56px;font-weight:700;line-height:1}
.tl-all.on .pl{background:var(--acc)}

/* BANNER */
.ban{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);margin-top:28px;animation:fade .5s both}
.ban-ph{position:relative;height:400px;overflow:hidden;background:var(--ink)}
.ban-ph img{width:100%;height:100%;object-fit:cover;animation:zoomin .9s cubic-bezier(.2,.8,.2,1) both}
.ban-ph figcaption{position:absolute;left:14px;bottom:14px;background:rgba(27,27,26,.82);color:#fff;font-size:12px;padding:4px 8px}
.ban-r{background:var(--ink);color:#fff;padding:40px 40px 36px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;position:relative;overflow:hidden}
.ban-r h2{font-size:clamp(52px,6vw,96px)}
.ban-r p{color:#C9C7C1;margin-top:12px;font-size:16px}
.ban-r .spec{border-color:#fff}
.ban-r .spec div{border-color:var(--lnd)}
.ban-r .spec dt{color:#A3A19B}
.ban-pk{position:absolute;right:-30px;top:20px;width:240px;height:150px;opacity:.95}
.ban-pk img{width:100%;height:100%;object-fit:contain}

/* TOOLBAR */
.mods{background:var(--paper);padding:56px 0 80px;margin-top:56px}
.tool{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:2px solid var(--ink);position:sticky;top:77px;z-index:20;background:var(--paper);padding-top:16px}
.srch{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);min-height:48px;padding:0 14px;min-width:280px;flex:0 1 340px}
.srch input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:16px;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vt{display:flex;border:1.5px solid var(--ink)}
.vt button{border:0;background:transparent;cursor:pointer;width:46px;height:44px;display:grid;place-items:center}
.vt button.on{background:var(--ink);color:#fff}
.cnt{font-size:14px;color:var(--mut);margin:18px 0 0}
.mb{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start;margin-top:8px}
.mb.qvon{grid-template-columns:minmax(0,1fr) 360px}
.grp{padding-top:36px}
.grp-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 32px;flex-wrap:wrap;margin-bottom:18px}
.grp-h h2{font-size:clamp(40px,4vw,60px);display:flex;align-items:baseline;gap:14px}
.grp-h h2 small{font-family:'Barlow',sans-serif;font-size:15px;font-weight:500;text-transform:none;color:var(--mut);letter-spacing:0}
.grp-h ul{display:flex;flex-wrap:wrap;gap:6px}
.grp-h li{font-size:13px;background:var(--sand);padding:5px 10px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:28px 14px}
.qvon .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1380px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.pc{display:flex;flex-direction:column;animation:rise .45s both}
.pc-pl{display:block;width:100%;border:0;padding:0;cursor:pointer;height:176px;text-align:left}
.pc-pl:hover img{transform:scale(1.06)}
.pc.on .pc-pl{box-shadow:inset 0 0 0 3px var(--acc)}
.pc-b{padding-top:12px;display:flex;flex-direction:column;gap:5px;flex:1}
.pc-n{font-size:22px;line-height:.95}
.pc-d{font-size:13.5px;color:var(--mut);line-height:1.4}
.pc-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--plate)}
.tmp{font-size:12.5px;font-weight:600}
.pc-a{font-size:14px;font-weight:600;color:var(--ink);min-height:40px;display:inline-flex;align-items:center;text-underline-offset:4px}
.pc-a:hover{color:var(--acc)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--ln)}
.lr{display:grid;grid-template-columns:150px 70px minmax(0,1.1fr) minmax(0,1.6fr) 150px auto;gap:20px;align-items:center;border-bottom:1px solid var(--ln);padding:10px 0;animation:fade .35s both;transition:background .2s}
.lr:hover{background:var(--sand)}
.lr .pl{height:92px}
.lr-r{font-size:13px;font-weight:600;color:var(--mut)}
.lr-n{font-size:24px}
.lr-d{font-size:14px;color:var(--mut)}
.lr-a{display:flex;gap:8px}
.lr-a button,.lr-a a{min-height:44px;padding:0 14px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.lr-a button:hover,.lr-a a:hover{background:var(--ink);color:#fff}
.empty{background:var(--sand);padding:40px;margin-top:36px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.qv{position:sticky;top:180px;background:var(--sand);padding:22px;animation:slidein .45s cubic-bezier(.2,.8,.2,1) both;margin-top:36px}
.qv-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.qv-h span{font-size:13px;font-weight:600;color:var(--mut)}
.qv .pl{height:220px;background:#fff}
.qv h3{font-size:34px;margin-top:4px}
.qv-l{font-size:13px;font-weight:600;color:var(--acc);margin-top:16px}
.qv-d{color:var(--mut);font-size:15px;margin:8px 0 16px}
.qv-p{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
.qv-p b{font-family:'Barlow Condensed',sans-serif;font-size:30px}
.qv-p small{font-size:13px;color:var(--mut)}
.qv-a{display:grid;gap:8px;margin-top:16px}

/* COMPARATOR */
.cmp{padding:80px 0;background:var(--sand)}
.cmp-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 48px;flex-wrap:wrap;margin-bottom:24px}
.cmp-h p{max-width:46ch;color:var(--mut)}
.cmp-t{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.cmp-t span{font-size:14px;color:var(--mut);margin-right:6px}
.cmp-sc{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cmp-g{display:grid;min-width:720px;background:var(--paper)}
.cmp-c{padding:14px 16px;border-bottom:1px solid var(--plate);font-size:15px;border-left:1px solid var(--plate);transition:background .2s}
.cmp-c.lab{border-left:0;font-weight:600;font-size:14px;color:var(--mut);background:var(--sand)}
.cmp-c.hd2{background:var(--ink);color:#fff;border-left-color:var(--lnd);padding:0}
.cmp-c.hd2.lab{background:var(--sand)}
.cmp-c.hl{background:#FBEDEB}
.cmp-c.hd2.hl{background:var(--acc)}
.cmp-hc{display:flex;flex-direction:column}
.cmp-hc .pl{height:120px;background:#ECEAE5}
.cmp-hc b{font-family:'Barlow Condensed',sans-serif;font-size:30px;text-transform:uppercase;line-height:1;padding:12px 16px 14px}
.cmp-row:hover .cmp-c{background:#F6F5F2}
.cmp-row:hover .cmp-c.lab{background:var(--plate)}
.cmp-row{display:contents}
.cmp-c .mk{font-size:.85em}

/* CTA */
.cta{background:var(--acc);color:#fff;padding:64px 0}
.cta .w{display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap}
.cta h2{font-size:clamp(40px,4.6vw,72px);max-width:16ch}
.cta p{color:#FFE4E0;margin-top:12px;max-width:52ch}
.cta-a{display:flex;gap:10px;flex-wrap:wrap}

@media (max-width:1240px){
  .nav,.tel{display:none}
  .burger{display:inline-flex}
  .mega{display:none}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid,.qvon .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mb.qvon{grid-template-columns:1fr}
  .qv{position:relative;top:0;order:-1}
  .ban{grid-template-columns:1fr}
