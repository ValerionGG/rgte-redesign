<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RGTE Catalogue — Module Gourmandise</title>
<script src="../vendor/preact.min.js"></script>
<script src="../dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#EFEDE8}
sc-for,sc-if{display:contents}
.k{--acc:#D42A20;--acc-d:#B2221A;--ink:#1B1B1A;--ink2:#262624;--sand:#EFEDE8;--plate:#E4E1DA;--plate2:#DAD6CD;--paper:#FFFFFF;--mut:#5F5D58;--ln:#CFCBC2;--lnd:#3B3B38;font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.55;color:var(--ink);background:var(--sand);overflow-x:clip;-webkit-font-smoothing:antialiased}
.k *,.k *::before,.k *::after{box-sizing:border-box}
.k img{display:block;max-width:100%}
.k h1,.k h2,.k h3,.k h4,.k p,.k ul,.k ol,.k dl,.k dd,.k dt,.k figure{margin:0;padding:0}
.k ul{list-style:none}
:where(.k) button,:where(.k) input,:where(.k) select,:where(.k) textarea{font:inherit;color:inherit}
.k :focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.w{max-width:1400px;margin:0 auto;padding:0 40px}
.cd{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;line-height:.9;letter-spacing:-.005em}
.tn{font-variant-numeric:tabular-nums}
.mk{background:#F7DCD8;color:#981C15;padding:0 4px;font-weight:600;font-size:.9em;white-space:nowrap}
.tb{background:var(--ink);color:#BDBBB5;font-size:13px}
.tb .w{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:40px}
.tb a{color:#fff;text-decoration:none;min-height:40px;display:inline-flex;align-items:center;gap:8px}
.tb a:hover{text-decoration:underline;text-underline-offset:3px}
.tb-l,.tb-r{display:flex;gap:22px;align-items:center}
.hd{position:sticky;top:0;z-index:80;background:rgba(239,237,232,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.hd-in{display:flex;align-items:center;gap:28px;min-height:76px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-height:44px;flex:none}
.logo-w{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:42px;line-height:.78;letter-spacing:-.02em;display:flex;align-items:flex-end;gap:3px}
.logo-w i{width:9px;height:9px;background:var(--acc);display:block;margin-bottom:1px}
.logo-s{font-size:11px;line-height:1.25;font-weight:600;letter-spacing:.04em;color:var(--mut);border-left:1px solid var(--ln);padding-left:12px}
.nav{display:flex;align-items:stretch}
.nav a,.nav button{display:inline-flex;align-items:center;gap:6px;min-height:76px;padding:0 13px;background:none;border:0;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;letter-spacing:.02em;text-transform:uppercase;text-decoration:none;color:var(--ink);position:relative;white-space:nowrap}
.nav a::after,.nav button::after{content:"";position:absolute;left:13px;right:13px;bottom:-1px;height:3px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav a:hover::after,.nav button:hover::after,.nav .on::after{transform:scaleX(1)}
.nav .on::after{background:var(--ink)}
.nav button svg{transition:transform .25s}
.nav button[aria-expanded="true"] svg{transform:rotate(180deg)}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:20px}
.tel{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-height:44px}
.tel-i{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.tel b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1;white-space:nowrap}
.tel small{display:block;font-size:12px;color:var(--mut);line-height:1.2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border:0;border-radius:0;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;letter-spacing:.03em;text-transform:uppercase;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.btn-r{background:var(--acc);color:#fff}.btn-r:hover{background:var(--acc-d)}
.btn-k{background:var(--ink);color:#fff}.btn-k:hover{background:#000}
.btn-o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}.btn-o:hover{background:var(--ink);color:#fff}
.btn-w{background:#fff;color:var(--ink)}.btn-w:hover{background:var(--sand)}
.btn-ow{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.65)}.btn-ow:hover{background:#fff;color:var(--ink)}
.burger{display:none;width:48px;height:48px;border:1.5px solid var(--ink);background:transparent;align-items:center;justify-content:center;cursor:pointer}
.mega{position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:1px solid var(--ln);box-shadow:0 40px 60px -40px rgba(0,0,0,.35);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .22s,transform .22s,visibility .22s}
.mega.on{opacity:1;visibility:visible;transform:none}
.mega-g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.25fr);gap:14px;padding-top:26px;padding-bottom:30px}
.mg{display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.mg-pl{position:relative;background:var(--sand);height:150px;overflow:hidden}
.mg-pl img{position:absolute;left:8%;bottom:12%;width:84%;height:74%;object-fit:contain;object-position:50% 100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.mg:hover .mg-pl img{transform:scale(1.06)}
.mg-n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;text-transform:uppercase;line-height:1;margin-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.mg-n small{font-family:'Barlow',sans-serif;font-size:13px;font-weight:500;color:var(--mut);text-transform:none}
.mg-m{font-size:14px;color:var(--mut);margin-top:6px;line-height:1.45}
.mg-x{position:relative;background:var(--ink);color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;text-decoration:none;min-height:200px}
.mg-x img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;transition:transform .6s}
.mg-x:hover img{transform:scale(1.05)}
.mg-x b,.mg-x span{position:relative}
.mg-x b{font-family:'Barlow Condensed',sans-serif;font-size:28px;line-height:.95;text-transform:uppercase}
.mg-x span{font-size:14px;margin-top:6px}
.mnav{display:none;border-top:1px solid var(--ln);background:var(--paper);padding:8px 0 20px}
.mnav.on{display:block}
.mnav a{display:flex;justify-content:space-between;align-items:center;min-height:54px;border-bottom:1px solid var(--plate);text-decoration:none;color:var(--ink);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;text-transform:uppercase}
.mnav .btn{margin-top:16px;width:100%}
.ft{background:var(--ink);color:#C9C7C1;padding:56px 0 28px;font-size:15px}
.ft a{color:#fff;text-decoration:none}
.ft a:hover{text-decoration:underline;text-underline-offset:3px}
.ft-top{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;padding-bottom:48px;border-bottom:1px solid var(--lnd)}
.ft-big{font-size:clamp(44px,6vw,92px);color:#fff;max-width:11ch}
.ft-cta{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.ft-tel{font-family:'Barlow Condensed',sans-serif;font-size:44px;font-weight:700;line-height:1;color:#fff;text-decoration:none;display:inline-flex;align-items:center;min-height:48px}
.ft-g{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;padding:44px 0}
.ft-g h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff;margin-bottom:12px}
.ft-g li a{display:inline-flex;min-height:34px;align-items:center;color:#C9C7C1}
.ft-g li a:hover{color:#fff}
.ft-b{border-top:1px solid var(--lnd);padding-top:20px;display:flex;justify-content:space-between;gap:12px 28px;flex-wrap:wrap;font-size:13px;color:#A3A19B}
.ft-b strong{color:#fff;font-weight:600}
.ft .logo{color:#fff}
.ft .logo-s{color:#A3A19B;border-color:var(--lnd)}
.pl{display:block;position:relative;background:var(--plate);overflow:hidden}
.pl::before{content:"";position:absolute;left:14%;right:14%;bottom:9%;height:22px;background:radial-gradient(closest-side,rgba(40,30,20,.32),rgba(40,30,20,0));filter:blur(3px)}
.pl img{position:absolute;left:7%;bottom:12%;width:86%;height:72%;object-fit:contain;object-position:50% 100%;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.pl.ph::before{display:none}
.pl.ph img{left:0;bottom:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.h-l{font-size:clamp(44px,5.6vw,84px)}
.lead{font-size:clamp(17px,1.35vw,19px);line-height:1.55;color:var(--mut);max-width:56ch}
@keyframes up{from{transform:translateY(105%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes zoomin{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:none}}
.spec{border-top:2px solid var(--ink)}
.spec div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;padding:11px 0;border-bottom:1px solid var(--ln);font-size:15px}
.spec dt{color:var(--mut)}
.spec dd{font-weight:500}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 48px;flex-wrap:wrap;margin-bottom:28px}
.sec-h p{max-width:46ch;color:var(--mut)}

/* PRODUCT HERO */
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mut);padding-top:16px}
.crumb a{color:var(--mut);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.crumb a:hover{color:var(--ink)}
.pd{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:start;padding-bottom:72px}
.gal{position:sticky;top:96px}
.stage{position:relative;height:560px;background:#E9E7E2;overflow:hidden}
.stage-n{position:absolute;left:0;right:0;top:34px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(56px,8.6vw,124px);line-height:.8;color:#DCD8D0;letter-spacing:-.01em;white-space:nowrap;animation:up 1s cubic-bezier(.2,.8,.2,1) both}
.stage .pl{position:absolute;inset:0;background:transparent}
.stage .pl::before{left:18%;right:18%;bottom:12%;height:34px}
.stage .pl img{left:6%;bottom:15%;width:88%;height:66%;animation:zoomin .7s cubic-bezier(.2,.8,.2,1) both}
.stage .pl.ph img{animation:zoomin .7s both}
.stage-cap{position:absolute;left:18px;bottom:16px;z-index:3;font-size:13px;font-weight:600;background:rgba(255,255,255,.9);padding:5px 10px}
.stage-ref{position:absolute;right:18px;top:16px;z-index:3;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--ink)}
.stage-ar{position:absolute;right:18px;bottom:14px;z-index:3;display:flex;gap:6px}
.stage-ar button{width:48px;height:48px;border:0;background:var(--ink);color:#fff;cursor:pointer;display:grid;place-items:center;transition:background .2s}
.stage-ar button:hover{background:var(--acc)}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.th{border:0;padding:0;cursor:pointer;background:none;text-align:left}
.th .pl{height:96px;background:#E9E7E2;box-shadow:inset 0 0 0 0 var(--acc);transition:box-shadow .2s}
.th .pl::before{display:none}
.th .pl img{bottom:8%;height:80%}
.th small{display:block;font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.3}
.th.on .pl{box-shadow:inset 0 0 0 3px var(--acc)}
.th.on small{color:var(--ink);font-weight:600}

.cfg{background:var(--paper);padding:30px 30px 28px}
.cfg-l{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.cfg-l a{color:var(--acc);text-decoration:none}
.cfg h1{font-size:clamp(56px,6vw,92px);margin-top:10px}
.cfg-d{color:var(--mut);margin-top:12px;font-size:16px}
.ben{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:20px}
.ben div{background:var(--sand);padding:12px 10px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;line-height:1.3;font-weight:500}
.opt{margin-top:24px}
.opt-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.opt-h b{font-family:'Barlow Condensed',sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.opt-h span{font-size:14px;color:var(--mut)}
.lens{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ln{min-height:52px;border:1.5px solid var(--ln);background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;line-height:1;transition:all .2s}
.ln small{font-family:'Barlow',sans-serif;font-size:11px;font-weight:500;color:var(--mut)}
.ln:hover{border-color:var(--ink)}
.ln.on{background:var(--ink);border-color:var(--ink);color:#fff;animation:pop .3s}
.ln.on small{color:#D4D2CC}
.ln.sm{font-size:15px}
.temps{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tp{min-height:64px;border:1.5px solid var(--ln);background:transparent;cursor:pointer;display:flex;align-items:center;gap:12px;padding:0 14px;text-align:left;transition:all .2s}
.tp b{font-family:'Barlow Condensed',sans-serif;font-size:24px;line-height:1;display:block}
.tp small{font-size:13px;color:var(--mut);display:block}
.tp:hover{border-color:var(--ink)}
.tp.on{border-color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.tp i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ln);flex:none}
.tp.on i{background:var(--acc);border-color:var(--acc)}
.fins{display:flex;gap:10px;flex-wrap:wrap}
.fn{border:0;background:none;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px}
.fn span{width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 1px var(--ln);transition:box-shadow .2s}
.fn small{font-size:12px;color:var(--mut);max-width:80px;text-align:center;line-height:1.2}
.fn.on span{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.fn.on small{color:var(--ink);font-weight:600}
.sum{margin-top:24px;background:var(--ink);color:#fff;padding:20px 22px}
.sum-r{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sum-c{font-size:14px;color:#C9C7C1;line-height:1.5}
.sum-c b{color:#fff;font-weight:600}
.sum-p{text-align:right}
.sum-p b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:44px;line-height:1;animation:pop .35s}
.sum-p small{font-size:12.5px;color:#C9C7C1}
.sum-a{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:16px}

/* TABS */
.tabs-s{background:var(--paper);padding:72px 0}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--ln);margin-bottom:36px;overflow-x:auto}
.tab{border:0;background:none;cursor:pointer;min-height:60px;padding:0 24px 0 0;margin-right:24px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(24px,2.6vw,36px);text-transform:uppercase;color:#A8A49C;position:relative;white-space:nowrap;transition:color .2s}
.tab::after{content:"";position:absolute;left:0;right:24px;bottom:-1px;height:4px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{transform:scaleX(1)}
.tp-p{animation:fade .4s both}
.desc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.desc p{font-size:18px;line-height:1.6;color:var(--ink);max-width:54ch}
.desc p+p{margin-top:14px;color:var(--mut);font-size:16px}
.desc figure{height:400px;overflow:hidden}
.desc figure img{width:100%;height:100%;object-fit:cover}
.carac{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 48px}
.dims{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:48px;align-items:start}
.plan{background:var(--sand);padding:20px}
.plan svg{width:100%;height:auto;display:block}
.dt{width:100%;border-collapse:collapse;font-size:15px}
.dt-r{display:grid;grid-template-columns:90px 1fr 1fr;gap:12px;padding:12px 8px;border-bottom:1px solid var(--ln);align-items:center}
.dt-r.h{font-size:13px;color:var(--mut);border-bottom:2px solid var(--ink)}
.dt-r.on{background:#FBEDEB}
.dt-r b{font-family:'Barlow Condensed',sans-serif;font-size:22px}

/* SEEN IN */
.seen{padding:72px 0;background:var(--sand)}
.sn-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sn{position:relative;height:340px;overflow:hidden;color:#fff;text-decoration:none;background:var(--ink)}
.sn img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.sn:hover img{transform:scale(1.06)}
.sn::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(15,15,14,.88),rgba(15,15,14,0) 60%)}
.sn div{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.sn small{font-size:13px;color:#E4E2DC}
.sn b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:28px;text-transform:uppercase;line-height:.95;margin:4px 0 8px}
.sn span{font-size:12.5px;color:#E4E2DC;display:block}

/* FORM */
.ask{background:var(--ink);color:#fff;padding:80px 0}
.ask-g{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px;align-items:start}
.ask h2{font-size:clamp(44px,5vw,76px)}
.ask-i p{color:#C9C7C1;margin-top:14px;max-width:40ch}
.ask-i a{color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:700;text-decoration:none;display:inline-flex;margin-top:20px;min-height:48px;align-items:center}
.ask-i .pkm{margin-top:28px;height:200px;background:#ECEAE5}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:16px 16px}
.fd{display:flex;flex-direction:column;gap:6px}
.fd.full{grid-column:1/-1}
.fd label{font-size:13px;font-weight:600;color:#D4D2CC}
.fd input,.fd select,.fd textarea{background:#262624;border:1.5px solid #4A4A46;color:#fff;min-height:50px;padding:0 14px;font-size:16px;border-radius:0;transition:border-color .2s;width:100%}
.fd textarea{min-height:120px;padding:12px 14px;resize:vertical}
.fd input:focus,.fd select:focus,.fd textarea:focus{border-color:#fff;outline:0}
.fd input[readonly]{color:#C9C7C1}
.fd.err input,.fd.err textarea{border-color:#FF6B5E}
.fd em{font-style:normal;font-size:13px;color:#FF9F95;min-height:0}
.fm-f{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px}
.fm-f small{font-size:13px;color:#A3A19B}
.ok{background:#fff;color:var(--ink);padding:36px;animation:rise .5s both}
.ok h3{font-size:44px}
.ok p{color:var(--mut);margin-top:10px}
.ok .tag{display:inline-block;margin-top:16px;background:#F7DCD8;color:#981C15;font-weight:600;font-size:14px;padding:4px 10px}
.ok dl{margin-top:20px}

/* RELATED */
.rel{padding:72px 0;background:var(--paper)}
.rl-g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.rl{text-decoration:none;color:var(--ink);display:flex;flex-direction:column}
.rl .pl{height:200px}
.rl:hover .pl img{transform:scale(1.06)}
.rl small{font-size:13px;color:var(--acc);font-weight:600;margin-top:12px}
.rl b{font-family:'Barlow Condensed',sans-serif;font-size:24px;text-transform:uppercase;line-height:1;margin-top:4px}
.rl span{font-size:13px;color:var(--mut);margin-top:4px}

@media (max-width:1240px){
  .nav,.tel{display:none}
  .burger{display:inline-flex}
  .mega{display:none}
  .pd{grid-template-columns:1fr}
  .gal{position:relative;top:0}
  .desc,.carac,.dims,.ask-g{grid-template-columns:1fr}
  .sn-g{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rl-g{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ft-g{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .w{padding:0 18px}
  .tb-l .hide-s,.tb-r .hide-s{display:none}
  .hd-r .btn{display:none}
  .logo-w{font-size:36px}
  .stage{height:340px}
  .stage-n{font-size:58px;top:58px}
  .tab{font-size:21px;padding-right:12px;margin-right:12px}
  .tab::after{right:12px}
  .thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}
  .th .pl{height:64px}
  .th small{display:none}
  .cfg{padding:22px 16px}
  .ben{grid-template-columns:1fr 1fr}
  .lens{grid-template-columns:repeat(4,minmax(0,1fr))}
  .temps{grid-template-columns:1fr}
  .sum-a{grid-template-columns:1fr}
  .sum-p{text-align:left}
  .tabs-s,.seen,.rel{padding:52px 0}
  .ask{padding:56px 0}
  .desc figure{height:240px}
  .sn{height:240px}
  .sn-g{grid-template-columns:1fr}
  .fm{grid-template-columns:1fr}
  .rl-g{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rl .pl{height:140px}
  .ok{padding:24px 18px}
  .ft-g{grid-template-columns:1fr}
  .ft-tel{font-size:36px}
  .dt-r{grid-template-columns:70px 1fr 1fr}
}
@media (prefers-reduced-motion:reduce){.k *{animation:none !important;transition:none !important}}
</style>

<main>

  <section class="pd">
    <div class="gal">
      <div class="stage">
        <span class="stage-n" aria-hidden="true">Gourmandise</span>
        <div class="pl {{ view.plCls }}" key="{{ view.key }}"><img src="{{ view.src }}" alt="{{ view.alt }}"></div>
        <span class="stage-ref">ST-06</span>
        <span class="stage-cap">{{ view.cap }}</span>
        <div class="stage-ar">
          <button type="button" aria-label="Vue précédente" onClick="{{ prevView }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Vue suivante" onClick="{{ nextView }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
        </div>
      </div>
      <div class="thumbs" role="tablist" aria-label="Vues du module">
        <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="4">
          <button type="button" role="tab" class="{{ t.cls }}" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}"><span class="pl {{ t.plCls }}"><img src="{{ t.src }}" alt="{{ t.alt }}"></span><small>{{ t.cap }}</small></button>
        </sc-for>
      </div>
    </div>

    <div class="cfg">
      <p class="cfg-l"><a href="Catalogue-Lignes.html">Ligne Stone</a><span class="tn">Réf. ST-06</span></p>
      <h1 class="cd">Gourmandise</h1>
      <p class="cfg-d">Vitrine réfrigérée à exposition centrale, à hauteur du plan de travail, avec vitrages coulissants des 2 côtés. Pour pâtisseries, macarons ou chocolats. Profondeur d'exposition 60 cm.</p>
      <div class="ben">
        <div><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 2v20M4 6l16 12M20 6 4 18"></path></svg>Froid ventilé</div>
        <div><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="18" height="12"></rect><path d="M12 6v12M8 12h-3M16 12h3"></path></svg>Vitrages coulissants des 2 côtés</div>
        <div><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10 4a2 2 0 1 1 4 0v10a4 4 0 1 1-4 0z"></path><path d="M12 9v7"></path></svg>Contrôle électronique</div>
        <div><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5l2-2v6h-6l2-2a5 5 0 1 0 1 6"></path></svg>Dégivrage automatique</div>
      </div>

      <div class="opt">
        <div class="opt-h"><b>Longueur</b><span class="tn">{{ lenTxt }}</span></div>
        <div class="lens" role="radiogroup" aria-label="Longueur">
          <sc-for list="{{ lens }}" as="l" hint-placeholder-count="7">
            <button type="button" role="radio" class="{{ l.cls }}" aria-checked="{{ l.sel }}" onClick="{{ l.pick }}">{{ l.v }}<small>{{ l.u }}</small></button>
          </sc-for>
        </div>
      </div>
      <div class="opt">
        <div class="opt-h"><b>Température</b><span>{{ tempTxt }}</span></div>
        <div class="temps" role="radiogroup" aria-label="Plage de température">
          <sc-for list="{{ temps }}" as="t" hint-placeholder-count="2">
            <button type="button" role="radio" class="{{ t.cls }}" aria-checked="{{ t.sel }}" onClick="{{ t.pick }}"><i></i><span><b class="tn">{{ t.v }}</b><small>{{ t.u }}</small></span></button>
          </sc-for>
        </div>
      </div>
      <div class="opt">
        <div class="opt-h"><b>Finition</b><span>{{ finTxt }}</span></div>

        </div>
      </div>

<section class="tabs-s">

      </sc-for>
    </div>
    <sc-if value="{{ tabDesc }}" hint-placeholder-val="{{ true }}">
      <div class="tp-p desc">
        <div>
          <p>La Gourmandise met vos pâtisseries, macarons ou chocolats au centre de la boutique : exposition centrale à hauteur du plan de travail, accessible des deux côtés grâce aux vitrages coulissants.</p>
          <p>Piliers et plan de travail en pierre acrylique blanche, montée sur pied en pierre acrylique blanche. Groupe logé, froid ventilé, deux plages de température au choix : +2 °C/+8 °C pour la pâtisserie, +14 °C/+18 °C pour le chocolat. Six longueurs de 101 à 222 cm, ou sur mesure.</p>
        </div>
        <figure><img src="../assets/photos/produits/stone-gourmandise-photo.webp" alt="Photo réelle de la vitrine Gourmandise exposant des chocolats" loading="lazy"></figure>
      </div>
    </sc-if>
    <sc-if value="{{ tabCarac }}" hint-placeholder-val="{{ false }}">
      <div class="tp-p carac">
        <dl class="spec">
          <div><dt>Exposition</dt><dd>Centrale, à hauteur du plan de travail</dd></div>
          <div><dt>Vitrages</dt><dd>Coulissants des 2 côtés</dd></div>
          <div><dt>Produits</dt><dd>Pâtisseries, macarons ou chocolats</dd></div>
          <div><dt>Profondeur d'exposition</dt><dd>60 cm</dd></div>
          <div><dt>Températures</dt><dd>+2 °C/+8 °C ou +14 °C/+18 °C</dd></div>
          <div><dt>Piliers et plan de travail</dt><dd>Pierre acrylique blanche</dd></div>
          <div><dt>Piètement</dt><dd>Monté sur pied en pierre acrylique blanche</dd></div>
        </dl>
        <dl class="spec">
          <div><dt>Groupe</dt><dd>Logé</dd></div>
          <div><dt>Froid</dt><dd>Ventilé</dd></div>
          <div><dt>Fluide frigorigène</dt><dd>Fréon R134A</dd></div>
          <div><dt>Régulation</dt><dd>Contrôle électronique de la température</dd></div>
          <div><dt>Dégivrage</dt><dd>Automatique</dd></div>
          <div><dt>Eaux de condensation</dt><dd>Ré-évaporation automatique</dd></div>
          <div><dt>Réserve réfrigérée</dt><dd>Sans</dd></div>
        </dl>
      </div>
    </sc-if>
    <sc-if value="{{ tabDims }}" hint-placeholder-val="{{ false }}">
      <div class="tp-p dims">
        <div class="plan">
          <svg viewBox="0 0 640 330" role="img" aria-label="Cotes du modèle {{ lenTxt }}">
            <g fill="none" stroke="#1B1B1A" stroke-width="1.5">
              <rect x="{{ dim.x }}" y="70" width="{{ dim.w }}" height="40" stroke-dasharray="5 4"></rect>
              <rect x="{{ dim.x }}" y="110" width="{{ dim.w }}" height="120" fill="#FFFFFF"></rect>
              <rect x="{{ dim.px }}" y="230" width="{{ dim.pw }}" height="50" fill="#FFFFFF"></rect>
            </g>
            <g stroke="#D42A20" stroke-width="1.2" fill="#D42A20">
              <path d="M{{ dim.x }} 300 H{{ dim.x2 }}"></path>
              <path d="M{{ dim.x }} 292 V308 M{{ dim.x2 }} 292 V308"></path>
              <path d="M{{ dim.xr }} 110 V280 M{{ dim.xr2 }} 110 H{{ dim.xr3 }} M{{ dim.xr2 }} 280 H{{ dim.xr3 }}"></path>
            </g>
            <text x="320" y="322" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="20" font-weight="700" fill="#D42A20">{{ dim.label }}</text>
            <text x="{{ dim.xt }}" y="200" font-family="Barlow Condensed, sans-serif" font-size="18" font-weight="700" fill="#D42A20">80 + 25 h</text>
            <text x="320" y="60" text-anchor="middle" font-family="Barlow, sans-serif" font-size="13" fill="#5F5D58">vitrage coulissant (des 2 côtés)</text>
            <text x="320" y="175" text-anchor="middle" font-family="Barlow, sans-serif" font-size="13" fill="#5F5D58">profondeur 80 cm · exposition prof. 60 cm</text>
          </svg>
          <p style="font-size:13px;color:#5F5D58;margin-top:8px">Vue de face schématique, cotes en cm. Hauteur : 80 + 25 cm (vitrage). Cotes des longueurs autres que 101 cm à confirmer par le bureau d'études.</p>
        </div>
        <div>
          <div class="dt-r h"><span>Longueur</span><span>Dimensions ext.</span><span>Prix HT</span></div>
          <sc-for list="{{ dimRows }}" as="r" hint-placeholder-count="7">
            <div class="{{ r.cls }}"><b class="tn">{{ r.len }}</b><span class="tn">{{ r.dims }}</span><span class="tn">{{ r.price }}</span></div>
          </sc-for>
          <p style="font-size:13px;color:#5F5D58;margin-top:12px">Modèle 101 cm : exposition en verre 81 × 60 cm, sans réserve réfrigérée.</p>
        </div>
      </div>
    </sc-if>
  </div>

      <a href="tel:0800951313">0 800 95 13 13</a>

          <div class="fd"><label for="f-mod">Modèle</label>

            </select>
          </div>
          <div class="{{ e.nomCls }}"><label for="f-nom">Nom *</label><input id="f-nom" type="text" autocomplete="name" value="{{ f.nom }}" onInput="{{ set.nom }}"><em>{{ e.nom }}</em></div>
          <div class="{{ e.telCls }}"><label for="f-tel">Téléphone *</label><input id="f-tel" type="tel" autocomplete="tel" value="{{ f.tel }}" onInput="{{ set.tel }}"><em>{{ e.tel }}</em></div>
          <div class="{{ e.emailCls }}"><label for="f-email">Email *</label><input id="f-email" type="email" autocomplete="email" value="{{ f.email }}" onInput="{{ set.email }}"><em>{{ e.email }}</em></div>
          <div class="fd"><label for="f-sec">Secteur d'activité</label>
            <select id="f-sec" value="{{ f.secteur }}" onChange="{{ set.secteur }}">
              <option value="">Choisir…</option><option>Boulangerie</option><option>Pâtisserie</option><option>Chocolats</option><option>Sandwichs</option><option>Traiteur</option><option>Poissonnerie</option><option>Bar à salades</option><option>Bar à couscous</option><option>Fromagerie</option><option>Bar</option><option>Bar à topping</option><option>Coffee shop / Café</option><option>Pizza al taglio</option>
            </select>
          </div>
          <div class="fd"><label for="f-cp">Code postal</label><input id="f-cp" type="text" inputmode="numeric" autocomplete="postal-code" value="{{ f.cp }}" onInput="{{ set.cp }}"></div>
          <div class="fd"><label for="f-ville">Ville</label><input id="f-ville" type="text" autocomplete="address-level2" value="{{ f.ville }}" onInput="{{ set.ville }}"></div>
          <div class="{{ e.msgCls }}"><label for="f-msg">Message *</label><textarea id="f-msg" value="{{ f.msg }}" onInput="{{ set.msg }}"></textarea><em>{{ e.msg }}</em></div>
          <div class="fm-f"><small>{{ formNote }}</small><button type="submit" class="btn btn-r">Envoyer ma demande</button></div>
        </form>
      </sc-if>
      <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
        <div class="ok" role="status">
          <h3 class="cd">Demande prête, {{ f.nom }}.</h3>
          <p>{{ okText }}</p>
          <span class="tag">{{ sendNote }}</span>
          <dl class="spec" style="margin-top:20px">
            <div><dt>Produit</dt><dd>Gourmandise — {{ lenTxt }}</dd></div>
            <div><dt>Configuration</dt><dd>{{ tempTxt }} — {{ finTxt }}</dd></div>
            <div><dt>Contact</dt><dd>{{ f.tel }} — {{ f.email }}</dd></div>
          </dl>
          <button type="button" class="btn btn-o" style="margin-top:20px" onClick="{{ resetForm }}">Modifier ma demande</button>
        </div>
      </sc-if>
    </div>
  </div>
</section>

      <a class="btn btn-k" href="Catalogue-Lignes.html">Toute la ligne Stone</a>
