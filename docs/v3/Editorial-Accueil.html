<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RGTE — Accueil</title>
<script src="../vendor/preact.min.js"></script>
<script src="../dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@200;300;400;600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#F4F4F2}
sc-for,sc-if{display:contents}
.ed{--red:#D42A20;--red-d:#B3221A;--ink:#1E1E1E;--paper:#F4F4F2;--stone:#E2E0DB;--studio:#ECEBE8;--graph:#262523;--mute:#5C5A56;--line:#D3D0CA;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:17px;line-height:1.6;color:var(--ink);background:var(--paper);overflow-x:clip;-webkit-font-smoothing:antialiased}
.ed *,.ed *::before,.ed *::after{box-sizing:border-box}
.ed img{display:block;max-width:100%}
.ed h1,.ed h2,.ed h3,.ed h4,.ed p,.ed ul,.ed figure{margin:0}
.ed ul{padding:0;list-style:none}
.ed button{font-family:inherit}
.ed :focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px}
.h2{font-family:'Urbanist',sans-serif;font-weight:200;font-size:clamp(40px,5.2vw,80px);line-height:.98;letter-spacing:-.035em;overflow-wrap:anywhere}
.h3{font-family:'Urbanist',sans-serif;font-weight:300;font-size:clamp(26px,2.4vw,34px);line-height:1.08;letter-spacing:-.02em}
.lead{font-size:clamp(17px,1.3vw,19px);color:var(--mute);max-width:56ch}
.idx{display:flex;align-items:center;gap:14px;font-size:15px;color:var(--red);font-weight:500}
.idx::before{content:'';width:32px;height:1px;background:var(--red)}
/* top + header */
.top{background:var(--graph);color:#D9D7D2;font-size:13px}
.top-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:38px}
.top a{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.top a:hover{text-decoration:underline;text-underline-offset:3px}
.hdr{position:sticky;top:0;z-index:60;background:rgba(244,244,242,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:28px;min-height:78px}
.logo{display:inline-flex;align-items:baseline;gap:12px;text-decoration:none;color:var(--ink);min-height:44px;align-items:center}
.logo b{font-family:'Urbanist',sans-serif;font-weight:700;font-size:30px;letter-spacing:.04em;color:var(--red);line-height:1}
.logo span{font-size:12.5px;line-height:1.15;color:var(--mute);border-left:1px solid var(--line);padding-left:12px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 13px;text-decoration:none;font-size:15.5px;font-weight:500;color:var(--ink)}
.nav a::after{content:'';position:absolute;left:13px;right:13px;bottom:8px;height:1px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.tel{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-height:44px}
.tel svg{color:var(--red);flex:none}
.tel b{display:block;font-size:16px;font-weight:600;letter-spacing:.02em;line-height:1.1}
.tel small{display:block;font-size:12px;color:var(--mute);line-height:1.2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 26px;border:0;border-radius:0;font:500 16px/1.1 'Hanken Grotesk',sans-serif;text-decoration:none;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s;white-space:nowrap}
.btn svg{flex:none;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.btn:hover svg{transform:translateX(4px)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-d)}
.btn-ink{background:var(--ink);color:#fff}.btn-ink:hover{background:#000}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.btn-line:hover{background:var(--ink);color:#fff}
.btn-wline{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}.btn-wline:hover{background:#fff;color:var(--ink)}
.btn-white{background:#fff;color:var(--ink)}.btn-white:hover{background:var(--ink);color:#fff}
.btn-sm{min-height:46px;padding:0 20px;font-size:15px}
.burger{display:none;width:46px;height:46px;border:1px solid var(--line);background:transparent;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);margin-left:auto}
.mnav{display:none}
.mnav a{display:flex;align-items:center;justify-content:space-between;min-height:54px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-family:'Urbanist',sans-serif;font-size:24px;font-weight:300}
.tlink{display:inline-flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;color:var(--ink);font-weight:500;background:linear-gradient(currentColor,currentColor) 0 calc(100% - 8px)/100% 1px no-repeat;transition:background-size .35s}
.tlink:hover{background-size:0 1px;background-position:100% calc(100% - 8px)}
/* footer */
.ftr{background:var(--graph);color:#CFCDC8;padding:60px 0 20px}
.ftr .ftr-big{font-family:'Urbanist',sans-serif;font-weight:200;font-size:clamp(64px,10vw,150px);line-height:.8;letter-spacing:-.05em;color:#fff;margin-bottom:44px}
.ftr-big span{color:var(--red)}
.ftr-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px}
.ftr-h{font-size:14px;color:#A9A7A1;margin-bottom:12px}
.ftr p{font-size:15px;line-height:1.65}
.ftr-l a{display:flex;align-items:center;min-height:38px;color:#fff;text-decoration:none;font-size:15px}
.ftr-l a:hover{color:#F27C73}
.ftr-tel{font-family:'Urbanist',sans-serif;font-size:34px;font-weight:300;color:#fff;text-decoration:none;letter-spacing:.01em}
.ftr-b{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 24px;margin-top:56px;padding-top:14px;border-top:1px solid #3E3D3A;font-size:13px}
.ftr-b a{color:#CFCDC8;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.ftr-b a:hover{color:#fff}
.legal{display:flex;flex-wrap:wrap;gap:0 20px}
@keyframes rise{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes unveil{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.02)}}
@keyframes lift{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
.fade{animation:fade .5s ease both}

/* ===== Accueil ===== */
.hero{position:relative;padding:0 20px 150px}
.hero-ph{position:relative;height:780px;overflow:hidden;background:#2b2a28;animation:unveil 1.1s cubic-bezier(.7,0,.2,1) both}
.hero-ph img{width:100%;height:100%;object-fit:cover;object-position:50% 60%;animation:kb 6s cubic-bezier(.2,.7,.2,1) both}
.hero-ph::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(24,23,21,.78) 0%,rgba(24,23,21,.5) 38%,rgba(24,23,21,0) 70%),linear-gradient(0deg,rgba(24,23,21,.55) 0%,rgba(24,23,21,0) 40%)}
.hero-txt{position:absolute;left:0;right:0;top:0;bottom:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:200px;color:#fff}
.hero-txt .wrap{width:100%}
.hero-k{font-size:15px;color:#E8E6E1;max-width:42ch;animation:rise .9s .5s cubic-bezier(.2,.7,.2,1) both}
.hero h1{font-family:'Urbanist',sans-serif;font-weight:200;font-size:clamp(50px,9vw,140px);line-height:.88;letter-spacing:-.045em;margin-top:22px;max-width:9.5em;overflow-wrap:anywhere}
.hero h1 span{display:block;animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.hero h1 span:nth-child(1){animation-delay:.55s}.hero h1 span:nth-child(2){animation-delay:.68s}.hero h1 span:nth-child(3){animation-delay:.81s}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px;animation:rise .9s 1s cubic-bezier(.2,.7,.2,1) both}
.hero-prod{display:block;position:absolute;z-index:3;right:60px;bottom:30px;width:min(560px,42vw);text-decoration:none;color:var(--ink);background:var(--studio);padding:0 28px 22px;animation:lift 1.2s .9s cubic-bezier(.2,.7,.2,1) both;transition:background .3s}
.hero-prod:hover{background:#E6E4E0}
.hero-prod .pk{position:relative;margin:-150px -8px 0}
.hero-prod .pk img{position:relative;z-index:2;width:100%;aspect-ratio:800/410;object-fit:contain;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.hero-prod:hover .pk img{transform:translateY(-8px)}
.shadow{position:absolute;left:10%;right:10%;bottom:4px;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(30,28,26,.42),rgba(30,28,26,0));filter:blur(4px)}
.hero-prod .cap{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
.hero-prod .cap b{display:block;font-family:'Urbanist',sans-serif;font-weight:300;font-size:30px;line-height:1;letter-spacing:-.02em}
.hero-prod .cap small{display:block;font-size:14px;color:var(--mute);margin-top:6px}
.hero-prod .cap em{font-style:normal;font-size:14px;text-align:right;white-space:nowrap}
.hero-prod .cap em strong{display:block;font-family:'Urbanist',sans-serif;font-weight:400;font-size:22px;color:var(--red)}
.hero-side{position:absolute;left:60px;bottom:40px;z-index:3;display:flex;align-items:center;gap:16px;font-size:14px;color:var(--mute)}
.hero-side a{color:var(--ink)}

.promise{padding:24px 0 80px}
.promise-g{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:80px;align-items:start}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:40px;border-top:1px solid var(--line)}
.facts div{padding:18px 0;border-bottom:1px solid var(--line)}
.facts div:nth-child(odd){padding-right:20px;border-right:1px solid var(--line)}
.facts div:nth-child(even){padding-left:24px}
.facts b{display:block;font-family:'Urbanist',sans-serif;font-weight:300;font-size:40px;line-height:1;letter-spacing:-.03em}
.facts span{font-size:15px;color:var(--mute)}

/* collection */
.coll{padding:0 0 100px}
.coll-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:48px}
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.pc{position:relative;display:flex;flex-direction:column;border:0;padding:0;background:transparent;cursor:pointer;text-align:left;color:var(--ink)}
.pc-v{position:relative;height:230px;background:radial-gradient(ellipse 80% 70% at 50% 35%,#F7F7F5,#ECEBE8 72%);display:flex;align-items:flex-end;justify-content:center;padding:24px 18px 26px;overflow:hidden;transition:background .4s}
.pc-v::after{content:'';position:absolute;left:0;right:0;bottom:0;height:22px;background:#DCD9D3}
.pc-v img{position:relative;z-index:2;max-height:180px;width:100%;object-fit:contain;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.pc-v .shadow{bottom:14px;z-index:1}
.pc:hover .pc-v img{transform:translateY(-10px) scale(1.03)}
.pc-b{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 2px 0;border-top:2px solid transparent;margin-top:10px;transition:border-color .3s}
.pc-b b{font-family:'Urbanist',sans-serif;font-weight:300;font-size:30px;letter-spacing:-.02em;line-height:1}
.pc-b span{font-size:14px;color:var(--mute)}
.pc p{font-size:14.5px;color:var(--mute);margin-top:6px;line-height:1.45;padding:0 2px}
.ldet{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);margin-top:40px;min-height:470px}
.ldet-ph{position:relative;overflow:hidden;background:#ccc}
.ldet-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .7s ease both}
.ldet-ph small{position:absolute;left:16px;bottom:14px;z-index:2;font-size:13px;color:#fff;background:rgba(30,30,30,.6);padding:4px 10px}
.ldet-b{background:var(--stone);padding:52px 48px;display:flex;flex-direction:column;gap:22px;animation:fade .5s ease both}
.ldet-b h3{font-family:'Urbanist',sans-serif;font-weight:200;font-size:clamp(48px,5vw,76px);line-height:.9;letter-spacing:-.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a,.chips span{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;background:rgba(255,255,255,.65);font-size:14px;text-decoration:none;color:var(--ink);transition:background .2s,color .2s}
.chips a:hover{background:var(--ink);color:#fff}

/* secteurs */
.sect{background:var(--graph);color:#fff;padding:100px 0}
.sect-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:start;margin-top:44px}
.slist{display:flex;flex-wrap:wrap;gap:0 4px}
.sbtn{border:0;background:transparent;cursor:pointer;font-family:'Urbanist',sans-serif;font-weight:200;font-size:clamp(28px,3vw,44px);line-height:1.18;letter-spacing:-.03em;padding:2px 10px 2px 0;min-height:44px;text-align:left;transition:color .25s}
.sbtn:hover{color:#fff !important}
.sbtn sup{font-family:'Hanken Grotesk',sans-serif;font-size:13px;letter-spacing:0;margin-left:4px;color:#F27C73;vertical-align:super}
.spanel{position:sticky;top:110px}
.spanel-ph{position:relative;height:340px;overflow:hidden}
.spanel-ph img{width:100%;height:100%;object-fit:cover;animation:fade .6s ease both}
.spanel-ph small{position:absolute;right:12px;top:12px;font-size:12px;background:rgba(30,30,30,.65);color:#fff;padding:3px 9px}
.spanel-b{padding:26px 0 0;animation:fade .5s ease both}
.spanel-row{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;padding:12px 0;border-top:1px solid #45443F;font-size:15px}
.spanel-row span{color:#B9B7B1}
.temp{font-family:'Urbanist',sans-serif;font-weight:300;font-size:44px;line-height:1;letter-spacing:-.03em}

/* process */
.proc{padding:100px 0}
.proc-g{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:64px;margin-top:56px;align-items:stretch}
.step{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:24px 0;border-top:1px solid var(--line);cursor:pointer;color:var(--ink);position:relative}
.step::before{content:'';position:absolute;left:0;top:-1px;height:2px;background:var(--red);width:0;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.step.on::before{width:100%}
.step i{font-style:normal;font-family:'Urbanist',sans-serif;font-weight:300;font-size:28px;line-height:1;color:var(--mute)}
.step.on i{color:var(--red)}
.step b{display:block;font-family:'Urbanist',sans-serif;font-weight:300;font-size:30px;line-height:1.05;letter-spacing:-.02em}
.step p{font-size:15.5px;color:var(--mute);max-height:0;overflow:hidden;opacity:0;transition:max-height .5s,opacity .4s,margin .4s}
.step.on p{max-height:140px;opacity:1;margin-top:10px}
.proc-v{position:relative;min-height:520px;background:var(--studio);overflow:hidden}
.proc-v img{position:absolute;inset:0;width:100%;height:100%;animation:fade .6s ease both}
.proc-v .cover{object-fit:cover}
.proc-v .pack{object-fit:contain;padding:60px}
.proc-v small{position:absolute;left:16px;bottom:14px;z-index:2;font-size:13px;background:#fff;padding:4px 10px}

/* mosaic */
.mos{padding:0 0 100px}
.mos-g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:108px;gap:12px;margin-top:40px}
.tile{position:relative;overflow:hidden;display:block;text-decoration:none;color:#fff;background:#bbb}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.tile:hover img{transform:scale(1.06)}
.tile::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,19,18,.72),rgba(20,19,18,0) 55%)}
.tile figcaption{position:absolute;left:20px;right:20px;bottom:16px;z-index:2}
.tile b{display:block;font-family:'Urbanist',sans-serif;font-weight:300;font-size:26px;line-height:1.05;letter-spacing:-.02em}
.tile span{font-size:14px;color:#E4E2DD}
.t1{grid-column:1/6;grid-row:span 5}.t2{grid-column:6/10;grid-row:span 3}.t3{grid-column:10/13;grid-row:span 3}.t4{grid-column:6/9;grid-row:span 3}.t5{grid-column:9/13;grid-row:span 2}.t6{grid-column:9/13;grid-row:span 1;background:var(--red)}
.t6::after{display:none}
.t6 .more{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-family:'Urbanist',sans-serif;font-weight:300;font-size:26px;color:#fff}

/* matieres */
.mat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:600px}
.mat-ph{position:relative;overflow:hidden}
.mat-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .7s ease both}
.mat-ph small{position:absolute;left:16px;bottom:14px;font-size:13px;color:#fff;background:rgba(30,30,30,.6);padding:4px 10px}
.mat-b{background:var(--stone);padding:56px 64px;display:flex;flex-direction:column;gap:22px}
.mat-b .h2{font-size:clamp(38px,4vw,60px)}
.mrow{padding:14px 0 !important}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border:0;border-top:1px solid #C9C6BF;background:transparent;padding:18px 0;text-align:left;cursor:pointer;color:var(--ink);width:100%}
.mrow b{font-family:'Urbanist',sans-serif;font-weight:300;font-size:30px;letter-spacing:-.02em;line-height:1.05}
.mrow small{display:block;font-size:14.5px;color:var(--mute);margin-top:4px}
.mrow i{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(30,30,30,.2);transition:transform .3s}
.mrow:hover i{transform:scale(1.1)}

/* showroom */
.show{padding:80px 0}
.show-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0}
.show-b{background:var(--graph);color:#fff;padding:56px 52px;display:flex;flex-direction:column;gap:20px}
.show-b address{font-style:normal;font-size:19px;line-height:1.5}
.show-map{background:#E9E7E2;min-height:420px;position:relative}
.show-map svg{position:absolute;inset:0;width:100%;height:100%}
.cta3d{background:var(--red);color:#fff;padding:96px 0}
.cta3d-g{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px;align-items:end}
.cta3d h2{font-family:'Urbanist',sans-serif;font-weight:200;font-size:clamp(48px,7vw,112px);line-height:.9;letter-spacing:-.045em}

@media(max-width:1180px){.nav,.tel{display:none}.burger{display:inline-flex}.mnav{display:block;padding:4px 0 16px}}
@media(max-width:1080px){
.promise-g,.sect-g,.proc-g,.ldet,.mat,.show-g,.cta3d-g{grid-template-columns:minmax(0,1fr)}
.track{grid-template-columns:repeat(5,minmax(240px,1fr));overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.pc{scroll-snap-align:start}
.ldet-ph{min-height:380px}.mat-ph{min-height:420px}.spanel{position:static}
.hero-prod{right:30px;width:min(480px,56vw)}
}
@media(max-width:720px){
.wrap{padding:0 16px}.top-note{display:none}.hdr-cta{display:none}.hdr-in{min-height:66px;gap:12px}.logo span{display:none}
.hero{padding:0 0 0}.hero-ph{height:640px}.hero-ph::after{background:linear-gradient(0deg,rgba(24,23,21,.85) 0%,rgba(24,23,21,.55) 55%,rgba(24,23,21,.25) 100%)}.hero-txt{padding-bottom:56px}.hero h1{font-size:clamp(46px,13vw,64px)}
.hero-prod{position:relative;right:auto;bottom:auto;width:auto;margin:30px 16px 0;padding:0 16px 16px}.hero-prod .pk{margin:-100px -4px 0}.hero-prod .cap b{font-size:24px}
.hero-side{display:none}
.promise{padding:64px 0 72px}.promise-g{gap:28px}.facts b{font-size:32px}
.coll,.mos{padding-bottom:80px}.sect,.proc,.show{padding:80px 0}
.ldet-b,.mat-b{padding:36px 20px}.show-b{padding:36px 20px}

        vStyle: on ? 'background:radial-gradient(ellipse 80% 70% at 50% 35%,#FFFFFF,#E4E2DE 72%)' : '',
        bStyle: on ? 'border-color:' + acc : '',
        pick: () => this.setState({ ligne:l.id }) };
    });
    const c = LIG.find(l => l.id === s.ligne) || LIG[1];
    const cur = { n:c.n, d:c.d, photo:c.photo, photoCap:c.photoCap, photoAlt:'Boutique équipée, Ligne ' + c.n,
      mods: c.mods.map(n => ({ n, href: n === 'Gourmandise' ? M : L })) };

    const SEC = [
      { n:'Boulangerie', t:'[TEMP.]', mods:'Amandine, Pastry Show, Réfrigérée statique (Legno), Loire (Industry)', real:'La Réunion, Gironde (33)', photo:P+'realisations/legno-boulangerie-large.webp', src:'Réalisation RGTE' },
      { n:'Pâtisserie', t:'+2 / +8 °C', mods:'Plane, Vision, Panorama, Centrale, Gourmandise, Pastry Show, Cube, Amandine', real:'Paris 4e, Rhône (69), Canet à Nice', photo:P+'realisations/stone-patissier-chocolatier-2.webp', src:'Réalisation RGTE' },
      { n:'Chocolats', t:'+14 / +18 °C', mods:'Plane, Centrale, Gourmandise', real:'Gap & Grenoble, Rhône (69), Canet à Nice', photo:P+'realisations/stone-chocolatier-boutique.webp', src:'Réalisation RGTE' },
      { n:'Sandwichs', t:'[TEMP.]', mods:'Panoramique, Basse, Murale self-service, Nepal', real:'Chamonix', photo:P+'realisations/basique-chamonix-3.webp', src:'Réalisation RGTE' },
      { n:'Traiteur', t:'[TEMP.]', mods:'Plane, Saladette, Panorama, Comptoir bar, Caisse', real:'Marseille, Hauts-de-Seine (92)', photo:P+'realisations/stone-dakao-2.webp', src:'Réalisation RGTE' },
      { n:'Poissonnerie', t:'−2 / 0 °C', mods:'Poissonnerie (Stone), Hanoi (Industry), Panorama', real:'Hauts-de-Seine (92)', photo:P+'realisations/stone-pointier.webp', src:'Réalisation RGTE' },
      { n:'Bar à salades', t:'+2 / +8 °C', mods:'Saladette, Panorama, Comptoir caisse', real:'Bouches-du-Rhône (13), Nice', photo:P+'realisations/stone-olives-service.webp', src:'Réalisation RGTE' },
      { n:'Bar à couscous', t:'+30 / +90 °C', mods:'Chaud bain-marie, Saladette', real:'Isère', photo:P+'realisations/stone-couscous.webp', src:'Réalisation RGTE' },
      { n:'Fromagerie', t:'[TEMP.]', mods:'Plane, Panorama (à valider)', real:'[RÉALISATION]', photo:P+'ambiance/vitrine-fromages.webp', src:'Ambiance Unsplash' },
      { n:'Bar', t:'[TEMP.]', mods:'Comptoir bar neutre ou réfrigéré, Saladette', real:'[RÉALISATION]', photo:P+'realisations/legno-cafe-bar.webp', src:'Réalisation RGTE' },
      { n:'Bar à topping', t:'+2 / +8 °C', mods:'Saladette sur mesure, Surface plane', real:'Bar à yogourt glacé, toute la France', photo:P+'realisations/stone-yogurt-toppings.webp', src:'Réalisation RGTE' },
      { n:'Coffee shop', t:'[TEMP.]', mods:'Comptoir bar, Ventilée plane, Caisse (Legno)', real:'[RÉALISATION]', photo:P+'realisations/legno-coffee-shop-2.webp', src:'Réalisation RGTE' },
      { n:'Pizza al taglio', t:'+2 / +8 °C', mods:'Saladette, Plane, Comptoir caisse', real:'Paris', photo:P+'realisations/stone-pizza.webp', src:'Réalisation RGTE' }
    ];
    const secteurs = SEC.map((x, i) => ({ n:x.n, on: s.sec === i, style: s.sec === i ? 'color:#fff' : 'color:#8E8C86', pick: () => this.setState({ sec:i }) }));
    const sx = SEC[s.sec];
    const sec = Object.assign({}, sx, { alt: sx.n + ' : vitrine en situation' });

    const STEPS = [
      { t:'Étude de votre local', d:'Vous nous transmettez dimensions, contraintes et produits à exposer. Le bureau d’études vérifie les implantations possibles.', img:P+'realisations/stone-olives-alziari-2.webp', cap:'Étude cotée, bar à olives à Nice', pack:false },
      { t:'Plan 3D offert', d:'Nous composons votre agencement avec les modules de la ligne choisie et vous le présentons en 3D, matières et coloris compris.', img:P+'realisations/stone-saladbar-plan.webp', cap:'Plan 3D, bar à salades (13)', pack:false },
      { t:'Fabrication sur mesure', d:'Les vitrines sont fabriquées à vos dimensions : longueurs, plage de température, pierre, bois ou verre sérigraphié.', img:P+'produits/stone-centrale-224.webp', cap:'Module Centrale, Ligne Stone', pack:true },
      { t:'Installation en boutique', d:'Les modules sont livrés et installés chez vous. Délais : [DÉLAI], selon le projet.', img:P+'realisations/stone-canet-2.webp', cap:'Installée : Canet, Nice', pack:false }
    ];
    const steps = STEPS.map((x, i) => ({ num:String(i + 1), t:x.t, d:x.d, on: s.step === i ? 'true' : 'false', cls: s.step === i ? 'step on' : 'step', pick: () => this.setState({ step:i }) }));
    const st = STEPS[s.step];
    const step = { img:st.img, cap:st.cap, alt:st.t + ' : ' + st.cap };

    const MATS = [
      { n:'Pierre acrylique', d:'Type Corian : piliers et plans de la Ligne Stone.', img:P+'ambiance/matiere-pierre-blanche.webp', cap:'Pierre blanche, ambiance Unsplash', sw:'background:#F4F2EE' },
      { n:'Granit', d:'Plan de travail et plinthe de la Ligne Basique.', img:P+'ambiance/comptoir-pierre-sombre.webp', cap:'Comptoir en pierre sombre, ambiance Unsplash', sw:'background:radial-gradient(circle at 30% 30%,#6A6863,#2E2D2B)' },
      { n:'Bois mélaminé', d:'Panneau frontal Legno, option Basique, avec moulures.', img:P+'realisations/legno-epicerie.webp', cap:'Réalisation RGTE, Ligne Legno', sw:'background:linear-gradient(90deg,#C9A27A,#B48A60)' },
      { n:'Verre sérigraphié', d:'Panneau frontal Stone imprimé au visuel de votre enseigne.', img:P+'realisations/stone-patissier-chocolatier-2.webp', cap:'Réalisation RGTE, façade sérigraphiée', sw:'background:linear-gradient(135deg,#fff 0 45%,#D42A20 45% 55%,#fff 55%)' }
    ];
    const mats = MATS.map((x, i) => ({ n:x.n, d:x.d, sw:x.sw, on: s.mat === i ? 'true' : 'false', style: s.mat === i ? 'border-top-color:#1E1E1E;box-shadow:inset 0 2px 0 ' + acc : '', pick: () => this.setState({ mat:i }) }));
    const mm = MATS[s.mat];
    return {
      rootStyle:'--red:' + acc,
      menuOpen:s.menu, menuAria: s.menu ? 'true' : 'false', toggleMenu: () => this.setState({ menu:!s.menu }),
      lignes, cur, secteurs, sec, steps, step, stepCover: !st.pack, stepPack: st.pack,
      mats, mat:{ img:mm.img, cap:mm.cap, alt:mm.n + ' : ' + mm.cap }
    };
  }
}
</script>
