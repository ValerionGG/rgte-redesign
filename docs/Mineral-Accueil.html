<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Minéral — Accueil</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap">
<style>
body{margin:0;background:#F4F2EE}
sc-for,sc-if{display:contents}
.mn{--g:#F4F2EE;--s:#E6E2DB;--s2:#DAD5CC;--ink:#2B2926;--mu:#6E6A63;--mu2:#5C5852;--gl:#C9D3D6;--ln:rgba(43,41,38,.16);--ln2:rgba(43,41,38,.08);background:var(--g);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mn *,.mn *::before,.mn *::after{box-sizing:border-box}
.mn img{display:block;max-width:100%}
.mn a{color:inherit}
.mn :focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px}
.sf{font-family:'Newsreader',Georgia,serif;font-weight:300}
.sc{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--mu)}
.no{font-family:'Newsreader',Georgia,serif;font-variant-caps:all-small-caps;letter-spacing:.14em;font-size:18px;color:var(--mu)}
.strip{border-bottom:1px solid var(--ln2);font-size:13px;color:var(--mu)}
.strip-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:44px}
.strip a{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px;min-height:44px}
.strip a:hover{color:var(--red)}
.hd{position:sticky;top:0;z-index:30;background:rgba(244,242,238,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln2)}
.hd-in{display:flex;align-items:center;justify-content:space-between;gap:24px;height:84px}
.logo{display:inline-flex;align-items:center;gap:14px;text-decoration:none;min-height:44px}
.logo-w{font-weight:600;font-size:19px;letter-spacing:.34em;position:relative}
.logo-w::after{content:"";position:absolute;right:-1px;top:0;width:5px;height:5px;background:var(--red)}
.logo-s{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:15px;color:var(--mu);padding-left:14px;border-left:1px solid var(--ln)}
.nav{display:flex;gap:2px}
.nav a{position:relative;text-decoration:none;font-size:15px;padding:0 14px;min-height:44px;display:inline-flex;align-items:center}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.nav a:hover::after{transform:scaleX(1)}
.nav a.on::after{transform:scaleX(1);background:var(--red)}
.hd-r{display:flex;align-items:center;gap:20px}
.tel{text-decoration:none;display:flex;flex-direction:column;line-height:1.25;min-height:44px;justify-content:center;font-size:15px;font-weight:500}
.tel small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;font:500 15px/1 'Hanken Grotesk',sans-serif;text-decoration:none;cursor:pointer;transition:background .35s,color .35s,border-color .35s,transform .35s,box-shadow .35s;white-space:nowrap}
.btn svg{transition:transform .35s}
.btn:hover svg{transform:translateX(4px)}
.btn-r{background:var(--red);color:#fff}
.btn-r:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px var(--red)}
.btn-o{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-o:hover{background:var(--ink);color:var(--g)}
.burger{display:none;width:48px;height:48px;border-radius:999px;border:1px solid var(--ln);background:transparent;color:var(--ink);align-items:center;justify-content:center;cursor:pointer}
.mnav{display:flex;flex-direction:column;padding:8px 20px 28px;border-top:1px solid var(--ln2)}
.mnav a{font-family:'Newsreader',Georgia,serif;font-size:26px;font-weight:300;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--ln2);min-height:44px}
.h1{font-family:'Newsreader',Georgia,serif;font-weight:300;letter-spacing:-.025em;line-height:.98;margin:0;overflow-wrap:anywhere}
.h2{font-family:'Newsreader',Georgia,serif;font-weight:300;letter-spacing:-.02em;line-height:1.04;margin:0;font-size:clamp(34px,4.4vw,64px);overflow-wrap:anywhere}
.h1 em,.h2 em{font-style:italic}
.lead{font-size:18px;line-height:1.65;color:var(--mu);max-width:560px;margin:0}
.ft{background:var(--s);padding:96px 0 0;border-top:1px solid var(--ln2)}
.ft-cta{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;padding-bottom:72px;border-bottom:1px solid var(--ln)}
.ft-cta .h2{max-width:780px}
.ft-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px;padding:56px 0}
.ft-g h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--mu2);margin:0 0 14px}
.ft-g p{margin:0;font-size:15px;line-height:1.7}
.ft-l a{display:flex;align-items:center;min-height:44px;text-decoration:none;font-size:15px;border-bottom:1px solid var(--ln2);transition:color .3s,padding .4s}
.ft-l a:hover{color:var(--red);padding-left:6px}
.ft-b{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;padding:14px 0 22px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu2)}
.ft-b a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center;color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.rv{animation:rise 1.1s cubic-bezier(.2,.7,.1,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.5s}
@supports (animation-timeline: view()){.rs{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 80%}}
@media (max-width:1080px){.nav,.tel{display:none}.burger{display:inline-flex}}
@media (min-width:1081px){.mnav{display:none}}
@media (max-width:720px){.wrap{padding:0 20px}.hd-in{height:72px}.ft{padding-top:64px}}
@media (max-width:520px){.hd-r .btn{display:none}.logo-s{display:none}}

/* — matières — */
.t-corian{background:#F6F4F0 url(assets/marble-white.webp) center/cover}
.t-granit{background:#4A4743 url(assets/marble-veins.webp) center/cover;filter:grayscale(1) contrast(1.5) brightness(.52)}
.t-granit::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) .8px,transparent 1.3px),radial-gradient(rgba(0,0,0,.55) 1px,transparent 1.6px);background-size:6px 6px,9px 9px;background-position:0 0,3px 4px}
.t-bois{background-color:#B08860;background-image:repeating-linear-gradient(90deg,rgba(84,52,26,.18) 0 1px,transparent 1px 7px),repeating-linear-gradient(90deg,rgba(255,236,210,.14) 0 3px,transparent 3px 29px),linear-gradient(180deg,#B9926A,#A47C55)}
.t-verre{background-color:#C9D3D6;background-image:radial-gradient(rgba(43,41,38,.2) 1px,transparent 1.5px),linear-gradient(118deg,rgba(255,255,255,.6) 0 14%,transparent 14% 36%,rgba(255,255,255,.3) 36% 41%,transparent 41%);background-size:8px 8px,100% 100%}
.tx{position:absolute;inset:0;transition:opacity 1s cubic-bezier(.2,.7,.1,1)}
.moul{position:absolute;inset:18px 22px;border:1px solid rgba(60,36,16,.35);box-shadow:inset 0 0 0 7px rgba(255,236,210,.1),inset 0 0 0 8px rgba(60,36,16,.25)}
.seri{position:absolute;left:0;right:0;top:64px;text-align:center;font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:22px;color:rgba(43,41,38,.72)}

/* — hero / signature — */
.hero{padding:48px 0 0}
.hero-g{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:40px;align-items:center}
.hero .h1{font-size:clamp(46px,6vw,96px);margin:22px 0 28px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.sw{margin-top:44px;padding-top:22px;border-top:1px solid var(--ln)}
.sw-r{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.swb{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:4px 16px 4px 5px;border-radius:999px;border:1px solid var(--ln);background:transparent;font:400 14px/1 'Hanken Grotesk',sans-serif;color:var(--ink);cursor:pointer;transition:border-color .3s,background .3s,transform .3s}
.swb:hover{transform:translateY(-2px);border-color:var(--ink)}
.swc{position:relative;width:38px;height:38px;border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(43,41,38,.15)}
.sw-cap{margin:14px 0 0;font-size:14px;color:var(--mu);min-height:46px;max-width:520px}
.stage{position:relative;height:640px}
.st-in{position:absolute;left:50%;top:0;width:580px;height:640px;margin-left:-290px;transform-origin:50% 0}
.floor{position:absolute;left:30px;top:528px;width:520px;height:70px;border-radius:50%;background:radial-gradient(closest-side,rgba(43,41,38,.32),rgba(43,41,38,0));filter:blur(4px);animation:floorIn 3s .3s cubic-bezier(.25,.8,.2,1) both}
.glow{position:absolute;left:110px;top:566px;width:300px;height:40px;border-radius:50%;background:radial-gradient(closest-side,rgba(201,211,214,.9),rgba(201,211,214,0));animation:fade 2s 3.4s both}
@keyframes floorIn{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}
.slab-w{position:absolute;left:30px;top:150px;width:520px;height:200px;perspective:1500px;perspective-origin:50% -60%;z-index:2}
.slab{position:absolute;left:0;top:0;width:520px;height:200px;transform-style:preserve-3d;transform-origin:50% 100%;transform:translateY(0) translateZ(0) rotateX(64deg) rotateY(0deg) rotateZ(0deg);animation:settle 3.4s .2s cubic-bezier(.25,.8,.2,1) both}
@keyframes settle{
0%{opacity:0;transform:translateY(-210px) translateZ(80px) rotateX(10deg) rotateY(-28deg) rotateZ(-12deg)}
14%{opacity:1}
58%{transform:translateY(-36px) translateZ(20px) rotateX(50deg) rotateY(-8deg) rotateZ(-3deg)}
84%{transform:translateY(5px) translateZ(0) rotateX(65.5deg) rotateY(.6deg) rotateZ(.3deg)}
100%{opacity:1;transform:translateY(0) translateZ(0) rotateX(64deg) rotateY(0deg) rotateZ(0deg)}
}
.face{position:absolute;overflow:hidden}
.f-top{left:0;top:0;width:520px;height:200px}
.f-top::after{content:"";position:absolute;inset:0;background:linear-gradient(172deg,rgba(255,255,255,.55),rgba(255,255,255,0) 60%);z-index:2}
.f-top::before{content:"";position:absolute;inset:0;z-index:3;background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 60%);background-size:260% 100%;background-position:130% 0;animation:sweep 9s 4.2s ease-in-out infinite}
@keyframes sweep{0%{background-position:130% 0}45%,100%{background-position:-30% 0}}
.f-front{left:0;top:200px;width:520px;height:30px;transform-origin:50% 0;transform:rotateX(-90deg)}
.f-front::after{content:"";position:absolute;inset:0;background:rgba(43,41,38,.12);z-index:2}
.f-side{left:520px;top:0;width:30px;height:200px;transform-origin:0 50%;transform:rotateY(90deg);backface-visibility:hidden}
.f-side::after{content:"";position:absolute;inset:0;background:rgba(43,41,38,.24);z-index:2}
.body{position:absolute;left:50px;top:372px;width:480px;height:170px;overflow:hidden;z-index:1;clip-path:inset(0 0 100% 0);animation:wipe 1.4s 2.3s cubic-bezier(.6,0,.2,1) forwards}
.body::after{content:"";position:absolute;inset:0;z-index:3;background:linear-gradient(180deg,rgba(43,41,38,.2),rgba(43,41,38,0) 26%,rgba(43,41,38,0) 80%,rgba(43,41,38,.08)),repeating-linear-gradient(90deg,rgba(43,41,38,0) 0 159px,rgba(43,41,38,.14) 159px 160px)}
.plinth{position:absolute;left:58px;top:542px;width:464px;height:16px;background:#CFC9BF;z-index:1;overflow:hidden;opacity:0;animation:fade .8s 3.2s forwards}
.hood{position:absolute;left:80px;top:128px;z-index:3;overflow:visible}
.hood-glass{fill:rgba(201,211,214,.34);opacity:0;animation:fade 1.2s 3s ease forwards}
.sheen path{stroke:#fff;stroke-width:12;opacity:.6;fill:none}
.sheen{animation:sheen 7s 4.6s ease-in-out infinite;transform:translateX(-120px)}
@keyframes sheen{0%{transform:translateX(-120px)}50%,100%{transform:translateX(480px)}}
.pil{fill:#F7F5F1;stroke:var(--ink);stroke-width:.8;opacity:0;animation:fade 1s 3.1s forwards}
.draw{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.4s 2.6s cubic-bezier(.6,0,.2,1) forwards}
.slide{fill:none;stroke:var(--ink);stroke-width:.8;stroke-dasharray:3 5;opacity:0;animation:fade 1s 4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pa{fill:#EFE9DF;stroke:var(--ink);stroke-width:.9;opacity:0;animation:rise2 .9s cubic-bezier(.2,.7,.1,1) forwards}
@keyframes rise2{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pa1{animation-delay:3.5s}.pa2{animation-delay:3.65s}.pa3{animation-delay:3.8s}.pa4{animation-delay:3.95s}.pa5{animation-delay:4.1s}
.ann{position:absolute;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);line-height:1.5;opacity:0;animation:fade 1s 4.3s forwards;z-index:4}
.ann b{display:block;font-family:'Newsreader',Georgia,serif;font-style:italic;text-transform:none;letter-spacing:0;font-size:16px;color:var(--ink);font-weight:400}
.lead-l{position:absolute;width:1px;background:var(--ink);opacity:0;animation:fade 1s 4.3s forwards;z-index:4}
.lead-l::after{content:"";position:absolute;left:-2px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.ll-dn::after{bottom:-2px}.ll-up::after{top:-2px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));border-top:1px solid var(--ln);margin-top:24px}
.fact{padding:22px 24px 26px 0;border-right:1px solid var(--ln2)}
.fact b{display:block;font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:46px;line-height:1;margin-bottom:8px}
.fact span{font-size:14px;color:var(--mu)}
@media (max-width:1180px) and (min-width:1001px){.st-in{transform:scale(.86)}.stage{height:560px}}
@media (max-width:1000px){.hero-g{grid-template-columns:1fr}}
@media (max-width:640px){.st-in{transform:scale(.6)}.stage{height:400px}}

/* — marquee — */
.mq{overflow:hidden;border-top:1px solid var(--ln2);border-bottom:1px solid var(--ln2);padding:20px 0;white-space:nowrap;margin-top:72px}
.mq-t{display:inline-flex;animation:mq 70s linear infinite;font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:300;font-size:30px;color:var(--mu)}
.mq-t span{display:inline-flex;align-items:center}
.mq-t span::after{content:"";display:inline-block;width:6px;height:6px;border:1px solid var(--mu);transform:rotate(45deg);margin:0 40px}
@keyframes mq{to{transform:translateX(-50%)}}

/* — sections — */
.sec{padding:128px 0;border-top:1px solid var(--ln2)}
.sec-s{background:var(--s)}
.sh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:end;margin-bottom:64px}
.sh .no{display:block;margin-bottom:18px}
.sh p{margin:0;color:var(--mu);font-size:17px;max-width:520px}
.sec-s .sh p,.sec-s .sc,.sec-s .no{color:var(--mu2)}
.pr-q{font-size:clamp(38px,5.2vw,80px);line-height:1.02;letter-spacing:-.025em;margin:26px 0 72px;max-width:1080px}
.pr-q em{font-style:italic}
.pr-c{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:40px}
.pr-c div{border-top:1px solid var(--ink);padding-top:20px}
.pr-c h3{font-family:'Newsreader',Georgia,serif;font-weight:400;font-style:italic;font-size:24px;margin:0 0 10px}
.pr-c p{margin:0;color:var(--mu)}

.lg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:64px;align-items:start}
.lg-row{all:unset;box-sizing:border-box;position:relative;display:grid;grid-template-columns:64px 1fr auto;align-items:baseline;width:100%;padding:24px 0;border-bottom:1px solid var(--ln);cursor:pointer;transition:padding .6s cubic-bezier(.2,.7,.1,1),color .3s}
.lg-row:first-child{border-top:1px solid var(--ln)}
.lg-row:hover{padding-left:12px;color:var(--ink)}
.lg-mk{position:absolute;left:0;top:50%;width:14px;height:1px;background:var(--red);transform-origin:left;transition:transform .5s}
.lg-n{font-family:'Newsreader',Georgia,serif;font-variant-caps:all-small-caps;letter-spacing:.14em;font-size:17px}
.lg-t{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:clamp(34px,3.6vw,54px);line-height:1;letter-spacing:-.02em}
.lg-k{font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.lg-pic{position:relative;height:420px;overflow:hidden;background:var(--s)}
.lg-pic img{position:absolute;left:0;top:0;width:100%;height:420px;object-fit:cover;transition:opacity 1.1s,transform 1.8s cubic-bezier(.2,.7,.1,1)}
.lg-meta{display:flex;justify-content:space-between;gap:16px;padding:20px 0 14px;border-bottom:1px solid var(--ln)}
.lg-d{font-size:18px;line-height:1.6;margin:20px 0 24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--ln);border-radius:999px;font-size:14px;text-decoration:none;transition:border-color .3s,background .3s,transform .3s}
.chip:hover{border-color:var(--ink);background:#FBFAF8;transform:translateY(-2px)}
.lnk{display:inline-flex;align-items:center;gap:10px;min-height:44px;margin-top:22px;text-decoration:none;font-weight:500;border-bottom:1px solid var(--ink)}
.lnk:hover{color:var(--red);border-color:var(--red)}
@media (max-width:960px){.lg{grid-template-columns:1fr}}

.sx-idx{display:flex;flex-wrap:wrap;gap:0 4px;margin-bottom:64px}
.sx-w{all:unset;cursor:pointer;font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:clamp(26px,2.8vw,40px);line-height:1.35;letter-spacing:-.01em;min-height:44px;transition:color .3s}
.sx-w:hover{color:var(--red)}
.sx-sep{font-family:'Newsreader',Georgia,serif;font-size:clamp(26px,2.8vw,40px);color:var(--mu2);margin:0 10px 0 6px;line-height:1.35}
.sx-d{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center;border-top:1px solid var(--ln);padding-top:48px}
.sx-pic{position:relative;height:440px;overflow:hidden;background:var(--s2)}
.sx-pic img{position:absolute;left:0;top:0;width:100%;height:440px;object-fit:cover;transition:opacity 1s,transform 1.8s cubic-bezier(.2,.7,.1,1)}
.sx-h{font-size:clamp(40px,4.4vw,64px);line-height:1;margin:10px 0 28px;letter-spacing:-.02em}
.sx-tp{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:18px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);margin-bottom:26px}
.sx-tp b{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:36px;line-height:1}
.tag{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border:1px solid var(--ln);border-radius:999px;font-size:12px;color:var(--mu2)}
@media (max-width:900px){.sx-d{grid-template-columns:1fr}}

.pc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:0}
.pc-s{all:unset;box-sizing:border-box;position:relative;cursor:pointer;padding:30px 28px 36px 0;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:12px;min-height:250px;transition:color .3s}
.pc-bar{position:absolute;left:0;right:28px;top:-1px;height:2px;background:var(--red);transform-origin:left;transition:transform .8s cubic-bezier(.2,.7,.1,1)}
.pc-t{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:38px;line-height:1}
.pc-x{font-size:15px;line-height:1.6;max-width:280px}
.pc-s:hover .pc-t{font-style:italic}

.rcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:28px}
.rc{text-decoration:none;display:block}
.rc-pic{height:380px;overflow:hidden;background:var(--s)}
.rc-pic img{width:100%;height:380px;object-fit:cover;transition:transform 1.6s cubic-bezier(.2,.7,.1,1),filter 1s;filter:saturate(.85)}
.rc:hover .rc-pic img{transform:scale(1.05);filter:saturate(1)}
.rc-m{display:flex;justify-content:space-between;padding:16px 0 8px;border-bottom:1px solid var(--ln)}
.rc-t{font-size:28px;line-height:1.1;margin:14px 0 6px;transition:color .3s}
.rc:hover .rc-t{color:var(--red)}
.rc p{margin:0;color:var(--mu);font-size:15px}
@media (min-width:1100px){.rcs .rc:nth-child(even){margin-top:72px}}
.disc{margin:40px 0 0;font-size:13px;color:var(--mu)}

.mt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px}
.mt-c{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--g);transition:transform .6s cubic-bezier(.2,.7,.1,1),box-shadow .6s}
.mt-c:hover{transform:translateY(-6px)}
.mt-s{position:relative;height:280px;overflow:hidden;display:block}
.mt-b{display:flex;flex-direction:column;gap:8px;padding:22px 22px 26px}
.mt-n{font-size:30px;line-height:1}
.mt-x{font-size:14px;color:var(--mu);line-height:1.55}

.srm{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:72px;align-items:center}
.srm-pic{height:560px;overflow:hidden}
.srm-pic img{width:100%;height:560px;object-fit:cover;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08) translateX(-2%)}}
.dl{display:grid;grid-template-columns:140px 1fr;gap:0;border-top:1px solid var(--ln);margin:32px 0}
.dl dt,.dl dd{margin:0;padding:14px 0;border-bottom:1px solid var(--ln)}
.dl dt{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);padding-top:17px}
@media (max-width:900px){.srm{grid-template-columns:1fr}.srm-pic,.srm-pic img{height:380px}.sh{grid-template-columns:1fr}.sec{padding:88px 0}}
@media (prefers-reduced-motion:reduce){.mn *{animation:none !important;transition:none !important}.body{clip-path:none}.draw{stroke-dashoffset:0}.hood-glass,.pil,.pa,.ann,.lead-l,.plinth,.slide{opacity:1}}
</style>
</helmet>
