<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vitrine — Showroom &amp; contact</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
body{margin:0;background:#101010}
.vt{font-family:'Manrope',system-ui,sans-serif;color:#EEE9E1;background:#101010;-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;font-size:15px}
.vt *{box-sizing:border-box}
.vt a{color:inherit;text-decoration:none}
.vt img{display:block;max-width:100%}
.vt button,.vt input,.vt textarea{font-family:inherit}
.vt-wrap{max-width:1320px;margin:0 auto;padding:0 48px}
.vt-d{font-family:'Libre Caslon Display',Georgia,serif;font-weight:400;line-height:1.04;letter-spacing:-.005em;margin:0}
.vt-sc{font-size:11px;line-height:1.4;letter-spacing:.3em;text-transform:uppercase;font-weight:600;color:#A8A39A}
.vt-brass{color:var(--brass)}
.vt-h2{font-size:clamp(34px,4.6vw,64px)}
.vt-lead{font-size:17px;color:#A8A39A;max-width:560px;margin:0}
.vt-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#D42A20;flex:none}
.vt-sec{padding:120px 0}
.vt-sechead{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:28px 80px;align-items:end;margin-bottom:56px}
.vt-kicker{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.vt-kicker::before{content:"";width:40px;height:1px;background:var(--brass)}
.vt-strip{border-bottom:1px solid rgba(238,233,225,.08);font-size:12px;color:#A8A39A}
.vt-stripin{display:flex;justify-content:space-between;align-items:center;min-height:40px;gap:16px;flex-wrap:wrap}
.vt-stripin a{display:inline-flex;align-items:center;gap:8px;min-height:40px;transition:color .3s}
.vt-stripin a:hover{color:#EEE9E1}
.vt-head{position:sticky;top:0;z-index:60;background:rgba(16,16,16,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(176,141,87,.22)}
.vt-headin{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:84px}
.vt-logo{display:inline-flex;align-items:center;gap:12px;min-height:48px}
.vt-logo b{font-family:'Libre Caslon Display',serif;font-weight:400;font-size:28px;letter-spacing:.18em;line-height:1}
.vt-logo small{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#A8A39A;font-weight:600;padding-left:12px;border-left:1px solid rgba(176,141,87,.5);line-height:1.3}
.vt-nav{display:flex;gap:36px}
.vt-nav a{position:relative;display:inline-flex;align-items:center;min-height:48px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#A8A39A;transition:color .3s}
.vt-nav a::after{content:"";position:absolute;left:0;right:0;bottom:10px;height:1px;background:var(--brass);transform:scaleX(0);transform-origin:right;transition:transform .6s cubic-bezier(.2,.7,.1,1)}
.vt-nav a:hover,.vt-nav a.on{color:#EEE9E1}
.vt-nav a:hover::after,.vt-nav a.on::after{transform:scaleX(1);transform-origin:left}
.vt-headr{display:flex;align-items:center;gap:22px}
.vt-tel{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.25;min-height:44px}
.vt-tel .vt-sc{font-size:10px;letter-spacing:.26em}
.vt-tel strong{font-size:15px;font-weight:600;letter-spacing:.06em}
.vt-burger{display:none;width:48px;height:48px;align-items:center;justify-content:center;background:transparent;border:1px solid rgba(238,233,225,.2);color:#EEE9E1;cursor:pointer}
.vt-mnav{display:none}
.vt-btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:50px;padding:0 28px;border:1px solid var(--brass);background:transparent;color:#EEE9E1;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;cursor:pointer;position:relative;overflow:hidden;transition:color .5s,border-color .5s;z-index:0;white-space:nowrap}
.vt-btn::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:#EEE9E1;transform:translateY(101%);transition:transform .55s cubic-bezier(.2,.7,.1,1);z-index:-1}
.vt-btn:hover{color:#101010;border-color:#EEE9E1}
.vt-btn:hover::before{transform:none}
.vt-btn.solid{background:#EEE9E1;color:#101010;border-color:#EEE9E1}
.vt-btn.solid::before{background:var(--brass)}
.vt-btn.solid:hover{border-color:var(--brass)}
.vt-link{display:inline-flex;align-items:center;gap:14px;min-height:44px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:#EEE9E1;background:none;border:0;cursor:pointer;padding:0}
.vt-link span{padding-bottom:5px;border-bottom:1px solid var(--brass)}
.vt-link svg{transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.vt-link:hover svg{transform:translateX(6px)}
.vt-foot{border-top:1px solid rgba(176,141,87,.35);padding:96px 0 36px;background:#0C0C0C}
.vt-footgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:48px}
.vt-foot h4{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--brass);margin:0 0 18px;font-weight:600}
.vt-foot p{font-size:14px;color:#A8A39A;margin:0}
.vt-footlinks{display:flex;flex-direction:column}
.vt-footlinks a{min-height:44px;display:flex;align-items:center;font-size:14px;color:#A8A39A;transition:color .3s}
.vt-footlinks a:hover{color:#EEE9E1}
.vt-footbot{margin-top:64px;padding-top:24px;border-top:1px solid rgba(238,233,225,.08);display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:12px;color:#A8A39A}
.vt-footbot a{min-height:44px;display:inline-flex;align-items:center}
@keyframes vtRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes vtSlide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.vt-rise{animation:vtRise 1.1s cubic-bezier(.2,.7,.1,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.5s}
.vt :focus-visible{outline:1px solid #EEE9E1;outline-offset:4px}

/* hero */
.vt-chero{position:relative;padding:100px 0 90px;overflow:hidden}
.vt-chero::before{content:"";position:absolute;right:-200px;top:-200px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(238,224,200,.07),rgba(238,224,200,0) 60%);pointer-events:none}
.vt-crumb{display:flex;gap:10px;align-items:center;margin-bottom:34px}
.vt-crumb a{min-height:44px;display:inline-flex;align-items:center;color:#A8A39A;transition:color .3s}
.vt-crumb a:hover{color:#EEE9E1}
.vt-cgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:64px;align-items:end}
.vt-chero h1{font-size:clamp(46px,6.6vw,100px);overflow-wrap:anywhere}
.vt-chero h1 span{color:var(--brass)}
.vt-hotline{display:block;border:1px solid rgba(176,141,87,.45);padding:30px 30px 26px;background:#141414;transition:border-color .5s,background .5s}
.vt-hotline:hover{border-color:#EEE9E1;background:#181818}
.vt-hotline b{display:block;font-family:'Libre Caslon Display',serif;font-weight:400;font-size:clamp(34px,3.4vw,48px);letter-spacing:.04em;margin:10px 0 6px;white-space:nowrap}

/* formulaire étapes */
.vt-fwrap{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.5fr);gap:72px;align-items:start}
.vt-steps{display:flex;flex-direction:column;gap:0;border-top:1px solid rgba(238,233,225,.1)}
.vt-stepi{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;min-height:72px;border-bottom:1px solid rgba(238,233,225,.08);position:relative}
.vt-stepi::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;background:var(--brass);transition:width .8s cubic-bezier(.2,.7,.1,1)}
.vt-stepi b{font-family:'Libre Caslon Display',serif;font-weight:400;font-size:24px;transition:color .4s}
.vt-panel{border:1px solid rgba(238,233,225,.1);background:#141414;padding:40px;animation:vtSlide .7s cubic-bezier(.2,.7,.1,1) both}
.vt-panel h3{font-family:'Libre Caslon Display',serif;font-weight:400;font-size:36px;margin:8px 0 28px}
.vt-chips{display:flex;flex-wrap:wrap;gap:8px}
.vt-chip{min-height:46px;padding:0 16px;border:1px solid rgba(238,233,225,.16);background:transparent;color:#EEE9E1;font-size:14px;cursor:pointer;transition:border-color .4s,background .4s,color .4s,transform .4s}
.vt-chip:hover{border-color:rgba(238,233,225,.5);transform:translateY(-2px)}
.vt-check{display:flex;gap:14px;align-items:flex-start;width:100%;margin-top:28px;padding:18px;border:1px solid rgba(176,141,87,.35);background:transparent;color:#EEE9E1;text-align:left;cursor:pointer;min-height:44px;transition:background .4s}
.vt-check:hover{background:rgba(176,141,87,.08)}
.vt-check .box{width:22px;height:22px;border:1px solid var(--brass);display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:1px;transition:background .3s}
.vt-check span small{display:block}
.vt-check span b{display:block;font-weight:600;font-size:15px}
.vt-check span small{font-size:13px;color:#A8A39A}
.vt-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 24px}
.vt-field{display:flex;flex-direction:column;gap:8px}
.vt-field.full{grid-column:1 / -1}
.vt-field label,.vt-flabel{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:#A8A39A}
.vt-field input,.vt-field textarea{min-height:52px;background:#101010;border:1px solid rgba(238,233,225,.16);color:#EEE9E1;font-size:15px;padding:12px 14px;outline:none;transition:border-color .4s;border-radius:0}
.vt-field textarea{min-height:130px;resize:vertical}
.vt-field input:focus,.vt-field textarea:focus{border-color:var(--brass)}
.vt-unit{position:relative}
.vt-unit input{width:100%;padding-right:52px}
.vt-unit i{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:#A8A39A}
.vt-err{font-size:12.5px;color:#F0A39C}
.vt-fnav{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:34px;padding-top:24px;border-top:1px solid rgba(238,233,225,.08)}
.vt-sent{border:1px solid rgba(176,141,87,.5);background:#141414;padding:48px;animation:vtRise .8s cubic-bezier(.2,.7,.1,1) both}
.vt-recap{margin:24px 0 28px;border-top:1px solid rgba(238,233,225,.1)}
.vt-recap div{display:grid;grid-template-columns:160px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid rgba(238,233,225,.08);font-size:14.5px}

/* carte */
.vt-mapgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0;border:1px solid rgba(238,233,225,.1)}
.vt-map{position:relative;background:#121212;min-height:520px;overflow:hidden}
.vt-map svg{display:block;width:100%;height:520px}
.vt-pin{position:absolute;left:58%;top:47%;width:0;height:0}
.vt-pin i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:#D42A20;box-shadow:0 0 0 6px rgba(212,42,32,.18)}
.vt-pin i::after{content:"";position:absolute;left:-14px;top:-14px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(212,42,32,.6);animation:vtPulse 2.6s ease-out infinite}
@keyframes vtPulse{from{transform:scale(.4);opacity:1}to{transform:scale(2.2);opacity:0}}
.vt-pin span{position:absolute;left:22px;top:-30px;white-space:nowrap;background:#101010;border:1px solid rgba(176,141,87,.5);padding:8px 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.vt-mapnote{position:absolute;left:20px;bottom:16px}
.vt-mapinfo{padding:44px 40px;background:#161616}
.vt-mapinfo .row{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid rgba(238,233,225,.08);font-size:15px}

/* plan 3D */
.vt-p3d{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:center}
.vt-iso{position:relative;height:420px;display:flex;align-items:center;justify-content:center}
.vt-iso svg{max-width:100%}
.vt-iso .draw{stroke-dasharray:900;stroke-dashoffset:900;animation:vtDraw 3.2s cubic-bezier(.6,0,.2,1) .3s forwards}
@keyframes vtDraw{to{stroke-dashoffset:0}}
.vt-p3dlist{margin:28px 0 34px;border-top:1px solid rgba(238,233,225,.1)}
.vt-p3dlist div{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid rgba(238,233,225,.08)}
.vt-p3dlist i{font-style:normal;font-family:'Libre Caslon Display',serif;color:var(--brass);font-size:18px}

/* faq */
.vt-faq{border-top:1px solid rgba(238,233,225,.1)}
.vt-q{border-bottom:1px solid rgba(238,233,225,.08)}
.vt-qbtn{display:grid;grid-template-columns:52px 1fr 44px;align-items:center;gap:12px;width:100%;min-height:80px;padding:12px 0;background:transparent;border:0;color:#EEE9E1;text-align:left;cursor:pointer}
.vt-qbtn .n{font-family:'Libre Caslon Display',serif;color:var(--brass);font-size:17px}
.vt-qbtn .t{font-family:'Libre Caslon Display',serif;font-size:clamp(21px,2vw,28px);line-height:1.2;transition:transform .6s cubic-bezier(.2,.7,.1,1)}
.vt-qbtn:hover .t{transform:translateX(8px)}
.vt-qbtn svg{transition:transform .6s cubic-bezier(.2,.7,.1,1)}
.vt-ans{padding:0 44px 28px 64px;color:#A8A39A;font-size:16px;max-width:860px;animation:vtRise .6s cubic-bezier(.2,.7,.1,1) both}

@media (max-width:1100px){
  .vt-nav,.vt-tel{display:none}
  .vt-burger{display:inline-flex}
  .vt-mnav{display:flex;flex-direction:column;padding:8px 24px 28px;border-top:1px solid rgba(238,233,225,.08)}
  .vt-mnav a{min-height:54px;display:flex;align-items:center;font-family:'Libre Caslon Display',serif;font-size:26px;border-bottom:1px solid rgba(238,233,225,.06)}
  .vt-mnav .vt-btn{margin-top:20px;font-family:'Manrope',sans-serif;font-size:11.5px}
  .vt-cgrid,.vt-fwrap,.vt-mapgrid,.vt-p3d{grid-template-columns:minmax(0,1fr)}
  .vt-steps{flex-direction:row}
  .vt-stepi{flex:1;grid-template-columns:1fr;text-align:center;padding:10px 4px}
}
@media (max-width:640px){
  .vt-wrap{padding:0 20px}
  .vt-headcta{display:none}
  .vt-logo small{display:none}
  .vt-sec{padding:90px 0}
  .vt-panel,.vt-sent{padding:26px 20px}
  .vt-form{grid-template-columns:minmax(0,1fr)}
  .vt-recap div,.vt-mapinfo .row{grid-template-columns:1fr;gap:4px}
  .vt-map,.vt-map svg{height:380px;min-height:380px}
  .vt-ans{padding:0 0 24px 0}
  .vt-qbtn{grid-template-columns:36px 1fr 44px}
  .vt-stepi .vt-sc{display:none}
}
@media (prefers-reduced-motion:reduce){.vt *{animation:none!important;transition:none!important}.vt-iso .draw{stroke-dashoffset:0}}
</style>
</helmet>
<div class="vt" style="{{ rootStyle }}">

  <div class="vt-strip">
    <div class="vt-wrap vt-stripin">
      <a href="index.html"><svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M16 5H2M6 1L2 5l4 4"></path></svg>Toutes les propositions</a>
      <span>Direction 1 · Vitrine — proposition de refonte, concept non officiel</span>
    </div>
  </div>

  <header class="vt-head">
    <div class="vt-wrap vt-headin">
      <a href="Vitrine-Accueil.html" class="vt-logo" aria-label="RGTE, retour à l’accueil"><b>RGTE</b><span class="vt-dot"></span><small>R.G. Technologies</small></a>
      <nav class="vt-nav" aria-label="Navigation principale">
        <a href="Vitrine-Lignes.html">Lignes</a>
        <a href="Vitrine-Secteurs.html">Secteurs</a>
        <a href="Vitrine-Realisations.html">Réalisations</a>
        <a href="Vitrine-Contact.html" class="on" aria-current="page">Showroom &amp; contact</a>
      </nav>
      <div class="vt-headr">
        <a class="vt-tel" href="tel:0800951313"><span class="vt-sc">Appel gratuit</span><strong>0 800 95 13 13</strong></a>
        <a class="vt-btn vt-headcta" href="#devis">Demande de devis</a>
        <button type="button" class="vt-burger" aria-label="Ouvrir ou fermer le menu" aria-expanded="{{ menuExpanded }}" onClick="{{ toggleMenu }}"><svg width="20" height="12" viewBox="0 0 20 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M0 1h20M0 6h20M0 11h20"></path></svg></button>
      </div>
    </div>
    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <nav class="vt-mnav" aria-label="Navigation mobile">
        <a href="Vitrine-Lignes.html">Lignes</a>
        <a href="Vitrine-Secteurs.html">Secteurs</a>
        <a href="Vitrine-Realisations.html">Réalisations</a>
        <a href="Vitrine-Contact.html">Showroom &amp; contact</a>
        <a href="tel:0800951313">0 800 95 13 13</a>
        <a class="vt-btn solid" href="#devis">Demande de devis</a>
      </nav>
    </sc-if>
  </header>

  <section class="vt-chero" aria-labelledby="t-contact">
    <div class="vt-wrap">
      <div class="vt-crumb vt-sc"><a href="Vitrine-Accueil.html">Accueil</a><span>/</span><span>Showroom &amp; contact</span></div>
      <div class="vt-cgrid">
        <div>
          <h1 id="t-contact" class="vt-d vt-rise">Rendez-vous<br><span>dans la lumière.</span></h1>
          <p class="vt-lead vt-rise d2" style="margin-top:28px">Bureau d’études et show-room à Puget-sur-Argens, dans le Var. Demandez un devis, votre plan 3D d’agencement, ou venez toucher les matières.</p>
        </div>
        <a class="vt-hotline vt-rise d3" href="tel:0800951313">
          <span class="vt-sc vt-brass">Numéro vert — appel gratuit</span>
          <b>0 800 95 13 13</b>
          <span style="font-size:14px;color:#A8A39A">423, Chemin des Vernèdes · Espace Vernèdes 3 · 83480 Puget-sur-Argens</span>
        </a>
      </div>
    </div>
  </section>

  <!-- ===== DEVIS EN ÉTAPES ===== -->
  <section id="devis" class="vt-sec" style="background:#121212;padding-top:110px" aria-labelledby="t-devis">
    <div class="vt-wrap vt-fwrap">
      <div>
        <div class="vt-sc vt-kicker">Demande de devis</div>
        <h2 id="t-devis" class="vt-d vt-h2">Trois temps,<br>une pièce.</h2>
        <p class="vt-lead" style="margin:22px 0 36px">Votre métier, votre local, vos coordonnées. Le bureau d’études revient vers vous.</p>
        <div class="vt-steps" aria-label="Progression">
          <sc-for list="{{ stepsUi }}" as="st" hint-placeholder-count="3">
            <div class="vt-stepi" style="{{ st.style }}" aria-current="{{ st.current }}"><b style="{{ st.numStyle }}">{{ st.n }}</b><span class="vt-sc">{{ st.label }}</span></div>
          </sc-for>
        </div>
      </div>

      <div>
        <sc-if value="{{ step1 }}" hint-placeholder-val="{{ true }}">
          <div class="vt-panel">
            <div class="vt-sc vt-brass">Étape 1 / 3</div>
            <h3>Quel est votre métier ?</h3>
            <div class="vt-chips" role="group" aria-label="Secteur d’activité">
              <sc-for list="{{ sects }}" as="c" hint-placeholder-count="13">
                <button type="button" class="vt-chip" aria-pressed="{{ c.pressed }}" style="{{ c.style }}" onClick="{{ c.pick }}">{{ c.label }}</button>
              </sc-for>
            </div>
            <sc-if value="{{ eSect }}" hint-placeholder-val="{{ false }}"><p class="vt-err" style="margin:14px 0 0">Choisissez un secteur pour continuer.</p></sc-if>
            <button type="button" class="vt-check" role="checkbox" aria-checked="{{ planChecked }}" onClick="{{ togglePlan }}">
              <span class="box" style="{{ planBox }}"><svg width="12" height="10" viewBox="0 0 12 10" fill="none" stroke="#101010" stroke-width="1.6" aria-hidden="true" style="{{ planTick }}"><path d="M1 5l3.5 3.5L11 1"></path></svg></span>
              <span><b>Je souhaite l’élaboration de mon plan 3D</b><small>Plan 3D d’agencement offert, réalisé par le bureau d’études.</small></span>
            </button>
            <div class="vt-fnav">
              <span class="vt-sc">{{ sectPicked }}</span>
              <button type="button" class="vt-btn solid" onClick="{{ next1 }}">Continuer</button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ step2 }}" hint-placeholder-val="{{ false }}">
          <div class="vt-panel">
            <div class="vt-sc vt-brass">Étape 2 / 3</div>
            <h3>Votre local</h3>
            <div class="vt-form">
              <div class="vt-field"><label for="c-long">Longueur disponible</label><div class="vt-unit"><input id="c-long" type="text" inputmode="decimal" value="{{ fLong }}" onInput="{{ setLong }}"><i>cm</i></div></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4200},"accent":{"editor":"color","default":"#B08D57","options":["#B08D57","#D42A20","#EEE9E1"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { menuOpen:false, step:1, sent:false, sect:'', plan3d:true, line:'', fLong:'', fProf:'', fMsg:'',
      fNom:'', fTel:'', fMail:'', fCp:'', fVille:'', tried1:false, tried2:false, tried3:false, faq:0 };
    this.SECTS = ['Boulangerie','Pâtisserie','Chocolats','Sandwichs','Traiteur','Poissonnerie','Bar à salades','Bar à couscous','Fromagerie','Bar','Bar à topping','Coffee shop / Café','Pizza al taglio'];
    this.LINES = ['Basique','Stone','Legno','Encastrable','Industry','Je ne sais pas encore'];
    this.FAQ = [
      { q:'Le numéro 0 800 95 13 13 est-il gratuit ?', a:'Oui : le 0 800 95 13 13 est un numéro d’appel gratuit.' },
      { q:'Où se trouve le show-room ?', a:'Le bureau d’études et le show-room sont au 423, Chemin des Vernèdes, Espace Vernèdes 3, 83480 Puget-sur-Argens. Horaires : [HORAIRES].' },
      { q:'Les vitrines peuvent-elles être faites sur mesure ?', a:'Oui. Les vitrines sont adaptées à votre local et à vos dimensions. Le Module Gourmandise, par exemple, existe en 101, 117, 146, 169, 191 et 222 cm, ou sur mesure.' },
      { q:'Quelles plages de température sont proposées ?', a:'+2 °C / +8 °C pour la pâtisserie, +14 °C / +18 °C pour les chocolats, −2 °C / 0 °C pour la poissonnerie (froid statique) et +30 °C / +90 °C pour le bain-marie.' },
      { q:'Quelles matières puis-je choisir ?', a:'Pierre acrylique type Corian, granit, bois mélaminé avec moulures, et panneau frontal en verre avec sérigraphie du client selon les lignes.' },
      { q:'Puis-je voir mon agencement avant la fabrication ?', a:'Oui : le bureau d’études élabore le plan 3D de votre agencement.' },
      { q:'Combien coûte une vitrine ?', a:'Le Module Gourmandise 101 cm en pierre acrylique blanche est à 5 800,00 € HT. Les autres longueurs et configurations sont sur devis.' }
    ];
  }
  renderVals(){
    const p = this.props || {};
    const accent = p.accent || '#B08D57';
    const s = this.state;
    const onChip = 'background:#EEE9E1;color:#101010;border-color:#EEE9E1';
    const field = (k) => (e) => { const o = {}; o[k] = e.target.value; this.setState(o); };
    const dimsOk = (st) => [st.fLong, st.fProf].every((v) => !v.trim() || /^\d+([.,]\d+)?$/.test(v.trim()));
    const contactOk = (st) => st.fNom.trim() && st.fTel.replace(/\D/g, '').length >= 10 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(st.fMail.trim());
    const labels = ['Votre métier', 'Votre local', 'Coordonnées'];
    const stepsUi = labels.map((l, i) => {
      const n = i + 1;
      const done = s.sent || n < s.step;
      const cur = !s.sent && n === s.step;
      return {
        n: '0' + n,
        label: l,
        current: cur ? 'step' : 'false',
        style: cur || done ? 'box-shadow:inset 0 -1px 0 ' + accent : '',
        numStyle: cur ? 'color:' + accent : (done ? 'color:#EEE9E1' : 'color:#8E897F')
      };
    });
    const sects = this.SECTS.map((x) => ({ label: x, pressed: x === s.sect ? 'true' : 'false', style: x === s.sect ? onChip : '', pick: () => this.setState({ sect: x }) }));
    const linesUi = this.LINES.map((x) => ({ label: x, pressed: x === s.line ? 'true' : 'false', style: x === s.line ? onChip : '', pick: () => this.setState({ line: x }) }));
    const faqs = this.FAQ.map((f, i) => ({
      q: f.q, a: f.a, n: '0' + (i + 1),
      open: s.faq === i,
      expanded: s.faq === i ? 'true' : 'false',
      iconStyle: 'transform:rotate(' + (s.faq === i ? 45 : 0) + 'deg)',
      toggle: () => this.setState({ faq: this.state.faq === i ? -1 : i })
    }));
    const tel = s.fTel.replace(/\D/g, '');
    const dims = [s.fLong.trim() ? s.fLong.trim() + ' cm de long' : '', s.fProf.trim() ? s.fProf.trim() + ' cm de profondeur' : ''].filter((x) => x).join(', ');
    return {
      rootStyle: '--brass:' + accent,
      menuOpen: s.menuOpen,
      menuExpanded: s.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      stepsUi: stepsUi,
      step1: !s.sent && s.step === 1,
      step2: !s.sent && s.step === 2,
      step3: !s.sent && s.step === 3,
      sent: s.sent,
      sects: sects,
      linesUi: linesUi,
      sectPicked: s.sect ? 'Secteur : ' + s.sect : 'Aucun secteur choisi',
      eSect: s.tried1 && !s.sect,
      planChecked: s.plan3d ? 'true' : 'false',
      planBox: s.plan3d ? 'background:' + accent : 'background:transparent',
      planTick: 'opacity:' + (s.plan3d ? 1 : 0),
      togglePlan: () => this.setState({ plan3d: !this.state.plan3d }),
      next1: () => this.setState(this.state.sect ? { step: 2, tried1: false } : { tried1: true }),
      back1: () => this.setState({ step: 1 }),
      next2: () => this.setState(dimsOk(this.state) ? { step: 3, tried2: false } : { tried2: true }),
      back2: () => this.setState({ step: 2 }),
      eDims: s.tried2 && !dimsOk(s),
      fLong: s.fLong, fProf: s.fProf, fMsg: s.fMsg, fNom: s.fNom, fTel: s.fTel, fMail: s.fMail, fCp: s.fCp, fVille: s.fVille,
      setLong: field('fLong'), setProf: field('fProf'), setMsg: field('fMsg'), setNom: field('fNom'),
      setTel: field('fTel'), setMail: field('fMail'), setCp: field('fCp'), setVille: field('fVille'),
      eNom: s.tried3 && !s.fNom.trim(),
      eTel: s.tried3 && tel.length < 10,
      eMail: s.tried3 && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.fMail.trim()),
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        this.setState(contactOk(this.state) ? { sent: true, tried3: false } : { tried3: true });
      },
      sectLabel: s.sect || '—',
      planLabel: s.plan3d ? 'Oui, plan 3D demandé' : 'Non',
      dimsLabel: dims || 'Non précisé',
      lineLabel: s.line || 'Non précisée',
      restart: () => this.setState({ sent: false, step: 1, sect: '', line: '', fLong: '', fProf: '', fMsg: '', fNom: '', fTel: '', fMail: '', fCp: '', fVille: '', plan3d: true }),
      askPlan: () => this.setState({ plan3d: true, sent: false, step: 1 }),
      faqs: faqs
    };
  }
}
</script>
