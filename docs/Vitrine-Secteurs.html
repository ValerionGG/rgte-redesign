<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vitrine — Secteurs</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
body{margin:0;background:#101010}
.vt{font-family:'Manrope',system-ui,sans-serif;color:#EEE9E1;background:#101010;-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;font-size:15px}
.vt *{box-sizing:border-box}
.vt a{color:inherit;text-decoration:none}
.vt img{display:block;max-width:100%}
.vt button{font-family:inherit}
.vt-wrap{max-width:1320px;margin:0 auto;padding:0 48px}
.vt-d{font-family:'Libre Caslon Display',Georgia,serif;font-weight:400;line-height:1.04;letter-spacing:-.005em;margin:0}
.vt-sc{font-size:11px;line-height:1.4;letter-spacing:.3em;text-transform:uppercase;font-weight:600;color:#A8A39A}
.vt-brass{color:var(--brass)}
.vt-h2{font-size:clamp(34px,4.6vw,64px)}
.vt-lead{font-size:17px;color:#A8A39A;max-width:560px;margin:0}
.vt-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#D42A20;flex:none}
.vt-sec{padding:120px 0}
.vt-sechead{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:28px 80px;align-items:end;margin-bottom:56px}
.vt-kicker{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.vt-kicker::before{content:"";width:40px;height:1px;background:var(--brass)}
.vt-strip{border-bottom:1px solid rgba(238,233,225,.08);font-size:12px;color:#A8A39A}
.vt-stripin{display:flex;justify-content:space-between;align-items:center;min-height:40px;gap:16px;flex-wrap:wrap}
.vt-stripin a{display:inline-flex;align-items:center;gap:8px;min-height:40px;transition:color .3s}
.vt-stripin a:hover{color:#EEE9E1}
.vt-head{position:sticky;top:0;z-index:60;background:rgba(16,16,16,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(176,141,87,.22)}
.vt-headin{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:84px}
.vt-logo{display:inline-flex;align-items:center;gap:12px;min-height:48px}
.vt-logo b{font-family:'Libre Caslon Display',serif;font-weight:400;font-size:28px;letter-spacing:.18em;line-height:1}
.vt-logo small{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#A8A39A;font-weight:600;padding-left:12px;border-left:1px solid rgba(176,141,87,.5);line-height:1.3}
.vt-nav{display:flex;gap:36px}
.vt-nav a{position:relative;display:inline-flex;align-items:center;min-height:48px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#A8A39A;transition:color .3s}
.vt-nav a::after{content:"";position:absolute;left:0;right:0;bottom:10px;height:1px;background:var(--brass);transform:scaleX(0);transform-origin:right;transition:transform .6s cubic-bezier(.2,.7,.1,1)}
.vt-nav a:hover,.vt-nav a.on{color:#EEE9E1}
.vt-nav a:hover::after,.vt-nav a.on::after{transform:scaleX(1);transform-origin:left}
.vt-headr{display:flex;align-items:center;gap:22px}
.vt-tel{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.25;min-height:44px}
.vt-tel .vt-sc{font-size:10px;letter-spacing:.26em}
.vt-tel strong{font-size:15px;font-weight:600;letter-spacing:.06em}
.vt-burger{display:none;width:48px;height:48px;align-items:center;justify-content:center;background:transparent;border:1px solid rgba(238,233,225,.2);color:#EEE9E1;cursor:pointer}
.vt-mnav{display:none}
.vt-btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:50px;padding:0 28px;border:1px solid var(--brass);background:transparent;color:#EEE9E1;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;cursor:pointer;position:relative;overflow:hidden;transition:color .5s,border-color .5s;z-index:0;white-space:nowrap}
.vt-btn::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:#EEE9E1;transform:translateY(101%);transition:transform .55s cubic-bezier(.2,.7,.1,1);z-index:-1}
.vt-btn:hover{color:#101010;border-color:#EEE9E1}
.vt-btn:hover::before{transform:none}
.vt-btn.solid{background:#EEE9E1;color:#101010;border-color:#EEE9E1}
.vt-btn.solid::before{background:var(--brass)}
.vt-btn.solid:hover{border-color:var(--brass)}
.vt-link{display:inline-flex;align-items:center;gap:14px;min-height:44px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:#EEE9E1;background:none;border:0;cursor:pointer;padding:0}
.vt-link span{padding-bottom:5px;border-bottom:1px solid var(--brass)}
.vt-link svg{transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.vt-link:hover svg{transform:translateX(6px)}
.vt-foot{border-top:1px solid rgba(176,141,87,.35);padding:96px 0 36px;background:#0C0C0C}
.vt-footgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:48px}
.vt-foot h4{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--brass);margin:0 0 18px;font-weight:600}
.vt-foot p{font-size:14px;color:#A8A39A;margin:0}
.vt-footlinks{display:flex;flex-direction:column}
.vt-footlinks a{min-height:44px;display:flex;align-items:center;font-size:14px;color:#A8A39A;transition:color .3s}
.vt-footlinks a:hover{color:#EEE9E1}
.vt-footbot{margin-top:64px;padding-top:24px;border-top:1px solid rgba(238,233,225,.08);display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:12px;color:#A8A39A}
.vt-footbot a{min-height:44px;display:inline-flex;align-items:center}
@keyframes vtRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes vtUnveil{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.vt-rise{animation:vtRise 1.1s cubic-bezier(.2,.7,.1,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.5s}
.vt :focus-visible{outline:1px solid #EEE9E1;outline-offset:4px}

.vt-phero{padding:100px 0 70px}
.vt-phero h1{font-size:clamp(46px,7vw,108px);overflow-wrap:anywhere}
.vt-phero h1 span{color:var(--brass)}
.vt-crumb{display:flex;gap:10px;align-items:center;margin-bottom:34px}
.vt-crumb a{min-height:44px;display:inline-flex;align-items:center;color:#A8A39A;transition:color .3s}
.vt-crumb a:hover{color:#EEE9E1}
.vt-fams{display:flex;gap:8px;flex-wrap:wrap;margin-top:48px}
.vt-fam{min-height:44px;padding:0 18px;border:1px solid rgba(238,233,225,.16);background:transparent;color:#EEE9E1;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;cursor:pointer;transition:border-color .4s,background .4s,color .4s}
.vt-fam:hover{border-color:rgba(238,233,225,.5)}

/* index + panneau */
.vt-explore{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:72px;align-items:start;padding-bottom:120px}
.vt-index{border-top:1px solid rgba(238,233,225,.1)}
.vt-ix{position:relative;display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:14px;width:100%;min-height:76px;padding:12px 0;background:transparent;border:0;border-bottom:1px solid rgba(238,233,225,.08);color:inherit;text-align:left;cursor:pointer;overflow:visible;animation:vtRise .9s cubic-bezier(.2,.7,.1,1) both}
.vt-ix::after{content:"";position:absolute;left:0;bottom:-1px;width:100%;height:1px;background:var(--brass);transform:scaleX(0);transform-origin:left;transition:transform .7s cubic-bezier(.2,.7,.1,1)}
.vt-ix:hover::after{transform:scaleX(1)}
.vt-ix .i{font-size:11px;letter-spacing:.14em;color:#A8A39A}
.vt-ix .nm{font-family:'Libre Caslon Display',serif;font-size:clamp(26px,2.6vw,38px);line-height:1.1;transition:transform .6s cubic-bezier(.2,.7,.1,1),color .4s}
.vt-ix:hover .nm{transform:translateX(10px)}
.vt-ix .t{font-size:12.5px;color:#A8A39A;white-space:nowrap;position:relative;z-index:2}
.vt-ix .th{position:absolute;right:120px;top:50%;width:150px;height:96px;margin-top:-48px;object-fit:cover;opacity:0;clip-path:inset(50% 0 50% 0);transition:opacity .5s,clip-path .7s cubic-bezier(.7,0,.2,1);pointer-events:none;z-index:1;border:1px solid rgba(176,141,87,.5)}
.vt-ix:hover .th{opacity:1;clip-path:inset(0 0 0 0)}
.vt-panel{position:sticky;top:110px;background:#161616;border:1px solid rgba(176,141,87,.3)}
.vt-panel .ph{position:relative;height:320px;overflow:hidden}
.vt-panel .ph img{width:100%;height:320px;object-fit:cover;animation:vtUnveil 1.1s cubic-bezier(.7,0,.2,1) both}
.vt-panel .ph::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(22,22,22,0) 35%,#161616),radial-gradient(ellipse 60% 70% at 50% 40%,rgba(22,22,22,0) 40%,rgba(22,22,22,.5) 100%)}
.vt-panel .ph .vt-sc{position:absolute;z-index:2;left:30px;top:24px}
.vt-pbody{padding:0 32px 34px;margin-top:-50px;position:relative;z-index:2}
.vt-ptop{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.vt-ptop h2{font-size:clamp(40px,4vw,58px)}
.vt-dial svg{display:block}
.vt-pmeta{margin:26px 0 0;border-top:1px solid rgba(238,233,225,.1)}
.vt-pmeta > div{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid rgba(238,233,225,.08);font-size:14.5px}
.vt-modlinks{display:flex;flex-wrap:wrap;gap:8px}
.vt-modlink{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid rgba(238,233,225,.16);font-size:13px;transition:border-color .4s,background .4s}
.vt-modlink:hover{border-color:var(--brass);background:rgba(176,141,87,.12)}
.vt-reals{display:flex;flex-direction:column}
.vt-real{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;min-height:52px;border-bottom:1px solid rgba(238,233,225,.08);font-size:14px;transition:padding .5s}
.vt-real:hover{padding-left:8px}
.vt-real b{font-family:'Libre Caslon Display',serif;font-weight:400;color:var(--brass)}
.vt-none{font-size:14px;color:#A8A39A}

/* échelle */
.vt-scale{position:relative;margin-top:30px;height:240px}
.vt-scale .bar{position:absolute;left:0;right:0;top:120px;height:1px;background:rgba(238,233,225,.2)}
.vt-tick{position:absolute;top:112px;width:1px;height:16px;background:rgba(238,233,225,.35)}
.vt-tick span{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:11px;color:#A8A39A;white-space:nowrap}
.vt-band{position:absolute;top:96px;height:48px;border:1px solid var(--brass);background:rgba(176,141,87,.1);cursor:pointer;transition:background .5s,transform .6s cubic-bezier(.2,.7,.1,1);padding:0}
.vt-band:hover{background:rgba(176,141,87,.3);transform:translateY(-6px)}
.vt-band .lb{position:absolute;bottom:62px;left:0;white-space:nowrap;text-align:left;display:flex;flex-direction:column;gap:2px}
.vt-band .lb b{font-family:'Libre Caslon Display',serif;font-weight:400;font-size:22px;color:#EEE9E1}
.vt-scalenote{font-size:12.5px;color:#A8A39A;margin-top:8px}

.vt-cta{text-align:center;padding:140px 0;border-top:1px solid rgba(238,233,225,.06);position:relative;overflow:hidden}
.vt-cta::before{content:"";position:absolute;left:50%;top:-260px;width:900px;height:900px;margin-left:-450px;border-radius:50%;background:radial-gradient(circle,rgba(176,141,87,.14),rgba(176,141,87,0) 62%);pointer-events:none}
.vt-cta .vt-d{font-size:clamp(40px,5.6vw,84px);position:relative}
.vt-cta p{position:relative;color:#A8A39A;max-width:560px;margin:24px auto 40px;font-size:17px}
.vt-ctarow{position:relative;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}

@media (max-width:1100px){
  .vt-nav,.vt-tel{display:none}
  .vt-burger{display:inline-flex}
  .vt-mnav{display:flex;flex-direction:column;padding:8px 24px 28px;border-top:1px solid rgba(238,233,225,.08)}
  .vt-mnav a{min-height:54px;display:flex;align-items:center;font-family:'Libre Caslon Display',serif;font-size:26px;border-bottom:1px solid rgba(238,233,225,.06)}
  .vt-mnav .vt-btn{margin-top:20px;font-family:'Manrope',sans-serif;font-size:11.5px}
  .vt-explore{grid-template-columns:minmax(0,1fr)}
  .vt-panel{position:relative;top:0}
  .vt-ix .th{display:none}
}
@media (max-width:640px){
  .vt-wrap{padding:0 20px}
  .vt-headcta{display:none}
  .vt-logo small{display:none}
  .vt-sec{padding:90px 0}
  .vt-pmeta > div{grid-template-columns:1fr;gap:4px}
  .vt-ptop{grid-template-columns:1fr}
  .vt-pbody{padding:0 20px 28px}
  .vt-scalewrap{overflow-x:auto}
  .vt-scale{min-width:720px}
}
@media (prefers-reduced-motion:reduce){.vt *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="vt" style="{{ rootStyle }}">

  <div class="vt-strip">
    <div class="vt-wrap vt-stripin">
      <a href="index.html"><svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M16 5H2M6 1L2 5l4 4"></path></svg>Toutes les propositions</a>
      <span>Direction 1 · Vitrine — proposition de refonte, concept non officiel</span>
    </div>
  </div>

  <header class="vt-head">
    <div class="vt-wrap vt-headin">
      <a href="Vitrine-Accueil.html" class="vt-logo" aria-label="RGTE, retour à l’accueil"><b>RGTE</b><span class="vt-dot"></span><small>R.G. Technologies</small></a>
      <nav class="vt-nav" aria-label="Navigation principale">
        <a href="Vitrine-Lignes.html">Lignes</a>
        <a href="Vitrine-Secteurs.html" class="on" aria-current="page">Secteurs</a>
        <a href="Vitrine-Realisations.html">Réalisations</a>
        <a href="Vitrine-Contact.html">Showroom &amp; contact</a>
      </nav>
      <div class="vt-headr">
        <a class="vt-tel" href="tel:0800951313"><span class="vt-sc">Appel gratuit</span><strong>0 800 95 13 13</strong></a>
        <a class="vt-btn vt-headcta" href="Vitrine-Contact.html">Plan 3D offert</a>
        <button type="button" class="vt-burger" aria-label="Ouvrir ou fermer le menu" aria-expanded="{{ menuExpanded }}" onClick="{{ toggleMenu }}"><svg width="20" height="12" viewBox="0 0 20 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M0 1h20M0 6h20M0 11h20"></path></svg></button>
      </div>
    </div>
    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <nav class="vt-mnav" aria-label="Navigation mobile">
        <a href="Vitrine-Lignes.html">Lignes</a>
        <a href="Vitrine-Secteurs.html">Secteurs</a>
        <a href="Vitrine-Realisations.html">Réalisations</a>
        <a href="Vitrine-Contact.html">Showroom &amp; contact</a>
        <a href="tel:0800951313">0 800 95 13 13</a>
        <a class="vt-btn solid" href="Vitrine-Contact.html">Plan 3D offert</a>
      </nav>
    </sc-if>
  </header>

  <section class="vt-phero" aria-labelledby="t-sect">
    <div class="vt-wrap">
      <div class="vt-crumb vt-sc"><a href="Vitrine-Accueil.html">Accueil</a><span>/</span><span>Secteurs d’activité</span></div>
      <div class="vt-sechead" style="margin-bottom:0">
        <h1 id="t-sect" class="vt-d vt-rise">Treize métiers,<br><span>chacun son climat.</span></h1>
        <p class="vt-lead vt-rise d2">Chaque métier de bouche a sa température, ses modules, ses contraintes. Choisissez le vôtre dans l’index : la fiche s’éclaire, avec les modules conseillés et les réalisations liées.</p>
      </div>
      <div class="vt-fams" role="group" aria-label="Filtrer les secteurs">
        <sc-for list="{{ fams }}" as="f" hint-placeholder-count="4">
          <button type="button" class="vt-fam" aria-pressed="{{ f.pressed }}" style="{{ f.style }}" onClick="{{ f.pick }}">{{ f.label }} · {{ f.count }}</button>
        </sc-for>
      </div>
    </div>
  </section>

  <section aria-label="Index des secteurs">
    <div class="vt-wrap vt-explore">
      <div class="vt-index">
        <sc-for list="{{ visible }}" as="s" hint-placeholder-count="13">
          <button type="button" class="vt-ix" aria-pressed="{{ s.pressed }}" onClick="{{ s.pick }}" style="{{ s.delay }}">
            <span class="i">{{ s.num }}</span>
            <span class="nm" style="{{ s.nameStyle }}">{{ s.name }}</span>
            <span class="t">{{ s.tshort }}</span>
            <img class="th" src="{{ s.img }}" alt="">
          </button>
        </sc-for>
      </div>

      <div class="vt-panel" aria-live="polite">
        <sc-for list="{{ sects }}" as="s" hint-placeholder-count="1">
          <div style="{{ s.paneStyle }}">
            <div class="ph"><img src="{{ s.img }}" alt="{{ s.alt }}"><span class="vt-sc">Secteur {{ s.num }} / 13 — ambiance</span></div>
            <div class="vt-pbody">
              <div class="vt-ptop">
                <div>
                  <h2 class="vt-d vt-rise">{{ s.name }}</h2>
                  <p class="vt-lead vt-rise d1" style="margin-top:14px;font-size:15.5px">{{ s.desc }}</p>
                </div>
                <div class="vt-dial vt-rise d2">
                  <svg width="132" height="132" viewBox="0 0 180 180" aria-hidden="true">
                    <circle cx="90" cy="90" r="86" fill="#121212" style="stroke:var(--brass)" stroke-opacity=".6"></circle>
                    <circle cx="90" cy="90" r="78" fill="none" stroke="#A8A39A" stroke-width="5" stroke-dasharray="1 7.168" opacity=".5"></circle>
                    <circle cx="90" cy="90" r="68" fill="none" stroke="#2C2A27" stroke-width="4"></circle>
                    <circle cx="90" cy="90" r="68" fill="none" stroke-width="4" stroke-linecap="round" style="{{ s.arcStyle }}"></circle>
                    <g style="{{ s.needleStyle }}"><line x1="78" y1="90" x2="146" y2="90" stroke="#EEE9E1" stroke-width="1.6"></line></g>
                    <circle cx="90" cy="90" r="5" fill="#D42A20"></circle>
                    <text x="90" y="134" fill="#A8A39A" font-size="12" font-family="Manrope" text-anchor="middle" letter-spacing="2">°C</text>
                  </svg>
                </div>
              </div>
              <div class="vt-pmeta vt-rise d2">
                <div><span class="vt-sc">Température</span><span>{{ s.temp }}</span></div>
                <div><span class="vt-sc">Modules</span>
                  <div>
                    <div class="vt-modlinks"><sc-for list="{{ s.mods }}" as="m" hint-placeholder-count="4"><a class="vt-modlink" href="Vitrine-Module.html">{{ m }}</a></sc-for></div>
                    <div class="vt-sc" style="margin-top:10px;font-size:10px">{{ s.note }}</div>
                  </div>
                </div>
                <div><span class="vt-sc">Réalisations</span>
                  <div class="vt-reals">
                    <sc-for list="{{ s.realList }}" as="r" hint-placeholder-count="2"><a class="vt-real" href="Vitrine-Realisations.html"><b>n° {{ r.no }}</b><span>{{ r.title }} — {{ r.place }}</span><span class="vt-sc">{{ r.line }}</span></a></sc-for>
                    <sc-if value="{{ s.noReal }}" hint-placeholder-val="{{ false }}"><span class="vt-none">Pas encore de réalisation présentée pour ce secteur — [RÉFÉRENCES].</span></sc-if>
                  </div>
                </div>
              </div>
              <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:28px">
                <a class="vt-btn solid" href="Vitrine-Contact.html">Devis pour ce métier</a>
                <a class="vt-btn" href="Vitrine-Lignes.html">Voir les lignes</a>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <!-- ===== ÉCHELLE DES CLIMATS ===== -->
  <section class="vt-sec" style="background:#141414" aria-labelledby="t-scale">
    <div class="vt-wrap">
      <div class="vt-sechead">
        <div>
          <div class="vt-sc vt-kicker">Les climats</div>
          <h2 id="t-scale" class="vt-d vt-h2">Du froid de la glace<br>à la chaleur du bain-marie.</h2>
        </div>
        <p class="vt-lead">Les plages de température indiquées par les fiches modules. Cliquez une plage pour ouvrir le secteur correspondant.</p>
      </div>
      <div class="vt-scalewrap">
        <div class="vt-scale">
          <div class="bar"></div>
          <div class="vt-tick" style="left:0%"><span>−2 °C</span></div>
          <div class="vt-tick" style="left:2.17%"><span>0</span></div>
          <div class="vt-tick" style="left:4.35%"><span>+2</span></div>
          <div class="vt-tick" style="left:10.87%"><span>+8</span></div>
          <div class="vt-tick" style="left:17.39%"><span>+14</span></div>
          <div class="vt-tick" style="left:21.74%"><span>+18</span></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3700},"accent":{"editor":"color","default":"#B08D57","options":["#B08D57","#D42A20","#EEE9E1"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { menuOpen:false, sect:'patisserie', fam:'all' };
    this.REALS = {
      1:{ title:'Pâtisserie', place:'Paris 4e', line:'Stone' },
      2:{ title:'Bar à salades', place:'Département 13', line:'Stone' },

      13:{ title:'Traiteur poissonnier', place:'Département 92', line:'Stone' },
      14:{ title:'Pâtissier chocolatier Canet', place:'Nice 06', line:'Stone' }
    };
    // lo/hi : plage froide connue (échelle −2…+22 du cadran) ; null = non renseignée ou hors échelle
    this.SECTS = [
      { id:'boulangerie', fam:'sucre', name:'Boulangerie', temp:'[TEMPÉRATURE]', tshort:'[T°]', lo:null, hi:null, desc:'Viennoiseries, pâtisseries boulangères : des modules à plaques et des vitrines de boulangerie.', mods:['Amandine','Pastry Show','Réfrigérée statique','Loire (Industry)'], note:'Modules plausibles — à valider', reals:[7,8], img:'assets/bakery-shelves.webp', alt:'Étagères de pains' },
      { id:'patisserie', fam:'sucre', name:'Pâtisserie', temp:'+2 °C / +8 °C', tshort:'+2 / +8', lo:2, hi:8, desc:'Entremets, pâtisseries, macarons : exposition réfrigérée à hauteur de comptoir ou centrale.', mods:['Plane','Vision','Panorama','Centrale','Gourmandise','Pastry Show','Cube','Amandine'], note:'Modules conseillés', reals:[1,10,14], img:'assets/vitrine-colorful.webp', alt:'Entremets colorés étagés en vitrine' },
      { id:'chocolats', fam:'sucre', name:'Chocolats', temp:'+14 °C / +18 °C', tshort:'+14 / +18', lo:14, hi:18, desc:'Bonbons et créations chocolatées, exposés à la température qui les respecte.', mods:['Plane','Centrale','Gourmandise','Panorama'], note:'Modules proposés en +14/+18 — à valider', reals:[3,10,14], img:'assets/chocolate-display.webp', alt:'Présentoir de chocolats en bacs' },
      { id:'sandwichs', fam:'sale', name:'Sandwichs', temp:'[TEMPÉRATURE]', tshort:'[T°]', lo:null, hi:null, desc:'Vente à emporter : vitrines panoramiques, basses et murales en libre-service.', mods:['Panoramique','Basse','Murale self-service'], note:'D’après la réalisation de Chamonix', reals:[4], img:'assets/bakery-window.webp', alt:'Vitrine de rue' },
      { id:'traiteur', fam:'sale', name:'Traiteur', temp:'[TEMPÉRATURE]', tshort:'[T°]', lo:null, hi:null, desc:'Plats et préparations : vitrines planes, saladettes, comptoirs.', mods:['Plane','Saladette','Comptoir bar','Comptoir caisse','Panorama'], note:'D’après les réalisations de Marseille et du 92', reals:[11,13], img:'assets/bakery-hall-dark.webp', alt:'Grande halle sombre' },
      { id:'poissonnerie', fam:'sale', name:'Poissonnerie', temp:'−2 °C / 0 °C', tshort:'−2 / 0', lo:-2, hi:0, desc:'Froid statique avec serpentin de cuve, et vidange de cuve.', mods:['Poissonnerie','Panorama','Surface plane','Hanoi (Industry)'], note:'Module Poissonnerie de la Ligne Stone', reals:[13], img:'assets/fish-ice.webp', alt:'Poissons sur glace' },
      { id:'salades', fam:'bar', name:'Bar à salades', temp:'+2 °C / +8 °C (Saladette)', tshort:'+2 / +8', lo:2, hi:8, desc:'Ingrédients en bacs gastronormes, à composer devant le client.', mods:['Saladette','Panorama','Comptoir caisse'], note:'D’après la réalisation du 13', reals:[2], img:'assets/saladette-bacs.webp', alt:'Bacs gastronormes inox colorés' },
      { id:'couscous', fam:'bar', name:'Bar à couscous', temp:'+30 °C / +90 °C (bain-marie)', tshort:'+30 / +90', lo:null, hi:null, hot:true, desc:'Bain-marie en bacs gastronormes, avec trous arrondis sur mesure.', mods:['Chaud bain-marie'], note:'D’après la réalisation d’Isère', reals:[12], img:'assets/saladette-bacs.webp', alt:'Bacs gastronormes' },
      { id:'fromagerie', fam:'sale', name:'Fromagerie', temp:'[TEMPÉRATURE]', tshort:'[T°]', lo:null, hi:null, desc:'Meules et pièces à la coupe, sous vitrine réfrigérée.', mods:['Panorama','Réfrigérée statique','Plane'], note:'Modules plausibles — à valider', reals:[], img:'assets/fromagerie.webp', alt:'Meules de fromage sur étagères' },
      { id:'bar', fam:'bar', name:'Bar', temp:'Comptoir neutre ou réfrigéré', tshort:'Neutre / froid', lo:null, hi:null, desc:'Le comptoir bar, neutre ou réfrigéré, et le comptoir caisse.', mods:['Comptoir bar','Comptoir caisse'], note:'Comptoirs des lignes Stone, Basique et Legno', reals:[11], img:'assets/coffee-counter.webp', alt:'Comptoir de café en noir et blanc' },
      { id:'topping', fam:'bar', name:'Bar à topping', temp:'[TEMPÉRATURE]', tshort:'[T°]', lo:null, hi:null, desc:'Saladette sur mesure à trous arrondis et surface plane.', mods:['Saladette','Surface plane'], note:'D’après la réalisation bar à yogourt glacé', reals:[6], img:'assets/topping-bar.webp', alt:'Bar à toppings' },
      { id:'coffee', fam:'sucre', name:'Coffee shop / Café', temp:'[TEMPÉRATURE]', tshort:'[T°]', lo:null, hi:null, desc:'Comptoir, caisse et petite vitrine réfrigérée pour les douceurs.', mods:['Comptoir bar','Comptoir caisse','Vitrine réfrigérée Cube'], note:'Modules plausibles — à valider', reals:[], img:'assets/vitrine-cookies.webp', alt:'Cookies en vitrine' },
      { id:'pizza', fam:'sale', name:'Pizza al taglio', temp:'[TEMPÉRATURE]', tshort:'[T°]', lo:null, hi:null, desc:'Garnitures en saladette, exposition plane, caisse.', mods:['Saladette','Plane','Comptoir caisse'], note:'D’après la réalisation pizza sur composition, Paris', reals:[9], img:'assets/baker-table.webp', alt:'Plan de travail fariné' }
    ];
    this.FAMS = [
      { id:'all', label:'Tous' },
      { id:'sucre', label:'Sucré' },
      { id:'sale', label:'Salé & traiteur' },
      { id:'bar', label:'Bars & comptoirs' }
    ];
  }
  renderVals(){
    const p = this.props || {};
    const accent = p.accent || '#B08D57';
    const s = this.state;
    const C = 427.26; // 2πr, r = 68
    const sects = this.SECTS.map((x, i) => {
      const sel = x.id === s.sect;
      const known = x.lo !== null;
      const rot = known ? -240 + (x.lo + 2) * 12.5 : -240;
      const len = known ? ((x.hi - x.lo) * 12.5 / 360 * C) : 0;
      const mid = known ? -240 + ((x.lo + x.hi) / 2 + 2) * 12.5 : -240;
      const arc = known
        ? 'stroke:' + accent + ';stroke-dasharray:' + Math.max(len, 4).toFixed(1) + ' ' + C + ';transform:rotate(' + rot + 'deg);transform-origin:90px 90px'
        : (x.hot ? 'stroke:#D42A20;stroke-opacity:.6;stroke-dasharray:3 6;transform:rotate(-240deg);transform-origin:90px 90px' : 'stroke:#A8A39A;stroke-opacity:.35;stroke-dasharray:2 8');
      return Object.assign({}, x, {
        num: (i < 9 ? '0' : '') + (i + 1),
        pressed: sel ? 'true' : 'false',
        pick: () => this.setState({ sect: x.id }),
        nameStyle: sel ? 'color:' + accent : 'color:#EEE9E1',
        paneStyle: sel ? 'display:block' : 'display:none',
        arcStyle: arc,
        needleStyle: 'transform:rotate(' + mid + 'deg);transform-origin:90px 90px;opacity:' + (known ? 1 : 0),
        realList: x.reals.map((n) => Object.assign({ no: (n < 10 ? '0' : '') + n }, this.REALS[n])),
        noReal: x.reals.length === 0
      });
    });
    const visible = sects
      .filter((x) => s.fam === 'all' || x.fam === s.fam)
      .map((x, i) => Object.assign({}, x, { delay: 'animation-delay:' + (i * 0.04).toFixed(2) + 's' }));
    const fams = this.FAMS.map((f) => ({
      label: f.label,
      count: f.id === 'all' ? this.SECTS.length : this.SECTS.filter((x) => x.fam === f.id).length,
      pressed: f.id === s.fam ? 'true' : 'false',
      style: f.id === s.fam ? 'background:#EEE9E1;color:#101010;border-color:#EEE9E1' : '',
      pick: () => this.setState({ fam: f.id })
    }));
    return {
      rootStyle: '--brass:' + accent,
      menuOpen: s.menuOpen,
      menuExpanded: s.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      sects: sects,
      visible: visible,
      fams: fams,
      goFish: () => this.setState({ sect: 'poissonnerie', fam: 'all' }),
      goPastry: () => this.setState({ sect: 'patisserie', fam: 'all' }),
      goChoco: () => this.setState({ sect: 'chocolats', fam: 'all' }),
      goHot: () => this.setState({ sect: 'couscous', fam: 'all' })
    };
  }
}
