server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  # Les maquettes sont en noindex ; mêmes en-têtes de sécurité de base que GitHub Pages
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Pages, modules JavaScript et styles : revalidés à chaque visite (une mise à jour se voit tout de suite)
  location ~* \.(html|js|mjs|css|json)$ { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
  # Polices et images : cache long
  location ~* \.(woff2?|png|jpe?g|webp|svg|ico)$ { add_header Cache-Control "public, max-age=2592000" always; try_files $uri =404; }
  location / { try_files $uri $uri/ $uri.html =404; }
}
